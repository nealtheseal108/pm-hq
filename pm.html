fetch("resources.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  var e=(d&&d.entries)||[];
  var dates=e.map(x=>x.dateAdded).filter(Boolean).sort();
  var last=dates.length?dates[dates.length-1]:null;
  var days=last?Math.round((Date.now()-new Date(last))/86400000):null;
  var stale=days!=null&&days>7;
  var meta=document.getElementById("intel-meta");
  var countLine = e.length + (e.length===1?" note":" notes");
  var dateLine = last ? ("snapshot " + last) : "no date on file";
  var staleLine = stale ? ("<div style=\"color:var(--now);font-weight:700;margin-top:1px\">" + days + "d stale — re-check &rarr;</div>") : "<div style=\"margin-top:1px\">view &rarr;</div>";
  if(meta) meta.innerHTML = countLine + " · " + dateLine + staleLine;
}).catch(function(){var m=document.getElementById("intel-meta");if(m)m.textContent="see Resources →";});
</script>

rue, "src": "manual", "term": "Spring 2027 co-op", "firstSeen": 1793294065, "lastSeen": 1793294065, "nyc": false}], "updated": 1794420479, "feedUrl": "feed-pm.json", "marketEdges": {"_sourcing": "Structural/strategic edges over the broader applicant pool -- distinct from resume-wording tactics (see Resume HQ's Edge Playbook for those). Grounded in this repo's own research (RECRUITING-BLINDSPOTS.md, config.md, per-firm-resume-patterns.json) plus a completed 2026-specific deep-research pass (16 tool calls, real sources checked for each claim, weak claims explicitly downgraded rather than kept for optimism). Confidence levels reflect what was actually verified, not what would be nice to be true.", "edges": [{"edge": "Defense-tech / gov-cloud PM-adjacent pipeline is citizenship-gated and demonstrably talent-constrained", "why": "This is the strongest edge found, with real 2026 evidence behind it. The Pentagon/OPM 'War Force' initiative (launched June 30, 2026) is explicitly recruiting AI/software talent for 2-year DoD tours paying up to ~$200K, requiring US citizenship plus clearance eligibility. Independently, only ~2 million people in the US hold an active federal security clearance (under 0.6% of the population), and the cleared population has dropped nearly 1 million since 2013 even as DoD's FY2026 budget hit $961.6B with heavy AI/cyber emphasis -- a real, citizenship-driven hiring-side supply crunch. Shield AI's own 2026 internship posting requires being 'authorized to work in the United States'; dual-use defense-tech firms (Anduril, Shield AI, Saronic, Skydio) sponsor clearances post-hire and keep entry-level roles uncleared, meaning the citizenship bar screens the applicant pool before the clearance timeline (8-24 months) ever becomes the bottleneck. This structurally and quantifiably shrinks competition versus a Google/Meta APM req open to the whole world's talent pool.", "action": "Treat defense-tech/gov-cloud as its own distinct funnel, not one of 19 equally-weighted targets. Build 2-3 warm intros specifically at Anduril, Shield AI, Saronic (confirmed hiring PM-adjacent/strategy-ops interns in 2026). Frame Black Box explicitly as 'agentic decision systems under uncertainty' -- that maps directly onto defense-tech's actual pitch (autonomous systems, ISR, decision support), far more precisely than a generic consumer-PM framing would.", "confidence": "high", "draftBullets": ["Architected an autonomous forecasting system (Black Box) that trades live on Kalshi under real market uncertainty by building an LLM-driven agentic signal pipeline, RSA-PSS-signed order execution, and a WebSocket data layer, holding a 0.150 Brier score across a 13/13 forward-testing run."], "sources": ["https://www.opm.gov/news/news-releases/war-force-to-recruit-top-engineers-to-enhance-american-military-technological-dominance/", "https://www.militarytimes.com/news/pentagon-congress/2026/07/06/pentagon-launches-war-force-campaign-in-push-for-software-engineers/", "https://news.clearancejobs.com/2026/06/30/pentagon-and-opm-launch-war-force-recruiting-and-hiring-initiative-for-ai-and-software-engineers/", "https://breakingdefense.com/2026/06/pentagon-seeks-to-hire-hundreds-of-software-engineers-for-2-year-tours/", "https://jobs.lever.co/shieldai/1721f9b3-b098-4988-bbb6-2d0382936be5"]}, {"edge": "Rare triple-combination: technical depth + real 0-to-1 shipped product + genuine agentic-AI fluency, all three at once", "why": "Most competing APM applicants are strong on ONE of these axes -- either technical (CS-only) or business (no real technical depth) -- and very few have BOTH plus a real, deployed, revenue-generating 0-to-1 product (Biryani Blitz) AND hands-on agentic-AI building experience (Black Box's LLM/agent pipeline) that predates the current wave of vague 'I used ChatGPT' resume claims.", "action": "Lead with this exact combination explicitly in positioning (already the core thesis of the per-firm resume research and the Compare-to-Optimal tool) -- the edge is real but only pays off if stated as ONE coherent identity, not scattered across three unrelated bullets.", "confidence": "high", "summaryLine": "CS + Business builder who ships: architected an autonomous trading system (Black Box \u2014 0.150 Brier, 13/13 live) and founded a 0\u21921 hardware/AI product (Biryani Blitz \u2014 Shark Tank S18, 200+ user interviews). Technical depth and product ownership, not one or the other.", "bulletNote": "This edge is a POSITIONING line, not a standard bullet \u2014 it's meant for a resume summary/headline or an interview 30-second pitch, since it explicitly names the combination across two experiences rather than describing one accomplishment. See summaryLine.", "draftBullets": [], "sources": []}, {"edge": "AI-tool fluency is bifurcated in 2026 -- claiming it is now a negative signal, shipping with it is a real one", "why": "Confirmed real and important to get right: 78% of job applications now carry AI-generated content, and a 2025 survey of 600 hiring managers found 33.5% claim to spot AI-generated resumes in under 20 seconds -- meaning a bare 'I used AI tools' claim now reads as a NEGATIVE signal (oversaturated, associated with low-effort applications), not neutral. But a distinct signal -- having actually SHIPPED something real with agentic tooling (a working MCP server, an autonomous system with real usage, verifiable architecture decisions) -- is a genuine differentiator specifically because the claimed-vs-real gap is so wide that recruiters in AI-adjacent roles now ask for public artifacts precisely to filter out the bare claims. Caveat: this evidence is strongest for AI/ML engineering hiring; the read-through to PM-specific recruiting (which traditionally emphasizes product judgment over technical build skill) is a reasonable inference, not directly confirmed.", "action": "Never write a bare 'used ChatGPT/Claude' resume bullet -- it now reads as a red flag. Instead make Black Box's technical substance verifiable: link the actual repo/architecture, be ready to describe specific agent-orchestration decisions (why Kalshi, what the forecasting pipeline does, what broke and how it was fixed) so it survives a technical follow-up. Position it as evidence of technical judgment and PM-engineering collaboration credibility -- a rarer trait among CS+Business PM applicants who've only taken classes, not shipped agent systems.", "confidence": "medium", "draftBullets": ["Shipped Black Box, a full agent-orchestration forecasting pipeline, by designing signal generation, confidence calibration, and automated RSA-PSS order signing, verifiable via a public repo and a live 13/13 forward-testing run."], "sources": ["https://www.forbes.com/sites/rachelwells/2026/03/18/ai-resumes-are-sabotaging-the-hiring-process-67-of-managers-reveal/", "https://resumepulse.ai/blog/hiring-managers-reject-ai-resumes-2026", "https://jobcannon.io/blog/ai-resume-statistics-2026"]}, {"edge": "Coverage edge: the custom scraper surfaces companies/postings most applicants never find", "why": "Most applicants source targets from word-of-mouth, career fairs, and the same 2-3 famous GitHub tracker repos everyone already uses -- meaning those postings get the most applicants. The 159-company pipeline includes real, live, currently-open roles at companies most peers have never heard of (Glean, Addepar, Rubrik, Greenlight Financial, etc.) sourced via jobright/simplify/direct ATS integration -- structurally lower applicant-to-seat ratio than the famous names. The deep-research pass independently validated the underlying mechanism: real (if imprecisely-quantified) data shows 18-30%+ of postings are effectively stale/ghost and freshness matters directionally, even though exact 'X% more responses' multipliers circulating online aren't from verifiable primary research.", "action": "Don't let prestige bias crowd out the less-famous-but-real targets -- the Pipeline is already season-sorted; work through the full list, not just the household names at the top. The scraper's real value is filtering OUT stale postings so effort concentrates on genuinely fresh reqs. Bonus: the scraper itself (Python + Playwright, 6 ATS integrations, observability/health tracking, carry-forward reliability logic) is a real, shipped technical artifact worth a resume line in its own right \u2014 see the draft bullet.", "confidence": "medium", "draftBullets": ["Built and operate a multi-tier internship-tracking system (Python + Playwright, 6 ATS integrations) that surfaces 159+ live PM/APM postings by automatically filtering stale listings and flagging newly-posted roles within 48 hours."], "sources": ["https://clarifycapital.com/ghost-jobs-2026", "https://clarifycapital.com/job-seekers-beware-of-ghost-jobs-survey", "https://www.entrepreneur.com/business-news/millions-of-job-postings-are-for-ghost-jobs-study/499415"]}, {"edge": "Timing/velocity: applying within the first 24-48h of a posting going live", "why": "Directionally real and already the repo's own documented #1 low-effort lever, but the deep-research pass could NOT verify the precise magnitude claims ('2-3x more interviews') circulating online as rigorous primary research -- they read as marketing content, not peer-reviewed or platform-official data, and nothing is internship-specific. Net: don't repeat a specific multiplier as fact, but the qualitative direction (fresher = better odds, ghost/stale postings are common) is real.", "action": "The scraper now stamps every role with a firstSeen timestamp; the Open Now tab flags anything first seen in the last 48h with a NEW badge. Work that badge first, every time, before touching older postings in the list.", "confidence": "medium", "bulletNote": "This is a BEHAVIORAL edge (an application habit), not resume content on its own \u2014 its resume payoff is already captured in the scraper bullet under the Coverage edge above ('flagging newly-posted roles within 48 hours' is this exact lever, stated as a shipped feature).", "draftBullets": [], "sources": ["https://clarifycapital.com/ghost-jobs-2026"]}, {"edge": "Guaranteed US work authorization (citizen, no sponsorship ever)", "why": "Real, but narrower than the obvious framing. A $100,000 supplemental H-1B fee (proclamation effective Sept 21 2025, upheld in court Dec 2025, running through Sept 2026) does NOT apply to change-of-status petitions filed by F-1/OPT students already in the US -- meaning most international CS/business students at target schools converting OPT-to-H-1B are largely insulated from this specific fee. What IS real: the 2026 wage-weighted H-1B lottery multiplies entries by wage level (a Level IV role gets 4x the entries of a Level I), which structurally disadvantages entry-level/intern-tier sponsorship regardless of the fee headlines -- so international candidates are a genuinely weaker bet for internship-to-FT conversion at the entry-level tier specifically. Also worth knowing: STEM OPT participation hit 165,524 students in 2024 (up 54% YoY), CS the single most popular F-1 major -- the competing international CS applicant pool is large and growing, not shrinking, so this edge is real but not as dominant as the headlines suggest.", "action": "Don't lean on a generic 'no sponsorship needed' line -- it's true but weakly differentiated since most direct UNC/CS peer competitors are also citizens. State it plainly on every application (still a hard knockout field to clear), but the more valuable use of citizenship is the defense-tech lane above, where it's not a soft preference but a hard gate.", "confidence": "medium", "bulletNote": "This is an APPLICATION-FORM field ('authorized to work? Y/N', 'require sponsorship? Y/N'), not resume bullet content \u2014 don't force it into a bullet. Just make sure it's answered correctly and prominently on every application.", "draftBullets": [], "sources": ["https://www.americanimmigrationcouncil.org/blog/trump-100000-fee-h-1b-visa/", "https://www.cdflaborlaw.com/blog/uscis-clarifies-the-100000-h-1b-visa-fee", "https://www.tryalma.com/learn/stem-opt-extension-statistics"]}, {"edge": "Non-target-school alumni respond more because they're asked less often", "why": "CHECKED AND NOT SUBSTANTIATED -- downgraded from the original hypothesis. Every source found for 'alumni response rates beat cold outreach' traces back to uncredentialed career-coaching SEO content with no named study, sample size, or methodology; the specific numbers cited for the same claim ranged wildly (25-40%, 40-60%, 60-80%, '5x') with no reconciliation -- a classic sign of content mills copying and inflating each other, not real data. No source addressed the specific differential claimed (do Stanford alumni at Google get more inbound requests than UNC alumni, causing UNC alumni to respond more readily). This is a plausible-sounding intuition with zero real evidentiary backing found.", "action": "Don't build strategy on the assumption that UNC alumni respond meaningfully better than target-school alumni -- there's no evidence for it either way. The real, well-established lever is just that warm alumni outreach beats cold outreach in general, which is unsurprising and worth doing regardless of school. The Pipeline's alumni-search link is still useful (finding a warm intro is table stakes, not a school-specific edge) -- just don't overweight the non-target-school angle in strategy.", "confidence": "low", "bulletNote": "This is an OUTREACH edge (who you message, not what your resume says) \u2014 not resume bullet content. The action item is using the Pipeline's Alumni link, not writing anything new.", "draftBullets": [], "sources": []}], "notSubstantiated": ["Non-target-school alumni respond at higher rates specifically because they're asked less often -- no real study found; treat as unverified intuition, not an exploitable edge (kept above with honest low confidence rather than deleted, since the underlying action -- do alumni outreach -- is still worth doing for othe status": "irrelevant", "role": "Product Management B2B Broadband Services Intern", "url": "https://www.optimumcareers.com/job/Bethpage-Intern-Product-Management-B2B-Broadband-Services-NY-11714/1449513100/?ats=successfactors&utm_source=Simplify&ref=Simplify", "date": "2026-11-11"}, {"company": "Legrand", "status": "irrelevant", "role": "Product Management Intern", "url": "https://iadugs.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/job/1837?utm_source=Simplify&ref=Simplify", "date": "2026-11-11"}, {"company": "Pyrotek", "status": "irrelevant", "role": "Product Management Intern", "url": "https://jobs.smartrecruiters.com/Pyrotek3/744000160635163?utm_source=Simplify&ref=Simplify", "date": "2026-11-11"}, {"company": "Badger Meter", "status": "irrelevant", "role": "Product Management Intern", "url": "https://badgermeter.wd5.myworkdayjobs.com/US_CareerSite/job/US---WI---Milwaukee-HQ/Product-Management-Intern_4676?utm_source=Simplify&ref=Simplify", "date": "2026-11-11"}, {"company": "DwyerOmega", "status": "irrelevant", "role": "Product Management Intern - Pressure & Force", "url": "https://recruiting.paylocity.com/Recruiting/Jobs/Details/4645741?utm_source=Simplify&ref=Simplify", "date": "2026-11-11"}, {"company": "Altice USA", "status": "irrelevant", "role": "Intern - Product Management Video CPE", "url": "https://jobright.ai/jobs/info/6af3f48350da4f7200923c69?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Altice USA", "status": "irrelevant", "role": "Intern -  Mobile Device Product Management", "url": "https://jobright.ai/jobs/info/6af38401f6053e296fc7d624?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Costco Wholesale", "status": "irrelevant", "role": "CDS Intern - IT Product Owner - Costco Travel", "url": "https://jobright.ai/jobs/info/6ae8d89c777c336eb6d66da3?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Optimum", "status": "irrelevant", "role": "Intern - Product Management B2B Broadband Services", "url": "https://jobright.ai/jobs/info/6af3693a80020ca3a8975585?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Optimum", "status": "irrelevant", "role": "Intern - Product Management Video CPE", "url": "https://jobright.ai/jobs/info/6af36921769e9374033c6046?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Great American Insurance Group", "status": "irrelevant", "role": "Technical Product Management Intern - Summer 2027", "url": "https://jobright.ai/jobs/info/6af478afcd7be4db20d85730?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Hourglass Cosmetics", "status": "irrelevant", "role": "Intern, Product Development", "url": "https://jobright.ai/jobs/info/6af27cef41f4504a0888c369?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Constellation Brands New Zealand & Australia", "status": "irrelevant", "role": "Intern, IT - Marketing Technology Product Management", "url": "https://jobright.ai/jobs/info/6af219cc1aaffa49f7380b79?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "SageSure", "status": "irrelevant", "role": "Data Science Product Analyst Intern", "url": "https://go.vansh.nyc/1oj?s=y", "date": "2026-11-11"}, {"company": "Subsea7", "status": "irrelevant", "role": "Product Intern", "url": "https://jobright.ai/jobs/info/6ac676f8064da25272e1a838?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Subsea7", "status": "irrelevant", "role": "Product Intern Job Details | Subsea7", "url": "https://jobright.ai/jobs/info/6ac9fad9002e496d4beeb999?utm_source=1099&utm_campaign=Product%20Management", "date": "2026-11-11"}], "title": "PM Recruiting HQ", "status": "PM / APM <b>internships</b> \u00b7 Summer 2027 \u00b7 159 targets \u00b7 sorted <b>by season \u2192 open date</b>"};
window.PLAYBOOK_HTML = "<h2>PM Internship Recruiting Playbook \u2014 Summer 2027</h2>\n\n<p><strong>Owner:</strong> [UNC CS student]  |  <strong>Cycle:</strong> Summer 2027 internships  |  <strong>Operating window:</strong> Mid-July 2026 \u2192 Nov 2026</p>\n<p><strong>Your edge:</strong> Strong SWE + data foundation, and three shipped products with real users/money: (1) Kalshi trading bot, (2) vending venture, (3) internship feature. You are a *builder who ships*, not a case-study tourist. Everything below leverages that.</p>\n\n<p>---</p>\n\n<h3>0. Positioning (read this first \u2014 it frames everything)</h3>\n\n<p>Most PM-intern applicants are consultants-in-training with slide decks and no shipped product. You are the opposite and rarer profile: <strong>an engineer who has built, launched, and iterated on real things.</strong> Lean into it hard.</p>\n\n<p>Your three products map to the three PM competencies recruiters screen for:</p>\n<ul>\n<li><strong>Kalshi trading bot</strong> \u2192 analytical/quant, metrics, probabilistic thinking, building against a live market. *This is your differentiator for fintech/data/growth PM roles.*</li>\n<li><strong>Vending venture</strong> \u2192 0\u21921 ownership, unit economics, ops, customer discovery, dealing with physical constraints. *This is your &quot;founder mentality&quot; story.*</li>\n<li><strong>Internship feature</strong> \u2192 shipping inside an org, cross-functional work, scoping, stakeholders. *This is your &quot;PM in the wild&quot; proof.*</li>\n</ul>\n\n<p>One-line brand: *&quot;CS student who ships \u2014 built a trading bot against live markets, ran a vending business, and shipped a feature used by real customers.&quot;*</p>\n\n<p>---</p>\n\n<h3>1. The Cycle Calendar</h3>\n\n<p>Two structural facts drive everything:</p>\n<p>1. <strong>Almost every program is ROLLING except Google APM.</strong> Rolling = apply the *week it opens*, not the week it closes. &quot;Deadline&quot; is a trap; the good reqs are gone months before it.</p>\n<p>2. <strong>The earliest posters open mid-to-late August 2026.</strong> So your prep must be *done* by mid-August. July\u2013early August is prep; late August onward is application execution.</p>\n\n<p>| Program | Opens | Closes | Rolling? | Watch |</p>\n<p>|---|---|---|---|---|</p>\n<p>| <strong>Google APM</strong> | Mid-Oct 2026 | Late Oct 2026 (~2\u20134 wks) | \u274c <strong>NO \u2014 single tight window, days/weeks</strong> | Check <code>careers.google.com/programs/apm</code> <strong>weekly from September.</strong> Miss it = wait a year. ~0.5% admit (~40 of ~8,000). |</p>\n<p>| <strong>Meta RPM</strong> | Late Aug 2026 | Fills through fall | \u2705 Rolling review | <code>metacareers.com/rotational-programs</code> from mid-Aug. Opens earliest of the big APMs. |</p>\n<p>| <strong>Microsoft PM</strong> | Mid\u2013late Aug 2026 | Rolling until filled | \u2705 | Apply ASAP. 12-wk, Redmond. Large cohort. Best roles gone early. |</p>\n<p>| <strong>Amazon PM</strong> | Aug\u2013Sept 2026 (some reqs July) | Rolling until filled | \u2705 | High req volume across orgs on <code>amazon.jobs</code>. One of the earliest. |</p>\n<p>| <strong>Apple PM/EPM</strong> | Sept 2026 (posts through Sept\u2013Nov) | Rolling, &quot;ongoing&quot; for months | \u2705 | No formal APM; target Product/Eng Program Mgmt intern (STDNT team) on <code>jobs.apple.com</code>. Team-dependent. |</p>\n<p>| <strong>Salesforce Futureforce APM</strong> | Sept 2026 (Summer-27 req already live) | ~Feb 2027, but hot teams fill by Dec | \u2705 | Apply before <strong>~Oct 31</strong> for priority. AI/ML-adjacent fill fastest. Salesforce Workday. |</p>\n<p>| <strong>Adobe PM</strong> | Early\u2013mid Sept 2026 (after Labor Day) | Rolling until filled | \u2705 | 35k+ intern apps. Monitor <code>adobe.com</code> careers from Sept. |</p>\n<p>| <strong>LinkedIn APM</strong> | Late Aug / early Sept 2026 | Rolling until filled | \u2705 | 3-mo + onboarding bootcamp. <code>careers.linkedin.com/apm</code>. ~$40\u201360/hr. |</p>\n<p>| <strong>Uber APM</strong> | Late Aug 2026 (Aug\u2013Oct) | Rolling until filled | \u2705 | Feeds 2-yr rotational APM. <code>uber.com/careers/apm</code>. |</p>\n<p>| <strong>Lyft APM</strong> | Aug\u2013Oct 2026 | Rolling until filled | \u2705 | Feeds 18-mo rotational; very small, very competitive. <code>lyft.com/careers</code>. |</p>\n<p>| <strong>DoorDash PM</strong> | Late Aug 2026 | Rolling until filled | \u2705 | 12-wk, Growth-PM flavored (metrics/experiment-heavy \u2014 plays to your quant edge). |</p>\n<p>| <strong>Atlassian APM</strong> | Sept 2026 (US) | Rolling until filled | \u2705 | US 12-wk; feeds 2\u00d712-mo rotational. (Southern-hemi program is a *different* Nov\u2013Feb cycle \u2014 ignore for US.) <code>join.atlassian.com</code>. |</p>\n<p>| <strong>Stripe PM</strong> | Mid-Aug 2026 | Rolling until filled | \u2705 | Posts early. Fintech + your Kalshi/quant story = strong fit. |</p>\n\n<p><strong>Calendar takeaways:</strong></p>\n<ul>\n<li><strong>By ~Aug 15:</strong> resume, stories, and product-sense reps must be DONE. The earliest reqs (Amazon, Microsoft, Stripe, Meta RPM) open then.</li>\n<li><strong>Sept\u2013Oct:</strong> peak volume. Most programs live. This is grind season.</li>\n<li><strong>Mid-Oct:</strong> Google APM opens \u2014 set 3 alarms. Non-negotiable.</li>\n<li><strong>Oct 31:</strong> informal priority cutoff for many rolling programs (Salesforce explicitly). Treat end of October as your &quot;everything strong is submitted&quot; deadline.</li>\n</ul>\n\n<p>---</p>\n\n<h3>2. Tiered Target Strategy</h3>\n\n<p>Apply to ~35\u201345 total. Ratio \u2248 8 Dream / ~15 Strong / ~20 Broad. Rolling means <strong>earliest submit wins</strong>, so front-load Strong/Broad in late Aug while you wait for Dream windows.</p>\n\n<h4>Tier 1 \u2014 DREAM (structured APM programs, brand + rotation; longshots, apply anyway)</h4>\n<p>Google APM, Meta RPM, Uber APM, Lyft APM, Atlassian APM, Salesforce Futureforce APM, LinkedIn APM, Airbnb, Stripe, Snap.</p>\n<p>*Why:* prestige rotational tracks, strong new-grad conversion, structured mentorship. Google is a coin-flip-in-a-hurricane \u2014 apply, don&#x27;t count on it.</p>\n\n<h4>Tier 2 \u2014 STRONG (great PM internships, realistic given your profile; your core bets)</h4>\n<p>Microsoft, Amazon, Adobe, DoorDash, Instacart, Reddit, Spotify, Coinbase, Robinhood, Databricks, Snowflake, Datadog, Intuit, PayPal, Block, Duolingo, HubSpot, Amplitude, Twilio.</p>\n<p>*Why your profile fits:* You are a technical PM candidate. <strong>Data/dev-tool/fintech companies (Databricks, Snowflake, Datadog, Amplitude, Coinbase, Robinhood, Block, PayPal, Stripe) directly value your SWE + Kalshi-quant background</strong> and will interview you on it rather than penalize a thin case-prep history. <strong>Growth-PM roles (DoorDash, Instacart, Reddit, Spotify) reward metrics/experimentation</strong> \u2014 again your lane.</p>\n\n<h4>Tier 3 \u2014 BROAD (volume, resume reps, safety; still real jobs)</h4>\n<p>Netflix, Nvidia, Dropbox, Box, Zoom, ServiceNow, Workday, Cloudflare, MongoDB, GitHub, Okta, Zscaler, DocuSign, Zendesk, RingCentral, Gusto, Brex, SoFi, Chime, Squarespace, Wix, GoDaddy, eBay, Etsy, Yelp, Chegg, Roblox, Unity, EA, Epic Games, TikTok, Walmart, Target, Best Buy, Chewy, Nike, Disney, Warner Bros Discovery, NBCUniversal, Audible, Booking.com, Expedia, Visa, Mastercard, Capital One, American Express, Fidelity, Charles Schwab, BlackRock, Bloomberg, JPMorgan, Goldman Sachs, Morgan Stanley, Citi, Bank of America, Discover, Fiserv, Cisco, IBM, Dell, HP, Oracle, SAP, Splunk, CrowdStrike, HashiCorp, 1Password, Qualcomm, Intel, AMD, Texas Instruments, Micron, Samsung, Tesla, Rivian, GM, Waymo, GE HealthCare, OpenAI, Canva, Zzz.</p>\n\n<p><strong>Targeting rules:</strong></p>\n<ul>\n<li><strong>Prioritize technical/data/fintech companies across all tiers</strong> \u2014 that&#x27;s where your edge converts to interviews. A &quot;Strong&quot; fintech beats a &quot;Dream&quot; consumer-social where you&#x27;d be out-storied.</li>\n<li>OpenAI / Nvidia / Databricks: technical-PM heavy, will grill you on systems \u2014 your SWE background is an asset here, treat as high-upside Strong even if listed elsewhere.</li>\n<li>Finance (JPM, Goldman, Capital One, Visa, Bloomberg): &quot;product/technical product&quot; roles \u2014 your trading bot is a *perfect* talking point. Good Broad-to-Strong swing group.</li>\n<li>Don&#x27;t over-invest in pure-consumer brands (Disney, Nike, retail) unless a specific req excites you \u2014 lower fit-to-effort ratio for your profile.</li>\n</ul>\n\n<p>---</p>\n\n<h3>3. What the Top Programs Actually Test</h3>\n\n<p>Four dimensions. Every interview is a weighted mix. Know the weighting per company.</p>\n\n<h4>A. Product Sense / Design (the core PM skill)</h4>\n<p>*Prompts:* &quot;Design X for Y user.&quot; &quot;Favorite product and how you&#x27;d improve it.&quot; &quot;How would you improve Google Maps?&quot;</p>\n<p>*What they grade:* user empathy, structured thinking, prioritization, tradeoffs \u2014 NOT clever features.</p>\n<p>*Framework:* <strong>Clarify \u2192 Users/segments \u2192 Pain points \u2192 Prioritize \u2192 Solutions \u2192 Tradeoffs \u2192 Metrics.</strong> State assumptions out loud.</p>\n<p>*Prep:* Do 2\u20133 mock product-design questions/week. Reps &gt; theory. Read *Decode and Conquer* (Lewis Lin) and *Cracking the PM Interview* (McDowell/Bavaro). Use Exponent (<code>tryexponent.com</code>) for question banks + mock partners.</p>\n<p>*Your edge:* Use YOUR products as answers when asked &quot;improve a product&quot; \u2014 improving your own vending routing or bot UX is a differentiated, credible answer.</p>\n\n<h4>B. Analytical / Metrics (your strongest lane \u2014 over-index here)</h4>\n<p>*Prompts:* &quot;Metric dropped 20% overnight \u2014 diagnose.&quot; &quot;What metrics for [feature]?&quot; &quot;Success metric for [product]?&quot;</p>\n<p>*What they grade:* structured diagnosis, defining north-star vs. guardrail metrics, funnel thinking, hypothesis generation.</p>\n<p>*Framework:* <strong>Segment (time/geo/platform/user-type) \u2192 internal vs. external cause \u2192 funnel-stage isolation \u2192 validate with data.</strong></p>\n<p>*Prep:* This is where <strong>Kalshi bot + Growth-PM targets (DoorDash, Instacart, Reddit)</strong> pay off. Practice metric-drop and A/B-test-design questions. Know: guardrail metrics, statistical significance basics, why you&#x27;d ship or not on a flat A/B result. You should be *better* than 90% of applicants here \u2014 make it obvious.</p>\n\n<h4>C. Estimation / Market Sizing</h4>\n<p>*Prompts:* &quot;How many [X] sold in the US per year?&quot; &quot;Revenue of [product]?&quot;</p>\n<p>*What they grade:* structured decomposition, sane assumptions, arithmetic under pressure \u2014 not the final number.</p>\n<p>*Framework:* top-down (population \u2192 filters) or bottom-up (units \u00d7 price \u00d7 frequency). Say assumptions, sanity-check the result.</p>\n<p>*Prep:* Lowest-effort dimension for you (you already think quantitatively). 5\u20136 reps total is enough. Don&#x27;t over-invest.</p>\n\n<h4>D. Behavioral / Leadership</h4>\n<p>*Prompts:* &quot;Tell me about a product you built.&quot; &quot;Time you influenced without authority.&quot; &quot;Handled conflict / failure / ambiguity.&quot;</p>\n<p>*What they grade:* ownership, impact, communication, self-awareness. Amazon = <strong>Leadership Principles</strong>, verbatim, expect 100% LP-mapped questions.</p>\n<p>*Framework:* <strong>STAR</strong> (Situation, Task, Action, Result) \u2014 quantify the Result every time.</p>\n<p>*Prep:* Build a <strong>story bank of 8\u201310 STAR stories</strong> from your three products. Each should hit multiple themes:</p>\n<ul>\n<li>Kalshi bot \u2192 analytical rigor, dealing with ambiguity/live risk, iterating on failure.</li>\n<li>Vending \u2192 ownership, unit economics, customer discovery, resource constraints, grit.</li>\n<li>Internship feature \u2192 cross-functional influence, scoping under constraints, shipping in an org, stakeholder mgmt.</li>\n<li>Map each story to Amazon LPs (Customer Obsession, Ownership, Bias for Action, Dive Deep, Deliver Results) \u2014 those LPs generalize to every other company&#x27;s behavioral round.</li>\n</ul>\n\n<h4>Per-company weighting cheat-sheet</h4>\n<ul>\n<li><strong>Google APM:</strong> heavy product sense + analytical + Googley-ness (behavioral). Bar is brutal; be sharp on all four.</li>\n<li><strong>Meta RPM:</strong> product sense + execution/analytical + &quot;move fast&quot; behavioral.</li>\n<li><strong>Amazon:</strong> behavioral (LPs) dominant, plus product/analytical. LP prep is 50% of the battle.</li>\n<li><strong>Microsoft:</strong> product sense + collaboration behavioral; more conversational, less brutal.</li>\n<li><strong>Fintech/data (Stripe, Coinbase, Databricks, Snowflake, Datadog):</strong> technical depth + analytical + product. Your SWE + bot story is the unlock \u2014 expect systems/technical follow-ups.</li>\n<li><strong>Growth shops (DoorDash, Instacart, Reddit, Spotify):</strong> metrics + experimentation dominant. Your quant lane.</li>\n</ul>\n\n<p>---</p>\n\n<h3>4. Application-Materials Checklist</h3>\n\n<h4>PM-tailored resume (one page \u2014 build this THIS week)</h4>\n<ul>\n<li>[ ] <strong>Reframe every bullet from &quot;built&quot; to &quot;product impact.&quot;</strong> SWE bullets say *how*; PM bullets say *why + outcome*. Formula: <strong>Action verb \u2192 what you shipped \u2192 measurable result \u2192 user/business impact.</strong></li>\n<li>Weak: &quot;Built a Python trading bot for Kalshi.&quot; Strong: &quot;Built and deployed a trading bot against live Kalshi markets, executing N trades and achieving [X% return / Y Sharpe]; owned the full loop from signal research to risk limits.&quot;</li>\n<li>Vending: &quot;Launched a vending venture from 0\u21921 \u2014 sourced inventory, priced for [margin], served [N] customers/month, generating $[X] revenue.&quot;</li>\n<li>Internship feature: &quot;Shipped [feature] used by [N] customers; scoped requirements with eng + design, [metric moved].&quot;</li>\n<li>[ ] <strong>Quantify everything.</strong> Users, revenue, %, latency, adoption. PMs live in numbers.</li>\n<li>[ ] Lead with the three products (Projects/Experience). Keep technical skills but subordinate them.</li>\n<li>[ ] Cut jargon a non-technical recruiter can&#x27;t parse in the first read.</li>\n<li>[ ] Tight, scannable, one page, PDF. Get 2 people (ideally 1 current PM) to red-pen it.</li>\n</ul>\n\n<h4>Cover letters</h4>\n<ul>\n<li>Default: <strong>skip</strong> for rolling big-tech (they don&#x27;t read them; speed matters more).</li>\n<li><strong>Write one when:</strong> (a) a smaller/mission-driven company explicitly asks (Duolingo, Notion-type, OpenAI), (b) you have a genuine product/mission connection, or (c) a niche fintech where your Kalshi story is directly on-thesis. 150 words max, product-specific, no fluff.</li>\n</ul>\n\n<h4>Referrals / warm intros (highest-leverage input \u2014 start NOW)</h4>\n<ul>\n<li>[ ] <strong>List UNC CS alumni in PM at target companies</strong> (LinkedIn alumni tool + UNC network). Aim for 20 names.</li>\n<li>[ ] Send <strong>10\u201315 short, specific outreach messages</strong> referencing shared UNC + one thing about their product. Ask for a 15-min chat, not &quot;a referral.&quot;</li>\n<li>[ ] A referral roughly multiplies your callback odds \u2014 <strong>for rolling programs, a referral on day 1 of the req is the single strongest move.</strong></li>\n<li>[ ] Track every contact in a sheet (name, company, status, follow-up date).</li>\n<li>[ ] Also hit: UNC PM/tech clubs, professors, former internship managers (they can refer or intro).</li>\n</ul>\n\n<p>---</p>\n\n<h3>5. Week-by-Week Cadence (Mid-July \u2192 November)</h3>\n\n<p><strong>Rule:</strong> Prep before mid-Aug; our notes.</p>\n\n<p><strong>Wk of Oct 13:</strong> \ud83d\udea8 <strong>GOOGLE APM OPENS (~mid-Oct).</strong> Apply immediately. Also hit any remaining targets. This is the week you set alarms and check daily.</p>\n\n<p><strong>Wk of Oct 20:</strong> Google APM window closing \u2014 confirm submitted. Push referrals on any still-open dream targets.</p>\n\n<p><strong>Wk of Oct 27 (~Oct 31 priority cutoff):</strong> Everything strong should be IN. Salesforce/priority-review deadline. Full interview mode.</p>\n\n<p><strong>Nov:</strong> Interviews + offers. Keep mock cadence for active loops. Apply to any straggler rolling reqs still live. Negotiate/decide.</p>\n\n<p>---</p>\n\n<h3>6. Top 5 Highest-ROI Moves THIS Week (mid-July, Jul 14\u201320)</h3>\n\n<p>Ranked by leverage. Do all 5 by Sunday.</p>\n\n<p>1. <strong>PM-reframe your resume (do it first).</strong> Rewrite all three products as PM-impact bullets (Action \u2192 shipped \u2192 metric \u2192 impact) per \u00a74. Everything downstream \u2014 referrals, applications \u2014 depends on this asset existing. 3\u20134 hours.</p>\n\n<p>2. <strong>Build the alumni referral list + send the first 3\u20135 messages.</strong> Referrals are the single biggest callback multiplier and have the longest lead time (people are slow to reply). Start today so warm intros are live before reqs open in August. Use LinkedIn UNC alumni filter \u2192 PM titles at target companies.</p>\n\n<p>3. <strong>Start your story bank + do 3 product-sense mocks.</strong> Draft 4\u20135 STAR stories from your products this week; do 3 mock product-design questions (Exponent or a peer). Product sense is the slowest skill to build \u2014 begin the reps now, not in September.</p>\n\n<p>4. <strong>Set up the application tracker.</strong> One sheet: Company | Tier | Opens | Applied date | Referral? | Status | Next action. Rolling deadlines mean *tracking is the job* \u2014 this prevents the #1 failure mode (missing a window). 30 minutes.</p>\n\n<p>5. <strong>Set the Google APM alarm system now.</strong> Create calendar reminders to check <code>careers.google.com/programs/apm</code> <strong>weekly starting the first week of September</strong>, plus a daily check for mid-to-late October. The one non-rolling, un-recoverable window in the entire cycle \u2014 automate it so it&#x27;s impossible to miss.</p>\n\n<p>---</p>\n\n<p>*This is your operating doc. Prep is done by Aug 15; applications go the day reqs open; referrals start today; Google APM is the one hard deadline. Your product-builder profile is rare \u2014 make every recruiter see the shipped work in the first 10 seconds.*</p>";

<script>(function () {

  // ---- real vs. fuzzy open/close dates ----

  var SEASON_ORDER = ["Summer", "Fall", "Winter", "Spring", "Rolling", "Unknown"];

  function tierOf(name) {

  function timelineHtml() {

    views.forEach(function (v) { v.classList.toggle("on", v.dataset.view === id); });
    // re-render the live boards on entry so a status flip made in one is reflected in the other
    if (id === "open") { var ov = app.querySelector('.view[data-view="open"]'); if (ov) ov.innerHTML = openHtml(); }
    if (id === "justopened") { var jv = app.querySelector('.view[data-view="justopened"]'); if (jv) jv.innerHTML = justOpenedHtml(); }
    if (id === "pipeline" && typeof refreshFunnels === "function") refreshFunnels();
  }
  tabs.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) show(b.dataset.tab); });
  show("justopened");   // default landing view

  // ---- Open Now tier tabs — bound on `app` (never replaced) since the "open" view's
  // innerHTML gets swapped wholesale both here and by the live-feed fetch below ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-otier]"); if (!b) return;
    openTierFilter = b.dataset.otier;
    var sec = app.querySelector('.view[data-view="open"]');
    if (sec) sec.innerHTML = openHtml();
  });

  // ---- manual status flips on Open Now / Just Opened rows: cycle the clickable pill through
  // Applied -> Interviewing -> Offer -> Rejected -> (clear), persisted per-company in localStorage ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-costat]"); if (!b) return;
    e.preventDefault();
    var key = b.dataset.costat;
    var srv = "";
    for (var i = 0; i < (openings || []).length; i++) {
      var r = openings[i];
      if (r.active !== false && roleKey(r) === key && r.applied) { srv = r.applied; break; }
    }
    // ring includes an explicit "none" step so you can cycle all the way back to "+ Status"
    // from any state — Applied -> Interviewing -> Offer -> Rejected -> (+ Status) -> Applied ...
    var o = openStat[key];
    var eff = (o === "none") ? "none" : (o || srv || "");
    var RING = ["applied", "interview", "offer", "accepted", "rejected", "irrelevant", "duplicate", "none"];
    var cur = eff === "" ? "none" : eff;
    openStat[key] = RING[(RING.indexOf(cur) + 1) % RING.length];   // "none" = explicit clear, shows "+ Status"
    saveOpenStat();
    var v = b.closest(".view");
    if (v) v.innerHTML = v.dataset.view === "justopened" ? justOpenedHtml() : openHtml();
  });

  // ---- Market Edges: copy a draft bullet/summary line straight to clipboard ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-copy-edge]"); if (!b) return;
    var me = HQ.marketEdges; if (!me) return;
    var edge = (me.edges || [])[+b.dataset.copyEdge]; if (!edge) return;
    var text = b.dataset.copySummary ? (edge.summaryLine || "") : (edge.draftBullets || [])[+b.dataset.copyBullet] || "";
    if (!text) return;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    var old = b.textContent; b.textContent = "Copied ✓";
    setTimeout(function () { b.textContent = old; }, 1200);
  });

  // ---- live feed: fetch the freshest openings at runtime so the board never shows stale/baked data ----
  if (HQ.feedUrl) {
    fetch(HQ.feedUrl, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (f) {
        if (!f || !f.roles) return;
        openings = f.roles; if (f.updated) HQ.updated = f.updated;
        var sec = app.querySelector('.view[data-view="open"]');
        if (sec) sec.innerHTML = openHtml();
        var jsec = app.querySelector('.view[data-view="justopened"]');
        if (jsec) jsec.innerHTML = justOpenedHtml();
        var tsec = app.querySelector('.view[data-view="timeline"]');
        if (tsec) tsec.innerHTML = timelineHtml();     // refresh any real-date chips matched to live/closed roles
        if (typeof render === "function") render();   // refresh pipeline: OPEN badges + deep-links to live postings
      })
      .catch(function () { /* offline / file:// — keep baked feed */ });
  }

  // ---- pipeline ----
  var KEY = HQ.key || "pm-pipeline-v2", FLAG = HQ.flag || "pm-targets-v2";
  var STAT = { research: ["Researching", "st-research"], applied: ["Applied", "st-applied"], interview: ["Interviewing", "st-interview"], offer: ["Offer", "st-offer"], accepted: ["Accepted", "st-accepted"], rejected: ["Rejected", "st-rejected"] };
  var ORDER = ["research", "applied", "interview", "offer", "accepted", "rejected"];
  var data = [];
  try { var st = localStorage.getItem(KEY); data = (st && JSON.parse(st).length) ? JSON.parse(st) : []; } catch (e) { data = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  try {
    if (!localStorage.getItem(FLAG)) {
      var have = {}; data.forEach(function (d) { have[(d.c || "").toLowerCase()] = 1; });
      comps.forEach(function (c) { if (!have[c.c.toLowerCase()]) data.push({ c: c.c, url: c.url || "", prog: c.prog || "", lc: c.lc || "", nyc: c.nyc || "", s: "research" }); });
      localStorage.setItem(FLAG, "1"); save();
    }
  } catch (e) {}
  // ---- fold the application log (applied.json) into the pipeline rows, once per company+status,
  // so a manual change you make later is never overwritten on the next load ----
  (function seedFromApplied() {
    var SEEN = KEY + "-appliedseen", seen = {}, changed = false;
    try { seen = JSON.parse(localStorage.getItem(SEEN)) || {}; } catch (e) { seen = {}; }
    (HQ.applied || []).forEach(function (a) {
      var st = a.status || "applied", sk = canonCo(a.company) + "|" + st;
      if (seen[sk] || !(st in RANK)) return;
      seen[sk] = 1;
      data.forEach(function (d) { if (canonCo(d.c) === canonCo(a.company) && RANK[st] > RANK[d.s || "research"]) { d.s = st; changed = true; } });
    });
    try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch (e) {}
    if (changed) save();
  })();
  var filter = "";
  var seasonFilter = "";   // "" = all seasons; else one of SEASON_ORDER (declared near top)
  var rowsEl = app.querySelector("#rows"), funnelEl = app.querySelector("#funnel"), cntEl = app.querySelector("#cnt");
  var seasonTabsEl = app.querySelector("#seasontabs");

  function renderSeasonTabs() {
    if (!seasonTabsEl) return;
    var counts = {};
    data.forEach(function (d) { var s = seasonOf(d.c).season || "Unknown"; counts[s] = (counts[s] || 0) + 1; });
    var all = '<button class="stab' + (seasonFilter ? "" : " on") + '" data-season="">All <b>' + data.length + "</b></button>";
    var tabs = SEASON_ORDER.filter(function (s) { return counts[s]; }).map(function (s) {
      return '<button class="stab sea-' + s.toLowerCase() + (seasonFilter === s ? " on" : "") + '" data-season="' + s + '">'
        + s + " <b>" + counts[s] + "</b></button>";
    }).join("");
    seasonTabsEl.innerHTML = all + tabs;
  }
  app.querySelector("#seasontabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-season]"); if (!b) return;
    seasonFilter = b.dataset.season; render();
  });

  function render() {
    renderSeasonTabs();
    // re-sort every render (not just first-seed) so companies already saved from an older
    // alphabetical seed still land in season -> open-date order, same key build_site.py uses
    data.sort(function (a, b) {
      var sa = seasonOf(a.c), sb = seasonOf(b.c);
      return sa.sr - sb.sr || sa.mr - sb.mr || a.c.toLowerCase().localeCompare(b.c.toLowerCase());
    });
    refreshFunnels();   // Applied / Interviewing / Offers / Researching, on Pipeline and at the top of Just Opened
    // map live openings by company so a target with an OPEN role deep-links to the actual posting
    // (active !== false: a recently-closed role riding along in `openings` isn't "open now")
    var OPEN = {}, CLOSED = {};
    (openings || []).forEach(function (r) {
      var k = (r.company || "").toLowerCase(); if (!k) return;
      if (r.active === false) { if (!CLOSED[k] || (r.removedAt || 0) > (CLOSED[k].removedAt || 0)) CLOSED[k] = r; }
      else if (r.url && !OPEN[k]) OPEN[k] = r;
    });
    rowsEl.innerHTML = ""; var shown = 0, lastSeason = null;
    data.forEach(function (d, i) {
      if (filter && d.c.toLowerCase().indexOf(filter) < 0) return;
      var seaInfo = seasonOf(d.c);
      var seaLabel = seaInfo.season || "Unknown";
      if (seasonFilter && seaLabel !== seasonFilter) return;
      shown++;
      // section divider on every season change — only in the unfiltered "All seasons" view;
      // a single season tab is already one homogeneous group, so a header would be redundant
      if (!seasonFilter && seaLabel !== lastSeason) {
        lastSeason = seaLabel;
        var hd = document.createElement("li"); hd.className = "sdiv sea-" + seaLabel.toLowerCase();
        hd.innerHTML = '<span>' + seaLabel + "</span>";
        rowsEl.appendChild(hd);
      }
      var live = OPEN[d.c.toLowerCase()];              // a real posting for this company, if open now
      var closedRole = !live && CLOSED[d.c.toLowerCase()];   // the only known posting recently closed, none open
      var href = (live && live.url) || d.url || "";     // deep-link to the posting, else the company's board
      var li = document.createElement("li"); li.className = "prow" + (closedRole ? " prow-closed" : "");
      var co = '<span class="pco">' + (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(d.c) + "</a>" : esc(d.c)) + "</span>";
      var pro = '<span class="pro">' + esc((live && live.title) || d.prog || "") + "</span>";
      var s = STAT[d.s] || STAT.research;
      var lc = d.lc ? '<span class="lcb lc-' + d.lc + '" title="LeetCode difficulty">' + (LCLABEL[d.lc] || d.lc) + "</span>" : "";
      var nyc = d.nyc ? '<span class="nycb nyc-' + d.nyc + '" title="NYC presence">' + (d.nyc === "hq" ? "NYC HQ" : "NYC") + "</span>" : "";
      var openb = live ? '<span class="nycb" style="background:var(--offer)" title="open role live now">● OPEN</span>' : "";
      var sea = seaInfo.season ? '<span class="seab sea-' + seaInfo.season.toLowerCase() + '" title="when this window opens">' + seaInfo.season + "</span>" : "";
      // real scraped date > recently-closed date > fuzzy hand-estimated window > nothing —
      // never fabricate a date for a target with none of the above
      var dateTarget = live ? { firstSeen: live.firstSeen, postedAt: live.postedAt }
        : closedRole ? { removedAt: closedRole.removedAt }
        : openWindowOf(d.c) ? { openWindow: openWindowOf(d.c) } : null;
      var dateChip = formatListingDates(dateTarget);
      // non-target-school arbitrage (market-edges.json): UNC alumni field far fewer inbound
      // requests than feeder-school alumni at the same company — one click to go find one
      var alumniUrl = "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(d.c + ' "University of North Carolina at Chapel Hill"');
      var alumni = '<a class="apply" style="background:var(--surface-2);color:var(--muted)" href="' + alumniUrl + '" target="_blank" rel="noopener" title="Find a UNC alum at ' + esc(d.c) + ' for a warm intro">Alumni ↗</a>';
      li.innerHTML = co + pro + openb + dateChip + sea + nyc + lc
        + '<button class="pill ' + s[1] + '" data-i="' + i + '" data-act="cycle">' + s[0] + "</button>"
        + (href ? '<a class="apply" href="' + esc(href) + '" target="_blank" rel="noopener">' + (live ? "Apply to role ↗" : "Board ↗") + "</a>" : "")
        + alumni
        + '<button class="pill st-rejected" data-i="' + i + '" data-act="del" title="Remove" style="background:none;color:var(--faint)">×</button>';
      rowsEl.appendChild(li);
    });
    cntEl.textContent = (filter || seasonFilter) ? shown + " / " + data.length : data.length + " targets";
    if ((filter || seasonFilter) && !shown) rowsEl.innerHTML = '<li class="empty">No matches.</li>';
  }
  rowsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var i = +b.dataset.i;
    if (b.dataset.act === "cycle") { var d = data[i]; d.s = ORDER[(ORDER.indexOf(d.s) + 1) % ORDER.length]; }
    else if (b.dataset.act === "del") { data.splice(i, 1); }
    save(); render();
  });
  app.querySelector("#search").addEventListener("input", function () { filter = this.value.trim().toLowerCase(); render(); });

  // ---- export/import: pipeline status is localStorage, which is PER-ORIGIN (onrender.com
  // and localhost don't share it) — this makes progress a portable file instead ----
  app.querySelector("#exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (HQ.key || "pm-pipeline") + "-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  });
  var importFile = app.querySelector("#importFile");
  app.querySelector("#importBtn").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var f = this.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!Array.isArray(incoming)) throw new Error("not an array");
        // merge by company (case-insensitive): imported status wins for a company already
        // present, anything imported-only gets appended — importing never silently drops rows
        var have = {}; data.forEach(function (d, i) { have[(d.c || "").toLowerCase()] = i; });
        incoming.forEach(function (row) {
          var k = (row.c || "").toLowerCase(); if (!k) return;
          if (k in have) data[have[k]] = row; else data.push(row);
        });
        save(); render();
        alert("Imported " + incoming.length + " rows.");
      } catch (e) { alert("Couldn't read that file as a pipeline export: " + e.message); }
      importFile.value = "";
    };
    reader.readAsText(f);
  });

  render();
})();
</script></body></html>
