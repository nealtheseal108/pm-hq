nership (founder grit)", "nealStory": "As Founder of Biryani Blitz: 0->1 hot-food vending platform at UC Berkeley, backed by Wharton + UNC Innovation Labs ($5K), $200K Wharton Startup Challenge finalist \u2014 sustained ownership through ambiguity.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Data-driven prioritization / analytical rigor", "nealStory": "Shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38%, and defined 15+ KPIs (First-Time Fix Rate as North Star) in the FieldPulse PRD \u2014 comfortable defining and moving metrics.", "factIds": ["ep-1", "fp-1"]}], "analyticalFocus": ["Security-specific metrics: MTTD / MTTR (mean time to detect/respond), false-positive vs false-negative tradeoff, detection coverage (MITRE ATT&CK)", "The 'you can't count breaches that didn't happen' measurement problem \u2014 proxy metrics and red-team validation", "Prioritization frameworks \u2014 RICE explicitly cited for CrowdStrike PM cases; be able to walk Reach/Impact/Confidence/Effort", "Platform/business metrics: module attach rate, seat/device expansion, sensor resource footprint, Falcon Flex module adoption", "AI-adoption metrics for Charlotte AI: analyst trust/override rate, alert-noise reduction, automation coverage, time saved per investigation", "SMB vs enterprise funnel metrics for Falcon Go: activation, time-to-first-value, retention/renewal", "Back-of-envelope estimation (e.g., alert volume, endpoints, storage/ingest cost \u2014 Next-Gen SIEM touts 50% lower storage, 150x faster search)"], "gotchas": ["Do NOT bring up the July 19, 2024 global outage unprompted (faulty Falcon sensor update crashed millions of Windows machines). If asked, be factual and pivot to lessons on release safety, staged rollouts, and blast-radius reduction \u2014 do not speculate or over-apologize.", "This is deep-tech cybersecurity, not consumer \u2014 product-sense answers must reason about SOC analysts, security admins, and CISOs, not casual end users. Show you understand the buyer vs. user split (CISO buys, analyst uses).", "Security's core tension is false positives (alert fatigue) vs false negatives (missed breach) \u2014 name it explicitly; interviewers reward candidates who don't optimize speed at the expense of missing a breach.", "The single-sensor / one-unified-platform architecture is the moat \u2014 don't propose designs that fragment the platform or bloat the agent without justifying the tradeoff.", "Know the 2025 'agentic' narrative (Charlotte AI agentic SOC, 7 agents, Agentic SOAR, AgentWorks) \u2014 bringing current threat-landscape and AI-in-security awareness is an explicit expectation.", "Neal's work-authorization status is UNCONFIRMED in the ledger \u2014 internship applications have knockout auth fields; he must confirm before applying.", "GPA is not on the master resume \u2014 only list if >=3.5; Neal must supply.", "No CrowdStrike-published APM-intern-specific interview loop was found; the round structure here is generalized from PM/PgM aggregators (Glassdoor, Comparably, InterviewQuery, TechPrep) \u2014 verify current specifics with the recruiter.", "Ledger presentation flags: soften the 97% outreach-time cut (near-ceiling, no baseline) and round 41.7% net margin to ~42% labeled 'projected' \u2014 phrasing only, never invent new numbers."], "sources": ["https://www.crowdstrike.com/en-us/platform/", "https://www.crowdstrike.com/en-us/pricing/", "https://www.crowdstrike.com/en-us/platform/cloud-security/", "https://www.crowdstrike.com/en-us/platform/charlotte-ai/", "https://www.crowdstrike.com/en-us/platform/next-gen-siem/", "https://www.crowdstrike.com/en-us/blog/crowdstrike-fall-2025-release-defines-agentic-soc-secures-ai-era/", "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-unveils-falcon-platform-fall-release-to-lead-cybersecurity-into-agentic-era/", "https://www.crowdstrike.com/en-us/about-us/sustainability/social-mission/", "https://www.crowdstrike.com/en-us/blog/crowdstrike-commitment-merit-mission/", "https://www.comparably.com/companies/crowdstrike/mission", "https://www.interviewquery.com/interview-guides/crowdstrike-product-manager", "https://www.glassdoor.com/Interview/CrowdStrike-Interview-Questions-E795976.htm", "https://www.techprep.app/blog/crowdstrike-interview-process", "https://www.crowdstrike.com/en-us/careers/university-interns/", "https://www.jointaro.com/interviews/companies/crowdstrike/?tab=experiences", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Okta", "products": ["Workforce Identity Cloud (WIC) - flagship IAM suite for employees, contractors, partners, and non-human identities; includes SSO, Adaptive MFA, Universal Directory, Lifecycle Management, Access Management, Identity Governance (IGA), and Privileged Access", "Customer Identity Cloud (CIC), powered by Auth0 - developer-focused CIAM: APIs/SDKs to embed login, authorization, and fraud protection into customer-facing apps", "Auth0 Platform - developer identity platform (login, social/enterprise connections, authorization, actions/extensibility)", "Universal Directory - single source of truth for all user profiles across apps", "Adaptive MFA / Okta Verify - phishing-resistant, risk-based multi-factor authentication", "Lifecycle Management - automated user provisioning/deprovisioning across SaaS apps", "Okta for AI Agents (early access) and Auth0 for AI Agents - governance, visibility, and secure auth for agentic/AI identities", "Okta Integration Network (OIN) - 7,000+ pre-built app integrations"], "valuesAndBar": ["Love our customers - customers are at the heart of everything; success is defined by customer success (customer-centricity / user-obsession). Expect behavioral prompts on discovering and serving user needs.", "Always secure. Always on. - every employee is an owner of security and reliability; never jeopardize the mission-critical trust customers place in Okta. Security-first product judgment is expected.", "Build and own it - deep ownership, accountability for results, act like a builder/owner of the company's future. Maps directly to founder/0-to-1 stories.", "Drive what's next - proactive, fast-moving innovation, continuous learning, refusing to settle; deliver the future of identity (incl. AI).", "PM-intern competency bar (from JD): understands customer needs and business problems; partners cross-functionally with Eng/Design/PMM; can document and prioritize user stories; monitors industry/competitive trends; comfortable with complex technical concepts; strong analytical + communication skills; thrives in ambiguous, fast-scaling environments; intellectual curiosity + entrepreneurial mindset."], "interviewFormat": ["Reported PM loop is ~3 core stages: (1) HR/recruiter behavioral screen, (2) product/case questions with a team member (PM), (3) career-ambition + strategy discussion with a Pillar lead (senior PM/leader). Candidates note additional rounds that can feel repetitive.", "Average reported time-to-hire ~22 days; difficulty rated moderate (~2.5/5 on Glassdoor).", "PM-intern program (Summer 2026): 12-week paid internship, hybrid, San Francisco office; interns placed on Access Management or Identity Management teams within Workforce Identity Cloud; collaborate with Engineering, Research & Design, Product Marketing, and field teams; each intern gets a dedicated mentor.", "Expect IAM domain fluency to be probed: SSO, MFA, OAuth 2.0, OpenID Connect (OIDC), SAML, API access management, Lifecycle Management, and the WIC vs. CIC/Auth0 distinction. You do not need to be an expert, but should reason about identity/security tradeoffs.", "Some interviewers reportedly under-prepared / unsure of which team you are interviewing for - drive clarity yourself and steer the conversation.", "Note: this is an MBA-track PM intern posting; an undergrad APM/PM intern track was not confirmed publicly - Neal should verify the specific req he is applying to (Product Analyst intern is the confirmed undergrad-facing product role)."], "productSensePrompts": [{"prompt": "Design a phishing-resistant MFA onboarding flow for a mid-size company rolling out Okta Verify to 5,000 employees. How do you balance security with adoption/friction?", "approach": "Clarify the user (IT admin vs. end employee vs. security/CISO buyer) and the goal (drive enrollment without help-desk overload or lockouts). Segment users (deskless, remote, execs). Pain points: enrollment friction, device diversity, fear of lockout. Prioritize a progressive enrollment flow (self-service + fallback factor + admin push), phishing-resistant defaults (FIDO2/passkeys), and clear recovery. Tie to Okta's 'Always secure. Always on.' value - never trade off the security promise. North-star metric: % enrolled in phishing-resistant factor within 30 days; guardrail: help-desk ticket volume + lockout rate. Neal can anchor this in his real user-research-first instinct (ep-1, bb-1)."}, {"prompt": "You are a PM on Customer Identity Cloud (Auth0). A developer is your primary user. How would you improve the developer's first-login-to-production ('time to first login') experience?", "approach": "Identify the persona: a developer embedding auth, optimizing for speed and trust. Map the journey: sign up to SDK/quickstart to first working login to production hardening. Find friction (config sprawl, unclear docs, connection setup). Prioritize by impact on activation: guided quickstarts, sane secure defaults, copy-paste snippets, sandbox-to-prod parity. North-star: time-to-first-successful-login; activation = % of new tenants reaching a production login within 7 days. Emphasize developer empathy - Neal's dev-tools work (sl-1, sl-2, building a 2-click Chrome extension) is the direct analog to reducing developer workflow friction."}, {"prompt": "Okta is launching identity governance for AI agents (non-human identities). Design an MVP for giving IT admins visibility and control over which AI agents can access which systems.", "approach": "Clarify: buyer/user is a security-conscious IT admin; the trend is exploding agentic identities Okta explicitly targets ('Drive what's next'). Define the job: discover agents, assign least-privilege access, audit/revoke. MVP scope: an agent inventory + a policy layer (scoped, time-boxed, revocable tokens) + an audit log. Cut governance-analytics/anomaly-detection to v2. Tradeoff: manual approval (safe, slow) vs. auto-provisioning (fast, risky) - lean secure-by-default. Metrics: % agents under managed identity, mean-time-to-revoke, over-privileged-agent count. Neal can connect his agentic-pipeline experience (bb-3, RAG/agents in skills) to show he understands the domain."}, {"prompt": "Adoption of Okta's Lifecycle Management (auto provisioning/deprovisioning) is low among existing SSO customers. Diagnose why and propose how you'd grow it.", "approach": "This is a mixed product-sense + analytical prompt. Structure: (1) segment the funnel - are customers aware, activated, or stuck in setup? (2) hypothesize causes: setup complexity (mapping SaaS app connectors), unclear ROI, integration gaps. (3) validate with data (activation by app connector, support tickets) and a few customer interviews. (4) prioritize fixes: templated provisioning for top-10 apps, an ROI/'offboarding risk' dashboard, in-product nudges for SSO customers not yet on LCM. North-star: % of SSO customers with >=1 active provisioning integration. Neal's activation/retention experience (ep-1: 17->563 users, 40% repeat lift bb-3) shows he thinks in funnels and adoption levers."}], "behavioralMapping": [{"value": "Build and own it (ownership, act like a builder/owner)", "nealStory": "Founded Biryani Blitz and ran it as Founder & AI Product Manager - built a 0->1 hot-food vending platform deployed at UC Berkeley end to end, from 180 customer interviews to a shipped product with projected ~42% net margin. Frame the story around taking full ownership of an ambiguous problem and shipping despite no playbook.", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "Love our customers (customer-centricity / user obsession)", "nealStory": "Scaled the Elephant productivity app from 17 to 563 active users in one quarter driven by 200+ user interviews, then shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38%. Use this to show research-first, outcome-driven customer empathy (strongest before->after metric in the ledger).", "factIds": ["ep-role", "ep-1"]}, {"value": "Drive what's next (proactive innovation, AI, refusing to settle)", "nealStory": "Shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities and built a computer-vision funnel-analytics system (OpenCV) - plus authored a RAG-based predictive-restocking PRD with 15+ KPIs. Positions Neal as an AI-native builder aligned with Okta for AI Agents. When quoting the outreach time saving, give a before->after rather than the bare 97% figure.", "factIds": ["bb-3", "bb-2", "fp-1"]}, {"value": "Cross-functional collaboration & delivering in ambiguity (JD bar)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40%, and translated developer pain points into a GitHub testing interface accelerating PR-to-merge ~25%. Shows working across dev workflows and shipping in an ambiguous internal-tools setting - strong analog to Okta's dev-tooling/CIC surface.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Analytical / metrics-driven judgment (product-sense + execution bar)", "nealStory": "Authored the FieldPulse predictive-restocking PRD: defined a 3-flow UX with AI explainability and 15+ KPIs with First-Time Fix Rate as the North Star; complemented by the CV telemetry system giving a physical machine e-commerce-grade conversion analytics. Use for 'tell me about defining success metrics / a KPI you chose and why.'", "factIds": ["fp-1", "bb-2"]}, {"value": "Leadership / influence without authority", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH); also a Bridge to BCG invitee (~10% acceptance). Use for people-leadership and selectivity/drive prompts; per ledger, add team size or a concrete shipped outcome rather than leaving it title-only.", "factIds": ["ld-1", "ld-2", "ld-3"]}], "analyticalFocus": ["Adoption/activation funnels for a security product (e.g., % of employees enrolled in MFA, % of SSO customers activating Lifecycle Management)", "Time-to-value metrics for developers on Auth0/CIC (time-to-first-login, tenant activation rate)", "Security vs. friction tradeoffs quantified (lockout rate, help-desk ticket volume, phishing-resistant-factor coverage %)", "North-star + guardrail metric selection and justification (candidate should propose one NSM and defend it)", "Sizing/estimation for enterprise SaaS (e.g., estimate number of identities/agents to secure, TAM for AI-agent identity)", "Retention/expansion levers in a land-and-expand enterprise model (net revenue retention, seat expansion, cross-sell WIC<->CIC)", "Diagnosing a metric drop (e.g., login success rate or provisioning success rate dropping) with a structured funnel breakdown"], "gotchas": ["Work authorization is a knockout: the confirmed PM-intern JD explicitly requires U.S. work authorization with NO sponsorship. Neal's ledger flags workAuth as UNCONFIRMED - he must confirm eligibility before applying, or this is an automatic filter.", "The publicly confirmed Summer 2026 PM-intern posting is MBA-track (graduating 2027); an undergrad APM/PM intern track was not confirmed. Neal (grad May 2028) should verify he is targeting the right req - the undergrad-facing product role is 'Product Analyst intern'. Do not assume an APM program exists.", "This is a security/identity company - product-sense answers that ignore the security dimension will fall flat. Always weave in the 'Always secure. Always on.' lens (least privilege, phishing resistance, don't trade away trust for growth).", "Know the WIC vs. CIC/Auth0 distinction cold: WIC = internal workforce IAM (admin is the user); CIC/Auth0 = developer-embedded customer identity (developer is the user). Answering a CIC prompt as if it were WIC (or vice versa) is a common miss.", "Brush up on IAM primitives: SSO, MFA, OAuth 2.0, OIDC, SAML, provisioning/SCIM, RBAC. You don't need deep expertise, but reason confidently with the vocabulary.", "Ledger phrasing risks: soften near-ceiling/over-precise numbers - present 97% outreach-time cut as a before->after, round 41.7% margin to ~42% and label it projected, and keep 'projected' on the $145K ARR. Never present projections as realized results.", "Interviewers may be under-prepared or unsure which team you're targeting - proactively state your team/product interest and structure the conversation yourself (demonstrates 'Build and own it').", "Do not claim IAM/security work experience Neal doesn't have - his edge is 0->1 building, user research, AI/agents, and dev-tooling; map those honestly rather than overclaiming domain depth."], "sources": ["https://www.okta.com/products/okta-customer-identity/", "https://www.okta.com/blog/product-innovation/one-platform-every-identity-unifying-okta-customer-identity-with-okta-workforce/", "https://www.sec.gov/Archives/edgar/data/1660134/000166013426000020/okta-20260131.htm", "https://www.okta.com/blog/company-and-culture/the-story-behind-oktas-values/", "https://www.okta.com/blog/company-and-culture/how-our-core-values-shape-our-identity/", "https://www.okta.com/company/careers/intern-program/", "https://builtin.com/job/okta-mba-product-management-intern-summer-2026-application-ripplematch/7515012", "https://www.glassdoor.com/Interview/Okta-Product-Manager-Interview-Questions-EI_IE444756.0,4_KO5,20.htm", "https://prepfully.com/interview-questions/okta/product-manager", "https://mindmajix.com/okta-interview-questions", "https://www.okta.com/company/careers/mba-product-management-intern-summer-2026-7310653/"]}, {"company": "Zscaler", "products": ["Zero Trust Exchange (ZTE) \u2014 the AI-powered cloud platform that inspects all traffic inline; processes 250B+ daily transactions for 40M+ users across 150+ data centers", "Zscaler Internet Access (ZIA) \u2014 secure web gateway / SSE for internet- and SaaS-bound traffic (SWG, inline CASB, DLP, cloud firewall, bandwidth control)", "Zscaler Private Access (ZPA) \u2014 Zero Trust Network Access to private apps via outbound-only App Connector tunnels; apps get no inbound ports, no public DNS, no attack surface", "Zscaler Digital Experience (ZDX) \u2014 endpoint-to-app digital experience monitoring (hop-by-hop latency, packet loss, app response) from the Client Connector agent", "Data Protection / Multi-Modal DLP \u2014 GenAI-powered DLP that protects data across text, images, video, and audio", "Risk360 \u2014 cyber risk quantification using ZIA/ZPA telemetry, DLP, ThreatLabz research, and external attack-surface data across 115+ risk factors", "AI Security Suite (launched Jan 27, 2026) \u2014 discover/secure/govern enterprise AI: AI asset inventory + dependency map, inline inspection, automated red teaming, prompt hardening, runtime guardrails, AI Deception, MCP gateway", "Deception \u2014 decoys/lures that divert and neutralize attackers (extended to AI Deception)"], "valuesAndBar": ["TOPIC values framework \u2014 behavioral questions map directly to these (confirm exact 'O' at interview; see gotchas): T=Teamwork (share info openly, move as one, serve over prestige), O=Ownership/Openness (accountability, own outcomes), P=Passion (fierce passion for work, customers, colleagues), I=Innovation (open mind, turn opportunities into results), C=Customer Obsession (everything focused on customer success)", "Core architectural philosophy: 'never trust, always verify' (Zero Trust) \u2014 Zscaler expects PMs to internalize this as both product principle and company mindset", "Customer Obsession is culturally emphasized above the rest (leadership calls it 'the secret to success')", "PM bar: strong written + verbal communication; ability to write comprehensive PRDs; can present complex ideas to both technical and non-technical stakeholders (eng, sales, product)", "Domain fluency valued: cybersecurity / network security, identity security, industry standards"], "interviewFormat": ["Reported core loop is ~3 rounds of ~30-min calls: (1) HR/recruiter screen, (2) UX lead, (3) hiring manager", "Final stage is often a panel with cross-functional stakeholders from engineering, sales, and product management \u2014 assesses culture fit + cross-functional communication", "Expect a case-study / prior-project presentation round: walk through a product you built, your strategic thinking, and product vision", "Behavioral questions are explicitly tied to the TOPIC values", "Technical-knowledge screen possible: proxy vs. DNS, how TCP/IP works, SAML (know the basics even for APM/intern)", "Motivation/fit: 'Why Zscaler?' and 5-year career-development alignment questions are common", "Note: public data is skewed toward full-time PM loops; the APM/intern loop is typically a lighter subset (recruiter + 1-2 PM/HM rounds). Ask the recruiter to confirm exact rounds."], "productSensePrompts": [{"prompt": "Zscaler Digital Experience (ZDX) tells IT admins why a user's app is slow (network vs. device vs. app). Design a new feature that helps a non-technical end user (not IT) understand and self-resolve their own connectivity/performance issues.", "approach": "Clarify user (frustrated remote employee, not IT) and goal (reduce helpdesk tickets + downtime). Pain: user only sees 'app is slow,' has no visibility or agency. Segment by problem source (home wifi, ISP, device, VPN/app). Prioritize a self-service 'connection health' surface in Client Connector: plain-language diagnosis + one-click fixes (restart connector, switch network) + auto-ticket with pre-attached diagnostics when unfixable. North Star: % of self-resolved incidents; guardrail: no increase in false 'all good' signals. Tie to Customer Obsession."}, {"prompt": "Design a data-loss-prevention (DLP) experience for employees using public GenAI tools (ChatGPT, Claude). How do you stop sensitive data leaks without blocking productivity?", "approach": "Frame the tension: security (block leaks) vs. adoption (don't cripple useful AI). Users: employees pasting data, security admins setting policy. Instead of hard-block, design graded interventions \u2014 inline warning + redaction suggestion, coach-and-allow, or block, tiered by data sensitivity + app risk. Give admins policy templates and an audit trail; give users a clear 'why' on every block (education > friction). Metrics: leak-attempt catch rate, false-positive/override rate, sanctioned-AI adoption. Anchor in ZTE inline inspection + Multi-Modal DLP + 'never trust, always verify.'"}, {"prompt": "Zscaler processes 250B+ transactions/day. Design a dashboard/product for a CISO to quantify and communicate their organization's cyber risk to the board (this is essentially Risk360).", "approach": "User = CISO reporting up to a non-technical board. Job-to-be-done: translate raw telemetry into a defensible risk narrative + prioritized actions. Design a single risk score decomposed into drivers (attack surface, config posture, user behavior, third-party), each with 'so what' + top remediations ranked by risk-reduction-per-effort. Add trend-over-time + peer benchmarking for board credibility. Metrics: score-to-remediation conversion, time-to-communicate risk, reduction in high-severity factors. Note privacy/telemetry tradeoffs."}, {"prompt": "Onboarding is a known friction point for Zero Trust adoption. Design the first-run/onboarding experience for a mid-market IT admin deploying ZPA (private app access) for the first time.", "approach": "Clarify: admin is likely replacing a legacy VPN, skeptical, time-poor, fears breaking access. Goal: fast time-to-first-value + trust. Map the flow: connect an App Connector, define first app + policy, test with a pilot user group, then expand. De-risk with a 'monitor-only/simulation' mode before enforcing (shows what would be blocked). Progress checklist, sane defaults, rollback. Metrics: time-to-first-secured-app, pilot-to-full-rollout conversion, support tickets during onboarding. Ties to Innovation + reducing attack surface without downtime."}], "behavioralMapping": [{"value": "Customer Obsession", "nealStory": "Founded Biryani Blitz after 180 customer interviews and built privacy-first CV telemetry (impression\u2192approach\u2192purchase funnel) to obsess over real user behavior; separately scaled Elephant to 563 users via 200+ interviews \u2014 lead with 'I don't ship without talking to users.'", "factIds": ["bb-1", "bb-2", "ep-1"]}, {"value": "Ownership", "nealStory": "As Founder & AI PM of Biryani Blitz, owned a 0\u21921 hot-food vending platform end to end (product, CV telemetry, lead-gen agent, loyalty app) with projected unit economics he's accountable for (~42% projected net margin, ~$145K projected ARR/machine).", "factIds": ["bb-role", "bb-1", "bb-3"]}, {"value": "Innovation", "nealStory": "Shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities cutting outreach time dramatically, and built an ML flashcard engine that lifted exam scores 16% / cut review time 38% \u2014 used AI to solve a concrete problem, not for novelty.", "factIds": ["bb-3", "ep-1"]}, {"value": "Teamwork / cross-functional communication", "nealStory": "At SailLoft, translated developer pain points into a Gerrit-based test product + GitHub testing interface, working across devs and clients; accelerated PR-to-merge ~25% and cut manual tests 40% \u2014 a story about serving the team's workflow, not personal credit.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Passion / drive", "nealStory": "Wharton + UNC Innovation Labs backing ($5K), $200K Wharton Startup Challenge finalist, and Director of Professional Development for UNC PM Club \u2014 shows sustained passion for building products and community.", "factIds": ["bb-4", "ld-1"]}, {"value": "Handling ambiguity / execution (dev-tools altitude)", "nealStory": "SailLoft 0\u21921 internal test product: chose Gerrit auto-voting + Bazel execution, delivered real-time test-status visibility, 40% manual-test reduction \u2014 a clean 'ambiguous internal problem \u2192 shipped tooling \u2192 measurable time savings' story that matches Zscaler's infra/security-tooling context.", "factIds": ["sl-1", "sl-2"]}, {"value": "PRD / product-craft depth", "nealStory": "Authored the FieldPulse PRD for an AI predictive-restocking feature (RAG over usage logs/seasonality), designing a 3-flow UX with AI explainability and 15+ KPIs with First-Time Fix Rate as North Star \u2014 directly demonstrates the 'writes comprehensive PRDs' bar Zscaler screens for.", "factIds": ["fp-1"]}], "analyticalFocus": ["North Star metric definition for a security product (Neal should practice: what is the North Star for ZDX? ZPA? \u2014 e.g., % traffic secured, self-resolution rate) \u2014 he has a strong example naming First-Time Fix Rate as a North Star (fp-1)", "Funnel analytics \u2014 Neal's CV impression\u2192approach\u2192purchase funnel (bb-2) maps to conversion-funnel reasoning; expect 'how would you measure adoption of a new feature' questions", "Guardrail metrics / tradeoffs in security: false-positive vs. false-negative rate (blocking legitimate traffic vs. missing a leak) \u2014 key for any DLP/threat-detection metric question", "Scale reasoning: comfort estimating at 250B+ transactions/day, 40M+ users, 150+ data centers (be ready to reason about sampling, cost, latency at that scale)", "Growth/adoption estimation: Neal's 17\u2192563 users (33x) in one quarter (ep-1) is his best before\u2192after data story", "Efficiency/ROI framing: quantify time saved (SailLoft 40% manual-test cut, ~25% PR-to-merge; Biryani Blitz outreach reduction) \u2014 practice stating baseline\u2192result, not just the % (per ledger presentation notes)"], "gotchas": ["TOPIC 'O' ambiguity: sources disagree \u2014 some list Ownership, others Openness (all agree on Teamwork/Passion/Innovation/Customer Obsession). Do NOT confidently assert one; say 'the TOPIC values' and let them lead. Verify on Zscaler's culture page or ask the recruiter.", "Know basic security/networking concepts even as an APM: proxy vs. DNS, how TCP/IP works, SAML, and what Zero Trust ('never trust, always verify') actually means. Neal's ledger shows no security-domain experience \u2014 he should study these cold, not fake fluency.", "Do NOT over-claim cybersecurity/network-security PM background \u2014 the ledger has none. Position honestly as a fast-learning 0\u21921 AI/technical PM who is genuinely curious about Zero Trust; forced domain claims will get exposed in the technical screen.", "Ledger presentation risks to fix in phrasing only: 41.7% net margin \u2192 say '~42%, projected'; 97% outreach-time cut \u2192 give a before\u2192after or soften (near-ceiling with no baseline); $145K ARR is 'projected.' Never invent new numbers.", "'Shark Tank applicant' (bb-4) is weak \u2014 drop it; lead with Wharton finalist + Innovation Labs backing instead.", "Zscaler sells B2B enterprise security to CISOs/IT admins, NOT consumers. Neal's instincts are consumer/founder-flavored \u2014 for product-sense he must reframe the 'user' as an IT admin, security analyst, or CISO, and weigh security-vs-productivity tradeoffs, not just growth.", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must confirm before applying; security firms often have stricter requirements.", "Public interview data is mostly full-time PM; treat the '3 rounds' as indicative, not guaranteed for an intern loop \u2014 confirm structure with the recruiter."], "sources": ["https://www.zscaler.com/products-and-solutions/zero-trust-exchange-zte", "https://sase.cloud/vendors/zscaler", "https://www.zscaler.com/culture", "https://www.zscaler.com/corporate-responsibility/values", "https://www.zscaler.com/blogs/zscaler-life/what-makes-zscaler-great-place-work", "https://www.conference-board.org/podcasts/c-suite-perspectives/Zscalers-Secret-to-Success-Be-Obsessed-with-Customers", "https://prepfully.com/interview-questions/zscaler/product-manager", "https://www.interviewquery.com/interview-guides/zscaler-product-manager", "https://www.techprep.app/companies/zscaler", "https://www.designgurus.io/answers/detail/what-questions-are-asked-in-the-zscaler-product-manager-interview", "https://www.stocktitan.net/news/ZS/zscaler-unveils-new-innovations-to-secure-enterprise-ai-98xrn1za93is.html", "https://www.helpnetsecurity.com/2026/01/27/zscaler-ai-security-suite/", "https://www.zscaler.com/products-and-solutions/zscaler-risk-360", "https://www.zscaler.com/products-and-solutions/zscaler-ai"]}, {"company": "Cloudflare", "products": ["Cloudflare Workers (serverless edge compute / isolate runtime; now 'Dynamic Workers' for AI agent code execution)", "R2 (S3-compatible object storage with zero egress fees; supports event notifications triggering Workers)", "Cloudflare Pages (git-push hosting for static sites and frameworks like Next.js, Astro, SvelteKit)", "Developer Platform storage/compute primitives: D1 (SQLite DB), KV, Durable Objects, Queues, Vectorize, Workers AI", "AI Gateway (unified inference control plane; 70+ models across 12+ providers via one API, one credit pool, one log view; multimodal)", "Cloudflare Agents / Sandboxes / Mesh + Workers VPC (2026 'agentic cloud' infra for running autonomous AI agents at scale)", "Zero Trust / SASE suite: Access, Gateway, WARP, DLP (pay-as-you-go ~$7/user/mo)", "WAF and DDoS mitigation (core security/performance CDN heritage)", "Cloudflare Images and Stream (media optimization/delivery)"], "valuesAndBar": ["Mission: 'help build a better Internet' \u2014 vision to power and protect the entire Internet. Tie every answer back to this.", "Officially codified culture values (per SEC/company sources): Principled, Curious, Transparent. Newer framings add Truth, Customer-Centricity, Openness.", "Radical/relentless transparency: open communication about tech, operations, and challenges (they blog everything publicly).", "Relentless curiosity: employees are expected to challenge assumptions and explore new ideas.", "Customer success as the ultimate measure of work.", "Engineering-first culture: PMs are expected to have technical fluency (networking fundamentals, system architecture) and 'self-sufficiency' \u2014 solve problems rather than defer to engineers.", "Interviewers weight roughly: technical depth ~30%, product sense ~25%, execution ~20%, cultural fit ~25%. 41% of rejections cited generic answers lacking Cloudflare-specific context."], "interviewFormat": ["Typical PM loop is ~4-5 stages over ~2-3 weeks (median ~17 days): recruiter screen -> technical/product screen -> onsite loop (3x60min: product sense case, execution/metrics dive, behavioral) -> hiring committee -> offer.", "A distinctive take-home CASE STUDY: build a 'feedback analyzer' tool USING Cloudflare Workers and other Cloudflare products. 'Vibe coding' / AI-assisted coding is explicitly allowed.", "Follow-up virtual interview where you walk through your case-study solution; they evaluate PM thinking, tradeoffs, and mindset (not raw coding).", "Onsite is largely behavioral with a couple of product/design questions; interns report it is NOT a heavy live-coding gauntlet, but technical fluency is still assessed.", "Rounds commonly include a hiring-manager interview, a joint PM + EM (engineering manager) interview, and a final PM round.", "Reported difficulty ~3.7-7.2/10; estimated acceptance rate ~8-12%."], "productSensePrompts": [{"prompt": "How would you improve the developer experience (DX) for Cloudflare Workers?", "approach": "Segment users (hobbyist/indie devs vs. platform teams vs. enterprises migrating off AWS Lambda). Pick indie/AI-builder devs as the beachhead. Map the journey: discover -> first deploy -> debug -> scale -> bind data (D1/R2/KV). Identify the biggest friction (e.g., local dev/debugging fidelity, cold-start clarity, or wiring bindings). Propose 2-3 features, state the tradeoff you'd pick, and define a north-star metric (e.g., time-to-first-successful-deploy) plus guardrails. Tie back to mission: lower the barrier so more people build on the Internet."}, {"prompt": "Design an onboarding flow for a first-time developer deploying an AI agent on Cloudflare's agentic cloud (Workers + AI Gateway + Sandboxes).", "approach": "Clarify the user: a solo dev shipping an agent, no infra background. Define the 'aha' moment = agent responding correctly against a real model in <10 min. Sequence: pick a template -> select model via AI Gateway (show cost/latency per provider) -> attach a Sandbox/tool -> deploy -> observe logs. Prioritize a working demo over configuration depth. Metrics: activation rate, time-to-first-agent-response, D7 retention. Call out the tradeoff of guided-template vs. blank-canvas."}, {"prompt": "You're PM for R2. Egress is free \u2014 how do you decide what to build next and how do you measure success?", "approach": "Start from R2's wedge (zero egress vs. S3 lock-in). Users = teams with heavy outbound data (media, AI training/inference datasets, backups). Identify jobs-to-be-done and where R2 loses vs. S3 (ecosystem/tooling, migration friction, feature parity like event notifications). Propose a migration-assist feature or lifecycle/analytics tooling. North-star: bytes stored + active buckets; watch migration completion rate and egress-savings realized. Show you understand the business model, not just the feature."}, {"prompt": "Cloudflare's WAF is flagging too many legitimate requests (false positives). As PM, how do you approach reducing false positives without weakening security?", "approach": "Frame the core tradeoff: false positives (blocked legit users, revenue/UX loss) vs. false negatives (real attacks). Instrument it: measure FP rate, FN rate, and customer-reported incidents by rule. Propose a data-driven fix: per-customer sensitivity tuning, a 'log/simulate' mode before enforcement, and ML-scored confidence thresholds. Define success (FP rate down X% with FN rate flat) and a rollback plan. This directly mirrors a real reported Cloudflare interview scenario and shows infra product judgment."}], "behavioralMapping": [{"value": "Ship 0->1 / bias to build (customer-centricity, self-sufficiency)", "nealStory": "Founded Biryani Blitz: launched a 0->1 hot-food vending platform at UC Berkeley (fresh biryani in 60s) after 180 customer interviews; projected ~$145K ARR/machine. Shows he builds end-to-end, not just specs.", "factIds": ["bb-role", "bb-1"]}, {"value": "Technical fluency / self-sufficiency (build it yourself, don't defer to engineers)", "nealStory": "Built a privacy-first OpenCV computer-vision telemetry system tracking impression->approach->purchase funnel, giving a physical machine e-commerce-grade analytics; and shipped an AI lead-gen agent (Node, Playwright, Gemini). He can code the case-study 'feedback analyzer' himself.", "factIds": ["bb-2", "bb-3"]}, {"value": "Data-driven decision-making / metrics rigor", "nealStory": "At Elephant Productivity Suite scaled a student app 17->563 active users (33x) in one quarter via 200+ interviews; shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 clean before->after with a north-star and guardrail metrics.", "factIds": ["ep-1"]}, {"value": "Developer-tools / dev-experience product sense (highly relevant to Workers/DX prompts)", "nealStory": "At SailLoft led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40%; translated developer-workflow pain into a GitHub testing interface accelerating PR-to-merge ~25% and a 2-click Chrome extension. This is the closest analog to Cloudflare's developer-platform work.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Disagreeing with an engineer/designer & making a tradeoff", "nealStory": "The SailLoft testing product involved a judgment call (auto-voting on Gerrit vs. a separate dashboard) \u2014 use this as the 'time you disagreed / chose a tradeoff' story, framing the reasoning and outcome. Only use the specific tradeoff if it is true to his experience.", "factIds": ["sl-1"]}, {"value": "Curiosity / user research depth", "nealStory": "500+ customer/user interviews across ventures (180 at Biryani Blitz, 200+ at Elephant, 200+ user research per skills profile) \u2014 demonstrates relentless curiosity and getting to ground truth before building.", "factIds": ["bb-1", "ep-1"]}, {"value": "Authoring a PRD / defining metrics from scratch", "nealStory": "Authored a FieldPulse PRD for an AI predictive-restocking feature (RAG over usage logs/schedules/seasonality) with a 3-flow UX including AI explainability and 15+ KPIs (First-Time Fix Rate as north star). Direct evidence of PM artifact skills for the case study.", "factIds": ["fp-1"]}], "analyticalFocus": ["North-star metric selection and guardrails for developer-platform products (e.g., time-to-first-deploy, activation rate, D7/D30 retention).", "Adoption/usage funnels: signup -> first deploy -> bind data -> scale to paid; where developers drop off.", "Security tradeoff metrics: WAF false-positive vs. false-negative rate, latency/performance regressions.", "Cost/economics reasoning: R2 egress savings, AI Gateway per-model cost/latency, unit economics (Neal can lean on his 41.7%/~42% projected net-margin and $145K ARR estimation work).", "Estimation / market-sizing (e.g., how many developers would adopt a new Workers feature; TAM for the agentic cloud).", "Experimentation / A-B testing to validate DX or onboarding changes."], "gotchas": ["Do NOT recite generic values. One source claims '8 values' including 'Build for Infinity' and 'No Bullshit' \u2014 I could NOT verify these against official Cloudflare/SEC sources (they are likely paraphrase/embellishment). Safer to ground answers in the mission ('help build a better Internet') and the documented values (Principled, Curious, Transparent). 41% of rejections were for generic, non-Cloudflare-specific answers.", "The take-home case study requires actually USING Cloudflare products (build a feedback analyzer on Workers). Neal should build and deploy a real Worker beforehand so he can speak to it firsthand \u2014 this is a filter for self-sufficiency.", "Engineering-first bar: expect networking/system-architecture fluency questions. Don't hand-wave technicals or defer to 'the engineers' \u2014 they penalize that.", "Product sense skews INFRASTRUCTURE, not consumer (WAF false positives, image load latency, Workers DX, R2 economics). Prep infra/dev-tools scenarios, not another 'design a social app' answer.", "Lead with the SailLoft dev-tools experience (sl-1, sl-2) and Biryani Blitz CV/telemetry (bb-2) to prove technical depth \u2014 these differentiate Neal for an infra company more than the consumer-app metrics.", "Fact-ledger phrasing risks: 41.7% net margin -> say '~42%, projected'; 97% outreach-time cut -> give before->after or soften; always label projected numbers as projections. Never invent numbers not in the ledger.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must confirm before applying; Cloudflare intern reqs will have a knockout field."], "sources": ["https://www.glassdoor.com/Interview/Cloudflare-Product-Manager-Intern-Interview-Questions-EI_IE430862.0,10_KO11,33.htm", "https://www.interviewquery.com/interview-guides/cloudflare-product-manager", "https://prepfully.com/interview-questions/cloudflare/product-manager", "https://sirjohnnymai.com/blog/how-hard-is-cloudflare-pm-interview/", "https://www.cloudflare.com/careers/life-at-cloudflare/", "https://www.cloudflare.com/products/", "https://www.cloudflare.com/products/r2/", "https://www.cloudflare.com/products/ai-gateway/", "https://blog.cloudflare.com/agents-week-in-review/", "https://blog.cloudflare.com/ai-platform/", "https://www.cloudflare.com/", "https://www.comparably.com/companies/cloudflare/mission", "https://www.sec.gov/Archives/edgar/data/1477333/000147733320000010/cloud-20191231.htm"]}, {"company": "GitHub", "products": ["GitHub Copilot \u2014 AI pair programmer / agentic coding platform; now the flagship (Copilot Business $19/user/mo, Copilot Enterprise $39/user/mo)", "GitHub Copilot app \u2014 new agent-native desktop control center with a 'My Work' view, isolated git-worktree agent sessions, Canvases, Sandboxes, and Agent Merge", "GitHub Actions \u2014 CI/CD automation and workflow platform (2026 roadmap centers on secure defaults, policy controls, supply-chain observability)", "GitHub Codespaces \u2014 cloud dev environments (billed per compute-hour + storage)", "GitHub Advanced Security, now split into Secret Protection ($19/committer/mo) and Code Security ($30/committer/mo)", "Core collaboration surface: Pull Requests, Code Review, Issues, and the Copilot Code Review AI reviewer", "Copilot CLI (terminal + voice), Copilot SDK (Node/TS, Python, Go, .NET, Rust, Java), Copilot Cloud Agent"], "valuesAndBar": ["GitHub's 8 official values (the 'Hubber' values): Customer Obsessed, Trust by Default, Ship to Learn, Own the Outcome, Growth Mindset, Global Product/Global Team, Anything is Possible, Practice Kindness", "Behavioral round maps to GitHub's leadership principles: create clarity amid ambiguity, help teammates grow, take full ownership of successes AND failures", "Customer-centric: 'their success is our success' \u2014 anticipate developer needs, listen to feedback loops", "Ship to Learn: ship often, take calculated risks, pivot fast when wrong \u2014 the journey is as valuable as the destination", "PM bar is more TECHNICAL than consumer PM roles \u2014 expect Git/CI-CD fluency, basic coding (Python/JS), SDLC understanding; open-source ecosystem familiarity is valued", "For Copilot/AI PM roles specifically: technical depth is heavily weighted (~60% per one guide), plus AI/LLM ecosystem fluency, evaluation-framework design, and developer-trust building"], "interviewFormat": ["Timeline: ~4-10 weeks recruiter-screen to decision (4-6 wks general PM; 6-10 wks for Copilot AI PM)", "Stage 1 \u2014 Recruiter screen (~30 min): background, motivation, logistics/work-auth", "Stage 2 \u2014 Hiring manager screen (~60 min): background deep-dive, resume walkthrough", "Optional additional phone screen (30-45 min)", "Final loop \u2014 general PM: ~5 rounds, often a full day, may include presenting an ambiguous take-home/prompt to a panel", "Final loop covers 4 core competencies: Product Sense (developer-centric design + prioritization), Product Execution (metrics, A/B testing, roadmap), Product Strategy (market/competitive/long-term vision), Behavioral (leadership principles + culture fit, ~45 min)", "Copilot AI PM variant \u2014 5-6 rounds of 60 min: Product Sense (rapid-fire on your AI background), Execution (two cases \u2014 one in-domain, one out), Leadership (tied to GitHub's principles), AI Depth (EM-led LLM systems discussion), Domain-Specific (dev experience + coding workflows)"], "productSensePrompts": [{"prompt": "Improve GitHub's code review / pull-request experience to speed up developer collaboration.", "approach": "Anchor on the user: solo OSS maintainer vs. enterprise reviewer vs. PR author waiting on merge. Map the PR-to-merge journey and name the biggest friction (review latency, unclear diffs, context switching). Neal has DIRECT relevant experience here (sl-2: built a GitHub testing interface that cut PR-to-merge cycles ~25%) \u2014 lean on that credibility. Propose 2-3 solutions (e.g., Copilot Code Review pre-pass, smart reviewer assignment, inline test-status), pick one on impact vs. effort, and define a North Star (PR cycle time / time-to-first-review) plus guardrail (review quality / revert rate)."}, {"prompt": "Design (or add) a feature to GitHub Copilot / the Copilot app to help developers manage multiple parallel AI coding agents.", "approach": "Frame the real 2026 problem GitHub itself named: context scatters, developers lose track of running agents. Segment users (individual dev running 3 agents vs. team lead reviewing agent output). Reference the existing My Work view, isolated worktree sessions, and Agent Merge, then find the gap (e.g., trust/observability into what an agent changed, cost control, safe rollback). Design for developer TRUST as the core job-to-be-done. Neal maps here via bb-3 (agentic pipelines: Node/Playwright/Gemini) and fp-1 (RAG PRD with AI explainability + North Star KPI)."}, {"prompt": "Define success metrics for a coding agent, and design an evaluation framework for the quality of the code it produces.", "approach": "Split into adoption metrics (agents launched, % of PRs agent-assisted), quality metrics (acceptance/merge rate, revert rate, CI pass rate, human edits per suggestion), and trust/retention (repeat use, developer NPS). Propose an eval framework: offline benchmark suite + human-graded rubric + online A/B on merge/revert. Name a North Star (e.g., merged agent-authored changes that survive 30 days) and guardrails (security/vuln introduction rate). Neal's fp-1 (15+ KPIs, First-Time-Fix-Rate as North Star) and bb-2 (built a conversion funnel: impression\u2192approach\u2192purchase) show he thinks in funnels and North-Star metrics."}, {"prompt": "How would you improve GitHub Actions for large-scale enterprise CI/CD workflows?", "approach": "Segment by scale (indie repo vs. monorepo with 1000s of daily runs). Identify pain: flaky tests, slow feedback, cost/compute waste, security of the supply chain (align with GitHub's 2026 Actions roadmap: secure defaults, policy controls, observability). Prioritize with an impact/effort lens and tie to a metric (mean CI time, cost/run, % pipelines with secure defaults). Neal's SLC experience is a strong hook: sl-1 built a 0->1 Gerrit + Bazel test product that cut manual tests 40% with real-time test-status visibility \u2014 same CI/test-observability problem space."}], "behavioralMapping": [{"value": "Customer Obsessed", "nealStory": "Founded Biryani Blitz after 180 customer interviews, and scaled Elephant Productivity from 17->563 users via 200+ interviews \u2014 decisions driven by direct user research, not assumptions. Lead with the interview-count depth (500+ interviews across ventures).", "factIds": ["bb-1", "ep-1"]}, {"value": "Ship to Learn", "nealStory": "Led the 0->1 launch of an internal Gerrit/Bazel software-test product at SailLoft, shipping fast and cutting manual tests 40% with real-time status; and iterated a QR loyalty app that lifted repeat purchases 40% \u2014 ship, measure, iterate.", "factIds": ["sl-1", "bb-3"]}, {"value": "Own the Outcome", "nealStory": "As Founder & AI PM of Biryani Blitz, owned a 0->1 hot-food vending platform end to end (fresh biryani in 60s) \u2014 customer research, CV telemetry, financial model ($145K projected ARR/machine, ~42% projected margin), and fundraising (Wharton + UNC Innovation Labs $5K, Wharton Startup Challenge finalist).", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Growth Mindset / create clarity amid ambiguity", "nealStory": "The FieldPulse PRD: authored an AI predictive-restocking PRD (RAG over usage logs, seasonality) from scratch, designing a 3-flow UX with AI explainability and defining 15+ KPIs with a North Star \u2014 turning an ambiguous AI feature brief into a concrete plan.", "factIds": ["fp-1"]}, {"value": "Trust by Default / privacy & developer trust", "nealStory": "Built a PRIVACY-FIRST computer-vision telemetry system (OpenCV) that gave a physical machine e-commerce-grade conversion analytics without compromising customer trust \u2014 directly relevant to GitHub's emphasis on developer trust in AI features.", "factIds": ["bb-2"]}, {"value": "Practice Kindness / help a teammate grow (leadership)", "nealStory": "As Director of Professional Development for the UNC PM Club and President of UNC Ultimate Frisbee (BatCH), developed and led others \u2014 the natural 'helped a teammate grow / led without authority' story. (Flag: strengthen with team/roster size before interview \u2014 ledger notes title-only leadership is a red flag.)", "factIds": ["ld-1", "ld-2"]}, {"value": "Developer experience / domain fit (GitHub-specific)", "nealStory": "At SailLoft, translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and built a 2-click Chrome-extension client-testing workflow \u2014 direct, on-the-nose GitHub/dev-tools domain credibility for the Domain-Specific round.", "factIds": ["sl-2"]}], "analyticalFocus": ["Developer/product funnel metrics: adoption -> activation -> retention (Neal has funnel experience via bb-2's impression->approach->purchase CV funnel)", "North Star metric definition + guardrail metrics (Neal used First-Time-Fix-Rate as a North Star in fp-1)", "Coding-agent / Copilot quality metrics: suggestion acceptance rate, merge rate, revert rate, CI pass rate, human edits per suggestion", "Evaluation-framework design for LLM/AI features (offline benchmark + human rubric + online A/B) \u2014 likely in Copilot AI PM loop", "CI/CD operational metrics: PR-to-merge cycle time, mean CI run time, test-flakiness, compute cost per run", "A/B testing / experimentation design and success-metric definition for a new feature", "Estimation/sizing (classic PM 'how many...' market-sizing) \u2014 be ready to reason from assumptions out loud"], "gotchas": ["Technical bar is HIGHER than consumer PM \u2014 expect real Git/CI-CD fluency, SDLC understanding, and basic coding (Python/JS). Neal's CS degree + SailLoft dev-tools work + agentic pipelines are the answer; don't undersell the technical side.", "Come CURRENT on GitHub's 2026 AI/agent strategy (Copilot app, agent sessions, Agent Merge, Copilot SDK GA). Interviewers will expect you to reference the actual product, not a 2023 mental model of Copilot as just autocomplete.", "Product-sense prompts are about THEIR products (code review, Actions, Codespaces, Copilot) \u2014 study the real product surfaces, not generic consumer apps.", "Behavioral answers must map to GitHub's specific 8 values / 3 leadership principles (ambiguity, helping others grow, ownership) \u2014 use STAR and name the value.", "Ledger integrity: only use verified facts. Round bb-1's 41.7% margin to ~42% and always label it 'projected'; soften bb-3's 97% (no baseline) into a before->after; keep every projection labeled as such.", "Strengthen leadership stories (ld-1/ld-2) with team/roster size before the loop \u2014 title-only leadership reads as a red flag.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must confirm before recruiter screen knockout questions.", "Reported interview success rate is very low (~2% cited) \u2014 the take-home/presentation quality in the final loop is a major differentiator; over-prepare it.", "For an APM/intern role, expect the loop to be somewhat lighter than the full Copilot AI PM 5-6 round loop, but the competency areas (product sense, execution, behavioral) are the same."], "sources": ["https://www.tryexponent.com/guides/github-copilot-ai-product-manager-interview-guide", "https://www.tryexponent.com/questions?company=github&role=pm", "https://www.interviewquery.com/interview-guides/github-product-manager", "https://nextsprints.com/guide/github-product-manager-interview-guide", "https://www.glassdoor.com/Interview/GitHub-Product-Manager-Interview-Questions-EI_IE671945.0,6_KO7,22.htm", "https://github.blog/news-insights/product-news/github-copilot-app-the-agent-native-desktop-experience/", "https://github.com/features/copilot/", "https://www.eesel.ai/blog/github-pricing", "https://github.com/todogroup/job-descriptions/blob/master/github-senior-software-engineer.md", "https://www.github.careers/careers-home", "https://www.comparably.com/companies/github/mission"]}, {"company": "HubSpot", "products": ["Smart CRM (the free core platform all Hubs sit on)", "Marketing Hub \u2014 inbound marketing, campaigns, lead capture/nurture at scale", "Sales Hub \u2014 pipeline management, deal tracking, sales automation, sequences", "Service Hub \u2014 support tickets, knowledge base, customer feedback/surveys", "Content Hub \u2014 content marketing / CMS (formerly CMS Hub)", "Data Hub \u2014 connect, clean, and action data from external sources (launched INBOUND 2025)", "Breeze \u2014 HubSpot's AI layer across the platform: Breeze Copilot, Breeze Intelligence, and Breeze Agents (Customer Agent, Prospecting Agent, Data Agent, etc.)"], "valuesAndBar": ["HEART culture code: Humble, Empathetic, Adaptable, Remarkable, Transparent", "'Use good judgment' \u2014 HubSpot's 3-word policy on almost everything (autonomy over rules)", "'Solve for the customer' (SFTC) \u2014 the customer-first north star embedded in the Culture Code", "Culture treated as a product \u2014 30+ revisions, continuous feedback (signals iteration mindset)", "PM competencies HubSpot explicitly names: deep product knowledge (from real usage), strategic thinking shown via concrete examples, critical analysis / having opinions on products, a 'maker/creator' mentality (side projects, building things), learning from failure, leaning into your superpower (not being generically well-rounded), and genuine curiosity (asking thoughtful questions)", "APM program is designed to build 'HubSpot's next generation of product leaders'; hires early-career regardless of prior PM experience; values 'culture add' over 'culture fit'; heavy problem-solving and asking hard questions"], "interviewFormat": ["Round 1 \u2014 Asynchronous recorded video: answer prompted questions, ~2 minutes per question (behavioral + motivation; be authentic and concise)", "Round 2 \u2014 30-minute phone/recruiter screen: behavioral, culture-add/fit, why HubSpot, why product", "Round 3 (final) \u2014 Video interview with Product Leads / Senior PMs: product sense, execution, and deeper behavioral; expect to walk through concrete examples of how you think", "APM interns are recruited in the FALL for the following SUMMER (apply early); overall PM loops reported to run ~4-6 weeks", "Frameworks HubSpot responds well to are practical, not academic: STAR for behavioral, RICE/prioritization matrices, A/B testing, user-journey mapping"], "productSensePrompts": [{"prompt": "You're the APM on Breeze. How would you design (or improve) an AI 'Customer Agent' that resolves front-line support tickets inside Service Hub? Who is it for and what could go wrong?", "approach": "Anchor on the user: SMB support reps and end-customers. Segment by ticket type (billing vs. technical vs. how-to). Pick a target: deflect repetitive how-to tickets while safely escalating anything needing judgment. Design the flow (detect intent -> retrieve from knowledge base via RAG -> draft answer -> confidence-gated auto-send vs. human handoff) and surface AI explainability + a confidence threshold so reps trust it. Name the trade-off (automation rate vs. bad-answer risk) explicitly \u2014 this maps to 'use good judgment' and 'solve for the customer.' Metrics: ticket deflection rate, CSAT on AI-handled tickets, escalation accuracy, first-contact resolution. Tie back to Neal's real explainability + KPI work (fp-1) and CV funnel analytics (bb-2)."}, {"prompt": "Marketing Hub's activation is weak for brand-new SMB signups \u2014 many never send a first campaign. How would you diagnose and fix onboarding?", "approach": "Define activation as a measurable moment (first campaign sent / first lead captured). Map the funnel signup -> connect data -> build asset -> send, and instrument drop-off at each step. Hypothesize the biggest leak (blank-canvas paralysis, no contacts imported). Prioritize fixes with RICE: guided templates, sample-data mode, AI-assisted first draft via Breeze. Propose an A/B test with a clear success metric (7-day activation rate). Directly reuse Neal's 17->563 activation growth via user interviews (ep-1) and his impression->approach->purchase funnel instrumentation (bb-2)."}, {"prompt": "Design a feature that helps HubSpot Sales Hub reps prioritize which leads to contact first.", "approach": "Clarify the user (SMB AE vs. SDR) and their pain (too many leads, no signal on who's ready). Frame a lead-scoring/prioritization surface driven by engagement + fit data (a natural Data Hub + Breeze use case). Sketch the UX: a ranked worklist with 'why this lead' explainability so reps trust the ranking. Trade-offs: model transparency vs. sophistication, over-automation vs. rep control. North-star metric: lead-to-meeting conversion; guardrails: rep adoption, false-positive rate. Map to Neal's AI lead-gen agent shipped across 100+ universities (bb-3) \u2014 he has literally built lead prioritization/outreach automation."}, {"prompt": "How would you decide what to build next for HubSpot's free Smart CRM tier to drive conversion to paid Hubs?", "approach": "Frame the strategy: free tier is the top of HubSpot's flywheel; goal is habit + data lock-in that creates natural upgrade pressure. Segment free users by intent/growth stage. Identify the value moment that, once hit, makes a paid Hub obviously worth it (e.g., hitting contact/automation limits). Prioritize features that increase engagement now and expose a paid ceiling gracefully (not paywalls that feel hostile \u2014 'solve for the customer'). Metrics: free activation, WAU/MAU, free->paid conversion, time-to-upgrade. Tie to Neal's founder unit-economics fluency \u2014 projected ARR/margin modeling (bb-1) \u2014 showing he reasons about monetization, not just features."}], "behavioralMapping": [{"value": "Solve for the customer / customer empathy", "nealStory": "Founded Biryani Blitz after 180 customer interviews and scaled Elephant from 17 to 563 users in one quarter via 200+ interviews \u2014 every product decision traced back to what users actually said. Lead with the interview-driven insight, then the shipped outcome.", "factIds": ["bb-1", "ep-1"]}, {"value": "Remarkable (maker mentality / creator of things)", "nealStory": "0->1 founder who built a physical hot-food vending platform deployed at UC Berkeley, including a privacy-first OpenCV telemetry system giving a physical machine e-commerce-grade conversion analytics \u2014 a concrete 'I build things' story HubSpot explicitly looks for.", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "Adaptable / learning from failure", "nealStory": "Use the SailLoft internal test-product launch: had to translate ambiguous developer-workflow pain into a shipped Gerrit/Bazel tool and a Chrome extension under time pressure in a ~1-month internship \u2014 frame the tradeoff he chose (auto-voting on Gerrit vs. a separate dashboard) and what he'd do differently. Neal should pick a genuine mistake here; do not fabricate one.", "factIds": ["sl-1", "sl-2"]}, {"value": "Use good judgment (prioritization / autonomy)", "nealStory": "FieldPulse PRD: defined 15+ KPIs and chose First-Time Fix Rate as the single north star, and designed AI explainability into a 3-flow UX \u2014 shows judgment about what matters most and how to make an AI feature trustworthy without being told the rules.", "factIds": ["fp-1"]}, {"value": "Empathetic (translating pain into product) / collaboration", "nealStory": "At SailLoft, translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and condensed client testing to a 2-click workflow \u2014 empathy for the internal-developer user, then measurable relief of their pain.", "factIds": ["sl-2", "sl-1"]}, {"value": "Data-driven / analytical (measurable outcomes)", "nealStory": "ML flashcard engine at Elephant lifted exam scores 16% and cut review time 38%; CV funnel at Biryani Blitz tracked impression->approach->purchase conversion. Neal instruments and measures \u2014 ideal for HubSpot's 'data over assumptions' bar. Note: soften/round over-precise figures per ledger presentation notes.", "factIds": ["ep-1", "bb-2"]}, {"value": "Humble / growth mindset (why product, superpower)", "nealStory": "CS + Business dual-degree at UNC, Director of Professional Development in the PM Club, Bridge to BCG invitee (~10% acceptance) \u2014 frame his 'superpower' as AI-native technical PM who ships from user research, rather than claiming to be generically well-rounded (HubSpot explicitly prefers a sharp superpower).", "factIds": ["edu-1", "ld-1", "ld-3"]}], "analyticalFocus": ["Activation / funnel metrics: signup -> activation moment (first campaign sent, first lead captured) \u2014 directly relevant to Marketing/Sales Hub onboarding", "Free-to-paid conversion and expansion revenue (the HubSpot flywheel from free CRM to paid Hubs)", "Engagement / retention: WAU/MAU, feature adoption, time-to-value", "AI feature quality metrics for Breeze: ticket deflection rate, CSAT on AI-handled interactions, escalation/handoff accuracy, confidence-threshold tuning, hallucination/error rate", "Prioritization math: RICE scoring, sizing a feature's impact, back-of-envelope TAM/opportunity sizing for a new feature", "North-star selection + guardrail metrics (e.g., First-Time Fix Rate as NSM with adoption/false-positive guardrails \u2014 Neal has done this in fp-1)", "A/B test design: hypothesis, success metric, guardrails, readout"], "gotchas": ["Do NOT show up without having actually USED HubSpot \u2014 they explicitly rank 'product knowledge from real usage' and having critical opinions. Neal should sign up for the free CRM/Marketing Hub before the interview and be ready to name 1-2 concrete strengths AND weaknesses.", "'Use good judgment' and 'solve for the customer' are cultural shibboleths \u2014 reference them naturally, but back them with a real example, don't just parrot the acronym.", "HubSpot prefers a sharp 'superpower' over being generically well-rounded \u2014 Neal should lead with the AI-native 0->1 technical PM lane, not a laundry list.", "They value genuine curiosity: come with 2-3 thoughtful, specific questions (e.g., about Breeze agent strategy or the free-tier flywheel) \u2014 'good questions are the measure of true curiosity.'", "The Round 1 async video is ~2 min/question \u2014 Neal must be crisp; rambling hurts. Practice tight STAR answers.", "Ledger presentation risks: soften over-precise numbers \u2014 41.7% net margin -> ~42% projected (bb-1); 97% outreach time cut is near-ceiling with no baseline, give a before->after or soften (bb-3). Never invent numbers.", "APM applications open in FALL for the following summer \u2014 timing matters; confirm the cycle is open.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must supply this for knockout questions; do not assume.", "'Culture add, not culture fit' \u2014 Neal should frame what unique perspective he brings, not just that he matches HubSpot."], "sources": ["https://recruit.hubspot.com/apm-intern-program-at-hubspot", "https://product.hubspot.com/blog/associate-product-manager", "https://product.hubspot.com/blog/what-the-best-product-manager-candidates-say-during-an-interview", "https://www.glassdoor.com/Interview/HubSpot-Product-Manager-Interview-Questions-EI_IE227605.0,7_KO8,23.htm", "https://www.hubspot.com/products", "https://www.hubspot.com/company-news/fall-2025-spotlight", "https://www.cmswire.com/digital-marketing/hubspot-unveils-data-hub-breeze-agents-and-the-loop-at-inbound-2025/", "https://blog.hubspot.com/blog/tabid/6307/bid/34234/the-hubspot-culture-code-creating-a-company-we-love.aspx", "https://sirjohnnymai.com/blog/loop-hubspot-pm-product-sense-interview", "https://www.interviewquery.com/interview-guides/hubspot-product-manager"]}, {"company": "RingCentral", "products": ["RingEX \u2014 AI-first cloud business communications (voice, video meetings, team messaging, SMS in one platform) with a Personal AI Assistant that takes call notes, translates messages, drafts texts, and summarizes unread chats", "RingCX \u2014 AI-first, agentic-voice contact center supporting voice + 20+ digital channels in one license; includes RingWEM (workforce engagement: automated quality management, interaction analytics, workforce management) and AI Assist for agents/supervisors", "RingCentral AI Receptionist (AIR) \u2014 always-on voice AI agent that answers inbound calls/SMS, answers FAQs, routes calls, and handles call-queue overflow; auto-configured by scraping a business's website; integrates with Shopify, Calendly, WhatsApp; 11,800+ businesses adopted", "RingSense / ACE (AI Conversation Expert) \u2014 conversation-intelligence layer using proprietary LLMs to transcribe calls, summarize meetings, score sales calls, and give real-time agent coaching", "RingCentral Events \u2014 event management platform with organization-level analytics (content performance, key metrics, trend identification)"], "valuesAndBar": ["Core value: Hyper Focused \u2014 intense concentration on strategic objectives; align on KPIs and outcomes (be metrics-driven and prioritize ruthlessly)", "Core value: Relentlessly Innovative \u2014 continuous improvement and pioneering new tech, especially rapid AI integration (agentic voice AI, AIR, RingSense/ACE)", "Core value: A Trusted Partner \u2014 reliability and transparency with customers and internal partners", "Core value: Empowering Customers \u2014 solve for the customer first, regardless of team or department", "Cultural operating principles: solve for the customer first; execute with openness/transparency to enable informed decisions; make decisions supported by data; flat structure with a culture of ownership", "Mission: 'reimagining the world of communications by breaking down barriers and empowering businesses across the globe to work as one'", "Strategic context for PMs: ~$250M R&D in 2026 concentrated on agentic voice AI that autonomously handles customer interactions and augments human agents \u2014 expect AI-product framing throughout"], "interviewFormat": ["Round 1: Recruiter phone screen, 30-45 min \u2014 background, resume walkthrough, motivation for applying, communication skills, and culture fit against the four core values", "Round 2: Possible technical/skills assessment (for PM this leans product/analytical rather than heavy coding; SQL is emphasized for data/BI roles, not typically PM \u2014 but be ready to talk metrics and reason about data)", "Round(s): Hiring-manager / senior-management interview \u2014 strategic thinking, product vision, leadership, and how you'd approach specific RingCentral product challenges plus long-term career goals", "Behavioral rounds use situational STAR questions (e.g., 'a time you had to scope down a project', 'biggest accomplishment')", "Product-sense component: 'What are your strengths as a PM? Favorite product and how would you improve it?' \u2014 expect a design/improvement prompt", "Note: reported Senior PM hire timeline averages ~28 days; APM/intern loops are typically shorter and lighter on the technical assessment"], "productSensePrompts": [{"prompt": "You're the PM for RingCentral AI Receptionist (AIR), the voice AI that answers inbound calls for small businesses. How would you improve it, and what would you build next?", "approach": "Clarify the user (SMB owner who misses calls = lost revenue) and success metric (% of after-hours/overflow calls resolved without a human, and downstream booked-appointment/conversion rate). Segment pain: setup friction, mis-routing, and trust ('will it embarrass my brand?'). Prioritize: (1) deeper vertical integrations beyond Shopify/Calendly/WhatsApp (e.g., restaurant POS, dental EHR) since AIR auto-scrapes the site but can't transact; (2) a confidence-threshold handoff so AIR escalates to human/voicemail before hallucinating; (3) post-call analytics tying AIR to revenue. Tie back to 'Empowering Customers' + agentic voice AI strategy. Name a North Star like Call Resolution Rate and guardrail metrics (false-answer rate, escalation rate)."}, {"prompt": "Design a feature for RingCX that helps a contact-center supervisor manage a team of 30 agents. What would you build?", "approach": "Anchor on the supervisor's job-to-be-done: catch problems in real time and coach at scale. Use RingCX's existing AI Assist + RingWEM as the platform. Propose a real-time 'risk radar' that surfaces at-risk live calls (sentiment drop, silence, escalation language) so a supervisor of 30 can triage rather than monitor linearly. Define success (CSAT lift, avg handle time, escalation rate, first-contact resolution). Discuss build tradeoffs: real-time transcription cost/latency vs. batch, false-positive alert fatigue. Connect to 'Hyper Focused' (KPI alignment) and RingSense/ACE coaching."}, {"prompt": "RingEX ships a Personal AI Assistant (call notes, translation, unread-chat summaries). Adoption of the AI features is low despite being included. How do you diagnose and fix it?", "approach": "Frame as an adoption/activation problem, not a feature-gap problem. Build the funnel: aware -> tried once -> habitual. Instrument where users drop (do they know it exists? did the first summary feel accurate/valuable?). Hypotheses: discoverability (buried in UI), trust (inaccurate first experience), and lack of a triggering moment. Fixes: contextual nudges at the moment of need (e.g., auto-offer a summary when a user returns to a 50-message thread), and an accuracy feedback loop. North Star: weekly AI-feature active users / weekly active users; guardrail on correction/thumbs-down rate. Ties to data-driven culture."}, {"prompt": "Should RingCentral build AIR-style agentic voice AI deeper into RingEX for larger enterprises, or keep it focused on SMBs? How would you decide?", "approach": "Strategy/prioritization prompt. Lay out a decision framework: market size vs. reach-vs-fit, competitive moat, and cost-to-serve. SMB = fast, self-serve, high volume, low ACV, less integration burden; Enterprise = high ACV but demands compliance, custom routing, and CRM/telephony integration depth. Recommend a staged bet: prove resolution-rate and ROI in SMB, then productize the top enterprise blockers (security, admin controls, integrations). Tie to the ~$250M agentic-AI R&D thesis and 'Relentlessly Innovative.' Close with the metric that would make you double down (resolution rate + net revenue retention by segment)."}], "behavioralMapping": [{"value": "Empowering Customers / solve for the customer first", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and used that research to scale the app 17->563 active users (33x) in one quarter and ship an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 customer-obsession that produced measurable customer outcomes.", "factIds": ["ep-1", "ep-role"]}, {"value": "Empowering Customers / user research depth", "nealStory": "Founded Biryani Blitz after 180 customer interviews before building \u2014 customer discovery drove the product, not the other way around.", "factIds": ["bb-1", "bb-role"]}, {"value": "Relentlessly Innovative (esp. AI)", "nealStory": "As AI Product Manager, shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%, and built a privacy-first computer-vision telemetry system (OpenCV) giving a physical vending machine e-commerce-grade conversion analytics \u2014 directly relevant to RingCentral's agentic-AI bet.", "factIds": ["bb-3", "bb-2"]}, {"value": "Relentlessly Innovative / AI product framing", "nealStory": "Authored a PRD for an AI predictive-restocking feature using RAG over usage logs/schedules/seasonality, with a 3-flow UX including AI explainability \u2014 mirrors how RingCentral productizes LLM features (RingSense/AIR) with trust and explainability.", "factIds": ["fp-1"]}, {"value": "Hyper Focused (scope down / KPI alignment)", "nealStory": "At SailLoft led the 0->1 launch of an internal Gerrit-based software-test product and chose a focused build (Gerrit voting + Bazel execution) that cut manual tests 40%; defined 15+ KPIs for the FieldPulse PRD with First-Time Fix Rate as the single North Star \u2014 shows prioritizing to one metric and scoping to what ships.", "factIds": ["sl-1", "fp-1"]}, {"value": "A Trusted Partner / cross-functional collaboration", "nealStory": "At SailLoft translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and a Chrome extension condensing client testing to a 2-click workflow \u2014 worked across dev stakeholders to earn trust and remove friction.", "factIds": ["sl-2", "sl-role"]}, {"value": "Ownership / bias to action (flat, ownership culture)", "nealStory": "Founder & AI Product Manager of Biryani Blitz \u2014 a 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in 60s), backed by Wharton + UNC Innovation Labs ($5K) and a $200K Wharton Startup Challenge finalist; also President of UNC Ultimate Frisbee and Director of Professional Development for the UNC PM Club.", "factIds": ["bb-1", "bb-4", "ld-2", "ld-1"]}], "analyticalFocus": ["North Star metric selection and guardrail metrics for an AI-communications feature (e.g., AIR Call Resolution Rate vs. false-answer/escalation rate)", "Adoption/activation funnels for AI features that are included but under-used (aware -> tried -> habitual) \u2014 relevant to RingEX Personal AI Assistant", "Contact-center operational metrics: CSAT, Average Handle Time (AHT), First-Contact Resolution, escalation rate (RingCX / RingWEM)", "Sizing/estimation and prioritization frameworks (RICE / impact-vs-effort) for roadmap tradeoffs, and reasoning about data even though heavy SQL is not typical for the PM loop", "ROI / unit-economics framing for AI features (cost-to-serve per automated call vs. human agent), aligned to RingCentral's ~$250M agentic-AI investment thesis", "Segment-level analysis: SMB vs. enterprise (ACV, net revenue retention, integration cost) for product-strategy decisions"], "gotchas": ["Do NOT walk in describing RingCentral only as a 'phone/VoIP company' \u2014 in 2026 they position as AI-first business communications and are betting ~$250M R&D on agentic voice AI. Frame everything through AI and customer outcomes.", "Know the product boundaries: RingEX (UCaaS), RingCX (CCaaS/contact center), AIR (voice AI receptionist), RingSense/ACE (conversation intelligence). Confusing RingEX and RingCX is a credibility hit.", "The 'favorite product / how would you improve it' question is a near-certainty \u2014 prepare a crisp answer with a metric and a prioritized improvement, ideally showing you understand a RingCentral product.", "SQL is emphasized for data/BI/analyst roles, not typically the PM loop \u2014 don't over-index on coding; be ready to reason about metrics and estimation instead.", "Neal's headline metrics need careful phrasing: 41.7% net margin should be rounded (~42%) and labeled 'projected', $145K ARR is 'projected', and the 97% outreach-time cut is near-ceiling with no baseline \u2014 give a before->after or soften it (per ledger presentationNote).", "Neal's work authorization is unconfirmed in the ledger and RingCentral is a US employer \u2014 confirm before applying; do not assume.", "GPA is not on the master resume; only list if >= 3.5. Do not invent it.", "Behavioral answers must map to the FOUR named values (Hyper Focused, Relentlessly Innovative, A Trusted Partner, Empowering Customers) and to their 'solve for the customer first / decisions supported by data' principles \u2014 quoting these back signals culture fit.", "Every behavioral story must trace to a ledger fact ID; do not embellish numbers or invent experiences."], "sources": ["https://www.ringcentral.com/whats-new.html", "https://www.ringcentral.com/ringcx.html", "https://www.ringcentral.com/company.html", "https://www.ringcentral.com/us/en/blog/introducing-ringcentral-ai-receptionist-business-ready-voice-ai-is-here/", "https://www.ringcentral.com/us/en/blog/ai-receptionist-easier-setup-smarter-conversations/", "https://www.ringcentral.com/us/en/blog/ai-receptionist-texts-call-queues-integrations/", "https://www.ringcentral.com/whyringcentral/company/pressreleases/ringcentral-announces-agentic-voice-ai-communications-suite.html", "https://www.comparably.com/companies/ringcentral/mission", "https://builtin.com/company/ringcentral/faq/culture-values", "https://www.interviewquery.com/interview-guides/ringcentral-product-manager", "https://www.glassdoor.com/Interview/RingCentral-Senior-Product-Manager-Interview-Questions-EI_IE197577.0,11_KO12,34.htm", "https://www.mockquestions.com/company/RingCentral/", "https://datalemur.com/blog/ringcentral-sql-interview-questions", "https://markets.financialcontent.com/stocks/article/finterra-2026-2-23-ringcentral-rng-deep-dive-ai-transformation-and-the-2026-tariff-safe-haven-play", "https://www.stocktitan.net/sec-filings/RNG/10-k-ring-central-inc-files-annual-report-c99e620da0b9.html", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Amplitude", "products": ["Amplitude Analytics (product & web analytics \u2014 full user-journey, funnels, retention, cohorts on one behavioral event source)", "Session Replay + Heatmaps (visualize real user sessions/clicks/scrolls tied to events)", "Feature Experimentation + Web Experimentation (A/B testing and feature flags/management)", "Guides and Surveys (in-app onboarding guidance + feedback/voice-of-customer collection)", "Customer Data Platform / Activation (CDP \u2014 collect, govern, and route behavioral data across teams/tools)", "Amplitude AI: AI Agents, AI Feedback, Ask
