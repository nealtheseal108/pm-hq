      return '<div class="sc' + (gap ? " gap" : "") + '"><div class="sct">' + esc(s.competency) + (gap ? ' <span class="gapb">needs your input</span>' : "") + "</div>"
        + '<p class="sstory">' + esc(s.story) + "</p>"
        + '<div class="sstar">' + esc(s.star) + "</div>"
        + (s.factIds && s.factIds.length ? '<div class="sids">grounded in ' + ids(s.factIds) + "</div>" : "") + "</div>";
    }).join("");
    return '<div class="panel"><div class="phead"><h2>Story Bank</h2><span class="hint">STAR stories from your real ledger — cite the metric, own the decision</span></div><div class="pad">' + cards + "</div></div>";
  }
  function companiesHtml() {
    if (!CO.length) return '<div class="panel"><div class="phead"><h2>Company Packs</h2><span class="hint">top-50, generating</span></div><div class="pad muted">The per-company interview packs are being generated + verified by the top-50 workflow. They\'ll appear here (products, values, round format, product-sense prompts about their product, and which of your stories map to their values).</div></div>';
    return '<div class="panel"><div class="phead"><h2>Company Packs</h2><span class="hint">' + CO.length + ' companies · pick one</span></div>'
      + '<div class="pad"><input id="cosearch" placeholder="Filter ' + CO.length + ' companies…" autocomplete="off"/></div>'
      + '<div class="colist" id="colist"></div></div><div id="codetail"></div>';
  }
  function companyDetail(c) {
    function list(title, arr, cls) { if (!arr || !arr.length) return ""; return '<h3>' + title + '</h3><ul class="' + (cls || "") + '">' + arr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
    var h = '<div class="panel"><div class="phead"><h2>' + esc(c.company) + '</h2><span class="hint">interview pack</span></div><div class="pad codet">';
    h += list("Flagship products (product-sense targets)", c.products);
    h += list("Values / PM bar", c.valuesAndBar);
    h += list("Round format", c.interviewFormat);
    if (c.productSensePrompts && c.productSensePrompts.length) {
      h += "<h3>Likely product-sense prompts</h3>";
      c.productSensePrompts.forEach(function (p) { h += '<div class="psp"><div class="pspq">' + esc(p.prompt) + '</div><div class="pspa">' + esc(p.approach) + "</div></div>"; });
    }
    if (c.behavioralMapping && c.behavioralMapping.length) {
      h += "<h3>Your story → their value</h3>";
      c.behavioralMapping.forEach(function (b) { h += '<div class="bmap"><b>' + esc(b.value) + ":</b> " + esc(b.nealStory) + " " + ids(b.factIds) + "</div>"; });
    }
    h += list("Analytical / metrics focus", c.analyticalFocus);
    h += list("Gotchas", c.gotchas, "gotcha");
    h += "</div></div>";
    return h;
  }
  function questionsHtml() {
    return '<div class="panel"><div class="phead"><h2>Common Questions</h2><span class="hint">rehearse a crisp answer to each</span></div><div class="pad"><ul class="cq">'
      + CQ.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul></div></div>";
  }
  function drillHtml() {
    return '<div class="panel"><div class="phead"><h2>Mock Drill</h2><span class="hint">random prompt → apply the framework → self-review</span></div>'
      + '<div class="pad"><div class="brow"><button class="btn" id="drill-go">New prompt</button><span class="muted" id="drill-kind"></span></div>'
      + '<div class="drill" id="drill"></div><div class="rubric" id="drill-rubric"></div></div></div>';
  }

  app.innerHTML =
    '<div class="brand"><span class="dot"></span><h1>Interview HQ</h1></div>'
    + '<p class="status">PM interview prep · shared frameworks + your story bank + <b>' + (CO.length || "top-50") + '</b> company packs</p>'
    + '<nav class="tabs" id="tabs">' + tab("frameworks", "Frameworks") + tab("stories", "Story Bank") + tab("companies", "Companies") + tab("questions", "Common Qs") + tab("drill", "Mock Drill") + "</nav>"
    + view("frameworks", frameworksHtml())
    + view("stories", storyHtml())
    + view("companies", companiesHtml())
    + view("questions", questionsHtml())
    + view("drill", drillHtml());

  var tabs = app.querySelector("#tabs"), views = app.querySelectorAll(".view");
  function show(id) { tabs.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === id); }); views.forEach(function (v) { v.classList.toggle("on", v.dataset.view === id); }); }
  tabs.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) show(b.dataset.tab); });
  show("frameworks");

  // companies list + detail
  if (CO.length) {
    var listEl = app.querySelector("#colist"), detEl = app.querySelector("#codetail"), searchEl = app.querySelector("#cosearch");
    function renderList(f) {
      listEl.innerHTML = CO.filter(function (c) { return !f || c.company.toLowerCase().indexOf(f) >= 0; })
        .map(function (c) { return '<button class="cochip" data-co="' + esc(c.company) + '">' + esc(c.company) + "</button>"; }).join("");
    }
    renderList("");
    listEl.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-co]"); if (!b) return;
      var c = CO.filter(function (x) { return x.company === b.dataset.co; })[0];
      if (c) { detEl.innerHTML = companyDetail(c); detEl.scrollIntoView({ behavior: "smooth", block: "start" }); }
    });
    searchEl.addEventListener("input", function () { renderList(this.value.trim().toLowerCase()); });
  }

  // drill
  var drillTypes = FR.map(function (f) { return f.type; });
  var products = [];
  CO.forEach(function (c) { (c.products || []).forEach(function (p) { products.push([c.company, p]); }); });
  var seed = 0;
  function rnd(n) { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); }
  var drillGo = app.querySelector("#drill-go");
  if (drillGo) {
    drillGo.addEventListener("click", function () {
      seed = (seed + Date.now()) % 233280;
      var f = FR[rnd(FR.length)] || {};
      var prompt, kind = f.type;
      if (/Product Sense/.test(f.type) && products.length) { var pr = products[rnd(products.length)]; prompt = "Design or improve " + pr[1] + " (" + pr[0] + ")."; }
      else if (/Estimation/.test(f.type)) prompt = "Estimate the market/volume for a product you'd pitch " + (products.length ? "to " + products[rnd(products.length)][0] : "an interviewer") + ".";
      else if (/Behavioral/.test(f.type)) prompt = (CQ.filter(function (q) { return /time|why|tell/i.test(q); })[rnd(6)] || "Tell me about a product you shipped.");
      else if (/Metrics/.test(f.type) && products.length) { var pm = products[rnd(products.length)]; prompt = "What metrics would you track for " + pm[1] + " (" + pm[0] + ")?"; }
      else prompt = f.when || "Answer using the " + f.type + " framework.";
      app.querySelector("#drill-kind").textContent = "· " + kind + " · aim for " + (/Behavioral/.test(kind) ? "60-90s" : "5-8 min");
      app.querySelector("#drill").innerHTML = '<div class="dq">' + esc(prompt) + "</div>"
        + '<div class="dframe"><b>Apply ' + esc(f.framework || f.type) + ':</b><ol>' + (f.steps || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
      app.querySelector("#drill-rubric").innerHTML = '<div class="rubt">Self-review</div><ul><li>Did I state a user + a goal metric out loud?</li><li>Did I name a tradeoff / what I deprioritized?</li><li>Did I quantify the result / define success?</li><li>Was I structured — could the interviewer follow my headline → detail?</li></ul>';
    });
    drillGo.click();
  }
})();
</script></body></html>
