t point-of-need rather than gating core creation. Metrics: free->paid conversion rate, but guardrail on free-user retention/activation so you don't win conversion by breaking the funnel. Neal maps this to bb-3 (QR loyalty app lifting repeat purchase 40% \u2014 driving upgrade/repeat behavior without friction) and bb-1 (unit-economics/margin thinking)."}, {"prompt": "Design a metric framework to measure whether Magic Studio (Canva's AI features) is actually succeeding.", "approach": "Distinguish adoption (% MAU who try an AI feature) from value (does AI output get kept and shipped vs. discarded/undone) from retention lift (do AI users come back more). North Star candidate: AI-assisted designs published per active user. Watch counter-metrics: AI regeneration loops, edit-after-generate rate (signals bad first output), and support/complaint volume. Segment by persona and use-case. Neal grounds this in fp-1 (authored a PRD defining 15+ KPIs with a North Star \u2014 First-Time Fix Rate) and ep-1 (16% exam-score lift, 38% review-time cut \u2014 outcome instrumentation)."}, {"prompt": "Canva's next 10 years is about empowering organizations (Enterprise), but its DNA is empowering individuals. As PM for Canva Enterprise, what's the one feature you build to win teams \u2014 and how do you keep it feeling like Canva?", "approach": "Identify what breaks when an individual tool goes org-wide: brand consistency, approvals/governance, and content reuse at scale. Pick ONE wedge (e.g. brand controls + template locking that non-designers can't violate) that turns Canva's simplicity into an enterprise advantage rather than adding enterprise bloat. Tie to a bottom-up land-and-expand motion (individuals already use Canva -> teams formalize). Defend the simplicity value: governance should be invisible to the everyday creator. Neal grounds this in sl-1 (led 0->1 internal tooling product, Gerrit voting + Bazel, cut manual tests 40% with real-time visibility \u2014 building governance/workflow tooling that people actually adopt) and ld-1 (PM Club professional-development leadership)."}], "behavioralMapping": [{"value": "Make Complex Things Simple", "nealStory": "SailLoft: took messy developer-workflow pain points and shipped a GitHub testing interface + a 2-click Chrome extension that condensed a whole client testing process into two clicks \u2014 reducing complexity for the end user, accelerating PR-to-merge ~25%.", "factIds": ["sl-2", "sl-1"]}, {"value": "Set Crazy Big Goals", "nealStory": "Biryani Blitz: set out to build a 0->1 hot-food vending platform from scratch (fresh biryani in 60s), grounded in 180 customer interviews, projecting ~42% net margin and $145K ARR/machine \u2014 and got it deployed at UC Berkeley, backed by Wharton + UNC Innovation Labs and a $200K Wharton Startup Challenge finalist.", "factIds": ["bb-1", "bb-4", "bb-role"]}, {"value": "Empower Others", "nealStory": "Elephant Productivity Suite: scaled a student productivity app 17->563 active users (33x) in one quarter via 200+ user interviews, shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 directly empowering students to do better with less effort. Also Director of Professional Development for the UNC PM Club.", "factIds": ["ep-1", "ld-1"]}, {"value": "Be a Force for Good", "nealStory": "Elephant Productivity Suite's mission was student outcomes, not just engagement \u2014 measurably raising exam scores (16%) and cutting wasted study time (38%). Frame Neal's founder work as building tools that measurably improve people's lives/work, and lean on his UNC Ultimate Frisbee (BatCH) presidency for community/team leadership.", "factIds": ["ep-1", "ld-2"]}, {"value": "Pursue Excellence", "nealStory": "FieldPulse: authored a rigorous PRD for an AI predictive-restocking feature (RAG over usage logs, seasonality), designing a 3-flow UX with AI explainability and defining 15+ KPIs with a First-Time Fix Rate North Star \u2014 depth and craft beyond what was asked. Reinforce with Bridge to BCG invitee (~10% acceptance).", "factIds": ["fp-1", "ld-3"]}, {"value": "Be a Good Human", "nealStory": "Founder-led user research as respect for people: 180 interviews at Biryani Blitz + 200+ at Elephant + 200+ at SailLoft context \u2014 Neal consistently listens to users before building. Pair with UNC Ultimate Frisbee (BatCH) president role for how he leads teammates and handles group dynamics.", "factIds": ["bb-1", "ep-1", "ld-2"]}], "analyticalFocus": ["Free-to-paid conversion: modeling Canva Pro upgrade rate without harming free-user activation/retention (guardrail metrics)", "Distinguishing AI adoption vs. AI value: edit-after-generate rate, regeneration loops, % of AI output kept and published", "Defining a North Star for a feature launch (Neal has direct reps: fp-1 defined 15+ KPIs with a North Star; ep-1 has real before->after deltas)", "Funnel instrumentation and conversion analytics (bb-2: impression->approach->purchase CV telemetry maps cleanly to product funnels)", "Engagement/retention at 240M+ MAU scale \u2014 reasoning about mass-consumer cohorts and segment-level metrics", "Estimation/sizing: market or usage sizing for a new vertical (e.g. estimate DAU of Canva Sheets, or TAM for Canva Enterprise)", "Unit economics literacy (bb-1: ~42% projected net margin, $145K ARR/machine) \u2014 useful for monetization/pricing questions"], "gotchas": ["Values are scored as hard filters in a dedicated round \u2014 a surface-level or generic answer on any of the six values can end the process. Rehearse all six with specific ledger-backed STARs.", "You must be a genuine Canva user. Interviewers can tell instantly. Neal should build several real designs in Visual Suite, run a Magic Studio flow, and try Canva Sheets/Code before interviewing \u2014 and reference friction he personally hit.", "'Make Complex Things Simple' is a trap in product-sense: proposing powerful-but-complex features without defending simplicity will read as off-value. Always name the simplicity trade-off and use progressive disclosure.", "The Craft Challenge/take-home is presentation-graded on reasoning and openness to alternatives, not just the answer \u2014 expect interviewers to push back; show you can update your view (do NOT dig in defensively).", "Public interview data is for full PM roles; a distinct APM-intern loop is not well documented. Do not assume the exact rounds \u2014 confirm the format and whether there's a take-home with the recruiter.", "Numbers hygiene from the ledger: present bb-1's 41.7% as ~42% and label it 'projected'; give bb-3's 97% outreach-time cut a before->after or soften it (no baseline = red flag). Never invent metrics or experiences beyond the ledger.", "Canva is Australian-HQ'd (Sydney) and pre-IPO at a ~$42B valuation with a strong 'Two-Step Plan' philanthropy narrative \u2014 'why Canva' answers land better when they engage the mission (empower everyone to design + be a force for good), not just the product.", "Work\u00e2\u20ac\u2018authorization and grad year (May 2028) are unconfirmed/knockout risks in the ledger \u2014 Neal must confirm internship eligibility/work auth before applying."], "sources": ["https://www.canva.com/about/", "https://www.canva.com/newsroom/news/canva-create-2025/", "https://www.canva.com/newsroom/news/canva-ai-launches/", "https://www.canva.com/newsroom/news/magic-studio/", "https://www.businesswire.com/news/home/20251030695119/en/Canva-Launches-Creative-Operating-System", "https://petapixel.com/2025/10/30/canvas-new-creative-os-promises-to-be-its-biggest-evolution-yet/", "https://musically.com/2025/08/20/design-tool-canva-now-has-more-than-240m-monthly-active-users/", "https://ophyai.com/blog/company-guides/canva-interview-guide", "https://www.glassdoor.com/Interview/Canva-Product-Manager-Interview-Questions-EI_IE1013251.0,5_KO6,21.htm", "https://www.tryexponent.com/questions?company=canva&role=pm", "https://sirjohnnymai.com/blog/how-hard-is-canva-pm-interview", "https://businessmodelcanvastemplate.com/blogs/mission/canva-mission", "https://medium.com/canva-chronicles/crazy-b-i-g-goals-for-2025-4406729e87ec", "https://www.inc.com/jennifer-conrad/how-ai-is-powering-canva-to-a-42-billion-valuation-and-a-future-ipo/91267864", "https://about.canva.com/news/20-crazy-big-goals-achieved-year/"]}, {"company": "Duolingo", "products": ["Core Duolingo language-learning app (free/freemium, gamified: streaks, XP, leagues, hearts)", "Super Duolingo (ad-free + convenience tier)", "Duolingo Max (top AI tier, ~$168/yr): Video Call with 'Lily' live AI tutor + Roleplay; 'Explain My Answer' became free to all users Jan 2026", "Duolingo Math (parent-paid supplemental tutor; ~60 new units grades 6-9, targeting leading tutor app in 2026)", "Duolingo Music (revamped after $34.5M NextBeat acqui-hire for game-like redesign)", "Duolingo ABC (early literacy for kids)", "Duolingo English Test (DET) \u2014 proctored, accepted by universities as TOEFL/IELTS alternative"], "valuesAndBar": ["12 Operating Principles frame the culture bar (values-alignment can override strong technical performance in the exec review)", "Learners First \u2014 every product decision defends an excellent learner experience", "Prioritize Ruthlessly \u2014 use data/experimentation to decide what gets resources", "Take the Long View \u2014 100-year company; sustainable growth over short-term gains; freemium is mission-aligned (free product wide, monetize by making paid worth it)", "Test It First \u2014 rigorous A/B testing before shipping; experimentation culture", "Reduce Complexity \u2014 simplicity in products and communication", "Ship It \u2014 bias to action, balance perfectionism with pragmatism", "Strive for Excellence; Be Candid and Kind (assume positive intent); Explain Why (connect work to strategy); Embrace Challenges; Never Settle on Talent; All for One and One for All", "Brand voice: playful, persistent, slightly irreverent \u2014 anti-stress, 'learn with delight' (leaderboards-as-shame is an ANTI-pattern to avoid)", "PM competency emphasis / rubric (per prep sources): Product Judgment ~40%, Execution Rigor ~35%, Cultural Contribution ~25%", "Values behavioral nudges as tools not tricks; emotional/identity leverage over pure utility; understands core loop: streak \u2192 XP \u2192 levels \u2192 pride \u2192 return"], "interviewFormat": ["Application + 'Why Duolingo?' short response (mission/education/languages alignment; earlier applications may interview earlier \u2014 rolling)", "Take-home design challenge (per some 2024-25 accounts, 3-7 days: 'Pick a feature to add/improve in Duolingo \u2014 a few slides with MVP, metrics, GTM'). NOTE: at least one 2026 source says take-homes were dropped \u2014 confirm with recruiter.", "Round 1 (~45-60 min): Product Sense + light behavioral + analytical/metrics (may discuss the take-home submission)", "Round 2 (~45-60 min): UX/Design, Strategy/Estimation, and Behavioral (teamwork, handling failure)", "Some accounts describe a fuller loop: recruiter screen (30m) \u2192 hiring-manager chat (45m) \u2192 onsite Product Sense (60m) \u2192 onsite Execution (60m) \u2192 Executive Review (30-45m)", "Timeline ~21-28 days app-to-decision; applications open ~Sept, offers ~late Oct; VERY few APM interns accepted per summer (highly competitive); 10-12 week summer program", "No slides/diagrams during live rounds (some sources) \u2014 Duolingo values verbal precision; no inter-round feedback, holistic decision"], "productSensePrompts": [{"prompt": "Design a feature to help a user recover emotionally and re-engage after breaking a long streak.", "approach": "Lead with the emotional barrier by ~minute 15: broken streak = shame/loss-of-identity, the #1 churn trigger. Segment users (long-streak power users vs. casual). Anchor to Learners-First and the anti-stress 'learn with delight' ethos \u2014 avoid shame mechanics. Propose identity-preserving recovery (e.g. Streak Repair/Freeze framing, a 'you're still a learner' message, a low-friction win-back lesson) over guilt-based nudges. Define North Star = D7/D30 return rate of streak-breakers; guardrails = no drop in overall session enjoyment/NPS. Frame as an A/B test (Test It First) with a clear hypothesis before building."}, {"prompt": "Improve onboarding for a non-English speaker learning a new language on Duolingo.", "approach": "Name the friction: cold-start motivation + language/UI comprehension barrier for someone who can't read English instructions. Clarify goal (activation = complete first lesson + return day 2). Map the funnel: language-pair selection \u2192 placement \u2192 first lesson \u2192 first streak. Reduce Complexity: localized/iconographic onboarding, quick placement to avoid boredom-or-overwhelm, an early 'aha' win. Tie to the core loop (first XP \u2192 pride \u2192 return). Metrics: first-lesson completion, D1/D7 retention by locale; A/B the localized flow. Show conviction that motivation is the product, not just content."}, {"prompt": "Should Duolingo expand Video Call (the 'Lily' AI tutor) from the Max tier down into the cheaper Super tier? How would you decide?", "approach": "Frame as a monetization vs. mission tradeoff (Take the Long View + freemium philosophy). Hypothesize: broadening reach deepens the core value/retention but risks cannibalizing Max's differentiation. Decide with data \u2014 A/B test Video Call access in Super and measure incremental Super conversion, Max downgrade/cannibalization, retention lift, and AI inference cost per user. North Star = incremental subscription contribution + retention; guardrail = Max churn and unit economics. Recommend a gated rollout (limited minutes in Super) to learn before committing (Ship It + Test It First)."}, {"prompt": "Design a feature to make Duolingo Math a product parents will pay for.", "approach": "Identify the payer vs. user split: kid is the learner, parent is the buyer \u2014 two audiences, two value props. For the learner: keep the delightful gamified loop (streaks/XP) that Duolingo owns. For the parent: visible outcomes \u2014 a progress/mastery dashboard, curriculum alignment (grades 6-9), and proof of learning tied to school. North Star = paid conversion + sustained weekly-active kids; guardrail = kid engagement must not drop as academic rigor rises (recall the 'grammar hint improved accuracy but cut session time' tension). Test pricing/packaging as a supplemental tutor. Ground in Learners First \u2014 outcomes without killing delight."}], "behavioralMapping": [{"value": "Learners First / user-obsessed product decisions", "nealStory": "Elephant Productivity Suite: ran 200+ user interviews and scaled 17\u2192563 active users (33x) in one quarter, shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 user research directly drove measurable learner outcomes (directly analogous to Duolingo's education mission).", "factIds": ["ep-role", "ep-1"]}, {"value": "Prioritize Ruthlessly / Test It First (data + experimentation)", "nealStory": "Biryani Blitz: built a privacy-first OpenCV telemetry system tracking the impression\u2192approach\u2192purchase funnel, giving a physical machine e-commerce-grade conversion analytics \u2014 used funnel data to decide what to improve, mirroring Duolingo's funnel/execution round.", "factIds": ["bb-2", "bb-1"]}, {"value": "Ship It / bias to action (0\u21921)", "nealStory": "SailLoft: led the 0\u21921 launch of an internal Gerrit+Bazel software-test product that cut manual tests 40% with real-time visibility, and shipped a Chrome extension condensing client testing to a 2-click workflow \u2014 shipped pragmatically under a short 2-month internship.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Reduce Complexity", "nealStory": "SailLoft: translated messy developer-workflow pain points into a simple GitHub testing interface and a 2-click Chrome-extension workflow, accelerating PR-to-merge ~25% \u2014 took complexity out of the user's path.", "factIds": ["sl-2"]}, {"value": "Take the Long View / ownership & conviction (founder mindset)", "nealStory": "Biryani Blitz: founded the company after 180 customer interviews, defined a 0\u21921 hot-food vending platform at UC Berkeley with a projected business model (~42% projected net margin, projected $145K ARR/machine), Wharton + UNC Innovation Labs backing ($5K) and $200K Wharton Startup Challenge finalist \u2014 owned problem definition end-to-end, the opposite of the 'gather requirements from stakeholders' anti-pattern.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Explain Why / metrics-driven leadership (Round-1 behavioral: 'a project you led and how you used data')", "nealStory": "FieldPulse PRD: authored a PRD for an AI RAG predictive-restocking feature, designed a 3-flow UX with AI explainability and defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 shows he can pick a North Star and connect features to strategy (the exact skill Duolingo's execution round probes).", "factIds": ["fp-1"]}, {"value": "All for One / Be Candid and Kind (teamwork & leadership)", "nealStory": "Leadership: Director of Professional Development for UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 collaborative leadership across peers; use for teamwork/conflict and 'why PM' behavioral prompts.", "factIds": ["ld-1", "ld-2"]}, {"value": "AI-native builder / technical comfort (engineer-adjacent fluency)", "nealStory": "Biryani Blitz: shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time ~97%, plus a QR loyalty app (React/Firebase) lifting repeat purchases 40% \u2014 demonstrates the AI/technical fluency Duolingo values as it expands AI features (Max Video Call).", "factIds": ["bb-3"]}], "analyticalFocus": ["A/B test interpretation \u2014 form a hypothesis, read results, and propose additional validating metrics (e.g. the 'grammar hints improved accuracy 8% but session duration dropped 14% \u2014 what's happening?' style prompt)", "Metric-anomaly diagnosis \u2014 'DAU dropped 10% after a UI refresh, how do you respond?' (segment, isolate, instrument, root-cause)", "Funnel analysis \u2014 activation/onboarding funnel and the engagement loop: streak \u2192 XP \u2192 levels \u2192 pride \u2192 return", "Retention & habit metrics \u2014 DAU/MAU, D1/D7/D30 retention, streak-length distribution, streak decay/win-back", "Choosing a North Star + guardrail metrics for a feature; balancing engagement vs. learning-outcome tradeoffs", "Monetization / market estimation \u2014 freemium conversion (Super/Max), subscription contribution, AI inference cost per user, market sizing (e.g. size the Duolingo Math or DET opportunity)"], "gotchas": ["Avoid the leaderboard/competition-for-competition's-sake answer \u2014 it contradicts Duolingo's anti-stress, 'learn with delight' brand and reads as shame mechanics.", "Do NOT open product-sense with 'first I'd gather requirements from stakeholders' \u2014 Duolingo wants PMs who define the problem independently (ownership).", "Avoid generic fixes ('improve onboarding', 'better UX'); use surgical specificity \u2014 name the exact friction/emotional barrier early (~by minute 15).", "They verify you actually USE the app \u2014 bring specific, nuanced feature critiques, not surface-level ideas. Reference real 2026 products (Max Video Call/Lily, Math, Music revamp).", "Cultural/values alignment can override strong technical performance in the executive review \u2014 show conviction for the mission (education) and the 'behavioral nudges as tools, not tricks' philosophy.", "Take-home status is ambiguous: older accounts describe a 3-7 day slide design challenge; one 2026 source says take-homes were dropped \u2014 confirm with the recruiter rather than assume.", "Some rounds discourage slides/diagrams live \u2014 practice verbal, precise reasoning.", "Neal-specific: 'lived experience learning a second language' is highly valued \u2014 weave in any genuine language-learning experience for 'Why Duolingo?'. Do not fabricate. Also confirm work authorization (ledger flags it UNCONFIRMED) since intern knockout fields require it.", "Phrasing risks from ledger: soften the 97% outreach-time cut (near-ceiling, no baseline) and round 41.7% net margin to ~42% labeled 'projected'; keep '$145K ARR' explicitly 'projected'."], "sources": ["https://blog.duolingo.com/operating-principles/", "https://blog.duolingo.com/handbook/", "https://blog.duolingo.com/duolingos-values-a-letter-from-the-ceo/", "https://blog.duolingo.com/duolingo-company-strategy/", "https://apmlist.org/blog/duolingo-apm-associate-product-manager-internship", "https://sirjohnnymai.com/blog/loop-duolingo-interview-process", "https://www.joinleland.com/library/a/the-ultimate-guide-to-landing-a-job-as-a-duolingo-product-manager", "https://www.interviewquery.com/interview-guides/duolingo-product-manager", "https://www.iykyk.careers/p/duolingo-apm-application-offer-iykyk", "https://blog.duolingo.com/product-highlights/", "https://investors.duolingo.com/news-releases/news-release-details/duolingo-unveils-major-product-updates-turn-learning-real-world", "https://naavik.co/digest/duolingos-next-beat/", "https://beginnersinai.org/duolingo-max-explained/", "https://www.classcentral.com/report/duolingo-2026-strategy/", "https://www.fool.com/earnings/call-transcripts/2026/05/04/duolingo-duol-q4-2025-earnings-transcript/"]}, {"company": "SAP", "products": ["SAP S/4HANA Cloud (flagship next-gen cloud ERP; Public & Private Editions)", "SAP Business Technology Platform (BTP) \u2014 PaaS layer for extending/integrating SAP, now consolidated with Business Data Cloud + AI Foundation into the SAP Business AI Platform", "SAP Joule \u2014 generative + agentic AI copilot embedded across 35+ solutions; 40+ specialized AI agents, 2,400+ Joule Skills; Joule Studio Agent Builder (GA Q1 2026) for custom agents", "SAP SuccessFactors \u2014 human capital management (HCM) / employee experience", "SAP Ariba \u2014 procurement & supplier network (part of Intelligent Spend / Business Network)", "SAP Concur \u2014 travel & expense management", "SAP Fieldglass \u2014 external/contingent workforce management", "SAP Business Network \u2014 B2B supplier/buyer network (Ariba + Concur + Fieldglass)", "SAP Analytics Cloud (SAC) & SAP Customer Experience (CX)", "SAP.com and SAP's digital properties (the specific surface for the iXp Digital Platforms & AI PM intern role)"], "valuesAndBar": ["Mission: 'Help the world run better and improve people's lives' \u2014 societal-impact framing; every product-sense answer should ladder up to helping enterprises run better", "Core values: innovation, customer success, integrity/ethics, sustainability, diversity & inclusion", "Ethical AI, data protection & privacy are explicitly emphasized (relevant given the agentic-AI intern role) \u2014 expect trust/governance to come up", "Consensus-driven, stakeholder-heavy culture: PM competency bar weights stakeholder management and decision-making under constraints", "People-centric leadership; empathetic listening and collaboration are cultural signals interviewers listen for", "Enterprise-buyer orientation: PMs must balance end-user needs (AP clerk, warehouse manager, HR admin) against enterprise buyer priorities (CIO, IT director, procurement, compliance)"], "interviewFormat": ["Recruiter screen (phone/video): background, motivation for SAP, resume walk; ~20-day average time-to-hire for PM roles", "Round 1 \u2014 Product Design (45-60 min): design or improve an SAP product feature; always involves an enterprise buyer dimension, not just end user", "Round 2 \u2014 Business Case / Market Analysis (45-60 min): enterprise market dynamics, competitive landscape, purchasing cycles", "Round 3 \u2014 Technical Awareness (45-60 min): grasp of SAP architecture \u2014 S/4HANA, BTP; for the AI intern role, LLMs, vector databases, agentic orchestration, Agile/Scrum or SAFe 6.0", "Round 4 \u2014 Behavioral + Leadership (45-60 min): stakeholder management, decision-making under constraints, often with a senior leader/director; long-term product vision and data-driven decisions", "iXp specifics: SAP Internship Experience Program (iXp) is a paid, hybrid, mentorship-heavy program; the Product Management (Digital Platforms & AI) intern role centers on 'Build & Run' ops for SAP.com and transforming digital platforms into AI-driven autonomous experiences"], "productSensePrompts": [{"prompt": "Design a Joule (SAP's AI copilot) experience for a first-time enterprise user inside S/4HANA who is intimidated by the ERP UI. How would you improve adoption?", "approach": "Clarify the user (e.g., an AP clerk vs. a CFO) and the enterprise buyer (CIO who bought S/4HANA for ROI). State a goal metric (task-completion rate / time-to-first-value). Brainstorm: natural-language 'explain this error' prompts, guided task agents, in-context suggestions. Prioritize by adoption impact vs. trust risk. Address SAP-specific constraints: data privacy, role-based permissions, auditability (Joule must not act outside a user's authorization). Close with success metrics: Joule Skill usage per active user, task deflection, satisfaction."}, {"prompt": "You own SAP.com (the iXp team's actual surface). How would you redesign it to become an 'AI-driven, autonomous experience,' and how would you measure success?", "approach": "Segment visitors (net-new prospect, existing customer, developer, job seeker) \u2014 SAP.com serves all. Pick a primary journey (prospect-to-qualified-lead). Propose an agentic assistant that answers product-fit questions and routes to the right solution across a huge portfolio (S/4HANA, SuccessFactors, Ariba). Metrics: assisted-conversion rate, self-serve resolution, lead quality. Flag guardrails (hallucination risk on enterprise commitments, brand trust). This maps directly to the role \u2014 show you understand 'Build & Run' and autonomous experiences."}, {"prompt": "Ariba/SAP Business Network connects millions of buyers and suppliers. Design a feature to help a mid-market supplier get discovered and win more business.", "approach": "Two-sided market lens: value to supplier (visibility, matched RFQs) must not degrade buyer trust (quality, compliance). Propose AI-driven supplier-matching or a reputation/verification signal. Prioritize with a network-effects view (which side is the bottleneck). Enterprise nuances: procurement compliance, supplier onboarding friction, spend controls. Metrics: supplier match-to-quote rate, buyer time-to-source, GMV per matched supplier. Tie to SAP's 'run better' mission."}, {"prompt": "Design an agentic-AI feature for SuccessFactors that helps an HR business partner, and decide when the agent should act autonomously vs. ask for approval.", "approach": "Define the job-to-be-done (e.g., surfacing flight-risk employees or drafting a job req). Map an autonomy spectrum: suggest -> draft -> act-with-approval -> fully autonomous, and gate by reversibility and stakes (drafting a req = low risk; sending an offer = human-in-the-loop). Emphasize SAP's ethical-AI and data-privacy values (employee data is sensitive). Metrics: HRBP time saved, agent-suggestion acceptance rate, escalation/override rate as a trust signal."}], "behavioralMapping": [{"value": "Innovation / AI-native building (agentic AI, LLMs \u2014 the exact iXp role focus)", "nealStory": "At Biryani Blitz, shipped an AI lead-generation agent using Node, Playwright, and Gemini across 100+ universities, cutting weekly outreach time ~97% \u2014 and built a privacy-first OpenCV computer-vision telemetry system tracking the impression-to-purchase funnel. Directly demonstrates agentic pipelines + privacy-conscious AI, which SAP's role calls for (LLMs, agentic orchestration, ethical AI).", "factIds": ["bb-3", "bb-2", "bb-role"]}, {"value": "Customer success / user research depth", "nealStory": "Scaled the Elephant Productivity Suite from 17 to 563 active users (33x) in one quarter driven by 200+ user interviews, and founded Biryani Blitz after 180 customer interviews \u2014 over 500 interviews across ventures. Shows customer-obsession, which SAP weights as a core value.", "factIds": ["ep-1", "bb-1"]}, {"value": "Stakeholder management / decision-making under constraints (SAP's consensus-driven bar)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product, translating developer-workflow pain points into a GitHub testing interface and accelerating PR-to-merge cycles ~25%; chose auto-voting on Gerrit as a design tradeoff. Demonstrates aligning engineering stakeholders and making a scoped decision under constraints.", "factIds": ["sl-1", "sl-2"]}, {"value": "Data-driven decisions / metrics ownership", "nealStory": "Authored the FieldPulse predictive-restocking PRD (RAG over usage logs/seasonality) defining 15+ KPIs with First-Time Fix Rate as the North Star; built ML flashcard engine that lifted exam scores 16% and cut review time 38%. Shows North-Star metric thinking SAP's analytical round probes.", "factIds": ["fp-1", "ep-1"]}, {"value": "Ownership / 0->1 delivery and measurable impact", "nealStory": "As Founder & AI PM of Biryani Blitz, launched a 0->1 hot-food vending platform at UC Berkeley (fresh biryani in 60s), projected ~$145K ARR/machine; backed by Wharton + UNC Innovation Labs ($5K) and a $200K Wharton Startup Challenge finalist. Demonstrates end-to-end ownership and 'Build & Run' mindset the iXp role names.", "factIds": ["bb-1", "bb-4", "bb-role"]}, {"value": "Leadership / collaboration (people-centric culture)", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leading peers and organizing others; pair with the Elephant team growth story to show collaborative execution.", "factIds": ["ld-1", "ld-2", "ep-1"]}], "analyticalFocus": ["North-Star metric selection for enterprise/B2B products (e.g., First-Time Fix Rate, task-completion, adoption) \u2014 Neal has a ledger example (FieldPulse, 15+ KPIs)", "Enterprise adoption & activation metrics: active users, time-to-first-value, feature adoption per seat, Joule Skill usage per active user", "AI/agent quality metrics: suggestion-acceptance rate, task-deflection, escalation/override rate as a trust signal, hallucination/error rate", "Two-sided network metrics for Ariba/Business Network: match-to-quote rate, GMV, supplier/buyer time-to-source", "Business-case / market sizing for enterprise software (TAM by industry & company size; enterprise purchasing cycles)", "Funnel analysis (impression->approach->purchase) \u2014 Neal has a real OpenCV funnel-telemetry example to cite", "Experiment design / A-B testing and conversion analytics for adoption improvements"], "gotchas": ["This is ENTERPRISE, not consumer PM. Product-sense answers must name the enterprise buyer (CIO, procurement, compliance) AND the end user \u2014 answering only for the end user is a common miss SAP interviewers penalize.", "The specific iXp PM role is 'Digital Platforms & AI' (SAP.com + agentic AI). Come ready to talk LLMs, vector databases, agentic orchestration, and Agile/Scrum or SAFe 6.0 \u2014 and lean into Neal's Gemini/Playwright agent + RAG PRD experience.", "SAP's culture is consensus-driven and stakeholder-heavy; behavioral answers should show alignment and empathetic collaboration, not lone-wolf heroics.", "Ethical AI, data privacy, and auditability are first-class at SAP \u2014 bake trust/guardrails into any AI product-sense answer (Neal's 'privacy-first' OpenCV system is a perfect proof point, bb-2).", "Ledger presentation risks: soften the '97% time cut' (near-ceiling, no baseline \u2014 give a before->after) and round '41.7% net margin' to ~42% and label it projected. Never state $145K ARR without the word 'projected'.", "Work authorization is UNCONFIRMED in the ledger and SAP internship postings gate on it \u2014 Neal must supply before applying; don't assume.", "Know the portfolio breadth: don't conflate S/4HANA (ERP), BTP (platform), and Joule (AI) \u2014 mixing them up signals shallow prep. Be able to say one sentence on each of S/4HANA, BTP, Joule, SuccessFactors, Ariba, Concur.", "The reviewed Newtown Square iXp posting is now filled (start date was April 2026) \u2014 treat it as representative of the role type, not a live opening; check jobs.sap.com for current reqs."], "sources": ["https://news.sap.com/2026/04/sap-business-ai-release-highlights-q1-2026/", "https://community.sap.com/t5/technology-blog-posts-by-members/joule-everywhere-breaking-down-sap-s-biggest-ai-announcements-from-sapphire/ba-p/14404234", "https://finoptory.ai/en/resources/blog/sap-business-ai-2026-overview/", "https://ophyai.com/blog/company-guides/sap-interview-guide", "https://www.glassdoor.com/Interview/SAP-Product-Manager-Interview-Questions-EI_IE10471.0,3_KO4,19.htm", "https://www.interviewquery.com/interview-guides/sap-product-manager", "https://jobs.sap.com/content/internships/?locale=en_US", "https://jobs.sap.com/job/Newtown-Square-SAP-iXp-Intern-Product-Management,-Digital-Platforms-&-AI-PA-19073/1373306733/", "https://www.comparably.com/companies/sap/mission", "https://builtin.com/company/sap/faq/leadership-management", "https://erp.today/sap-suite-sweet-spots-how-well-do-you-know-your-sap-suite/", "https://medium.com/@raja.gupta20/understand-complete-sap-ecosystem-and-solutions-portfolio-in-10-minutes-dc2a15960455"]}, {"company": "Dell Technologies", "products": ["Dell / Dell Pro / Dell Pro Max PC lineup (2025 rebrand consolidating Inspiron, Latitude, Precision into simplified Dell / Dell Pro / Dell Pro Max, each in Base/Plus/Premium tiers)", "XPS laptops (iconic premium consumer line revived at CES 2026 with redesigned XPS 14 and XPS 16, teased XPS 13)", "AI PCs / Copilot+ PCs with NPUs (~55% of Dell laptop shipments by early 2026) plus Dell Pro AI Studio developer suite for on-device AI", "Alienware gaming laptops and desktops (16 Area-51, 16X Aurora with anti-glare OLED; new ultra-slim ~17mm and entry-level tiers)", "PowerEdge servers including AI-optimized PowerEdge XE series for NVIDIA/AMD GPU deployment (the enterprise 'AI Factory')", "Dell APEX (multi-cloud, as-a-service / consumption-based infrastructure \u2014 the recurring-revenue platform)", "Dell UltraSharp monitors (e.g. UltraSharp 52 Thunderbolt Hub, world's first 52-inch 6K monitor)"], "valuesAndBar": ["'How We Win' Code of Conduct: win with integrity \u2014 the overarching culture frame", "Customers: customer relationships seen as the ultimate differentiator and foundation for success (Dell is customer-obsessed and direct-to-customer by heritage)", "Winning Together: teamwork over individualism; people perform better, smarter, and have more fun as a team", "Innovation: ability to innovate and cultivate breakthrough thinking as the engine for growth", "Results and Integrity round out the classic Dell values set (deliver measurable outcomes, act ethically)", "PM competency emphasis: market/competitive analysis, customer-input-driven business plans, cross-functional partnership with engineering, roadmap building and product strategy alignment", "Intern bar: identify new growth areas / emerging product opportunities and drive an end-to-end team project with real impact on Dell strategy; passion for business and market intelligence"], "interviewFormat": ["Recruiter / HR screen (~30 min): background, PM experience, understanding of the role", "Hiring-manager phone interview: experience and situational/behavioral questions", "On-site / panel round: behavioral questions assessing leadership and teamwork (Dell explicitly recommends the STAR method)", "Final round: discussion with senior leaders to assess strategic fit", "Typically 3 rounds total; predominantly experience + behavioral; formal product-design/case interviews are NOT standard (candidate reports note 'mostly straightforward experience and behavioral questions, no case interview')", "Known question themes: 'Tell me about a time you went above and beyond for a customer'; 'How do you prioritize across eng team, product bugs, roadmap, and leadership suggestions?'; 'Walk me through the technical architecture of your product'; 'How would you secure resources/funding for your product?'", "Intern program is a team-based end-to-end project with mentors, SMEs, and peer advisors; expect to discuss market/competitive analysis and roadmap thinking"], "productSensePrompts": [{"prompt": "Dell just revived the premium XPS brand at CES 2026 after folding it into 'Dell Premium.' How would you decide whether reviving XPS was the right call, and what metrics would tell you it's working?", "approach": "Clarify the goal (brand equity / premium ASP / share vs. Apple in prosumer). Segment users: creators, students, execs. Argue XPS carries emotional brand equity that the generic 'Dell Premium' label diluted. Define success metrics: premium-tier mix %, ASP, NPS/consideration lift, win-rate vs. MacBook Pro, return rate. Name the tradeoff (naming clarity of the 2025 rebrand vs. lost brand equity) and propose a test: track consideration and premium attach before/after revival. Tie to Dell's Customers value."}, {"prompt": "Design an AI PC feature for the Dell Pro line (Copilot+ / Dell Pro AI Studio) that would make an IT administrator choose Dell over a competitor.", "approach": "Pick the persona (enterprise IT admin, not end user). Identify the pain: deploying, securing, and managing on-device AI models across a fleet. Propose a feature \u2014 e.g., a fleet-wide on-device model management + policy console in Dell Pro AI Studio (which model runs where, data stays local for privacy/compliance). Prioritize with a value-vs-effort lens; North Star could be % of fleet with governed on-device AI or reduction in AI-related support tickets. Explicitly address privacy/data-residency (Dell sells 'AI stays on the device')."}, {"prompt": "Alienware is adding an entry-level gaming laptop tier to reach a broader audience. How do you design it without cannibalizing the flagship Area-51/Aurora lineup or diluting the Alienware brand?", "approach": "State the strategic tension: TAM expansion vs. brand dilution / cannibalization. Segment gamers (aspirational entry buyers vs. enthusiasts). Decide what to keep sacred (design language, thermals, alienFX identity) vs. what to strip (OLED, top GPU). Define guardrail metrics: incremental new-to-brand buyers, flagship attach/upgrade rate, brand-perception surveys. Propose staged rollout and a cannibalization read via cohort analysis. Recommend a good-better-best ladder that creates an upgrade path."}, {"prompt": "Dell APEX moves customers from one-time hardware purchases to a consumption-based subscription. How would you improve adoption of APEX among mid-market enterprises, and how would you measure it?", "approach": "Frame the business shift (recurring revenue, stickiness) and the mid-market buyer's fear: unpredictable consumption billing. Identify friction: procurement habits, forecasting spend, trust. Propose interventions \u2014 usage dashboards with spend predictability, committed-use discounts, a guided migration path. North Star: net revenue retention / % of eligible workloads on APEX; guardrails: churn, gross-margin per account, support load. Tie to Dell's shift to as-a-service and the Customers + Results values."}], "behavioralMapping": [{"value": "Customers (customer relationships as the ultimate differentiator)", "nealStory": "Founded Biryani Blitz off the back of 180 customer interviews and built privacy-first CV telemetry to understand the real impression-to-purchase funnel \u2014 decisions grounded in customer input, mirroring Dell's 'analyze customer input to build business plans.' Reinforce with Elephant's 200+ user interviews driving 17->563 growth.", "factIds": ["bb-1", "bb-2", "ep-1"]}, {"value": "Winning Together (teamwork / cross-functional partnership with engineering)", "nealStory": "At SailLoft, translated developer-workflow pain points into a GitHub testing interface and partnered with the engineering team on a Gerrit+Bazel test product \u2014 classic PM-eng cross-functional collaboration that cut PR-to-merge cycles ~25%.", "factIds": ["sl-1", "sl-2"]}, {"value": "Innovation (breakthrough thinking as the engine for growth)", "nealStory": "Shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities cutting outreach time dramatically, and authored a RAG-based predictive-restocking PRD (FieldPulse) with a 3-flow explainable-AI UX \u2014 AI-native product innovation, directly relevant to Dell's AI PC / Dell Pro AI Studio push.", "factIds": ["bb-3", "fp-1"]}, {"value": "Results (deliver measurable outcomes)", "nealStory": "Scaled Elephant 17->563 active users (33x) in one quarter and shipped an ML flashcard engine lifting exam scores 16% and cutting review time 38% \u2014 quantified, before/after outcomes. Pair with SailLoft's 40% manual-test cut for an execution/results story.", "factIds": ["ep-1", "sl-1"]}, {"value": "Integrity / judgment under constraints (prioritization question)", "nealStory": "As a solo founder-PM at Biryani Blitz, balanced building the platform, CV telemetry, lead-gen agent, and loyalty app with limited resources \u2014 a real prioritization-under-constraint narrative for Dell's 'how do you prioritize across eng, bugs, roadmap, leadership' question. Backed by Wharton/UNC funding shows credible resourcing.", "factIds": ["bb-1", "bb-3", "bb-4"]}, {"value": "Going above and beyond for a customer / above-and-beyond ownership", "nealStory": "For the 'time you went above and beyond for a customer' prompt: the QR loyalty app (React/Firebase) built specifically to reward and retain repeat Biryani Blitz customers, lifting repeat purchases 40% \u2014 a concrete customer-obsession artifact.", "factIds": ["bb-3", "bb-1"]}], "analyticalFocus": ["Market and competitive analysis (sizing new growth areas / emerging product opportunities \u2014 explicitly in the intern JD)", "Product roadmap prioritization tradeoffs across eng bandwidth, bugs, roadmap, and leadership asks", "Business-case / resourcing math: how to justify and secure funding for a product (ROI, unit economics \u2014 Neal has projected ARR/margin practice from Biryani Blitz)", "Recurring-revenue / as-a-service metrics for APEX (net revenue retention, consumption forecasting, gross margin per account)", "PC/hardware funnel and mix metrics: premium-tier attach, ASP, win-rate vs. competitors, return rate, NPS/consideration", "AI PC adoption metrics: Copilot+ attach %, on-device AI usage, fleet governance metrics", "Defining a North Star + guardrail metrics for a feature (Neal's FieldPulse PRD defined 15+ KPIs with a North Star \u2014 good to reference)"], "gotchas": ["Dell is enterprise + hardware first, NOT a pure consumer software shop \u2014 do not walk in expecting a Google/Meta-style rigorous product-design case gauntlet. Reports say the loop is behavioral/experience-heavy with often NO formal case. Prepare STAR stories more than whiteboard designs.", "Know the 2025 rebrand nuance: Inspiron->Dell, XPS->Dell Premium, Latitude->Dell Pro, Precision->Dell Pro Max (Base/Plus/Premium tiers). BUT XPS was revived as a standalone premium brand at CES 2026 \u2014 if you cite the rebrand, acknowledge the XPS reversal or you'll sound out of date.", "Dell's strategic center of gravity in 2026 is the 'AI Factory' (PowerEdge XE AI servers for NVIDIA/AMD GPUs) and AI PCs \u2014 show you understand Dell is monetizing the AI buildout at both enterprise and endpoint, not just selling laptops.", "Use STAR explicitly \u2014 Dell recruiters literally recommend it; a rambling non-STAR answer reads as unprepared.", "Be ready to 'walk through the technical architecture of your product' \u2014 lean on CS degree + real stacks (OpenCV CV pipeline, Node/Playwright/Gemini agent, React/Firebase, RAG). Do not overclaim beyond the ledger.", "Confirm graduation timing fit: program targets grads Dec 2026 / May 2027 (and MBA/upper-division tracks). Neal graduates May 2028 \u2014 verify he's eligible for the specific req before over-investing; the undergrad PM intern posting may accept earlier class years, but this is a knockout to check.", "Ledger phrasing risks: soften Biryani Blitz's 41.7% net margin to ~42% (projected) and the 97% outreach-time cut to a before/after; label projections as projected. Neal's grad year (May 2028) and work authorization are unconfirmed knockout fields \u2014 verify before applying.", "Don't invent Dell-specific product experience \u2014 Neal has none; frame product-sense answers as structured thinking about Dell's real products, and keep behavioral answers strictly to ledger facts."], "sources": ["https://jobs.dell.com/en/internships", "https://jobs.dell.com/en/job/austin/undergraduate-product-management-intern/375/86214317776", "https://www.interviewquery.com/interview-guides/dell-product-manager", "https://www.tryexponent.com/questions?company=dell&role=pm", "https://www.glassdoor.com/Interview/Dell-Technologies-Product-Manager-Interview-Questions-EI_IE1327.0,17_KO18,33.htm", "https://i.dell.com/sites/csdocuments/Corporate_corp-Comm_Documents/en/Dell-Code-of-Conduct-External.pdf", "https://www.dell.com/en-us/lp/dt/code-of-conduct", "https://www.dell.com/en-us/dt/corporate/newsroom/announcements/detailpage.press-releases~usa~2026~1~dell-technologies-at-ces-2026.htm", "https://www.dell.com/en-us/blog/dell-transforms-ai-pc-portfolio-for-anywhere-productivity/", "https://www.dell.com/en-us/dt/corporate/newsroom/announcements/detailpage.press-releases~usa~2025~01~dell-technologies-leads-ai-pc-movement-with-new-redesigned-pc-portfolio.htm", "https://www.microcenter.com/site/mc-news/article/dell-new-names-at-ces-2025.aspx", "https://markets.financialcontent.com/stocks/article/finterra-2026-3-10-the-ai-factory-a-deep-dive-into-dell-technologies-dell-in-2026"]}, {"company": "HP Inc.", "products": ["OmniBook Ultra (premium consumer AI PC laptops; replaced the retired Spectre line as of July 2025)", "EliteBook / ProBook / EliteDesk commercial PC lines \u2014 including the EliteBook 6 G2q 'Next Gen AI PC' (Snapdragon, up to 85 TOPS NPU, ~28h battery) announced at HP Imagine 2026", "HP IQ \u2014 on-device AI software layer built on a ~20B-parameter local model (early access Spring 2026)", "HP Instant Ink \u2014 ink/toner subscription service (recurring-revenue consumer subscription; a classic PM improvement prompt)", "Poly \u2014 video conferencing, cameras, headsets & meeting-room software (workforce solutions; Poly Camera Pro conferencing built into new PCs)", "OMEN / HyperX \u2014 gaming laptops, desktops (OMEN MAX 45L) and gaming peripherals", "HP Wolf Security \u2014 endpoint/PC and printer security (Wolf Pro Security NGAV, TPM Guard, Wolf Connect)", "Printing / Print business \u2014 home, office, LaserJet, plus 3D printing & industrial/digital press", "Workforce Solutions & managed services (device-as-a-service, fleet management)"], "valuesAndBar": ["Mission framing: 'create technology that makes life better for everyone, everywhere' / 'engineer experiences that amaze' \u2014 lead any product answer with the human/customer outcome, not the spec", "Corporate Objectives (HP's foundational values): Customer loyalty, Profit, Growth, Market leadership, Commitment to employees, Leadership capability, Global citizenship \u2014 customer loyalty is listed first", "Sustainability & 'most sustainable and just technology company' \u2014 decarbonization, circular materials, responsible sourcing, digital equity (a genuine HP differentiator; weave into product tradeoffs)", "Integrity, inclusion, and data stewardship / privacy \u2014 reinforced by the on-device (privacy-first) AI positioning of HP IQ and NPU processing", "Strategic themes to echo: 'enable people's best work in more places' (hybrid work), on-device/local AI for privacy, recurring-revenue subscriptions & services (Instant Ink, DaaS), and hardware+software+services ecosystem", "PM competency bar (per interview guides): product intuition/sense, data & analytical rigor, technical fluency to earn engineering trust, and cross-functional collaboration across Design/Marketing/Engineering"], "interviewFormat": ["Reported full loop is long (interview guides describe up to ~8 stages): (1) resume screen, (2) recruiter phone screen ~30 min, (3) product sense ~60 min, (4) analytical/metrics ~45-60 min, (5) technical fluency ~45-60 min, (6) hiring manager behavioral ~60 min, (7) cross-functional/collaboration ~45 min, (8) HR/offer ~30 min", "Glassdoor candidate reports for IC/PM roles are more compressed: typically 2-4 interviews \u2014 e.g. HR screen -> product/UX-UX building question -> hiring manager on product strategy -> cross-functional PM-skills round", "Difficulty rated ~3.1/5 on Glassdoor; ~76% positive experience; average ~22 days to hire \u2014 moderate, not a brutal FAANG-style bar", "Expect a strong cross-functional/collaboration round (Design + Marketing + Engineering) \u2014 HP is a hardware+software+services company, so stakeholder alignment across HW/SW/supply chain matters", "For an intern/APM specifically, expect fewer rounds and heavier weight on behavioral + product sense + a light analytical/market-sizing component rather than deep technical system design"], "productSensePrompts": [{"prompt": "How would you improve HP Instant Ink (the ink/toner subscription)?", "approach": "Clarify goal (reduce churn vs grow ARPU vs acquisition). Segment users: home/casual, home-office prosumer, SMB. Map the funnel: printer purchase -> enrollment -> first over/under-print -> renewal/churn. Root pain points: page-count anxiety, cost vs a cartridge, forgetting cancellation, running out mid-job. Propose 1-2 features tied to HP values: e.g. an ML page-usage predictor that auto-recommends the right plan (reduces bill-shock churn) and a sustainability angle (cartridge recycling / carbon savings dashboard \u2014 ties to HP's circular-materials value). North Star: subscriber retention / net revenue retention; guardrails: enrollment-to-90-day-retention, cancellation rate, support tickets. This directly mirrors a listed HP sample question."}, {"prompt": "Design an AI feature for an HP AI PC (OmniBook / EliteBook) using the on-device NPU (HP IQ, ~20B local model).", "approach": "Anchor on HP's stated edge: on-device = privacy-first, low-latency, offline-capable (contrast vs cloud AI). Pick a user (hybrid knowledge worker) and a job-to-be-done (staying focused / managing meeting overload). Feature idea: a local AI meeting assistant that transcribes + summarizes + drafts follow-ups fully on-device using the NPU and Poly Camera Pro \u2014 no data leaves the laptop (privacy value + Poly ecosystem tie-in). Discuss tradeoffs: NPU compute/battery budget, model size limits vs cloud, accuracy. Metrics: feature adoption, meetings summarized/week, retention, and a trust/privacy proxy. Explicitly named as an HP sample prompt ('Design an AI-powered feature for HP PCs')."}, {"prompt": "Design a feature (or improve the experience) for Poly video conferencing / meeting rooms for the hybrid-work era.", "approach": "Frame around HP's 'best work in more places' theme and the pain of hybrid meetings: remote attendees feel like second-class participants. Propose AI director/auto-framing that gives every remote person an equal 'seat at the table' + speaker-attributed live captions. Prioritize with a RICE-style lens; call out the HW+SW integration (camera + on-device AI + Teams/Zoom). Metrics: meeting-satisfaction/NPS for remote attendees, % rooms with feature enabled, talk-time equity. Shows you understand HP's Poly acquisition and workforce-solutions strategy."}, {"prompt": "HP wants to grow a subscription/services business (Instant Ink, device-as-a-service). Should HP launch a consumer subscription bundle across PC + print + security, and how would you decide what goes in it?", "approach": "This tests business/strategy sense (ties to the 'build a business case' sample question). Start with the strategic why: HP is shifting toward recurring revenue and higher-margin services. Define the target segment (prosumer / small business). Evaluate what to bundle by customer value + margin + stickiness: hardware refresh + Instant Ink + Wolf Security + support. Model unit economics simply (ARPU, expected lifetime, CAC payback), name risks (cannibalization, bundle complexity, churn), and propose a small pilot with a clear success metric (attach rate, LTV lift, churn). Close with the market-leadership + customer-loyalty values."}], "behavioralMapping": [{"value": "Customer loyalty / deep customer research (HP's first-listed value)", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and used that research to scale the app from 17 to 563 active users (33x) in one quarter \u2014 a direct 'explain your customer research approach' and 'product you launched and its impact' answer.", "factIds": ["ep-1", "ep-role"]}, {"value": "Product launch & measurable impact (0->1 execution)", "nealStory": "Founded Biryani Blitz: launched a 0->1 hot-food vending platform at UC Berkeley off 180 customer interviews, with projected ~$145K ARR/machine \u2014 shows end-to-end ownership from research to shipped product with a business case (mirrors 'describe a product you launched' and 'build a business case').", "factIds": ["bb-1", "bb-role"]}, {"value": "Influencing engineering / earning technical trust", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit+Bazel software-test product, cutting manual tests 40%, and translated developer pain points into a GitHub testing interface that sped PR-to-merge ~25% \u2014 a strong 'tell me about influencing engineering decisions' story showing technical fluency HP's technical round probes.", "factIds": ["sl-1", "sl-2"]}, {"value": "Data / analytics-driven product decisions", "nealStory": "Built a privacy-first OpenCV computer-vision telemetry system tracking the impression->approach->purchase funnel, giving a physical vending machine e-commerce-grade conversion analytics \u2014 shows metrics instrumentation and the privacy-first ethos that maps to HP's on-device AI story.", "factIds": ["bb-2"]}, {"value": "Cross-functional collaboration / stakeholder alignment (HP has a dedicated cross-functional round)", "nealStory": "As Director of Professional Development for the UNC PM Club and President of UNC Ultimate Frisbee, and shipping a QR loyalty app (React/Firebase) that lifted repeat purchases 40% at Biryani Blitz, Neal has coordinated across contributors and stakeholders to ship outcomes \u2014 use for 'aligned conflicting stakeholder priorities.'", "factIds": ["ld-1", "ld-2", "bb-3"]}, {"value": "AI-native product thinking (fits HP IQ / AI PC direction)", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time dramatically, and authored the FieldPulse PRD for a RAG-based AI predictive-restocking feature with a 3-flow explainable UX and 15+ KPIs (First-Time Fix Rate as North Star) \u2014 shows AI PM depth and metric definition rigor.", "factIds": ["bb-3", "fp-1"]}, {"value": "Handling failure / learning (common closing behavioral)", "nealStory": "Use a scoped, honest learning from a real venture (e.g. an early Biryani Blitz assumption invalidated by the 180 interviews, or an Elephant feature that didn't move the metric) \u2014 draw only from bb-1/ep-1 experiences; do NOT invent a failure. Frame the pivot and what changed downstream.", "factIds": ["bb-1", "ep-1"]}], "analyticalFocus": ["Subscription/recurring-revenue metrics: churn, net revenue retention, ARPU, enrollment-to-retention rate, CAC payback, LTV (Instant Ink, DaaS bundles)", "Feature adoption & engagement metrics for AI PC features (adoption rate, weekly active usage of an AI feature, retention lift, a trust/privacy proxy)", "Market sizing / TAM estimation (e.g. size the AI-PC or hybrid-conferencing market; global expansion country prioritization \u2014 a real HP sample prompt)", "Hardware+services unit economics and attach rate (device + ink/security/support attach, margin per unit vs recurring margin)", "Funnel analysis (Neal's OpenCV impression->approach->purchase funnel is a strong parallel to any acquisition/conversion funnel question)", "Defining a North Star + guardrail metrics for a proposed feature (Neal's FieldPulse PRD did exactly this \u2014 First-Time Fix Rate as North Star, 15+ KPIs)"], "gotchas": ["Do NOT confuse HP Inc. (HPQ \u2014 PCs, printers, Poly, consumer/commercial hardware, the subject here) with Hewlett Packard Enterprise (HPE \u2014 servers, cloud, enterprise infrastructure). They split in 2015 and are different companies with different interviews. Many search results mix them.", "The Spectre laptop brand was RETIRED (~July 2025) and folded into OmniBook Ultra \u2014 do not cite Spectre as a current flagship; use OmniBook Ultra / EliteBook.", "HP is fundamentally a hardware + services company, not a pure-software shop \u2014 product-sense answers should respect hardware constraints (NPU compute, battery, supply chain, BOM cost, refresh cycles), not treat everything as a shippable web feature.", "Sustainability/circular-materials is a real, load-bearing HP value (they aim to be 'the most sustainable and just technology company') \u2014 genuinely weaving it into a tradeoff scores points; ignoring it misses HP's identity.", "Neal's numbers carry ledger presentationNotes: soften over-precise/near-ceiling metrics \u2014 say ~42% net margin (not 41.7%) and 'projected' for the $145K ARR (bb-1); give a before->after or soften the 97% outreach-time cut (bb-3). Never present these as guaranteed actuals.", "Work authorization is UNCONFIRMED in the ledger \u2014 HP intern applications will have knockout eligibility fields; Neal must confirm status himself. Do not assume.", "Interview length varies widely by source (guides say up to 8 stages; Glassdoor says 2-4). For an intern/APM req, prepare for the compressed version but be ready for a heavier cross-functional/behavioral emphasis.", "The APM/intern loop is less product-sense-heavy than Google's; expect more emphasis on collaboration, business/strategy (global expansion, business case), and genuine interest in HP's hardware+print+AI portfolio."], "sources": ["https://www.hp.com/us-en/newsroom/press-releases/2026/hp-enables-best-work-in-more-places.html", "https://www.hp.com/us-en/newsroom/press-releases/2025/future-of-work.html", "https://www.hp.com/in-en/shop/tech-takes/post/why-hp-transformed-spectre-into-omnibook-u", "https://en.wikipedia.org/wiki/HP_Spectre", "https://www.hp.com/us-en/printers/instant-ink.html", "https://www.hp.com/us-en/newsroom/press-releases/2026/hp-reimagines-future-of-work.html", "https://www.cleverprep.com/companies/hp/product-manager", "https://www.glassdoor.com/Interview/HP-Inc-Product-Manager-Interview-Questions-EI_IE1093161.0,6_KO7,22.htm", "https://www.comparably.com/companies/hp/mission", "https://www.dcfmodeling.com/blogs/vision/hpq-mission-vision", "https://prepfully.com/interview-questions/hewlett-packard/product-manager"]}, {"company": "Datadog", "products": ["Infrastructure Monitoring (core platform)", "APM & Distributed Tracing", "Log Management", "Cloud Security (CSPM, Cloud SIEM, Code Security, Workload Protection) \u2014 surpassed $100M ARR in 2025", "Digital Experience: Real User Monitoring (RUM), Session Replay, Synthetic Monitoring, Product Analytics", "Software Delivery: CI Visibility, Test Optimization, Feature Flags (launched Feb 2026), Code Coverage", "Service Management: Incident Response, On-Call, Software Catalog, SLOs, Case Management", "Bits AI suite: Bits AI SRE Agent, Bits Security Analyst, Bits Investigation, Bits Agent Builder", "LLM/AI Observability: Agent Observability, GPU Monitoring (AI-workload visibility)", "Platform: Dashboards, Alerts/Monitors, Workflow Automation, App Builder, 900+ integrations"], "valuesAndBar": ["Official core values: Be open, Be pragmatic, Be honest", "Low-ego / 'no jerks' culture \u2014 leave your ego at the door; the best idea wins regardless of rank", "Pragmatism: solve the problem at hand efficiently; make deliberate trade-offs and explain them (over-engineering is as much a red flag as under-engineering)", "Extreme ownership & accountability \u2014 teams own projects end to end", "Humility + continuous learning; strong blameless post-mortem / learn-from-incidents culture", "Customer focus: deep empathy for developers, IT ops, and security engineers as the users", "Technical fluency is non-negotiable for PMs \u2014 must 'walk the walk' with engineers, understand architecture/APIs/cloud infra, be comfortable with SQL and observability concepts", "Developer experience (DX) focus over UI aesthetics; B2B value creation over consumer vanity metrics", "Collaboration and cross-functional influence without formal authority"], "interviewFormat": ["Typical timeline: 3-5 weeks, ~4-6 stages (varies by role/team; at least one step expected in person per Datadog careers)", "Stage 1 \u2014 Recruiter screen: logistics, background, high-level fit", "Stage 2 \u2014 Hiring Manager screen: background + product philosophy discussion", "Stage 3 \u2014 Onsite (usually virtual): back-to-back rounds covering Product Case Study, Technical/System Design, Analytical/Metrics, and Values/Collaboration", "Stage 4 \u2014 Technical interview (distinctive to Datadog): explain the architecture of a product you managed, or whiteboard a system design (e.g. 'design a monitoring system for a high-traffic e-commerce site', data flow, DB choice, bottlenecks)", "Optional take-home/case study: feature prioritization + roadmap development", "Final hiring-manager / executive round: team fit and success potential", "Note: Datadog has explicit rules restricting AI use during interviews \u2014 expect authentic, live problem-solving"], "productSensePrompts": [{"prompt": "Design a feature for Datadog that helps developers debug a production incident faster.", "approach": "Clarify the user (on-call SRE vs. app dev) and the moment of pain (2am page, unclear root cause). Anchor on Datadog's actual assets: correlated traces + logs + metrics already in one platform. Propose a concrete feature (e.g. an AI-suggested root-cause timeline that stitches the failing trace to the deploy/feature-flag change and the offending log line \u2014 leaning into Bits Investigation direction). Prioritize by time-to-resolution impact. North-star metric: Mean Time To Resolution (MTTR); guardrails: false-positive suggestion rate, alert fatigue. Show DX empathy (works from the alert, not a new dashboard) and pragmatism (ship the correlation before the full autonomous agent)."}, {"prompt": "Datadog is expanding into AI/LLM observability. How would you design a product to monitor a customer's LLM-powered application or AI agents?", "approach": "Frame the user problem: teams shipping LLM apps have no visibility into cost, latency, quality/hallucination, and safety. Define what to observe \u2014 per-request token cost, latency, prompt/response traces, eval scores, PII/safety violations, agent tool-call chains. Tie back to Datadog's existing trace model (an LLM call as a span). Prioritize cost + latency + a quality signal for v1. Metrics: cost-per-request, p95 latency, eval pass rate, adoption of the LLM Observability product among existing APM customers. Call out the trade-off of building evals in-house vs. integrating. This directly maps to Datadog's stated 2026 strategy (Agent Observability, GPU monitoring, Bits AI)."}, {"prompt": "How would you improve Datadog's dashboards / alerting to reduce alert fatigue?", "approach": "Start from the customer pain: too many low-signal alerts erode trust and cause missed real incidents. Segment users (platform team setting alerts vs. on-call receiving them). Define the problem quantitatively \u2014 signal-to-noise ratio, % alerts actioned, % auto-resolved. Propose solutions ranging from smarter defaults / anomaly-based thresholds to alert grouping/deduplication and a 'muted noisy monitor' feedback loop. Pick one for v1 using pragmatism (grouping is high-leverage and low-risk). Success metric: reduction in alerts-per-incident while holding or improving detection recall; guardrail: no increase in missed incidents."}, {"prompt": "Datadog is primarily a bottoms-up developer-adopted B2B product. How would you increase adoption/expansion within an existing enterprise customer (land-and-expand)?", "approach": "Diagnose the funnel: one team adopted APM, but Logs/Security/RUM are unused. Identify friction (cost visibility, config effort, unclear cross-product value). Propose in-product growth loops: surface 'you're already sending logs \u2014 turn on Log Management' nudges from existing telemetry, usage-based trials, a value/cost dashboard for the buyer. Distinguish developer-user metrics (products enabled per team, DAU of dashboards) from buyer/revenue metrics (net revenue retention, products-per-account, ARR expansion). Emphasize B2B success metrics beyond DAU \u2014 exactly the analytical angle Datadog probes. Trade-off: aggressive nudges vs. developer trust."}], "behavioralMapping": [{"value": "Be pragmatic \u2014 deliberate trade-offs, ship efficiently over the perfect solution", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel execution) that cut manual tests 40%. Frame the trade-off: chose auto-voting on Gerrit inside the existing developer workflow rather than building a separate standalone dashboard, to ship value fast where developers already worked.", "factIds": ["sl-role", "sl-1"]}, {"value": "Technical fluency / earn engineering respect through competence (walk the walk with engineers)", "nealStory": "At Biryani Blitz, personally built a privacy-first computer-vision telemetry system (OpenCV) tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics \u2014 a PM who ships production code and designs the data pipeline, not just specs.", "factIds": ["bb-role", "bb-2"]}, {"value": "Customer focus / be the customer's advocate", "nealStory": "Founded Biryani Blitz only after 180 customer interviews, and at Elephant Productivity ran 200+ user interviews to scale the app 17->563 active users (33x) in one quarter \u2014 demonstrates grounding product decisions in direct user research (500+ interviews across ventures).", "factIds": ["bb-1", "ep-1", "ep-role"]}, {"value": "Data-driven / defining meaningful B2B (non-vanity) success metrics", "nealStory": "In the FieldPulse Predictive Restocking PRD, defined 15+ KPIs with First-Time Fix Rate as the North Star (an operational outcome metric, not DAU) for an AI/RAG feature \u2014 shows ability to pick enterprise outcome metrics over vanity metrics. Reinforce with the ML flashcard engine at Elephant that lifted exam scores 16% and cut review time 38%.", "factIds": ["fp-1", "ep-1"]}, {"value": "Extreme ownership / cross-functional influence without authority", "nealStory": "As Founder & AI Product Manager at Biryani Blitz, owned a 0->1 hot-food vending platform end to end (deployed at UC Berkeley, projected ~$145K ARR/machine) and shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time ~97% \u2014 ownership from problem discovery through shipped, measured outcomes.", "factIds": ["bb-role", "bb-1", "bb-3"]}, {"value": "Be open / humility, learning, collaboration (low-ego culture)", "nealStory": "As UNC Product Management Club Director of Professional Development and President of UNC Ultimate Frisbee (BatCH), plus a Bridge to BCG invitee (~10% acceptance) \u2014 use these for a 'time you led/collaborated and incorporated others' feedback' or 'handled a setback and learned' prompt. Pair with the iterative user-interview loops at Elephant/Biryani Blitz as evidence of learning-driven iteration.", "factIds": ["ld-1", "ld-2", "ld-3", "ep-1"]}], "analyticalFocus": ["B2B success metrics beyond consumer vanity metrics (avoid DAU/MAU-first answers; prefer NRR, products-per-account, MTTR, adoption per team)", "Metric definition for developer/observability tools: MTTR, alert signal-to-noise, false-positive rate, detection recall, ingestion volume/cost", "System-design-adjacent estimation: data flow, throughput, storage/retention trade-offs for high-cardinality telemetry", "Trade-off framing and prioritization (RICE-style) with explicit guardrail metrics", "SQL comfort and reasoning over usage/telemetry data", "Land-and-expand / usage-based-pricing economics for bottoms-up SaaS", "Cost as a first-class metric (cost-per-request, cost-per-GB ingested) \u2014 a real Datadog customer concern"], "gotchas": ["Datadog PM interviews are unusually technical \u2014 expect to explain a system architecture or whiteboard a design. Neal should prep to draw the Biryani Blitz OpenCV telemetry pipeline (bb-2) and the SailLoft Gerrit/Bazel CI system (sl-1) as his 'architecture I owned' examples.", "Do NOT default to consumer metrics (DAU/MAU/engagement). Datadog is B2B/developer tooling \u2014 lead with operational and revenue-retention metrics.", "Design answers must show DX empathy (developers as users) over UI polish; talk about the on-call/debugging workflow, not pretty screens.", "Values screen is real: demonstrate low-ego, pragmatism, and honesty. Avoid claiming a 'perfect' solution \u2014 show the trade-off you deliberately made (e.g. sl-1 auto-voting vs. separate dashboard) but only assert that trade-off if Neal can confirm it was true.", "Explicit no-AI-during-interview policy \u2014 practice answering live and out loud, no tool assistance.", "Anti-hallucination: only the ledger metrics are approved. Soften over-precise figures in delivery \u2014 say '~42% projected net margin' not 41.7% (bb-1), and give a before->after for the ~97% outreach-time cut rather than the bare percentage (bb-3).", "Know Datadog's 2026 AI story (Bits AI agents, LLM/Agent Observability) \u2014 showing awareness that observability is expanding into AI monitoring signals genuine research and fits the low-ego 'curious candidate' bar.", "Neal's work authorization is unconfirmed in the ledger (identity note) \u2014 he should have a clear answer ready for the recruiter screen knockout question."], "sources": ["https://www.interviewquery.com/interview-guides/datadog-product-manager", "https://www.joinleland.com/library/a/datadog-product-manager-interview", "https://dataford.io/interview-guides/datadog/product-manager", "https://careers.datadoghq.com/candidate-experience/", "https://www.datadoghq.com/about/latest-news/press-releases/datadog-announces-dash-2026-ai-and-observability-event/", "https://www.datadoghq.com/about/latest-news/press-releases/datadog-launches-feature-flags/", "https://builtin.com/company/datadog/faq/culture-values", "https://alignwithme.com/culture/datadog", "https://dataford.io/interview-guides/datadog/software-engineer", "https://www.useluminix.com/reports/company-overviews/datadog-company-overview-observability-platform-financials-and-competitive-position-2026/source/1"]}, {"company": "CrowdStrike", "products": ["Falcon platform \u2014 the unified, AI-native, single-sensor 'Agentic Security Platform' (one lightweight sensor feeds telemetry across endpoint, identity, cloud, SaaS, and AI protection)", "Falcon Prevent \u2014 next-gen antivirus (NGAV) endpoint prevention", "Falcon Insight XDR \u2014 endpoint/extended detection & response (EDR/XDR)", "Falcon Identity Protection \u2014 identity threat detection & response (ITDR)", "Falcon Cloud Security (CNAPP) \u2014 code-to-cloud: workload protection + posture management (CSPM) across AWS/Azure/GCP + containers", "Falcon Next-Gen SIEM \u2014 index-free, petabyte-scale log analytics/SIEM (150x faster search; now ingests 3rd-party EDR like Microsoft Defender)", "Charlotte AI \u2014 agentic GenAI analyst; Fall 2025 'agentic SOC' with 7 mission-ready agents (triage, investigation/Agentic Response) + Charlotte Agentic SOAR + AgentWorks agent-builder", "Falcon Exposure Management \u2014 vulnerability/attack-surface prioritization (AI Exposure Prioritization Agent, contextual risk scoring)", "Falcon Fusion SOAR \u2014 native security orchestration, automation & response", "Falcon Complete Next-Gen MDR \u2014 fully managed detection & response service", "Threat Intelligence & Counter Adversary Operations (adversary tracking/hunting)", "Packaging: Falcon Go / Falcon Pro / Falcon Enterprise bundles; Falcon Flex modular licensing"], "valuesAndBar": ["Mission-first: 'We Stop Breaches' \u2014 every product decision and hire ties back to stopping breaches; expect candidates to connect their work to this mission", "'One Team, One Fight' \u2014 heavy emphasis on cross-functional collaboration (eng leads, product marketing, senior mgmt all interview PMs)", "Fanatical / relentless customer focus \u2014 customer obsession is a stated core value", "Think Big, Innovate, and Disrupt \u2014 bias toward bold, AI-native innovation (they reframed the whole platform as 'agentic' in 2025)", "Integrity & Accountability \u2014 own outcomes; results orientation", "Limitless Passion drives Unlimited Potential \u2014 high-ownership, startup-vibe-with-corporate-resources culture; remote-first", "Domain currency: PMs are expected to stay current on the cybersecurity threat landscape and articulate how trends affect CrowdStrike's products"], "interviewFormat": ["~3-4 rounds total; typical response within 1-2 weeks (per Glassdoor/Comparably aggregates)", "Round 1: Recruiter phone screen \u2014 background, motivation, culture/mission fit ('why CrowdStrike', 'why cybersecurity')", "Round 2: Technical / case round \u2014 may include a case study or system-design / mental-model questions relevant to PM; technical roles get a technical assessment", "Take-home / strategic round: present a take-home assignment or product strategy and defend design choices (product vision + market-trend understanding)", "Panel round(s): multiple stakeholders \u2014 engineering leads, product marketing, senior management \u2014 mixing behavioral + situational (collaboration, leadership, PM approach)", "Behavioral throughout, evaluated against CrowdStrike core values using STAR; prioritization frameworks like RICE expected for case/product-sense answers", "NOTE: aggregators describe the general PM/PgM funnel; no CrowdStrike-published APM-intern-specific loop was found \u2014 treat exact APM-intern rounds as unconfirmed"], "productSensePrompts": [{"prompt": "Charlotte AI now auto-triages security alerts and can drive investigations autonomously (under analyst command). How would you design the analyst-facing experience so SOC analysts trust and adopt an AI agent that acts on their behalf?", "approach": "Clarify user (Tier-1 vs senior SOC analyst) and the core tension: automation speed vs. trust/liability in a domain where a wrong call = a missed breach. Frame around trust-building: explainability (show why Charlotte flagged/dismissed an alert), human-in-the-loop gating for high-severity actions, confidence scores, easy override + feedback loop that retrains. North Star = analyst-verified true-positive resolution time; guardrail metrics = false-negative rate (missed breaches) and override rate. Prioritize with RICE. Tie to 'always under analyst command' and 'We Stop Breaches' \u2014 never trade breach risk for speed."}, {"prompt": "Falcon Go targets small businesses at ~$60/device/year, while CrowdStrike is historically enterprise. Design the onboarding for a 10-person business with no security team.", "approach": "State the segment gap: SMB owner is non-technical, price-sensitive, no SOC. Goal = time-to-first-value and 'set-and-forget' safety. Map the journey: signup -> sensor deploy across a few laptops -> sane secure defaults (no tuning) -> plain-language 'you're protected / here's what we blocked' dashboard -> alert only when action truly needed. Prioritize self-serve + automated remediation over configurability. Metrics: activation (sensors deployed), time-to-first-protection, alert-noise ratio, retention/renewal. Gotcha to raise: enterprise-grade alerting would overwhelm SMBs \u2014 the design must suppress noise, which contrasts with the enterprise product."}, {"prompt": "CrowdStrike's moat is one lightweight single sensor feeding all modules. A PM proposes a new module needing a heavier agent. How do you evaluate the tradeoff?", "approach": "Anchor on the platform thesis: single-agent/low-footprint is a core differentiator (customer-perceived performance + deployment simplicity). Evaluate incremental CPU/memory/battery cost vs. incremental breach-prevention value; segment by customer (endpoint-count, device type). Consider alternatives: cloud-side processing, sampling, opt-in for high-value customers. Decision framework: does it degrade the shared-telemetry flywheel or the 'it just runs' promise? Metrics: sensor resource footprint (P95), customer-reported performance complaints, attach rate of the new module. Recommend a gated rollout with a footprint budget."}, {"prompt": "Define the North Star metric and top 3 supporting metrics for the Falcon EDR (Insight XDR) product.", "approach": "Reject vanity metrics (alerts generated) \u2014 in security, the mission is stopping breaches, so tie NSM to prevented/contained incidents. Propose NSM = mean time to detect-and-respond (MTTD+MTTR) on true threats, or breaches prevented per protected endpoint. Supporting: detection coverage (MITRE ATT&CK technique coverage), false-positive rate (analyst trust/noise), and automated-containment rate. Discuss the fundamental security tension: minimizing false negatives (missed attacks) vs false positives (alert fatigue). Note the measurement problem \u2014 you can't easily count breaches that didn't happen \u2014 so use proxy + red-team validation."}], "behavioralMapping": [{"value": "We Stop Breaches / builds security & trust into products", "nealStory": "At Biryani Blitz, built a PRIVACY-FIRST computer-vision telemetry system (OpenCV) that tracked the impression->approach->purchase funnel without capturing identifiable data \u2014 shows instinct to design for trust/privacy, adjacent to a security mindset.", "factIds": ["bb-2", "bb-role"]}, {"value": "Relentless / Fanatical Customer Focus", "nealStory": "Founded Biryani Blitz only after 180 customer interviews, and scaled Elephant from 17->563 users (33x) in one quarter driven by 200+ user interviews \u2014 deep, repeated customer-obsession translating research into shipped product.", "factIds": ["bb-1", "ep-1"]}, {"value": "Think Big, Innovate & Disrupt (AI-native)", "nealStory": "Shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities cutting outreach time dramatically, and authored the FieldPulse RAG predictive-restocking PRD \u2014 mirrors CrowdStrike's 2025 agentic/AI-native pivot.", "factIds": ["bb-3", "fp-1"]}, {"value": "One Team, One Fight (cross-functional collaboration)", "nealStory": "At SailLoft, translated developer-workflow pain points into a Gerrit/Bazel test product and a GitHub testing interface \u2014 required aligning with engineers on their workflow, exactly the eng-PM collaboration CrowdStrike's panel tests.", "factIds": ["sl-1", "sl-2", "sl-role"]}, {"value": "Integrity & Accountability / results orientation", "nealStory": "Led 0->1 launch of an internal Gerrit-based test product cutting manual tests 40%, and accelerated PR-to-merge cycles ~25% via a GitHub interface \u2014 owned measurable outcomes end to end.", "factIds": ["sl-1", "sl-2"]}, {"value": "Limitless Passion / high ow
