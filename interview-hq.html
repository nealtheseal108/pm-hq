d, cashback & rewards", "PayPal Ads (retail-media / advertising business)", "Paidy (Japan BNPL) \u2014 note: reportedly under strategic review"], "valuesAndBar": ["Three codified leadership principles (2023, reinforced by the BOLD framework): (1) Put People First, (2) Work Customer Back, (3) Win Together", "'Work Customer Back' = customer-obsession: solve customers' greatest needs, innovate through uncertainty, act quickly with purpose \u2014 expect product-sense answers to START from a real user problem, not a feature", "'Win Together' = take ownership, drive joint success, execute with excellence \u2014 behavioral prompts on cross-functional collaboration and shipping", "'Put People First' = build trust, foster belonging, raise the standard \u2014 behavioral prompts on leadership/mentorship/inclusion", "Company culture values: Inclusion, Innovation, Collaboration, Wellness", "PM bar for interns: structured product thinking under ambiguity, data-driven decisions (KPIs, A/B tests, funnels), and clear tradeoff articulation between UX and technical/fraud/regulatory constraints", "Fintech-specific bar: comfort reasoning about trust, security, fraud, chargebacks/disputes, and regulatory constraints as first-class product considerations"], "interviewFormat": ["Round 1 \u2014 Recruiter phone screen (~45 min): background, career goals, motivation/fit, logistics (work authorization likely a knockout field)", "Round 2 \u2014 Hiring manager phone screen (~50 min): behavioral + core PM skills, STAR-format past-experience deep dive", "Round 3 \u2014 On-site / virtual loop: typically 4-6 interviews (~45-50 min each) with engineers, product partners, a data/analytics interviewer, and a hiring manager", "Loop composition: (a) Product Design / Product Sense, (b) Product Metrics & Analytical Thinking (KPIs, A/B testing, funnel analysis, estimation), (c) Behavioral / Past-Experience (STAR), sometimes (d) light technical/whiteboard for technical-PM tracks", "Product Sense round expects analyzing user needs, finding friction, and designing for areas like checkout, onboarding, merchant tools, or dispute workflows", "Total timeline typically ~1-2 weeks from shortlist to loop, sometimes longer"], "productSensePrompts": [{"prompt": "Compare the PayPal app checkout experience to Venmo. Pick one and improve it. (A documented PayPal PM question.)", "approach": "Clarify scope (consumer P2P vs. checkout) and pick Venmo for its social/consumer stickiness. Segment users (frequent social senders vs. occasional bill-splitters vs. merchant-pay users). Identify the friction: PayPal feels transactional/utilitarian while Venmo is social but under-monetized. Prioritize 2-3 improvements tied to a user problem (e.g., faster group-bill-splitting, or nudging Pay-with-Venmo at merchant checkout). Define a North Star (e.g., monthly active payers) plus guardrails (fraud rate, complaint rate). Close with the tradeoff you chose and how you'd A/B test it. Neal can lean on his 500+ interviews habit (ep-1, bb-1) to ground every claim in a real user need \u2014 the 'Work Customer Back' principle."}, {"prompt": "Venmo is seeing a decrease in users adding their bank accounts. Why might this be happening, and what would you do? (A documented Venmo PM question.)", "approach": "This is a diagnosis-then-design prompt. Structure it: (1) segment where the drop happens in the funnel (new signups vs. existing users; which onboarding step). (2) Generate hypotheses across categories \u2014 product change (new UI/flow regression), external (a competitor or a trust/security scare), user intent (users prefer debit/card link or balance-only), or measurement artifact. (3) Prioritize hypotheses by likelihood x impact and say what data you'd pull (funnel drop-off by step, cohort by signup date, error rates). (4) Propose a fix for the leading hypothesis and how to validate with an A/B test. Neal's OpenCV impression->approach->purchase funnel work (bb-2) is a strong analogy for funnel-drop-off reasoning."}, {"prompt": "Design a subscription-management feature for the PayPal wallet. (A documented PayPal PM question.)", "approach": "Start from the user problem: recurring charges are opaque and hard to cancel \u2014 a trust/anxiety pain point PayPal is uniquely positioned to solve since it sees the transactions. Define target user (consumers with 3+ recurring merchants). Design the core flows: (1) auto-detect & surface all subscriptions, (2) one-tap pause/cancel, (3) renewal reminders/spend alerts. Prioritize with a simple framework (impact vs. effort/RICE). Call out fintech constraints: merchant agreements, disputes, and regulatory rules around stopping payments. North Star: reduction in dispute/chargeback rate + increased wallet engagement. Neal's FieldPulse PRD (fp-1) shows he can define 3 flows + 15 KPIs with a North Star \u2014 directly transferable."}, {"prompt": "Design a product/feature to bring Gen Z or new users into the PayPal (vs. Venmo) ecosystem, or improve Fastlane guest-checkout conversion.", "approach": "Pick Fastlane for specificity: the job-to-be-done is killing guest-checkout friction (competing with Shop Pay). Segment merchants (SMB vs. enterprise) and shoppers (returning vs. first-time). Friction = cart abandonment from long forms. Design: recognize the shopper by email/phone, one-tap autofill, and a trust signal. Prioritize the single highest-conversion-lift change. North Star = checkout conversion rate; guardrails = fraud/false-decline rate. Neal's SailLoft 2-click Chrome-extension workflow and ~25% PR-to-merge acceleration (sl-2) demonstrate real 'reduce clicks to lift conversion' instinct."}], "behavioralMapping": [{"value": "Work Customer Back (customer obsession / start from the user problem)", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and used the insights to scale the app 17->563 active users (33x) in one quarter and ship an ML flashcard engine that lifted exam scores 16% and cut review time 38%. Frame as: listened to the customer first, then built to a measurable outcome.", "factIds": ["ep-1", "ep-role"]}, {"value": "Work Customer Back (validating need before building)", "nealStory": "Founded Biryani Blitz after 180 customer interviews and launched a 0->1 hot-food vending platform at UC Berkeley (fresh biryani in 60s). Emphasize the discipline of interviewing before committing capital \u2014 customer-back product decisions.", "factIds": ["bb-1", "bb-role"]}, {"value": "Win Together (take ownership / execute with excellence, ship 0->1)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40% with real-time visibility. Ownership of an ambiguous internal product from zero to shipped.", "factIds": ["sl-1", "sl-role"]}, {"value": "Win Together (cross-functional influence / persuading engineering)", "nealStory": "At SailLoft, translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and built a 2-click Chrome-extension workflow. Answers 'tell me about persuading engineering to implement a function' \u2014 Neal worked directly with devs to define and land the interface.", "factIds": ["sl-2"]}, {"value": "Put People First (leadership / raising the standard in others)", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leading peers, running development programming. Use for 'time you led/mentored a team' or 'built belonging' prompts.", "factIds": ["ld-1", "ld-2"]}, {"value": "Innovation / act quickly with purpose (data-driven analytical thinking)", "nealStory": "Built a privacy-first computer-vision telemetry system (OpenCV) tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics. Strong for 'time you used data to drive a decision' and for the metrics round.", "factIds": ["bb-2"]}, {"value": "Innovation / bias to action (shipping AI to remove toil)", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities, cutting weekly outreach time ~97%; QR loyalty app (React/Firebase) lifted repeat purchases 40%. Good for 'most innovative thing you built' and measurable-impact prompts.", "factIds": ["bb-3"]}, {"value": "Win Together (overcoming ambiguity / resilience under pressure)", "nealStory": "Backed by Wharton + UNC Innovation Labs ($5K) and a $200K Wharton Startup Challenge finalist \u2014 story of driving a venture through competitive, high-pressure, resource-constrained conditions.", "factIds": ["bb-4"]}], "analyticalFocus": ["Funnel analysis and drop-off diagnosis (e.g., signup->bank-link, checkout conversion, cart abandonment)", "Defining a North Star metric plus supporting KPIs and guardrails for a payment feature", "A/B test design: hypothesis, metric, sample/duration reasoning, guardrail metrics", "Core fintech health metrics: activation, retention, conversion, transaction volume/TPV, monthly active payers, take rate", "Trust & risk metrics as guardrails: fraud rate, false-decline rate, chargeback/dispute rate, NPS/complaint rate", "Market-sizing / estimation (e.g., size a payments or remittance market; estimate active users of a product) \u2014 practice a clean top-down + bottom-up cross-check", "Tradeoff quantification: UX friction reduction vs. fraud exposure vs. revenue/take rate"], "gotchas": ["Product-sense answers MUST start from a real user problem, not a feature \u2014 this maps directly to PayPal's 'Work Customer Back' principle; leading with a solution is a common fail.", "In fintech, always name trust/security/fraud/dispute and regulatory constraints as explicit tradeoffs \u2014 omitting them signals you don't understand payments.", "Know the PayPal vs. Venmo distinction cold: PayPal = checkout/merchant/utility + global; Venmo = US social P2P, younger users, monetization push (Pay with Venmo, Venmo card). Interviewers directly ask you to compare them.", "PayPal is mid-reorganization \u2014 Honey and Paidy are reportedly under strategic review / possible divestiture; don't build a product-sense answer that assumes Honey is a growth priority. Focus on core wallet, Venmo, Fastlane, Braintree, PYUSD, PayPal Ads.", "Work authorization is likely a knockout field \u2014 the ledger flags Neal's workAuth as UNCONFIRMED (identity.workAuth); Neal must confirm before applying.", "Neal's ledger flags over-precise metrics: soften '41.7% net margin' to ~42% projected (bb-1) and give a before->after for the '97% time cut' rather than the bare number (bb-3). Do not invent baselines.", "Use STAR structure for behavioral rounds and quantify outcomes \u2014 but only with ledger numbers; never fabricate a metric to fit a prompt.", "For the metrics round, don't just list metrics \u2014 pick ONE North Star and justify why, then add guardrails. Listing 10 metrics with no prioritization is a weak signal."], "sources": ["https://prepfully.com/interview-guides/paypal-product-manager", "https://www.interviewquery.com/interview-guides/paypal-product-manager", "https://www.tryexponent.com/questions?company=paypal&role=pm", "https://www.glassdoor.com/Interview/PayPal-Product-Manager-Interview-Questions-EI_IE9848.0,6_KO7,22.htm", "https://www.glassdoor.com/Interview/Venmo-Product-Manager-Interview-Questions-EI_IE447866.0,5_KO6,21.htm", "https://www.joinleland.com/library/a/paypal-product-manager-interview", "https://www.productmanagementexercises.com/interview-questions/paypal", "https://careers.pypl.com/how-we-recruit/Interviewing/default.aspx", "https://www.builtinchicago.org/company/paypal/faq/culture-values", "https://builtin.com/company/paypal/faq/leadership-management", "https://www.paymentsdive.com/news/paypal-ceo-chriss-acquisitions-divest-honey-paidy-venmo-braintree/710021/", "https://www.connectingthedotsinfin.tech/paypals-next-moves-paypal-open-venmo-fastlane-and-verifone/"]}, {"company": "Block, Inc.", "products": ["Square \u2014 seller ecosystem: POS, payments, e-commerce, inventory, payroll, banking, business loans, bookings (small-business / F&B / retail merchants)", "Cash App \u2014 consumer digital wallet: send/receive money, Cash Card debit, savings, borrow, stock & bitcoin investing, taxes", "Afterpay \u2014 buy-now-pay-later, bridging the Square (seller) and Cash App (consumer) sides", "TIDAL \u2014 hi-def music streaming (100M+ songs), artist-focused", "Bitkey \u2014 self-custody bitcoin hardware wallet (new model has a secure touchscreen to verify/authorize transactions)", "Proto \u2014 bitcoin mining system / hardware, decentralizing hashrate", "Cash App Bitcoin \u2014 automatic bitcoin earning + Proof of Reserves; Square rolling out bitcoin payments for sellers"], "valuesAndBar": ["Focus on the customer / customer obsession \u2014 the most-repeated bar; every product-sense answer must start from a specific user segment and pain, not a solution or tech", "Economic empowerment / inclusion \u2014 the company mission is expanding access to the economy for the underserved (small sellers, unbanked/underbanked consumers); tie recommendations to lowering barriers", "Build to last / long-term thinking \u2014 durable bets over quick wins", "Be principled & be transparent \u2014 trust, security, clarity (esp. relevant to money movement and bitcoin custody)", "Be empowering \u2014 give users and sellers control and simplicity; design-driven simplicity (fewer steps, fast time-to-value)", "Bold experimentation \u2014 data-driven A/B testing and iteration", "PM competency bar: strategic reasoning (why launch), user empathy, analytics/funnel + ROI fluency, cross-functional collaboration with eng/design, business acumen tied to company metrics", "Technical openness/excellence \u2014 comfort talking APIs and working closely with engineers (Neal's CS background is an asset here)"], "interviewFormat": ["Overall ~4-6 week loop, roughly 5 stages (per Exponent/ProductGym; note: public guides describe the experienced-PM Square loop \u2014 an APM/intern loop is typically compressed, but expect the same question TYPES)", "Round 1 \u2014 Recruiter phone screen: background, motivation ('what do you know about Block/Square?'), products you've built, behavioral (STAR), sometimes API/technical familiarity", "Round 2 \u2014 Hiring manager screen (~45 min): work history, cultural fit, business acumen; often a conversion-funnel / ROI discussion", "Round 3 \u2014 Onsite (one day), four ~45-min components: (a) Product Sense & Design \u2014 design a feature for a Square/Cash App product, define the market segment FIRST; (b) Product Analytics \u2014 conversion-funnel exercise with real data, ROI math, MUST ask clarifying questions before solving; (c) Product Strategy \u2014 open-ended: mission, segmentation, monetization, roadmap; (d) Cross-functional chats with an EM/designer on communication & stakeholder mgmt", "Round 4 \u2014 Panel presentation (~60 min, hardest round): you get an open-ended prompt IN ADVANCE from the recruiter (e.g. 'design any product for restaurant or retail teams'), build a deck (PowerPoint/Canva), and present to a panel", "Referrals drive a large share of hires; researching the company visibly is a scored signal"], "productSensePrompts": [{"prompt": "Design a feature to improve Cash App's activation/onboarding for a first-time user who just downloaded it to receive money from a friend \u2014 how do you turn a one-time receiver into an active, monetizable user?", "approach": "Segment first (received-money-only users vs. senders vs. investors). Pick the received-only segment (huge, low-engagement). Map their funnel: receive -> cash out to bank (churn point) vs. keep balance in Cash App. Pain: no reason to keep money in-app. Solution set: instant Cash Card issuance at first receive, round-up-to-savings, a 'why keep it here' nudge (boosts/cashback). North-star: % of received-only users who make an outbound spend within 30 days. Tie to economic-empowerment mission (giving underbanked users a functional account). Name a tradeoff and an A/B test. Neal can lean on ep-1 activation/retention work."}, {"prompt": "Design a feature for Square restaurant/F&B sellers to reduce order friction or increase repeat customers (mirrors the real 'build any product for restaurant or retail teams' panel prompt).", "approach": "Define the seller segment (single-location quick-service vs. multi-location full-service). Interview-grounded pains: table turnover, staffing, repeat customers. Proposal e.g. a QR-based order-ahead + loyalty layer integrated into Square POS so the seller gets no-new-hardware repeat-purchase lift. Metrics: repeat-visit rate, avg ticket, labor cost per order. Explicitly a Square-native (no extra device) solution to hit 'fast time-to-value'. Neal has a DIRECT analog: bb-3 QR loyalty app that lifted repeat purchases 40%, and bb-1/bb-2 physical-retail funnel \u2014 very strong here."}, {"prompt": "How would you use Afterpay to create value across BOTH the Square (seller) and Cash App (consumer) sides \u2014 i.e., what's the connective-tissue product?", "approach": "Frame Block's thesis: Afterpay is the bridge between the two ecosystems. Consumer side: surface BNPL eligibility inside Cash App at checkout; seller side: Square merchants get higher conversion/AOV by offering it. Design the loop: Cash App user discovers Afterpay-enabled Square sellers -> drives seller GMV -> data feeds better underwriting. Metrics: attach rate, incremental AOV, seller adoption, default/repayment rate (the 'be principled' guardrail \u2014 don't push users into debt). Show you understand the multi-BU flywheel, which is Block's core strategic story."}, {"prompt": "Cash App wants to grow bitcoin engagement responsibly (auto-earn, Proof of Reserves). Design an onboarding for a bitcoin-curious but nervous first-timer.", "approach": "Segment: risk-averse first-time crypto user, not the existing HODLer. Pain: fear of volatility, scams, losing funds. Lead with 'be principled/be transparent': tiny auto-round-up bitcoin buys, plain-language education, Proof of Reserves as a trust signal, clear downside framing. Metric: % of new bitcoin users still holding at 90 days (durable engagement, not churn-and-refund). Flag the ethical guardrail (don't over-nudge into a volatile asset) \u2014 hits Block's principled value and shows maturity. Neal's fp-1 AI-explainability/UX work shows he thinks about clarity."}], "behavioralMapping": [{"value": "Focus on the customer / customer obsession", "nealStory": "Founded Biryani Blitz off 180 customer interviews and built a privacy-first CV funnel (impression->approach->purchase) to actually watch real customer behavior at the machine \u2014 customer obsession made physical.", "factIds": ["bb-1", "bb-2"]}, {"value": "Economic empowerment / building for the underserved", "nealStory": "Scaled the Elephant productivity app 17->563 users by grounding every feature in 200+ user interviews and shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 building tools that measurably improve outcomes for a group that lacked them.", "factIds": ["ep-1"]}, {"value": "Bold experimentation / data-driven, analytics fluency", "nealStory": "Built e-commerce-grade conversion analytics for a physical vending machine (OpenCV funnel) and authored a PRD defining 15+ KPIs with First-Time-Fix-Rate as the north star \u2014 shows funnel + metric-selection thinking the Analytics round tests.", "factIds": ["bb-2", "fp-1"]}, {"value": "Be empowering / design-driven simplicity, fewer steps", "nealStory": "Built a Chrome extension that condensed client testing to a 2-click workflow and a GitHub testing interface that accelerated PR-to-merge ~25% \u2014 reducing steps to value, exactly Block's simplicity bar.", "factIds": ["sl-2"]}, {"value": "Cross-functional collaboration with eng/design (the cross-functional-chat round)", "nealStory": "As a PM+dev intern at SailLoft, led the 0->1 launch of an internal Gerrit/Bazel test product by translating developer-workflow pain into shipped tooling that cut manual tests 40% \u2014 literally worked shoulder-to-shoulder with engineers.", "factIds": ["sl-1", "sl-2"]}, {"value": "Build to last / long-term thinking & ownership (founder judgment)", "nealStory": "Took Biryani Blitz from 0->1 with a real unit-economics model (projected ~42% net margin, $145K ARR/machine), earned Wharton+UNC backing and $200K challenge finalist \u2014 owned the full durable business case, not just a feature.", "factIds": ["bb-1", "bb-4"]}, {"value": "Repeat-purchase / consumer growth (direct Square-seller analog)", "nealStory": "Shipped a QR loyalty app (React/Firebase) that lifted repeat purchases 40% and an AI lead-gen agent across 100+ universities that cut weekly outreach time ~97% \u2014 direct evidence of driving retention/growth for merchants.", "factIds": ["bb-3"]}], "analyticalFocus": ["Conversion / activation funnel analysis (e.g., Cash App debit-card activation drop-off, Square seller onboarding) \u2014 must ASK CLARIFYING QUESTIONS before solving; jumping straight to answers is a documented DQ", "ROI and unit-economics math done live (payback, LTV/CAC, incremental AOV, take rate) \u2014 Neal should rehearse mental math", "Metric / north-star selection and guardrail metrics (counter-metrics like default rate for Afterpay, churn for bitcoin)", "A/B test design: hypothesis, primary vs. guardrail metric, sample/segment", "Payments-specific metrics: GMV, take rate, attach rate, gross profit (Block reports 'gross profit' as a headline metric \u2014 reference it), transaction margin, chargeback/fraud rate", "Retention/repeat metrics for two-sided ecosystem (seller GMV retention, consumer inflows, cross-BU flywheel)"], "gotchas": ["Do NOT lead product-sense answers with an LLM/AI gimmick \u2014 public interviewer guidance explicitly flags 'first or only idea built around LLMs' as a red flag. Neal is AI-heavy on paper, so consciously lead with the USER and segment, then bring AI only if it genuinely serves the need.", "In the Analytics round, ASK clarifying questions before computing \u2014 candidates who jump into problem-solving without requesting data get disqualified.", "In Product Sense, DEFINE THE MARKET SEGMENT before naming pain points (senior bar); don't design for 'everyone.'", "Know which business unit you're interviewing for \u2014 Square (seller/B2B), Cash App (consumer), Afterpay (BNPL/two-sided) have very different users; don't blur them.", "Context: Block announced large layoffs (4,000+ of ~10,000) in Feb 2026 citing AI. Don't raise it unprompted; if asked about company outlook, stay positive and mission-focused, and be ready for AI-efficiency themes.", "Public interview guides describe the EXPERIENCED-PM Square loop and cite '3+ years PM' \u2014 as an intern/APM Neal should expect a lighter loop but the same question types; he should not claim seniority he doesn't have (workAuth and grad year: May 2028).", "STAR is explicitly expected for behavioral \u2014 structure answers Situation/Task/Action/Result.", "Visibly researching Block (products, recent bitcoin/Bitkey/Proof-of-Reserves moves, gross-profit metric) is a scored signal \u2014 weave it in.", "Ledger honesty: Neal's metrics are largely PROJECTED for Biryani Blitz (41.7% margin, $145K ARR) \u2014 say 'projected/estimated'; the 97% figure has no baseline, so frame as a before->after, not a hard stat."], "sources": ["https://en.wikipedia.org/wiki/Block,_Inc.", "https://block.xyz/", "https://block.xyz/inside/block-launches-bitkey-wallet-with-screen-automatic-bitcoin-earning-on-cash-app-and-proof-of-reserves", "https://block.xyz/news/afterpay", "https://block.xyz/news/square", "https://block.xyz/news/cashapp", "https://block.xyz/news/bitkey", "https://www.tryexponent.com/guides/square-product-manager-interview", "https://productgym.io/how-to-win-the-square-product-manager-interview/", "https://www.techinterview.org/companies/block/", "https://www.productmanagementexercises.com/interview-questions/cash%20app", "https://www.glassdoor.com/Interview/Block-Product-Manager-Interview-Questions-EI_IE422050.0,5_KO6,21.htm", "https://matrixbcg.com/blogs/mission/block", "https://www.teamblind.com/post/Need-help-cashappafterpaysquare-on-site-pm-interview-34WFcwAw", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Coinbase", "products": ["Coinbase App (retail crypto brokerage: buy/sell/send/receive)", "Coinbase One (subscription: zero trading fees, boosted staking rewards, priority support, onchain benefits)", "Base (Coinbase's Ethereum L2 blockchain; ~all agentic payment activity, $20M+ processed since Oct 2025)", "Coinbase Wallet / self-custody wallet + onchain dapp benefits", "USDC stablecoin (Coinbase distributes; 50% revenue share with Circle; 2nd-largest digital dollar)", "Staking / Coinbase Earn (largest institutional ETH staking provider)", "Coinbase Derivatives (US futures; integrating USDC as collateral via Nodal Clear)", "Prediction Markets (launched Dec 2025, fastest-growing segment; crypto binaries, combo trades)", "Everything Exchange (June 2026): tokenized US stocks, options on stocks & crypto, thematic index perpetual futures, agentic trading"], "valuesAndBar": ["Ten cultural tenets: Clear communication, Efficient execution, Act like an owner, Top talent, Championship team, Continuous learning, Customer focus, Repeatable innovation, Positive energy, Mission first", "Act like an owner: take 100% responsibility for the mission; DRI (Directly Responsible Individual) model per OKR priority", "Mission-first + high-performance: intense, demanding pace balanced by recharge weeks; expects people who thrive under high expectations", "APM traits they screen for: eagerness/excitement to learn, proactiveness, curiosity, structured thinking, positivity", "Data-driven decision-making and metrics fluency (define North Star; unit economics of an exchange)", "Genuine crypto/onchain conviction \u2014 they now probe industry-specific interest (favorite dapp, where crypto UX can improve), not just generic PM skill", "Ship fast with tolerance for failure while obsessing over quality/craft"], "interviewFormat": ["Competitive multi-stage funnel (reports range 4 core rounds up to ~7 touchpoints depending on performance)", "Stage 0 - Recruiter call: motivational/level-setting, background and why-Coinbase (less evaluative)", "Stage 0 - Written homework/assessment: ~3 short-answer questions on background, product familiarity, and teamwork (sometimes an IQ/culture assessment)", "Stage 1 - Hiring manager + Senior PM screens: two ~30-60 min interviews split across Product Sense (vision) and Product Execution (metrics)", "Stage 2 - Virtual onsite: 4-5 back-to-back ~1hr sessions with Senior PMs covering Product Sense, Execution, Behavioral/Values (Leadership), and an Engineering/technical-planning discussion, PLUS a presentation exercise", "Stage 3 - Optional behavioral + metrics round with senior leadership, run only if needed", "Categories overall: Product Design/Sense, Product Execution (analytical/metrics/KPI), Product Strategy (growth under uncertainty, regulation), Behavioral/Values, light Engineering/technical"], "productSensePrompts": [{"prompt": "Define the North Star metric for Coinbase's send/receive (crypto transfer) experience, and name 2-3 input metrics you would move.", "approach": "Clarify the user (retail sender to another wallet/user) and the mission ('increase economic freedom' => more usable onchain money movement). Propose North Star = weekly successful send/receive transactions per active user (captures value delivered + habit), not raw volume (skews to whales). Input metrics: send-completion rate (started -> confirmed), time-to-first-successful-send for new users, and failed/reverted-transfer rate. Discuss the funnel (find recipient -> pick asset/network -> confirm fees -> settle) and where drop-off happens (address complexity, gas confusion). Tie to a guardrail: fraud/erroneous-send rate must not rise. Neal can lean on his OpenCV impression->approach->purchase funnel (bb-2) as an analogy for instrumenting a conversion funnel."}, {"prompt": "You're PM for Coinbase One. Should we expand its onchain benefits (dapp deals on Base) or double down on core exchange perks (zero fees, boosted staking)? How do you decide?", "approach": "Frame as a growth-vs-retention bet under the 'Everything Exchange' strategy. Segment members: core traders (value fee waivers) vs onchain-native users (value Base dapp benefits). Define the goal metric = subscription net retention / LTV, not signups. Reason about acquisition cost and stickiness: onchain benefits differentiate vs Robinhood/Kraken and pull users onto Base (strategic moat), but core perks retain the majority revenue base. Recommend a sequenced approach: protect core perks (retention floor) while running a targeted onchain-benefits experiment to a segment, measured on incremental Base activity and churn. Show the tradeoff explicitly and pick a DRI-style owner metric."}, {"prompt": "Design a feature to help a first-time, non-crypto-native user complete their first onchain action (e.g., first Base transaction or first stake) without getting lost.", "approach": "Start from the persona: a curious but anxious mainstream user; JTBD = 'try crypto without feeling dumb or losing money.' Map the current onboarding funnel and the top fear points (seed phrases, gas, irreversible mistakes, jargon). Propose a guided 'first action' flow with progressive disclosure, a sandbox/small-amount default, plain-language explainers, and an AI copilot that explains each step (Neal's FieldPulse AI-explainability UX, fp-1, and his ML/AI product work map here). North Star = new-user first-successful-onchain-action rate within 7 days; guardrails on error/support-ticket rate. Close with an A/B test plan and a crawl-walk-run rollout."}, {"prompt": "Should Coinbase expand crypto/prediction-market products into a new country? Walk me through how you'd evaluate it.", "approach": "Structure: market attractiveness x regulatory feasibility x strategic fit. Size TAM (crypto adoption, smartphone/banking penetration), then gate hard on regulation/licensing (the binding constraint for Coinbase) and local fiat on/off-ramp partnerships. Assess competition (local exchanges) and localization cost. Recommend a phased entry (compliant read-only/light product -> full trading) with a clear success metric (funded activation rate, CAC payback) and a kill criterion. Emphasize 'mission first' but disciplined execution. Neal's Biryani Blitz 0->1 deployment and 180-interview market validation (bb-1) show he sizes and de-risks new-market entry with primary research."}], "behavioralMapping": [{"value": "Act like an owner", "nealStory": "Founded Biryani Blitz: took 100% ownership of a 0->1 hot-food vending platform deployed at UC Berkeley, from 180 customer interviews through a projected ~$145K ARR/machine unit-economics model \u2014 no one assigned it, he owned the mission end to end.", "factIds": ["bb-role", "bb-1"]}, {"value": "Efficient execution / ship fast", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit + Bazel software-test product in a ~2-month internship that cut manual tests 40%, and shipped a 2-click Chrome extension that sped PR-to-merge cycles ~25% \u2014 shipped real tooling fast under a tight window.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Customer focus / user research depth", "nealStory": "Scaled Elephant Productivity Suite from 17 to 563 active users (33x) in one quarter driven by 200+ user interviews, then shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 decisions grounded directly in customer needs.", "factIds": ["ep-role", "ep-1"]}, {"value": "Data-driven / metrics fluency (Product Execution)", "nealStory": "Built a privacy-first OpenCV telemetry system tracking an impression->approach->purchase funnel to give a physical vending machine e-commerce-grade conversion analytics; and authored a PRD defining 15+ KPIs with First-Time Fix Rate as the North Star \u2014 shows he defines and instruments metrics, not just cites them.", "factIds": ["bb-2", "fp-1"]}, {"value": "Repeatable innovation / AI-native building", "nealStory": "Shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that collapsed weekly outreach time by ~97%, plus a React/Firebase QR loyalty app that lifted repeat purchases 40% \u2014 repeatedly turns AI into shipped, leverage-creating product.", "factIds": ["bb-3"]}, {"value": "Championship team / leadership", "nealStory": "Serves as Director of Professional Development for UNC's PM Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leads peer teams; use for teamwork, stakeholder-alignment, and conflict-management behavioral prompts.", "factIds": ["ld-1", "ld-2"]}, {"value": "Continuous learning / top talent bar", "nealStory": "Invited to Bridge to BCG (~10% acceptance) and a $200K Wharton Startup Challenge finalist backed by Wharton + UNC Innovation Labs ($5K) \u2014 external validation of a high bar and drive to learn.", "factIds": ["ld-3", "bb-4"]}], "analyticalFocus": ["Defining a North Star metric for a specific product surface (e.g., send/receive, Netflix homepage) and its input metrics", "Unit economics of an exchange (take-rate, trading volume, CAC, LTV, subscription retention for Coinbase One)", "Funnel analysis: onboarding / first-transaction / activation conversion for retail crypto users", "Prioritization frameworks and tradeoff reasoning (growth vs retention, core vs onchain)", "Guardrail metrics (fraud, erroneous sends, support-ticket rate) alongside the primary metric", "Sizing/market-entry math for new-country expansion under regulatory constraints"], "gotchas": ["Genuine crypto/onchain conviction is now table stakes \u2014 be ready to name a favorite dapp and articulate where crypto UX is broken; generic PM answers won't survive. Neal should form a real, specific point of view on Base and onchain onboarding before interviewing.", "The written homework/short-answer stage is real and evaluative on product familiarity \u2014 treat it as a first cut, not a formality.", "Culture is explicitly intense/high-expectation ('mission first', DRI ownership). Behavioral answers should show high ownership and comfort with ambiguity, not just collaboration.", "Do NOT round Neal's numbers up or invent any: per the ledger, 41.7% net margin should be presented as ~42% and labeled 'projected'; the 97% outreach-time cut is near-ceiling with no baseline (soften or give before->after); ARR is a projection ('projected $145K ARR/machine').", "Work authorization is UNCONFIRMED in the ledger \u2014 Coinbase's knockout/immigration fields require it; Neal must confirm before applying.", "GPA is not on the master resume \u2014 only list if >= 3.5; Neal must supply.", "Round count varies (sources cite 4 up to ~7 touchpoints) and later rounds are performance-gated \u2014 prepare for the full onsite including a presentation exercise and a light engineering/technical-planning discussion.", "Coinbase posted a Q1 2026 loss ($394M on $1.4B rev) despite a strong 2025 \u2014 showing awareness of the business's volatility/regulatory exposure signals genuine interest."], "sources": ["https://aspiringpm.substack.com/p/coinbases-apm-interview-process", "https://www.tryexponent.com/guides/coinbase-pm-interview", "https://igotanoffer.com/blogs/product-manager/coinbase-product-manager-interview", "https://www.joinleland.com/library/a/how-to-prepare-for-coinbase-product-management-case-interviews", "https://ophyai.com/blog/company-guides/coinbase-interview-guide", "https://www.glassdoor.com/Interview/Coinbase-Associate-Product-Manager-Interview-Questions-EI_IE779622.0,8_KO9,34.htm", "https://builtin.com/company/coinbase/faq/culture-values", "https://www.coinbase.com/blog/working-at-coinbase-intense-and-demanding-balanced-by-deliberate-recharge-time", "https://www.coinbase.com/blog/new-updates-to-coinbase-one-zero-trading-fees-boosted-staking-rewards-and", "https://www.forbes.com/sites/ninabambysheva/2026/06/16/coinbase-expands-into-agentic-trading-new-prediction-markets-contracts-and-derivatives/", "https://www.coinbase.com/staking", "https://www.coinbase.com/derivatives"]}, {"company": "Robinhood", "products": ["Robinhood app (commission-free stock/ETF/options trading) \u2014 the core self-directed brokerage", "Robinhood Gold ($5/mo subscription; 4.2M+ subscribers, >15% adoption) \u2014 higher interest on cash, bigger instant deposits, margin, Cortex, gateway to premium tiers", "Robinhood Legend \u2014 advanced desktop + mobile trading platform for active traders: 90+ indicators, futures (40+ CME products), crypto, index/crypto options, AI-powered custom indicators & scans, short selling", "Robinhood Cortex \u2014 AI investing assistant (Gold-exclusive): Cortex Digests (near real-time stock/crypto insights, ~1M users) and Cortex Assistant (plain-English trade/research/settings via chat)", "Robinhood Crypto \u2014 45+ assets, staking, crypto on Legend", "Robinhood Retirement \u2014 IRAs with match; AUC ~$26.5B (+102% YoY)", "Prediction Markets / Event Contracts (via Robinhood Derivatives) \u2014 yes/no bets on sports, politics, econ data, crypto, news; ~10% of net revenue in Q1 2026, record 8.8B contracts", "Robinhood banking / cards \u2014 Gold Card and Platinum Card credit cards, custodial & trust accounts, Early Dividends", "Robinhood Social \u2014 trading community with live verified trades", "Robinhood Strategies / wealth management \u2014 managed portfolios and tokenized assets"], "valuesAndBar": ["Mission: 'democratize finance for all' \u2014 every product-sense answer should ladder back to lowering barriers / leveling the playing field, not just monetization", "Insane Customer Focus \u2014 'our customers are why we exist'; design for the retail/first-time investor, prioritize what's best for them", "High Performance \u2014 operate with extreme urgency; velocity + quality; adjust strategy fast on new info", "Safety Always \u2014 'trust is hard earned and easily lost'; never compromise trust/compliance for speed (critical in a regulated fintech; expect risk/compliance tradeoff probes)", "One Robinhood \u2014 collective accountability, honesty, inclusion; strong cross-functional collaboration bar (they run 2 XFN screens with eng/design/ops)", "Participation is Power \u2014 break barriers so everyone, not just the wealthy, can access financial systems", "First Principles Thinking \u2014 'only follow the crowd when they're right'; use data and experiments, make bold bets", "Lean & Disciplined \u2014 'do more with less'; use constraint to drive innovation", "PM bar in practice: depth over generic fluency \u2014 they want conviction, testing/learning mindset, ability to defend specific improvements on the spot and articulate tradeoffs from first principles"], "interviewFormat": ["Overall ~2-4 weeks (avg ~34 days); rated ~2.9/5 difficulty by PM candidates", "Round 1 \u2014 Recruiter phone screen: motivational/level-setting; recruiter also uses behavioral signal to gauge which vertical/team fits; often helps prep for later rounds", "Round 2 \u2014 Hiring Manager conversation: product experience, ownership, how you work with eng and design; be ready to walk your last role, execution, and tradeoffs clearly", "Onsite = 2 days of case studies (peer or senior PM led)", "Day 1 Case Study I (product sense/behavioral): 'Tell me about a big product you launched and what made it exciting for you and the company' \u2014 probes conviction, testing mindset, stakeholder influence, blocker/mistake recovery", "Day 1 Case Study II (product sense/strategy): 'You're CEO/VP of your favorite product \u2014 how would you structure the org / what would you deprioritize and why' \u2014 holistic thinking; they check if you consider backend AND frontend product teams", "Day 2 Case Study III (strategy): one-page hypothetical Robinhood business expansion, e.g. 'Should Robinhood do mortgages?' or 'Build an ad platform?' \u2014 GTM, tradeoffs, velocity + conviction + experimentation", "Day 2 Product Execution round (analytical + behavioral): 'Walk your end-to-end product lifecycle', 'Tell me about analyzing a large dataset and the insight you drew'; interviewers give hints, expect clarifying questions", "Day 2 \u2014 two Cross-Functional screens (engineer / designer / ops lens): e.g. 'a time you took on tech debt and the tradeoffs', 'greatest strength/weakness as a PM'", "Gotcha: come prepared with TWO real products you use and be ready to defend specific improvements live"], "productSensePrompts": [{"prompt": "Robinhood wants more first-time / younger investors to actually START investing (not just open an account). Design a feature to convert a new user who has funded but never placed a first trade.", "approach": "Anchor on the mission (democratize finance) and Insane Customer Focus. Segment: funded-but-inactive users; hypothesize friction (fear of losing money, choice overload, not knowing what to buy). Prioritize a low-stakes on-ramp: fractional 'starter baskets', a guided first-trade flow, or a small guaranteed-safe simulated-to-real bridge. Explicitly weigh Safety Always (don't nudge risky behavior / suitability + compliance) as a hard constraint, not an afterthought \u2014 this is the value they most want to see respected. North Star: % of funded users placing first trade within 7 days; guardrails: no rise in complaints, no concentration in high-risk assets. Close with an A/B test plan (First Principles)."}, {"prompt": "Design or improve Robinhood Cortex (the AI investing assistant) for a novice investor. What would you build and how do you keep it safe/trustworthy?", "approach": "Frame around Cortex Assistant (plain-English trade/research). Pick the novice persona and their job-to-be-done: 'help me understand what I own and what to do next' without feeling like advice. Design explainability-first (why a stock moved, what a term means), with hard guardrails: never give personalized recommendations that trip investment-advice/suitability regulation \u2014 tie directly to Safety Always. Reuse Neal's FieldPulse experience: RAG over user data + AI explainability + North Star metric selection is a near-perfect analog. Metrics: Cortex-attributed activation, question-resolution rate, trust/CSAT; guardrail: hallucination/complaint rate. Discuss build-vs-monetize (Gold gating) as a lean/disciplined tradeoff."}, {"prompt": "Robinhood's event contracts / prediction markets are ~10% of revenue and growing fast. Should Robinhood keep expanding prediction markets, and how would you do it responsibly?", "approach": "First-principles strategy answer (this is a Case Study III style expansion prompt). Assess: fit with mission (does it democratize, or is it closer to gambling?), revenue upside vs. brand/regulatory risk (Safety Always + reputational). Propose a framework: which contract categories to add (econ data, crypto, sports vs. politics) ranked by regulatory clarity x user demand x margin. Recommend guardrails (position limits, responsible-use nudges, clear disclosure). Give a phased GTM with an experiment to validate retention/monetization before scaling. Show conviction with a clear yes/no and the tradeoffs you'd accept."}, {"prompt": "You're the PM for Robinhood Gold. Adoption is >15% and ~4.2M subscribers. How do you grow Gold subscriptions among active-but-non-Gold users?", "approach": "Growth/execution prompt. Map the funnel: free active traders -> Gold trial -> paid -> retained. Diagnose the value-perception gap (users don't see $5/mo worth). Prioritize levers: surface Cortex/Legend/higher cash yield at the moment of intent (contextual upsell), bundle a compelling hero perk, free-trial with clear activation of at least one premium feature. Tie to First Principles: run a holdout experiment on trial-to-paid and measure incremental LTV, not just conversion. Watch Safety Always/One Robinhood: don't dark-pattern the upsell. North Star: net-new retained Gold subs; guardrail: churn + downgrade complaints. Reuse Neal's ep-1 (17->563 growth, 33x) as the growth-instinct story."}], "behavioralMapping": [{"value": "Insane Customer Focus", "nealStory": "Founded Biryani Blitz after 180 customer interviews and built CV telemetry to actually watch the impression->approach->purchase funnel \u2014 decisions driven by observed customer behavior, not assumptions. Also 200+ interviews at Elephant.", "factIds": ["bb-1", "bb-2", "ep-1"]}, {"value": "High Performance (extreme urgency, velocity + quality)", "nealStory": "SailLoft internship: in a ~1-month window (Jun-Jul 2025) led 0->1 launch of an internal Gerrit/Bazel test product cutting manual tests 40% and shipped a Chrome extension condensing testing to a 2-click workflow \u2014 fast shipping without dropping quality.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "First Principles Thinking (data + experiments, bold bets)", "nealStory": "Elephant: shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38%, validated with real outcome metrics; FieldPulse PRD defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 metric-first reasoning from scratch.", "factIds": ["ep-1", "fp-1"]}, {"value": "Safety Always (trust, doing the responsible thing, tradeoffs)", "nealStory": "Biryani Blitz: deliberately built the CV telemetry as PRIVACY-FIRST \u2014 chose not to capture/store identifying data while still getting conversion analytics. A concrete 'protect the user's trust even when it's the harder build' tradeoff (adapt honestly; don't overstate as regulatory work).", "factIds": ["bb-2"]}, {"value": "One Robinhood (cross-functional collaboration, honesty)", "nealStory": "SailLoft: translated developer-workflow pain points into a GitHub testing interface and accelerated PR-to-merge ~25% \u2014 worked directly across the eng workflow; UNC PM Club Director of Professional Development for org/collaboration signal.", "factIds": ["sl-2", "ld-1"]}, {"value": "Participation is Power / democratize access", "nealStory": "Biryani Blitz shipped an AI lead-gen agent across 100+ universities cutting weekly outreach time ~97% and a QR loyalty app that lifted repeat purchases 40% \u2014 using tech and constraint to broaden reach/access cheaply.", "factIds": ["bb-3"]}, {"value": "Lean & Disciplined (do more with less)", "nealStory": "Biryani Blitz built and validated a 0->1 platform on ~$5K in backing (Wharton + UNC Innovation Labs), Wharton Startup Challenge finalist \u2014 constrained resources, real traction; automation cut outreach time ~97%.", "factIds": ["bb-4", "bb-1", "bb-3"]}, {"value": "Ownership / big launch story (Case Study I opener)", "nealStory": "Best 'big product I launched' story: Elephant scaled 17->563 active users (33x) in one quarter \u2014 clear before->after, real users, and a measurable feature outcome (16% exam lift, 38% review-time cut). Strongest single narrative to open the onsite.", "factIds": ["ep-1", "ep-role"]}], "analyticalFocus": ["North Star metric selection and defense (they explicitly ask; Neal has fp-1 with First-Time Fix Rate as North Star and 15+ KPIs)", "Activation / funnel conversion \u2014 funded-account -> first-trade, free -> Gold, impression -> purchase (map to bb-2 CV funnel and ep-1 growth)", "Retention & engagement metrics for a transactional consumer app (DAU/MAU, repeat purchase \u2014 bb-3 40% repeat lift)", "Subscription economics \u2014 Gold trial-to-paid, churn, incremental LTV", "Revenue mix / monetization reasoning \u2014 event contracts now ~10% of revenue, transaction-based revenue, net interest on cash", "Experiment design \u2014 A/B tests, holdouts, guardrail metrics (be ready to state hypothesis, primary metric, guardrails, sample/duration)", "Reading a large dataset and extracting an insight (explicit Product Execution prompt) \u2014 Neal should prep one concrete story of analyzing data and the decision it drove", "Estimation / market sizing likely in Case Study III expansion prompts (e.g. size a mortgages or ad-platform opportunity)"], "gotchas": ["Safety Always is a fintech-specific trap: for ANY growth or AI feature idea, proactively name the regulatory/compliance/suitability tradeoff and a guardrail \u2014 candidates who optimize purely for engagement/revenue fail this bar. Robinhood carries real reputational scars (GameStop trading halt, options-related incidents), so 'move fast without breaking trust' must be explicit.", "Bring TWO real products you actively use and be ready to defend SPECIFIC improvements live \u2014 generic product fluency is called out as a fail mode.", "Case Study II checks whether you consider BACKEND product teams (infra, risk, data) and not just shiny frontend features \u2014 mention platform/backend org explicitly.", "Answers should ladder to the mission ('democratize finance for all') and lower-barrier framing, not just ARPU \u2014 this is the cultural differentiator vs. a generic fintech.", "Ledger discipline: do NOT invent finance/trading domain experience. Neal has none directly \u2014 lean on transferable 0->1, growth, AI/RAG, and dev-tools work. Present bb-2 as 'privacy-first design choice', NOT as regulatory/compliance experience.", "Fix over-precise metrics in phrasing per ledger presentationNotes: round 41.7% net margin to ~42% and label projected; give a before->after or soften the 97% outreach-time cut (no baseline); '$145K ARR' must stay labeled 'projected'.", "Cross-functional screens (2 of them) are real gates \u2014 prep an eng-lens story (SailLoft Gerrit/Bazel, tech-debt tradeoff) and a design-lens story; have a genuine strength/weakness answer.", "Confirm work authorization before applying (ledger flags it UNCONFIRMED and it's a common knockout field); list GPA only if >= 3.5.", "This is almost certainly a full-time PM loop as documented; verify whether the APM/intern track uses the same 2-day onsite or a compressed version before over-preparing all 5 rounds."], "sources": ["https://robinhood.com/us/en/about-us/ (mission + 7 values verbatim)", "https://newsroom.aboutrobinhood.com/hood-summit-2025-news/ (Legend features, active-trader tools)", "https://investors.robinhood.com/static-files/b2f8b742-6b7f-430d-9a42-3b06d5040bda (Q4/FY2025 results: Gold 4.2M subs >15%, Retirement AUC $26.5B +102%)", "https://investors.robinhood.com/static-files/15576d76-2d02-4aea-a40d-48e694c04a4b (Q1 2026 results: event contracts ~10% of revenue, 8.8B contracts, +320% other transaction revenue)", "https://newsroom.aboutrobinhood.com/hood-summit-2025-news/ and https://robinhood.com/us/en/support/articles/cortex-digests/ (Cortex Digests / Assistant, ~1M users)", "https://robinhood.com/us/en/prediction-markets/ (prediction markets / event contracts product)", "https://www.tryexponent.com/guides/robinhood-pm-interview (interview rounds, case study I/II/III, execution + XFN questions)", "https://www.tryexponent.com/blog/robinhood-interview-process (process overview, 2-day onsite, 3 case studies)", "https://www.glassdoor.com/Interview/Robinhood-Product-Manager-Interview-Questions-EI_IE1167765.0,9_KO10,25.htm (candidate-reported rounds, 2.9/5 difficulty, ~34 days)", "https://www.joinleland.com/library/a/robinhood-product-manager-interview (process/questions/tips)", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json (Neal's verified experiences and fact IDs)"]}, {"company": "Databricks", "products": ["Data Intelligence Platform (the unified lakehouse platform \u2014 Databricks' umbrella product)", "Unity Catalog (unified governance for data, apps, and AI agents across clouds/engines; foundation of the platform; best catalog for Apache Iceberg)", "Mosaic AI + Agent Bricks (build/serve/govern GenAI agents auto-optimized on your enterprise data; model serving, AI search / vector DB, fine-tuning)", "Databricks SQL / DBSQL (serverless data warehouse; new unified SQL editor GA in 2025; ~$1B revenue run-rate)", "Lakeflow (unified data engineering: Lakeflow Connect for ingestion, Spark Declarative Pipelines (formerly DLT), Lakeflow Jobs (formerly Workflows), plus no-code Lakeflow Designer)", "AI/BI: Genie (natural-language 'text-to-insight' conversational analytics) + AI/BI Dashboards", "Databricks One (no-code AI business-intelligence experience for non-technical business users)", "Lakebase (Postgres-based transactional/OLTP database integrated into the lakehouse)", "Delta Lake (open-source storage layer; default table format on Databricks)", "Databricks Assistant (in-product AI copilot for code/SQL/debugging)"], "valuesAndBar": ["Customer obsessed \u2014 'the customer is at the center of everything we do'; PM case study is explicitly graded on a customer-first mindset", "Raise the bar \u2014 'every day is an opportunity to do even better'; high-performance culture that rewards impact", "Truth seeking \u2014 'we make decisions based on data, and we adapt as it changes'; data-driven, comfortable being wrong", "Operate from first principles \u2014 reason from fundamentals, not analogy; drives innovation", "Bias for action \u2014 'speed is critical; we debate, plan, execute and iterate with urgency'; comfort with pace and ambiguity", "Put the company first \u2014 do what's best for the whole company over local/team optimization", "PM competency emphasis: customer-first product sense, data-driven metric/analytical rigor, clear vision + structured communication of thought process, technical feasibility (big-data/Spark/ML/cloud literacy), and cross-functional leadership/collaboration"], "interviewFormat": ["Recruiter screen \u2014 background, motivation, and genuine interest in the data/AI space", "Hiring-manager screen \u2014 deeper dive on past product experience and 'why Databricks / why the data space'", "Take-home case study / assignment \u2014 a real-world product prompt you analyze offline (graded on customer-first mindset, data-driven decisions, vision, and thoroughness of communicated thinking)", "Case-study presentation to a panel \u2014 present recommendation + defend it in live Q&A (clarity + handling pushback are critical)", "Onsite loop of ~3-4 rounds: Product Sense/Design, Technical Feasibility (data pipelines, ETL, distributed systems, Spark, ML workflows, cloud), Behavioral/Leadership (collaboration, conflict, alignment), and Analytical/Execution", "Final round \u2014 strategic conversation with HM or exec leadership on how your product thinking aligns with Databricks' AI + data-democratization vision", "Average reported time-to-hire ~35-39 days"], "productSensePrompts": [{"prompt": "Databricks Genie lets business users ask questions of their data in natural language ('text-to-insight'). How would you improve Genie for a non-technical business analyst who doesn't trust the answers it returns?", "approach": "Anchor on the persona (business analyst, low SQL fluency, high trust bar) and the core job: get a correct answer they can defend to their boss. Name the failure mode = trust/verifiability, not just accuracy. Prioritize features that expose the reasoning: show the generated SQL + the tables/columns used, surface a confidence/ambiguity signal, let the user confirm the entity mapping ('by revenue do you mean net or gross?'), and cite the semantic-layer definition. Tie back to two Databricks principles \u2014 customer obsessed (the analyst's real fear is being wrong in front of leadership) and truth seeking (make the data reasoning inspectable). Define a North Star (share of Genie answers accepted/acted on without escalation to a data engineer) and guardrail metrics (hallucination rate, escalations). Neal can lean on the FieldPulse PRD (fp-1) where AI explainability was a deliberate UX design choice."}, {"prompt": "Design a product (or feature) that helps a data engineer trust and adopt Agent Bricks to ship a production-quality AI agent on their own enterprise data.", "approach": "Clarify scope: enterprise data engineer, goal = a reliable, governable agent in production (not a demo). Segment the journey \u2014 build, evaluate, deploy, monitor \u2014 and find the highest-friction step (evaluation/eval-confidence and governance are where enterprise adoption stalls). Propose: auto-generated eval sets grounded in their data, a quality/regression dashboard, and native Unity Catalog governance (lineage, permissions, PII controls) so the agent is auditable. Prioritize with a RICE-style lens and pick a North Star = number of agents promoted to production per account. Explicitly reason from first principles about why agents fail in enterprise (data quality, hallucination, lack of guardrails) rather than by analogy to consumer chatbots. Neal maps to bb-3 (shipping an agentic pipeline with Node/Playwright/Gemini) and fp-1 (RAG + KPI definition)."}, {"prompt": "Pick a metric to measure the health/success of the Databricks Data Intelligence Platform, and walk through how you'd move it.", "approach": "Distinguish the platform's business North Star (consumption/DBUs \u2014 Databricks monetizes on usage) from a leading product-health metric (weekly active workspaces running meaningful workloads, or time-to-first-value for a new workspace). Build a metric tree: activation -> breadth of products adopted (SQL + pipelines + ML) -> consumption -> retention/expansion. Note the land-and-expand enterprise motion: single-user adoption doesn't equal account health, so segment by account and by persona (engineer vs analyst vs data scientist). Propose one experiment to move activation (guided onboarding / templates) and a guardrail (don't inflate consumption via inefficient queries \u2014 that hurts customer trust). Ties to truth-seeking and customer-obsessed. Neal maps to ep-1 (17->563 activation growth, review-time/engagement metrics) and fp-1 (15+ KPIs with a North Star)."}, {"prompt": "Databricks One is a no-code BI experience aimed at business users who have never touched the platform. How would you drive adoption of it inside an account that already uses Databricks heavily on the data-engineering side?", "approach": "Frame it as an expansion/land-and-expand problem, not net-new acquisition: the data team is the buyer/champion, the business user is the new end user. Map the two-sided friction \u2014 business users don't know the data exists or how to ask; data teams fear ungoverned self-serve. Prioritize: a curated 'certified data products' catalog surfaced to business users (leaning on Unity Catalog governance), in-context prompt suggestions, and a feedback loop back to the data team. North Star = weekly active business users who complete an insight; guardrail = governance violations / bad-data exposure. Reason from first principles about the real blocker (trust + discoverability, not UI). Neal maps to ep-1 (33x user growth via 200+ interviews) and bb-1 (180 customer interviews to find the real job-to-be-done)."}], "behavioralMapping": [{"value": "Customer obsessed", "nealStory": "Founded Biryani Blitz after 180 customer interviews and ran 200+ interviews at Elephant to find the real user need before building \u2014 decisions started from the customer, not the feature.", "factIds": ["bb-1", "ep-1", "bb-role"]}, {"value": "Bias for action", "nealStory": "0->1 launch of the Gerrit/Bazel internal test product in a ~1-month SailLoft internship (Jun-Jul 2025), shipping something that cut manual tests 40% under real time pressure.", "factIds": ["sl-1", "sl-role"]}, {"value": "Truth seeking (data-driven, adapt as data changes)", "nealStory": "Built a privacy-first OpenCV computer-vision funnel (impression->approach->purchase) to get real conversion data on a physical machine, and shipped an ML flashcard engine measured on a 16% exam-score lift and 38% review-time cut \u2014 let the metrics drive iteration.", "factIds": ["bb-2", "ep-1"]}, {"value": "Operate from first principles", "nealStory": "Authored the FieldPulse predictive-restocking PRD (RAG over usage logs/seasonality) reasoning from the underlying problem, defining 15+ KPIs with First-Time Fix Rate as the North Star rather than copying an existing product.", "factIds": ["fp-1"]}, {"value": "Raise the bar", "nealStory": "Scaled Elephant from 17 to 563 active users (33x) in a single quarter \u2014 not settling for incremental growth \u2014 and reached $200K Wharton Startup Challenge finalist with $5K Wharton/UNC Innovation Labs backing for Biryani Blitz.", "factIds": ["ep-1", "bb-4"]}, {"value": "Cross-functional leadership / collaboration (conflict, alignment)", "nealStory": "Translated developer-workflow pain into a GitHub testing interface that accelerated PR-to-merge ~25%, aligning engineers around the workflow change; also leads as UNC PM Club Director of Professional Development and Ultimate Frisbee President.", "factIds": ["sl-2", "ld-1", "ld-2"]}, {"value": "Technical feasibility / AI-native builder", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time ~97%, plus a React/Firebase loyalty app that lifted repeat purchases 40% \u2014 a PM who can actually build agentic/RAG systems.", "factIds": ["bb-3", "fp-1"]}], "analyticalFocus": ["Consumption-based business metrics (DBUs / usage revenue is how Databricks monetizes \u2014 reason in terms of workload consumption, not seat count)", "Land-and-expand / account-level health for an enterprise B2B motion (activation -> product breadth -> expansion -> net revenue retention), segment by account and by persona", "Metric-debugging drills ('a metric dropped X% \u2014 diagnose it') \u2014 practice a structured funnel/segmentation decomposition", "Building metric trees and choosing a North Star vs guardrail metrics (Neal's FieldPulse 15+ KPIs / First-Time Fix Rate North Star is a ready example)", "AI/agent quality metrics: hallucination/accuracy, eval pass rate, answer-acceptance rate, escalation rate \u2014 relevant to Genie/Agent Bricks", "Time-to-first-value / activation and onboarding funnels for a technical developer product", "Basic estimation/market-sizing framed around data/AI workloads or enterprise accounts"], "gotchas": ["Expect a real take-home case study you present to a panel \u2014 the grade is on customer-first thinking, data-driven reasoning, vision, and CLARITY of communicated thought process, plus handling live Q&A pushback. Rehearse presenting, not just analyzing.", "This is a technical infra/data company: you will be tested on big-data literacy \u2014 data pipelines, ETL, distributed systems, Spark, ML workflows, and cloud. Neal should brush up on lakehouse basics (Delta Lake, Unity Catalog governance, warehouse vs lakehouse) so product answers stay credible.", "Users are data engineers, analysts, data scientists, and increasingly non-technical business users (Genie / Databricks One) \u2014 pick the right persona; a consumer-app framing will miss.", "Monetization is consumption-based (DBUs), not seats/subscriptions \u2014 analytical answers that assume per-seat pricing will read as uninformed.", "Recruiters ask 'why the data/AI space / why Databricks' \u2014 Neal must have a genuine, first-principles answer; generic 'I love PM' won't clear the bar.", "Some of Neal's headline numbers are near-ceiling or over-precise (per ledger presentationNotes): soften bb-1's 41.7% -> ~42% projected, and give bb-3's 97% a before->after baseline rather than a bare percentage, or it reads as fabricated.", "Neal's experience is 0->1 / consumer / SMB and startup-scale; Databricks is enterprise B2B infra. Explicitly bridge: frame the customer-interview and metric-rigor muscles as transferable, and show you understand enterprise land-and-expand.", "Work authorization is UNCONFIRMED in the ledger \u2014 confirm before applying since it's a knockout field.", "No confirmed dedicated APM/intern program surfaced in research; the process described is the standard PM loop. Neal should confirm whether an intern-specific track exists and adjust expectations (take-home may be lighter for interns)."], "sources": ["https://www.databricks.com/company/careers/culture", "https://www.databricks.com/company/careers/interview-prep", "https://www.tryexponent.com/blog/databricks-interview-process", "https://www.tryexponent.com/companies/databricks", "https://www.interviewquery.com/interview-guides/databricks-product-manager", "https://prepfully.com/interview-questions/databricks/product-manager", "https://www.databricks.com/blog/whats-new-databricks-unity-catalog-data-ai-summit-2025", "https://www.databricks.com/blog/mosaic-ai-announcements-data-ai-summit-2025", "https://www.constellationr.com/insights/news/databricks-launches-mosaic-agent-bricks-lakeflow-designer-lakehouse", "https://www.databricks.com/product/unity-catalog", "https://www.databricks.com/product/artificial-intelligence/agent-bricks", "https://docs.databricks.com/aws/en/sql/release-notes/2025", "https://en.wikipedia.org/wiki/Databricks", "https://builtin.com/company/databricks/faq/culture-values", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Snowflake", "products": ["Snowflake AI Data Cloud (core cloud data platform used by 13,900+ customers to build, use, and share data/apps/AI)", "Snowflake Cortex AI (managed gen-AI: Cortex Analyst text-to-SQL, Cortex Search, Cortex Agents, LLM functions incl. Anthropic Claude, Llama, Mistral)", "Snowflake CoWork (formerly Snowflake Intelligence) \u2014 personal work agent for knowledge workers; Artifacts, User Memory, Deep Research, Skill Catalog; surfaces in Slack, iOS, Excel", "Snowflake CoCo (formerly Cortex Code) \u2014 data-native AI coding agent with autonomous task execution and VS Code extension", "Snowflake Horizon Catalog + Horizon Context \u2014 governance, lineage, security, and AI-agent context layer (universal AI catalog)", "Snowpark (developer framework for Python/Java/Scala data pipelines and ML in-platform)", "Snowflake Marketplace (share/monetize data, apps, and now AI agents/semantic views across accounts)", "Openflow (GA, managed data integration on Apache NiFi) and Datastream (Kafka-compatible managed streaming)", "Apache Iceberg v3 support (open table format), Semantic Studio, Open Semantic Interchange (OSI) standard"], "valuesAndBar": ["Put Customers First \u2014 'we only succeed when our customers succeed'; reflected in consumption-based pricing and 126% net revenue retention (Jan 2025). This is the #1 value and shows up directly in PM behavioral/case prompts.", "Integrity Always", "Think Big", "Be Agile", "Get It Done (bias to shipping)", "Own It \u2014 end-to-end ownership of outcomes is heavily tested in behavioral rounds", "Rock the Yacht (challenge the status quo / raise concerns)", "Embrace Each Other's Differences", "PM competency emphasis: deep customer/pain-point understanding, ownership end-to-end, collaboration/cross-functional work, technical depth (data platform + AI fluency), and structured problem-solving. Non-eng roles still carry the technical-depth-and-ownership bar."], "interviewFormat": ["Stage 1 \u2014 Recruiter/HM screen (intern hiring reported as fast, often ~1 day turnaround at screen stage).", "Stage 2 \u2014 Technical/skills screen (~60 min). For eng it's HackerRank/CoderPad; for PM expect lighter technical fundamentals + role fit rather than a full coding gauntlet, but be ready for SQL/data-model basics given the product.", "Stage 3 \u2014 Final panel: 3-5 back-to-back ~60-min interviews spanning five areas: technical, expertise (deep dive on your past projects vs. what you'd own here), system/product design, behavioral, and collaboration.", "PM-specific: candidates report the panel skews heavily behavioral but goes DEEP on each problem statement (question categories reported: Behavioral, Product Sense, Product Design, Product Execution). Use STAR.", "Behavioral rounds explicitly probe both ownership stories AND teamwork stories \u2014 have both ready.", "Expertise round: expect a granular walkthrough of one of your shipped products (metrics, tradeoffs, what you'd do differently)."], "productSensePrompts": [{"prompt": "A large enterprise customer says Cortex Analyst (text-to-SQL) 'sometimes returns wrong answers' and they've lost trust. As PM, how do you improve accuracy and rebuild trust?", "approach": "Clarify the failure mode (wrong SQL vs. wrong schema mapping vs. ambiguous NL). Segment users (analyst vs. exec self-serve). Root-cause via a taxonomy of errors; tie fix to Snowflake's real lever \u2014 semantic models / Semantic Studio + Horizon Context so the agent shares one trusted business definition. Propose confidence signals + 'show the SQL' explainability so users can verify (mirror Neal's AI-explainability UX in fp-1). North-star metric: % of queries the user accepts without editing; guardrail: hallucination/error rate. Ties to 'Put Customers First' \u2014 trust is the product."}, {"prompt": "Design a feature that makes Snowflake Marketplace better for a first-time buyer trying to find and trust a dataset or AI agent.", "approach": "Frame the job-to-be-done: discovery -> evaluation of trust/quality -> integration. Identify friction (can't judge freshness, lineage, or cost before buying). Propose trust signals (Horizon lineage, sample preview, usage/quality ratings) and a low-commitment try-before-buy flow. Prioritize with a reach/impact frame; define success (activation: buyer runs first query on shared data within X min) and a counter-metric (return/dispute rate). Note the two-sided-marketplace tradeoff between buyer trust and provider friction."}, {"prompt": "Snowflake wants to grow adoption of CoWork (its knowledge-worker agent) among non-technical business users. What would you build and how would you measure it?", "approach": "Pick the persona (a business analyst who lives in Slack/Excel, not the Snowflake UI). Meet them where they are \u2014 lean into existing Slack/Excel/iOS surfaces. Design an onboarding that produces one 'wow' answer fast (grounded in their own governed data via Horizon Context). Metrics: WAU, time-to-first-successful-answer, queries-per-user, retention W1->W4 as North Star; guardrail: answer-correctness/trust. Reference Neal's real 17->563 (33x) activation growth via user interviews (ep-1) as the playbook."}, {"prompt": "The consumption pricing model means a feature that increases query volume increases revenue but can spook cost-conscious customers. How do you balance driving usage vs. protecting the customer relationship?", "approach": "Name the tension explicitly (revenue vs. 'Put Customers First'/trust). Segment by customer maturity; propose value-aligned levers: cost visibility/budget alerts, right-sizing recommendations, and features where more usage = more customer value (not just spend). Measure net revenue retention AND a customer-health/trust proxy, not raw consumption alone. Shows Snowflake-specific business-model fluency, which differentiates in the expertise round."}], "behavioralMapping": [{"value": "Put Customers First", "nealStory": "Founded Biryani Blitz off 180 customer interviews before building, and instrumented a CV telemetry funnel to keep learning from real customer behavior \u2014 decisions driven by customer pain, not assumptions. Reinforce with the 200+ interviews behind the Elephant productivity app.", "factIds": ["bb-1", "bb-2", "ep-1"]}, {"value": "Own It (end-to-end ownership of outcomes)", "nealStory": "Led the 0->1 launch of SailLoft's internal Gerrit/Bazel software-test product end to end \u2014 from developer-workflow pain points to shipped tooling that cut manual tests 40% \u2014 owning both PM and dev work as the intern who drove it.", "factIds": ["sl-1", "sl-2", "sl-role"]}, {"value": "Get It Done / Be Agile (bias to shipping)", "nealStory": "Scaled the Elephant app 17->563 active users (33x) in a single quarter and shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 fast, measurable shipping under a tight timeline.", "factIds": ["ep-1"]}, {"value": "Think Big", "nealStory": "Built Biryani Blitz as a 0->1 hot-food vending platform with a projected ~$145K ARR/machine model, scaled an AI lead-gen agent across 100+ universities, and reached $200K Wharton Startup Challenge finalist backed by Wharton + UNC Innovation Labs.", "factIds": ["bb-1", "bb-3", "bb-4"]}, {"value": "Technical depth + AI fluency (PM bar)", "nealStory": "AI-native builder: shipped a privacy-first OpenCV CV telemetry system and an agentic lead-gen pipeline (Node/Playwright/Gemini); authored a RAG predictive-restocking PRD with 15+ KPIs and a First-Time-Fix-Rate North Star \u2014 directly relevant to Snowflake's Cortex/agent/RAG product surface.", "factIds": ["bb-2", "bb-3", "fp-1"]}, {"value": "Rock the Yacht / cross-functional collaboration", "nealStory": "Translated developer pain points into a GitHub testing interface that accelerated PR-to-merge ~25% and built a 2-click Chrome-extension client workflow \u2014 worked across engineers and clients to change an existing process. Pair with UNC PM Club Director of Professional Development and Ultimate Frisbee (BatCH) President for team leadership.", "factIds": ["sl-2", "ld-1", "ld-2"]}], "analyticalFocus": ["North-star metric definition and guardrail/counter-metrics (Neal has a real example: First-Time Fix Rate North Star + 15+ KPIs in fp-1)", "Consumption/usage economics \u2014 Snowflake's consumption-based pricing means credit/query-volume, cost-per-query, and Net Revenue Retention (126%) are business-critical metrics a PM must reason about", "Adoption & activation funnels: activation rate, time-to-first-value, WAU/MAU, retention cohorts (W1->W4) \u2014 Neal's 17->563 (33x) growth and CV impression->approach->purchase funnel map here", "AI-quality metrics: answer accuracy, hallucination/error rate, query-acceptance-without-edit, trust signals for Cortex Analyst/Agents", "SQL / data-model fluency and basic estimation (market sizing, ARR/margin math like the ~42% projected net margin) given the data-platform domain", "Experimentation / A-B testing to validate feature impact (listed skill)"], "gotchas": ["Snowflake's #1 value is Put Customers First, and it shows up as a real reported case question: 'a customer who is 7% of ARR threatens to leave unless you build a feature only they need \u2014 what do you do?' Have a framework (segment impact, roadmap opportunity cost, precedent-setting risk) ready \u2014 do NOT just say 'build it'.", "Expect a real 'Own It' probe AND a 'teamwork/collaboration' probe as separate questions \u2014 prepare distinct stories for each so you don't reuse one.", "It is an ENTERPRISE data-infra company, not consumer. Product-sense answers should reason about enterprise buyers, governance/trust, data engineers/analysts, and consumption cost \u2014 not consumer DAU vanity metrics.", "Even for PM, there is a technical bar: be ready for SQL basics and to reason about data models / how the platform works. Don't hand-wave the technical layer.", "Behavioral rounds 'go deep' \u2014 interviewers push multiple layers into one story. Know the metrics and tradeoffs behind each ledger bullet cold.", "Watch over-precise numbers from the ledger: say '~42% projected net margin' (not 41.7%) and give a before->after for the '97% outreach time cut' (bb-3) so it reads credible, not fabricated \u2014 per the ledger's own presentationNotes.", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must have his answer ready for the knockout question; do not assume.", "Product names changed at Summit 2026: Snowflake Intelligence -> CoWork, Cortex Code -> CoCo. Using current names signals you did fresh research."], "sources": ["https://careers.snowflake.com/us/en/job/ (Product Management Intern - Summer 2026, Menlo Park; listing surfaced via search, direct page returned 410)", "https://www.tryexponent.com/blog/snowflake-interview-process", "https://www.interviewquery.com/interview-guides/snowflake-product-manager", "https://www.glassdoor.com/Interview/Snowflake-Interview-Questions-E928471.htm", "https://prepfully.com/interview-questions/snowflake/product-manager", "https://customcareer.miami.edu/blog/2026/05/14/get-a-job-at-snowflake-interview-process-and-top-questions/", "https://pestel-analysis.com/blogs/mission/snowflake (core values list)", "https://builtin.com/company/snowflake/faq/culture-values", "https://www.snowflake.com/en/product/features/cortex/", "https://www.snowflake.com/en/product/features/horizon/", "https://www.snowflake.com/en/news/press-releases/snowflake-advances-trusted-ai-with-snowflake-horizon-catalog-centralizing-governance-context-and-security-across-the-enterprise/", "https://atlan.com/know/snowflake/summit-2026-announcements/", "https://www.constellationr.com/insights/news/snowflake-summit-2026-context-custom-model-training-iceberg-v3", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Roblox", "products": ["Roblox platform / app (3D immersive experiences, the core game universe)", "Roblox Studio (creation engine used by developers to build experiences)", "Avatar Marketplace (buy/sell clothing, accessories, emotes for Robux; dynamic + regional pricing since 2024-25)", "Developer Exchange / DevEx (converts Earned Robux to fiat; 23,500+ creators, DevEx rate raised in 2025)", "Robux virtual currency (differential + regional pricing across platforms)", "Creator monetization suite: game passes, developer products, Premium payouts, UGC avatar items, immersive/rewarded-video ads, in-experience subscriptions, Creator Rewards", "Roblox Connect / private messaging & voice (social + safety surface)", "Roblox for brands (branded experiences and collaborations, e.g. Build-A-Bear-style activations)"], "valuesAndBar": ["Core value: Respect the Community \u2014 decisions in everyone's best interest; explicit priority order Community > Company > Team > Individual (safety, esp. for younger users, is central)", "Core value: We are Responsible \u2014 owned by intended AND unintended consequences of your actions", "Core value: Take the Long View \u2014 set long-term vision first, even when making short-term calls; drive innovation", "Core value: Get Stuff Done \u2014 take initiative, relentlessly iterate toward long-term goals (bias to shipping)", "APM bar de-emphasizes deep platform ownership; emphasizes STRUCTURED thinking, learning potential, clarity of communication, and ability to learn Roblox's systems fast", "~75% of employees are in product & engineering; strong builder/technical culture \u2014 a technical-founder PM profile fits well", "Genuine motivation for gaming / the creator economy is explicitly screened for in the recruiter round"], "interviewFormat": ["Stage 1 \u2014 Recruiter screen (~30 min): role fit, culture alignment, genuine interest in gaming/creator economy", "Stage 2 \u2014 Online Assessment (~1.5-2 hrs): game-based strategy evaluation ON the Roblox platform, 2-3 timed strategy games (e.g. 'Kaiju Cats'-style: maximize 3 cats' combined power in ~15 turns, avoid hazards, hit order bonuses). Candidates write short essays explaining their strategic approach. Tests systems thinking, prioritization under pressure, creative problem-solving. Practice game 'Kaiju Cats' is provided", "Stage 3 \u2014 Final Loop: three rounds of ~30-45 min each \u2014 (a) Product Sense/design within the Roblox ecosystem, (b) Analytical/technical case + (c) Behavioral (hiring-manager-led)", "Product Sense round: design/improve something in Roblox's world (onboarding for first-time creators, avatar customization for under-connected regions, brand collab, private-message s
