experience."], "productSensePrompts": [{"prompt": "Agentforce Service can now autonomously resolve customer support cases. Design an improvement that increases how many cases the AI agent can safely close without a human \u2014 while protecting Trust (Salesforce's #1 value).", "approach": "Anchor on Trust first. Segment users: the support agent (co-pilot), the end customer, and the admin who configures guardrails. Pick the admin+customer as primary. Frame the tension: automation rate vs. safety/accuracy. Propose a confidence-threshold + escalation design (agent auto-resolves high-confidence, deterministic cases; routes ambiguous/high-risk ones to humans with a drafted answer), plus an audit trail and explainability so customers/admins can see WHY the agent acted. North-star metric: % of cases fully resolved by agent at >=X CSAT with <Y% reopen/escalation-reversal rate. Guardrail metrics: reopen rate, incorrect-resolution rate, customer trust/CSAT. Neal can lean on FieldPulse (fp-1) explainability + KPI work and Biryani Blitz CV-funnel analytics (bb-2)."}, {"prompt": "Design a feature to help small-business admins onboard onto Agentforce faster \u2014 most SMBs churn before they get value from an AI agent.", "approach": "Define the goal (time-to-first-value / activation) and the user (non-technical SMB admin, low data maturity). Diagnose the funnel: connect data \u2192 configure agent \u2192 trust it \u2192 go live. Identify the biggest drop-off (usually configuration + trust). Propose guided templates by industry, a 'sandbox' where the agent runs on sample data before touching production, and a preview of the agent's reasoning. Tie to Customer Success value. Metrics: activation rate, time-to-first-agent-action, 30-day retention. Prioritize with reach/impact/effort. Neal maps this cleanly to Elephant (ep-1) 17->563 activation growth and 200+ interviews, and SailLoft's 2-click client workflow (sl-2)."}, {"prompt": "How would you improve Data Cloud (Data 360) so that data quality issues don't silently degrade the AI agents built on top of it?", "approach": "Start from the insight that agents are only as trustworthy as their data (ties Trust + the Agentforce dependency). User: data admin / RevOps. Frame the problem: garbage-in leads to confident-but-wrong agent actions. Propose a data-health scoring layer, freshness/completeness monitors, and 'agent readiness' checks that warn before an agent is deployed on low-quality data, plus lineage so you can trace a bad agent action back to its data. North-star: agent action accuracy attributable to data quality; guardrail: false-positive alert fatigue. Neal can reference his RAG-over-usage-logs PRD (fp-1) and analytics-pipeline/telemetry work (bb-2)."}, {"prompt": "Slack now surfaces Agentforce agents inside channels. Pick a metric that tells us whether this feature is actually valuable, and design one experiment to move it.", "approach": "This is analytical + product sense. Reject vanilla metrics (impressions). Choose an engagement-to-value metric: % of agent suggestions in Slack that are accepted AND lead to a completed downstream action (e.g., deal updated, case resolved) per weekly active team. Define the counterfactual and a clean A/B (teams with in-channel agent vs. control who use it in the standalone app). Watch guardrails: interruption/annoyance (dismiss rate), Trust (wrong actions taken). Propose iterate loop. Neal can ground this in his A/B-testing + KPI skills and the impression->approach->purchase funnel he instrumented at Biryani Blitz (bb-2)."}], "behavioralMapping": [{"value": "Customer Success (deep user research \u2192 outcomes)", "nealStory": "Elephant Productivity Suite: ran 200+ user interviews and turned that research into a product that scaled from 17 to 563 active users (33x) in one quarter, with an ML flashcard engine that lifted exam scores 16% and cut review time 38%. Use for 'tell me about a time you obsessed over the customer / drove measurable outcomes.'", "factIds": ["ep-role", "ep-1"]}, {"value": "Innovation (0->1 building, AI-native)", "nealStory": "Biryani Blitz: launched a 0->1 AI hot-food vending platform at UC Berkeley (fresh biryani in 60s), founded after 180 customer interviews, with a privacy-first computer-vision telemetry funnel. Use for 'tell me about a time you built something from scratch / took a big risk / innovated.'", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "Trust (privacy, responsible use of data/AI)", "nealStory": "Biryani Blitz privacy-first computer-vision telemetry: instrumented an impression->approach->purchase funnel WITHOUT compromising customer privacy \u2014 a direct story for Salesforce's #1 value about handling data responsibly. Pair with the AI lead-gen agent's guardrails.", "factIds": ["bb-2", "bb-3"]}, {"value": "Prioritization / execution under changing priorities", "nealStory": "SailLoft: led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40%; translated developer pain points into a GitHub testing interface that accelerated PR-to-merge ~25%. Use for 'walk me through a product from concept to launch' and 'how do you prioritize / manage tradeoffs.'", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Stakeholder management / cross-team dependencies", "nealStory": "SailLoft: translated developer-workflow pain points into shipped tooling (Gerrit voting decision, Chrome extension 2-click workflow) \u2014 working across dev stakeholders in an enterprise dev-tools context, which mirrors Salesforce's B2B enterprise environment. Also UNC PM Club Director of Professional Development for leading a team.", "factIds": ["sl-2", "sl-1", "ld-1"]}, {"value": "Analytical rigor / defining metrics (North Star, KPIs)", "nealStory": "FieldPulse Predictive Restocking PRD: authored a RAG-over-usage-logs AI predictive-restocking PRD, designed a 3-flow UX with AI explainability, and defined 15+ KPIs with First-Time Fix Rate as the North Star. Direct fit for Salesforce's analytics/metrics round.", "factIds": ["fp-1"]}, {"value": "Leadership / drive / ambition", "nealStory": "Biryani Blitz backed by Wharton + UNC Innovation Labs ($5K), $200K Wharton Startup Challenge finalist; plus President of UNC Ultimate Frisbee and Director of Professional Development for the UNC PM Club. Use for 'tell me about a time you led' or 'why should we pick you.'", "factIds": ["bb-4", "ld-2", "ld-1", "ld-3"]}, {"value": "Efficiency / automation impact (scrappy builder)", "nealStory": "Biryani Blitz: shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%; QR loyalty app (React/Firebase) lifted repeat purchases 40%. Use for 'tell me about a time you drove efficiency / built automation.' Note: soften the 97% by framing as a before->after time, not a bare percentage.", "factIds": ["bb-3"]}], "analyticalFocus": ["Choosing the right North-Star metric for an AI-agent feature and separating it from vanity metrics (impressions/usage) \u2014 value-based metrics like accepted-suggestion-to-completed-action.", "Guardrail metrics unique to autonomous AI: incorrect/unsafe action rate, case reopen rate, escalation-reversal rate, hallucination rate, Trust/CSAT \u2014 Salesforce cares that automation doesn't erode Trust.", "Activation and time-to-first-value for enterprise/SMB onboarding (retention, 30/60/90-day cohorts) \u2014 very relevant to a land-and-expand SaaS model.", "Diagnosing a metric drop / funnel debugging (segment by user type, product surface, data-quality tier) \u2014 Salesforce asks execution + analytics back-to-back.", "A/B test design with a valid counterfactual and enterprise constraints (org-level rather than user-level randomization, small-N enterprise accounts).", "Enterprise SaaS economics: ARR, net revenue retention, seat expansion, per-account value \u2014 frame impact in these terms since Salesforce is B2B, not consumer.", "Back-of-envelope estimation (e.g., size the support-cases-per-day an agent could deflect, or ARR impact of a 5-point activation lift)."], "gotchas": ["Salesforce is ENTERPRISE B2B, not consumer. Do not default to consumer instincts (DAU, viral growth). The buyer (admin/exec), the user (rep/agent), and the beneficiary (end customer) are often DIFFERENT people \u2014 always disambiguate the user in a design prompt.", "Trust is the #1 value and it is not a throwaway. In any AI/Agentforce prompt, explicitly address privacy, security, explainability, and safe automation \u2014 omitting this reads as tone-deaf for 2026 Salesforce.", "The interview is 'inverted': budget less time on the opening framework and expect 4-5 escalating technical/strategic follow-ups per question. Practice defending and deepening an answer, not just structuring it.", "Cases are Salesforce-product-specific. Come in fluent in Agentforce, Data 360, Sales/Service Cloud, and the Agentforce rebrand \u2014 a generic 'design an app for X' answer signals you didn't do homework.", "Know the values by name and ideally V2MOM and Ohana/Trailblazer culture; weave them into behavioral answers naturally (especially Trust and Customer Success).", "Ledger phrasing risks: the '97% outreach-time cut' (bb-3) and '41.7% net margin' (bb-1) are flagged as near-ceiling/over-precise \u2014 present the 97% as a before->after time and round margin to ~42% and label it 'projected/estimated.' Never invent numbers or experiences beyond the ledger.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must confirm before knockout screening questions.", "Grad year is May 2028, so Neal is targeting the SUMMER INTERNSHIP APM path, not the 2-year FT program \u2014 position accordingly and lead with the Futureforce internship motivation."], "sources": ["https://www.salesforce.com/company/our-values/", "https://trailhead.salesforce.com/content/learn/modules/salesforce-culture-and-values/explore-salesforce-culture-and-values", "https://www.salesforce.com/news/stories/sustainability-core-value/", "https://www.salesforce.com/company/careers/university/associate-program-manager/", "https://www.salesforce.com/blog/futureforce-associate-product-manager-internship/", "https://www.tryexponent.com/guides/salesforce-product-manager-interview", "https://www.tryexponent.com/blog/salesforce-interview-process", "https://prepfully.com/interview-guides/salesforce-product-manager-interview-guide", "https://medium.com/@amyru/pm-interview-diaries-the-salesforce-apm-interview-95c7b65f2716", "https://www.joinleland.com/library/a/salesforce-apm", "https://www.glassdoor.com/Interview/Salesforce-Product-Manager-Interview-Questions-EI_IE11159.0,10_KO11,26.htm", "https://vantagepoint.io/blog/sf/the-complete-guide-to-salesforces-agentforce-ecosystem-understanding-the-full-product-portfolio-in-2026", "https://crmxai.com/blog/salesforce-agentforce-rebrand-product-names", "https://www.sec.gov/Archives/edgar/data/1108524/000110852426000060/crm-20260131.htm", "https://www.productmanagementexercises.com/interview-questions/salesforce-behavioral"]}, {"company": "Adobe", "products": ["Adobe Photoshop (raster image editing; now with AI Generative Fill, Harmonize, Generative Upscale)", "Adobe Firefly (generative-AI creative platform + Firefly AI Assistant that orchestrates ~100 tools via natural language)", "Adobe Express (freemium quick-design tool aimed at non-pros / social creators)", "Adobe Acrobat + Reader (PDF creation/e-sign, now with conversational/agentic AI assistant)", "Adobe Premiere Pro / Premiere (video editing, AI-assisted)", "Adobe Illustrator (vector graphics)", "Adobe Lightroom (photo management/editing)", "Frame.io (collaborative review/approval for creative teams)", "Adobe Experience Cloud (enterprise marketing / personalized digital experiences / content supply chain)"], "valuesAndBar": ["CURRENT (2023 revamp) core values: Create the Future, Own the Outcome, Raise the Bar, Be Genuine", "Create the Future = customer-centric + relentless innovation to address unmet/unknown needs (maps directly to PM 'product sense')", "Own the Outcome = bias toward action, empowerment, ownership of results end-to-end", "Raise the Bar = never settle for good enough; strive to be first/only/best", "Be Genuine = inclusion, respect, honesty, authenticity", "Mission: 'changing the world through personalized digital experiences'; theme of 'creativity for all' + responsible AI", "PM competencies Adobe explicitly grades: (1) Product sense \u2014 understanding user needs & behaviors not just features, (2) Data-driven \u2014 running tests / defining & analyzing metrics, (3) Communication \u2014 succinct, no rambling, (4) Industry/domain relevance", "GOTCHA on values: some third-party guides still cite the OLD values 'Genuine, Exceptional, Innovative, Involved' \u2014 do not use those; use the 2023 set above"], "interviewFormat": ["Total process ~2-6 weeks, typically 3-5 rounds (can be 4-6 for senior)", "Round 1: Recruiter phone screen (~30 min) \u2014 resume walkthrough + motivation / why Adobe", "Round 2: Phone/hiring-manager interview (~45 min) \u2014 mix of behavioral + a product question", "Round 3+: Onsite loop \u2014 ~4-5 interviews of 30-50 min each with senior PMs & team members, covering product design, strategy, analytical/metrics, and behavioral", "Interviewers often pose a REAL problem they personally faced on their team (be ready to reason live, not recite a framework)", "Later/final round may be with a director/VP/GM: product vision, roadmap critique, prioritization under market shifts", "Note: intern/APM-specific loop is a lighter version of the same structure; expect fewer rounds and more emphasis on product sense + behavioral than deep strategy"], "productSensePrompts": [{"prompt": "Design a feature to bring Adobe Express to first-time / non-designer users (e.g., a small-business owner making a social post). How would you make it feel effortless?", "approach": "Clarify the target user (non-pro, mobile-first, time-poor) and the job-to-be-done (a good-enough on-brand asset fast, not pixel perfection). Segment: solopreneurs vs students vs social-media managers; pick solopreneurs. List pains: blank-canvas paralysis, brand consistency, not knowing design rules. Prioritize a solution: template-first + AI 'describe it and we draft it' (Firefly) + guardrails (brand kit auto-applied). Contrast against Canva as the real competitor. North-star metric: % of new users who publish/export a first asset within session 1 (time-to-first-value); guardrail: retention W1 and edits-per-asset."}, {"prompt": "Adobe just shipped the Firefly AI Assistant that orchestrates tools across Photoshop/Premiere/Illustrator from one natural-language prompt. How would you measure whether it's succeeding, and what would you improve next?", "approach": "State the goal: lower the skill floor + speed up expert workflows without eroding trust/control. Define success metrics tiered: adoption (% of eligible users invoking the assistant), value (task completion rate, time-to-completion vs manual, # of manual tool-switches avoided), quality/trust (accept-vs-reject rate of AI actions, undo rate, correction edits), retention. Watch the pro-user risk: experts fearing loss of control \u2014 so propose 'show the steps / editable, reversible actions.' Next bets: transparency of what tools it called, and letting users save/replay a prompt as a repeatable recipe."}, {"prompt": "Acrobat/Reader is adding a conversational AI assistant over PDFs. Pick a user segment and design the core experience + how you'd monetize it (freemium).", "approach": "Pick a segment: knowledge worker drowning in long PDFs (contracts, research, reports). JTBD: 'find/understand/act on what's in this document fast.' Core flows: summarize, ask-questions-with-citations (grounded, must cite the page to build trust), and generate (draft an email/answer from the doc). Freemium line: free = summarize + limited Q&A; paid = multi-doc analysis, export, and integrations. Metrics: query success rate, citation click-through (trust proxy), free-to-paid conversion, queries-per-document. Call out the hallucination risk explicitly \u2014 grounding + citations are the mitigation."}, {"prompt": "How would you improve retention / reduce churn for a Creative Cloud subscription among lapsing hobbyist (non-professional) users?", "approach": "Frame churn drivers via funnel: (1) never activated (didn't learn the tool), (2) infrequent need, (3) price sensitivity, (4) switched to a free competitor. Instrument to find the biggest bucket, hypothesize it's activation for hobbyists. Interventions: guided AI-assisted first projects (drop the learning curve), usage-based nudges, and a lighter/cheaper Express-tier off-ramp instead of full cancel (save the relationship). North star: monthly active creators who export \u22651 asset; guardrail: downgrade-vs-cancel ratio. Tie to 'creativity for all' \u2014 reducing the skill barrier is the strategic lever."}], "behavioralMapping": [{"value": "Create the Future (customer-centric, address unmet needs)", "nealStory": "Founding Biryani Blitz off 180 customer interviews to identify an unmet need (fresh hot food in 60s from vending) and building a 0\u21921 platform deployed at UC Berkeley \u2014 pair with Elephant's 200+ interviews driving the ML flashcard engine. Use for 'tell me about a time you identified an unmet user need' / 'building something new from scratch.'", "factIds": ["bb-1", "bb-role", "ep-1"]}, {"value": "Own the Outcome (bias to action, end-to-end ownership)", "nealStory": "As Founder & AI PM, owning Biryani Blitz end-to-end \u2014 from customer research to shipping CV telemetry, a lead-gen agent, and a loyalty app, plus being accountable to investors (Wharton/UNC backing, $200K challenge finalist). Best answer for 'time you took ownership of a result' / 'drove something to completion under pressure.'", "factIds": ["bb-role", "bb-2", "bb-3", "bb-4"]}, {"value": "Raise the Bar (never settle, measurable excellence)", "nealStory": "Scaling Elephant 17\u2192563 active users (33x) in one quarter and shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 quantified 'never good enough' iteration. Also SailLoft cutting manual tests 40% and accelerating PR-to-merge ~25%. Use for 'time you exceeded expectations / raised the standard.'", "factIds": ["ep-1", "sl-1", "sl-2"]}, {"value": "Be Genuine (honesty, working with/for people, humility)", "nealStory": "Leadership as UNC PM Club Director of Professional Development and Ultimate Frisbee (BatCH) President \u2014 plus the founder honesty angle: being transparent with users during 180+/200+ interviews and adjusting the product to what they actually said. Use for 'time you gave/received hard feedback' or 'worked with a difficult stakeholder/team.'", "factIds": ["ld-1", "ld-2", "bb-1", "ep-1"]}, {"value": "Data-driven / analytical (Adobe grades this explicitly)", "nealStory": "Built privacy-first OpenCV telemetry tracking the impression\u2192approach\u2192purchase funnel to give a physical machine e-commerce-grade conversion analytics; authored a FieldPulse PRD defining 15+ KPIs with First-Time Fix Rate as North Star. Use for any 'how do you use data / define metrics' behavioral prompt.", "factIds": ["bb-2", "fp-1"]}, {"value": "Navigating ambiguity (common Adobe behavioral prompt)", "nealStory": "0\u21921 launch of the Gerrit-based internal test product at SailLoft \u2014 translating vague developer-workflow pain into a shipped GitHub testing interface + Chrome extension; and the whole Biryani Blitz 0\u21921 with no template. Use for 'tell me about a time you navigated ambiguity.'", "factIds": ["sl-1", "sl-2", "bb-1"]}], "analyticalFocus": ["Defining a North-Star metric + guardrail metrics for a creative/consumer product (Neal has direct reps: First-Time Fix Rate on FieldPulse, funnel metrics at Biryani Blitz)", "Conversion-funnel analysis (impression\u2192approach\u2192purchase is Neal's own frame; Adobe cares about activation\u2192retention\u2192free-to-paid conversion)", "A/B testing / experimentation design (listed in Adobe's 'data-driven' competency and Neal's skills)", "Estimation / market sizing (e.g., 'how many images are edited in Photoshop per day' / TAM for Express) \u2014 practice back-of-envelope with stated assumptions", "Measuring AI-feature success specifically: adoption, task-completion, accept/reject rate, undo rate, trust proxies \u2014 high-probability given Firefly/agentic push", "Retention & churn diagnosis for subscription (Creative Cloud) products"], "gotchas": ["Do NOT only talk about Photoshop \u2014 Adobe interviewers explicitly flag candidates who can't reason about products beyond Photoshop. Know Express, Firefly, Acrobat, Premiere, Frame.io.", "Use the CURRENT values (Create the Future / Own the Outcome / Raise the Bar / Be Genuine). Several prep sites still list the retired values (Genuine, Exceptional, Innovative, Involved) \u2014 using those signals stale prep.", "Actually download and use the target team's product before the loop \u2014 'lack of product research' is a named rejection reason.", "Be succinct \u2014 Adobe explicitly grades communication and penalizes rambling; structure answers and land the point.", "Be genuinely data-driven, not hand-wavy \u2014 always define metrics and how you'd validate, even in product-design answers.", "For AI features, proactively raise trust/control/hallucination risks and mitigations \u2014 Adobe's whole 2025 narrative is 'responsible AI' + keeping pros in control.", "Ledger hygiene: Biryani Blitz $145K ARR and ~42% margin are PROJECTIONS \u2014 say 'projected'; the 97% outreach-time cut has no baseline, so frame as before\u2192after or soften. Never present projections as realized.", "WorkAuth and GPA are UNCONFIRMED in the ledger \u2014 Neal must supply before submitting; don't fabricate."], "sources": ["https://interview.norahq.com/interview-guides/adobe-product-manager-interview-guide-2025", "https://www.tryexponent.com/guides/adobe-pm-interview", "https://www.interviewquery.com/interview-guides/adobe-product-manager", "https://prepfully.com/interview-guides/adobe-product-manager", "https://blog.adobe.com/en/publish/2023/03/07/evolving-adobes-values-culture", "https://bstrategyhub.com/adobe-mission-statement-vision-core-values-analysis/", "https://news.adobe.com/news/2025/10/adobe-max-2025-creative-cloud", "https://venturebeat.com/technology/adobes-new-firefly-ai-assistant-wants-to-run-photoshop-premiere-illustrator-and-more-from-one-prompt", "https://www.adobe.com/products/firefly.html"]}, {"company": "Lyft", "products": ["Lyft Rideshare core app (rider matching, Priority Pickup, Lyft XL, Lyft Lux, Extra Comfort)", "Wait & Save (lower-cost ride option, trades time for savings)", "Price Lock (subscription-style fare predictability for recurring/commute rides; part of Risher's push to move away from surge pricing)", "Lyft Silver (simplified rideshare product for older adults: easier-entry cars, simplified app, live phone support)", "Lyft Bikes / Citi Bike / Bay Wheels and e-scooters (shared micromobility via Lyft Urban Solutions; next-gen ebikes in NYC, Chicago, SF, DC Metro)", "Lyft Media (in-app, in-car tablet, and bike-station advertising network; targeting ~$100M revenue run-rate)", "Autonomous / robotaxi on the Lyft app via partners (May Mobility in Atlanta live; Mobileye in Dallas ~2026; Baidu in Europe)", "Lyft driver app (earnings tools, Upfront Pay/transparency, earnings guarantees)"], "valuesAndBar": ["Four core operating principles: Obsess Over Members, Make it Happen, Uplift Others, Be Yourself", "Customer obsession \u2014 CEO David Risher's central theme; 'members' framing spans both riders AND drivers (three-sided marketplace)", "Data-driven decision-making \u2014 Lyft explicitly weights the Product Execution/metrics round heavily", "Belonging / inclusion ('We All Belong') \u2014 DEI is a stated cultural pillar", "Execution-oriented, profitable-growth culture (record Q3 2025 revenue $1.7B, gross bookings $4.8B) \u2014 bias to shipping and impact", "PM competency emphasis: product sense (creativity + tradeoffs), analytical rigor (KPIs/metrics), leadership & self-awareness (initiative, learning from failure)"], "interviewFormat": ["Stage 1 - Recruiter screen (30 min): background, why Lyft, why PM, resume walk", "Stage 2 - Two PM phone/video screens (45-60 min each): one product-leaning, one execution/analytical-leaning", "Stage 3 - Onsite loop (typically 3 rounds, can be 2-4): Product Sense, Product Execution (analytical/metrics), and Leadership & Experience (behavioral)", "Stage 4 - Team matching: exploratory conversations with prospective managers", "Product Sense round: discuss/critique an existing product, propose improvements or design something new, show structured thinking + explicit tradeoffs", "Product Execution round: define success metrics/KPIs, diagnose metric changes, prioritize opportunities \u2014 very analytical", "Leadership/Behavioral round: initiative, conflict, learning from failure, leadership, passion, knowledge of Lyft values", "Total timeline ~3-5 weeks", "APM Program specifics: 18-month rotational program, two ~9-month rotations across different teams; small cohorts with mentorship for early-career talent"], "productSensePrompts": [{"prompt": "Design a product/feature to improve the rider experience for Lyft Silver (older-adult riders).", "approach": "Clarify the user: older adults who face friction with app complexity, mobility getting in/out of cars, and trust/safety. Segment (tech-comfortable vs. caregiver-assisted vs. low-vision/low-mobility). Pick the highest-pain segment, list pain points across the journey (booking, matching, pickup identification, ride, payment, support). Prioritize 2-3 solutions (e.g., simplified one-tap 'ride to my saved place', voice/phone booking, driver-side accessibility flags, live human support surfaced prominently). Tie to a North Star like completed rides per older-adult MAU and guardrail on support-contact rate. Name tradeoffs (simplicity vs. feature depth; caregiver access vs. rider privacy)."}, {"prompt": "Lyft wants to move riders away from surge pricing toward Price Lock subscriptions. Should they, and how would you design/expand it?", "approach": "Frame the marketplace tension: surge balances supply/demand and protects driver earnings; subscriptions trade that flexibility for rider predictability and retention. Identify the target user (high-frequency commuters). Design: fixed-fare windows on a route for a monthly fee, overage rules, blackout for extreme demand. Reason about the two-sided impact \u2014 riders gain predictability, but Lyft must still incentivize drivers during peaks (subsidize the gap). Metrics: subscriber retention, rides-per-subscriber, contribution margin per locked ride, driver-supply fill rate during peaks. Call the risk: cannibalizing high-margin surge revenue and supply shortfalls."}, {"prompt": "How would you grow Lyft Media (the in-app / in-car / bike-station ad network) toward a bigger revenue line?", "approach": "Establish it's a three-sided marketplace now including advertisers. Inventory audit: app surfaces (map, ride-waiting, receipt), in-car tablets, bikeshare station screens. Value prop: high-intent, geo/time-contextual, captive attention (cited 7x brand impact, 10x CTR). Growth levers: expand inventory without hurting rider NPS, better targeting using ride context, self-serve SMB ad tooling, measurement/attribution to justify spend. North Star: ad revenue per active rider; guardrail: rider satisfaction / ride-completion unaffected. Tradeoff: ad load vs. core experience integrity."}, {"prompt": "A May Mobility robotaxi is now hailable in the Lyft app in Atlanta. Design the rider experience for hailing an autonomous vehicle, and decide when to match a rider to AV vs. human.", "approach": "New user anxieties: safety, no driver to help, unlock/find-the-car, edge cases (item left behind, accessibility). Design onboarding education, in-app support button, clear AV labeling and opt-in/opt-out. Matching logic: match AV when route is geofence-safe, weather permits, rider has opted in, and it improves ETA/economics; fall back to human otherwise. Metrics: AV opt-in rate, AV completion rate, support contacts per AV ride, rider CSAT vs. human baseline. Tradeoff: AV supply is limited and cheaper long-term, but a bad early experience damages trust \u2014 protect the human fallback."}], "behavioralMapping": [{"value": "Obsess Over Members", "nealStory": "Founded Biryani Blitz after 180 customer interviews and built privacy-first CV telemetry to track the impression-to-purchase funnel so the physical machine could act on real user behavior \u2014 obsessing over the actual member journey, not assumptions.", "factIds": ["bb-1", "bb-2"]}, {"value": "Obsess Over Members", "nealStory": "At Elephant Productivity Suite ran 200+ user interviews and shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 decisions driven by direct user pain, not guesses.", "factIds": ["ep-1"]}, {"value": "Make it Happen (bias to ship / execution)", "nealStory": "Led the 0-to-1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel) at SailLoft in a ~6-week internship, cutting manual tests 40% with real-time test-status visibility \u2014 shipped a working system fast.", "factIds": ["sl-role", "sl-1"]}, {"value": "Make it Happen (bias to ship / execution)", "nealStory": "Scaled the Elephant app from 17 to 563 active users (33x) in a single quarter \u2014 set a growth target and executed to a measurable before-to-after outcome.", "factIds": ["ep-1"]}, {"value": "Make it Happen (scrappy / ambiguity)", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time dramatically, plus a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 built the tooling needed to move the business himself.", "factIds": ["bb-3"]}, {"value": "Data-driven decision-making (Product Execution)", "nealStory": "Authored the FieldPulse predictive-restocking PRD defining 15+ KPIs with First-Time Fix Rate as the North Star metric and a RAG-based AI feature with explainability \u2014 demonstrates metric definition and prioritization, the core of Lyft's execution round.", "factIds": ["fp-1"]}, {"value": "Uplift Others (leadership / helping teammates)", "nealStory": "As UNC Product Management Club Director of Professional Development and President of UNC Ultimate Frisbee (BatCH), invested in developing others \u2014 a direct fit for the driver/teammate-centric 'Uplift Others' value.", "factIds": ["ld-1", "ld-2"]}, {"value": "Be Yourself / passion & self-awareness", "nealStory": "Bootstrapped Biryani Blitz to Wharton + UNC Innovation Labs backing ($5K) and $200K Wharton Startup Challenge finalist while balancing CS + Business at UNC \u2014 shows authentic founder drive and the ability to talk candidly about the venture's tradeoffs and learnings.", "factIds": ["bb-4", "edu-1"]}], "analyticalFocus": ["Marketplace health metrics: rider/driver liquidity, match rate, ETA, cancellation rate, surge frequency", "North Star and guardrail metric selection (Lyft's execution round explicitly tests this)", "Diagnosing a metric drop (e.g., 'rides in a city fell 10% \u2014 why?')", "Unit economics: contribution margin per ride, take rate, driver-incentive spend vs. gross bookings", "Retention & frequency: rides per active rider, cohort retention, subscription (Lyft Pink / Price Lock) impact", "Two-sided tradeoffs: rider price sensitivity vs. driver earnings vs. Lyft margin", "New-line monetization metrics: Lyft Media ad revenue per rider, CTR/brand-impact; AV opt-in and completion rates", "Prioritization frameworks and sizing/estimation (market size, TAM, demand forecasting)"], "gotchas": ["'Members' means BOTH riders and drivers \u2014 Lyft frames it as a three-sided marketplace (riders, drivers, advertisers/AV partners). Always reason about the driver side, not just riders; ignoring drivers is a classic Lyft red flag.", "The Execution round is heavily analytical/metrics \u2014 do NOT hand-wave numbers. Neal should lean on the FieldPulse 15+ KPIs / North Star work (fp-1) and the quantified Elephant/Biryani outcomes; avoid over-precise fabricated figures (ledger flags 41.7% and 97% as over-precise \u2014 round and add 'projected/estimated').", "Lyft directly contrasts itself with Uber; know Lyft's differentiators (pure rideshare + micromobility focus, driver-centric brand, 'people not cars' vision) rather than treating it as a generic ride app.", "Bring current context: profitable growth story (record Q3 2025 revenue ~$1.7B, gross bookings ~$4.8B), CEO David Risher's customer-obsession + move away from surge pricing, and the AV strategy via partners (May Mobility, Mobileye, Baidu) rather than owning a fleet.", "The APM role is an 18-month, two-rotation program \u2014 behavioral answers should show adaptability and eagerness to learn across domains, not deep single-domain expertise.", "Know the actual product names (Wait & Save, Price Lock, Lyft Silver, Lyft Media, Lyft Urban Solutions bikes) \u2014 using real products in product-sense answers signals genuine prep.", "Neal's background is food-vending + dev-tools + student productivity, NOT transportation \u2014 he should proactively bridge his marketplace/two-sided (Biryani Blitz supply-demand, funnel analytics) and growth experience to Lyft's marketplace context.", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must be ready for knockout screening questions; do not assume."], "sources": ["https://www.tryexponent.com/guides/lyft-pm-interview", "https://igotanoffer.com/blogs/product-manager/lyft-product-manager-interview", "https://www.joinleland.com/library/a/lyft-apm", "https://aspiringpm.substack.com/p/an-interview-guide-to-the-lyft-apm", "https://www.lyft.com/careers/apm", "https://www.lyft.com/belonging", "https://dcf-model.com/blogs/vision/lyft", "https://bstrategyhub.com/lyft-mission-statement-vision-core-values-analysis/", "https://www.lyft.com/rider", "https://www.lyft.com/bikes", "https://lyfturbansolutions.com/products", "https://www.fool.com/earnings/call-transcripts/2026/04/07/lyft-lyft-q1-2025-earnings-call-transcript/", "https://techcrunch.com/2025/09/10/lyfts-modest-robotaxi-launch-highlights-growing-gap-with-uber-and-waymo/", "https://www.webpronews.com/lyft-ceo-eyes-robotaxis-in-2026-ditches-surge-pricing-for-subscriptions/", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Airbnb", "products": ["Homes (core stays marketplace) \u2014 the original book-a-home product", "Airbnb Experiences (reimagined 2025) \u2014 locals-hosted activities in 650+ cities, including celebrity-led 'Airbnb Originals'", "Airbnb Services (launched 2025 Summer Release) \u2014 10 vetted categories (chefs, photography, massage, spa, personal training, hair, makeup, nails, prepared meals, catering) across 260 cities", "The all-new Airbnb app (rebuilt 2025) \u2014 one place to book homes + services + experiences, with post-booking suggestions and a day-by-day itinerary/trip view", "Host tools & Co-Hosting Network (marketplace supply side \u2014 listing management, pricing tools)", "AirCover (guest & host protection / trust-and-safety layer)"], "valuesAndBar": ["Champion the Mission \u2014 'create a world where anyone can belong anywhere'; frame product decisions around belonging, community trust, and inclusive TAM, not just transactions", "Be a Host \u2014 caring, open, encouraging; deep hospitality and empathy for both guests AND hosts (two-sided marketplace)", "Embrace the Adventure \u2014 curiosity, optimism, growth mindset; comfort operating under ambiguity", "Be a Cereal Entrepreneur \u2014 determined and creative, scrappy 0->1 builder turning bold ambition into reality (nods to founders selling cereal to survive)", "Craftsmanship / design bar \u2014 Airbnb is design-led (co-founders are designers); polish, intuitive trust-building UX and attention to detail are explicitly evaluated", "Two-sided marketplace fluency \u2014 reasoning about guest AND host (supply/demand) health, not one side in isolation"], "interviewFormat": ["Total ~4-6 weeks, 5+ touchpoints", "Recruiter phone screen (30-45 min) \u2014 core-values behavioral fit + light domain screen", "Hiring manager phone screen (30-45 min) \u2014 deeper domain expertise, STAR-format answers", "Peer PM phone screen (30-45 min) \u2014 cross-functional collaboration / working style", "Virtual on-site loop of ~4 rounds (45-60 min each), panelists span PMs, engineers, data scientists, program managers", "On-site \u2014 Product Sense: understand user needs, find the root problem, design intuitive trust-building experiences (how you think/empathize, not idea count)", "On-site \u2014 Execution/Case: break down an ambiguous prompt, prioritize, define success metrics; often a case-study presentation to a ~5-person panel with breakout sessions", "On-site \u2014 Metrics Deep Dive: funnel metrics, guardrail metrics, A/B testing, experiment interpretation, marketplace health", "On-site \u2014 Core-Values Behavioral: empathy, hospitality ('Be a Host'), craftsmanship, mission orientation, problem-solving under uncertainty"], "productSensePrompts": [{"prompt": "Airbnb just launched Airbnb Services (chefs, massage, photography, etc.). You own the guest-side Services experience. How would you improve discovery so guests actually book a service after booking a stay?", "approach": "Clarify the goal (attach-rate of services to a booked stay) and the target user (a guest who has already booked a home, so intent + trip context is known). Segment by trip type \u2014 leisure/celebration vs. business vs. family. Root problem: guests don't know services exist or don't trust an unknown local provider. Prioritize journeys: (1) contextual post-booking suggestion ('you booked Paris, add a chef the night you arrive'), (2) in-trip itinerary nudges timed to the stay. Lean on Airbnb's trust primitives \u2014 verified providers, reviews, avg 10 years experience \u2014 to lower the trust barrier (ties to 'Be a Host'). Name North Star = services booked per stay; guardrails = guest CSAT / rebooking, and provider (supply-side) fulfillment quality so you don't flood low-quality supply. Sketch the two-sided tradeoff explicitly."}, {"prompt": "Name three common problems guests have with the home they booked, and what Airbnb could do to fix each. (A real reported Airbnb PM question.)", "approach": "Structure before ideating (they grade thinking, not idea volume). Frame around the trust gap in a marketplace where you buy sight-unseen. Three problems: (1) Listing doesn't match reality (photos/amenities) -> verified/standardized photos, amenity checklist, 'accuracy' review sub-score already exists, tighten enforcement; (2) Check-in friction / can't reach host -> in-app check-in guide + guaranteed response SLA + fallback support; (3) Something breaks or feels unsafe mid-stay -> AirCover + one-tap in-trip support + proactive re-homing. For each, tie back to 'belong anywhere' (trust) and state how you'd measure success (e.g., accuracy-related refunds down, rebooking rate up)."}, {"prompt": "Design a feature to help a first-time host list their home and get their first booking. (Supply-side / 'Be a Host' framing.)", "approach": "Flip to the host persona \u2014 the scariest moment is the empty-calendar cold start with no reviews. Clarify goal: time-to-first-booking for new hosts. Root problems: (1) friction/anxiety creating a good listing, (2) no reviews = no trust = no demand, (3) pricing uncertainty. Solutions: guided AI-assisted listing (auto-titles/photos/pricing suggestions), a 'new host' trust badge + early-guest matching, Superhost/co-host mentorship. Emphasize this is a marketplace: healthy supply drives guest selection and price. North Star = % new hosts booked within 30 days; guardrail = guest satisfaction on new-host stays so you don't trade quality for supply."}, {"prompt": "Airbnb wants to grow Experiences among domestic/local users (not just travelers). How would you approach it?", "approach": "Clarify: reframes Airbnb from a travel product to a 'things to do near me' product \u2014 big TAM shift ('Champion the Mission' / belonging locally). Segment: tourists vs. locals-in-own-city vs. celebration occasions. Root insight: locals have low awareness that Experiences exist for their own city and lack a booking trigger. Levers: occasion-based entry points (date night, birthday), social/group features already shipped in 2025, and 'Airbnb Originals' as an awareness hook. Discuss cannibalization vs. incremental demand, and metrics: local Experiences bookings, repeat rate, and whether it lifts overall engagement/retention. Flag the guardrail: keep host supply quality high while scaling."}], "behavioralMapping": [{"value": "Be a Cereal Entrepreneur", "nealStory": "Founding Biryani Blitz \u2014 a 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in ~60s), started after 180 customer interviews, projected ~$145K ARR/machine; backed by Wharton + UNC Innovation Labs ($5K) and a $200K Wharton Startup Challenge finalist. Scrappy, determined, turned a bold idea into a shipped physical product \u2014 the literal cereal-founder analogy.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Be a Host", "nealStory": "At Biryani Blitz, built a privacy-first computer-vision funnel (impression->approach->purchase) to genuinely understand and remove friction for real customers at the machine; and shipped a QR loyalty app that lifted repeat purchases 40% \u2014 caring about the end-user experience and earning repeat trust, the core of hospitality. Pair with the 200+ / 180 interview depth showing empathy-first product work.", "factIds": ["bb-2", "bb-3", "ep-1"]}, {"value": "Champion the Mission", "nealStory": "Scaled the Elephant Productivity Suite from 17 -> 563 active users (33x) in one quarter via 200+ user interviews and an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 a mission-driven product built around real user outcomes and a community of students, not just growth numbers.", "factIds": ["ep-role", "ep-1"]}, {"value": "Embrace the Adventure (ambiguity / growth / curiosity)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40%, and translated ambiguous developer pain into a GitHub testing interface + a 2-click Chrome extension that sped PR-to-merge ~25% \u2014 jumping into an unfamiliar domain and shipping under uncertainty in a short internship.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Conflict / cross-functional (disagree with eng or design counterpart)", "nealStory": "SailLoft PM work sits at the developer/eng workflow boundary \u2014 use the Gerrit auto-voting design decision (auto-voting on Gerrit vs. a separate dashboard) as the tradeoff you had to align eng on; frame the disagreement, the data/user-pain you used to resolve it, and the shipped outcome (40% manual-test cut). NOTE: only use the specific auto-voting tradeoff if literally true (ledger flags this as a presentation note, not a verified fact).", "factIds": ["sl-1", "sl-2"]}, {"value": "Data-driven decisions / metrics (supports Metrics round + behavioral)", "nealStory": "FieldPulse PRD \u2014 authored an AI predictive-restocking feature (RAG over usage logs/schedules/seasonality) with a 3-flow UX and 15+ defined KPIs, choosing First-Time Fix Rate as the North Star. Demonstrates picking a North Star and reasoning about metric tradeoffs \u2014 directly relevant to Airbnb's Metrics Deep Dive.", "factIds": ["fp-1"]}], "analyticalFocus": ["Marketplace / two-sided health metrics \u2014 reason about guest (demand) AND host (supply) simultaneously; supply-demand balance, liquidity, match rate", "Funnel metrics \u2014 search -> view -> book conversion; identify where in the booking funnel a drop occurs", "Guardrail metrics \u2014 e.g., don't grow bookings at the cost of guest CSAT, host quality, cancellations, or trust/safety incidents", "A/B testing & experiment interpretation \u2014 read an experiment result, spot confounders, decide ship/no-ship", "North Star selection & tradeoffs \u2014 pick one metric and defend it (e.g., nights booked, booking-to-search ratio, rebooking/retention rate)", "Trust & quality metrics \u2014 accuracy of listings, review scores, refund/dispute rates, AirCover claims", "New-product attach metrics \u2014 for Services/Experiences: attach rate per stay, incrementality vs. cannibalization"], "gotchas": ["Product Sense grades HOW you think and empathize, not how many ideas you generate \u2014 structure and pick a user segment before brainstorming; do not spray ideas.", "Always reason about BOTH sides of the marketplace (guest and host). Answering only for guests is a classic Airbnb miss.", "Design bar is high (design-led founders) \u2014 talk about polish, trust-building UX, and craftsmanship, not just features.", "Behavioral is mapped tightly to the four named values (Champion the Mission, Be a Host, Embrace the Adventure, Be a Cereal Entrepreneur) \u2014 have a STAR story pre-mapped to each; the 'Be a Host' hospitality/empathy angle is uniquely Airbnb.", "Case-study on-site can be a presentation to a ~5-person panel with breakouts \u2014 practice presenting and defending, not just answering.", "Ledger discipline: Neal's numbers have presentation flags \u2014 say '~42% projected net margin' not '41.7%', and give a before->after for the 97% outreach-time cut instead of the bare 97%. Do NOT invent any experience, metric, or Airbnb-specific project.", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must supply it for knockout fields; don't assume.", "The interviewquery Glassdoor-cited positive rate is low (~27%) and difficulty ~3.1/5 \u2014 process is long (5+ rounds); manage stamina and consistency of value-mapping across rounds."], "sources": ["https://news.airbnb.com/airbnb-2025-summer-release/", "https://www.tryexponent.com/guides/airbnb-pm-interview", "https://www.interviewquery.com/interview-guides/airbnb-product-manager", "https://igotanoffer.com/blogs/product-manager/airbnb-product-manager-interview", "https://www.joinleland.com/library/a/airbnb-product-manager-interview", "https://www.levels.fyi/companies/airbnb/culture", "https://careers.airbnb.com/life-at-airbnb/", "https://www.productmanagementexercises.com/interview-questions/airbnb", "https://www.glassdoor.com/Interview/Airbnb-Product-Manager-Interview-Questions-EI_IE391850.0,6_KO7,22.htm", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "DoorDash", "products": ["DoorDash Marketplace (three-sided: consumers, Dashers, merchants)", "DashPass (subscription: $0 delivery + reduced fees; ~$9.99/mo or $96/yr)", "DoorDash Drive / Drive On-Demand (white-label last-mile delivery for merchants)", "DashMart (DoorDash-owned convenience/grocery stores) + DashMart Fulfillment Services (CVS, Party City, Kroger)", "Going Out (in-app restaurant reservations via SevenRooms integration; DashPass perks; launched Dash Forward 2025)", "Dot autonomous delivery robot (up to 20 mph, Phoenix; part of autonomous delivery platform)", "SmartScale (merchant hardware: weighs orders to verify accuracy, cut missing-item claims up to 30%; Panera first adopter)", "Dasher app (revamped maps/pins, Flash Offers pay boosts, Pro Shopper rewards)", "Merchant tools: Storefront, Order Manager, marketing/ads, Package Pickup", "Caviar (premium restaurant delivery) and Wolt (international marketplace, DoorDash-owned)", "AI-powered personalized recommendations, Smart Tags (dietary filters), Complement Your Cart"], "valuesAndBar": ["DoorDash organizes 12 operating principles under 4 values: We are Leaders, We are Doers, We are Learners, We are One Team", "Leaders: 'Be an owner', 'Dream big, start small', 'Choose optimism and have a plan'", "Doers: 'Bias for action', 'Operate at the lowest level of detail' (famous DoorDash trait \u2014 go deep on details/data), 'And not either/or'", "Learners: 'Truth seek', '1% better every day', 'Customer-obsessed, not competitor-focused'", "One Team: 'Make room at the table', 'Think outside the room', 'One team, one fight' (shared success/failure, high-accountability no-blame)", "PM bar: must reason about a THREE-SIDED marketplace (consumers, Dashers, merchants) and make explicit trade-offs on who wins/loses \u2014 no generic roadmaps", "Heavy emphasis on metrics, experimentation/A-B testing, and unit economics (razor-thin margins: supply, demand, pricing, UX)", "Values pragmatic judgment over theoretical perfection \u2014 decide and act with incomplete (~50%) data"], "interviewFormat": ["Stage 1 \u2014 Recruiter phone screen (~30 min): resume fit, motivation, DoorDash mission alignment, overview of process", "Stage 2 \u2014 Hiring-manager / senior-PM phone screen (~45 min): product sense + prioritization framework", "Stage 3 \u2014 Virtual on-site loop of 3-4 rounds (30-45 min each): Product Sense, Product Analytics/Metrics, Product Prioritization (Execution), and Product Values (behavioral)", "Product Prioritization/Execution round is described as the toughest \u2014 must balance limited resources across the 3-sided marketplace", "Analytics is often woven into rounds rather than a standalone case: expect experimentation, metric strengths/weaknesses, 'if a metric failed what would you do'", "Some teams add an optional take-home / case study (varies by team and hiring manager)", "Values round is a dedicated behavioral round mapped to the 12 operating principles; STAR answers expected", "Full process typically ~3-6 weeks (some report up to 1-3 months)"], "productSensePrompts": [{"prompt": "A neighborhood suddenly runs out of available Dashers during a dinner rush \u2014 orders are piling up. As PM, what do you do?", "approach": "This is the archetypal DoorDash live-ops prompt (they explicitly prefer 'fix a live order gone sideways' over shiny new features). Frame it as a supply-demand imbalance in a 3-sided marketplace. Diagnose: is it a spike in demand, a drop in Dasher supply, weather, or a pay/incentive issue? Short-term levers: surge/peak-pay (Flash Offers) to pull in Dashers, dynamically raise delivery ETAs/fees to dampen demand, temporarily hide far-away merchants, notify consumers with honest ETAs. Long-term: predictive supply forecasting, scheduled-dash incentives, batching. Define trade-offs explicitly (consumer wait time vs. Dasher pay cost vs. merchant order volume) and name a North Star (on-time delivery / order completion rate) plus guardrails (Dasher earnings, cancel rate)."}, {"prompt": "Design a feature to improve the DoorDash experience for restaurant merchants (the most under-served side of the marketplace).", "approach": "Pick the merchant persona (independent vs. chain) and their top pain: order accuracy, prep-time predictability, or new-customer acquisition. Reference real DoorDash direction \u2014 e.g. SmartScale (order-accuracy hardware) and DashMart Fulfillment. Segment users, prioritize one pain (missing-item claims hurt all three sides), propose a solution, define MVP ('dream big, start small'), and metrics: North Star = repeat order rate / merchant retention; guardrails = missing-item claim rate, prep-time accuracy. Tie back to marketplace: fewer errors \u2192 better consumer trust \u2192 more volume for Dashers."}, {"prompt": "How would you improve DashPass to increase subscriber retention (or grow subscribers)?", "approach": "Clarify goal: acquisition vs. retention vs. LTV. Map the DashPass value loop (order frequency drives perceived value drives retention). Segment: power users vs. lapsing users. Ideas grounded in real product: bundle Going Out reservation perks, grocery/DashMart benefits, family plans, partner bundles (T-Mobile). Prioritize by reach x impact x effort. Metrics: North Star = subscriber retention / renewal rate; supporting = orders per subscriber, incremental orders vs. non-subscribers; guardrail = margin per order (thin margins matter). Propose an A/B test to isolate incremental behavior, not just correlation."}, {"prompt": "DoorDash is expanding beyond restaurants (grocery, retail, Dot robots). Should we invest more in autonomous delivery (Dot), and how would you measure success?", "approach": "Frame as a build/where-to-bet strategy question testing 'dream big, start small' + unit economics. Analyze why autonomy matters: last-mile labor is the biggest cost driver in thin-margin delivery. Assess feasibility per segment (short-range, dense urban, sidewalk-safe). Start small: pilot in one city (Phoenix, as real), specific order types (small, short-distance). Metrics: cost per delivery vs. human Dasher, delivery success rate, safety incidents, consumer NPS, and Dasher displacement risk (One Team / stakeholder trade-off). Recommend a staged rollout with clear kill criteria \u2014 show pragmatic judgment over hype."}], "behavioralMapping": [{"value": "Bias for action (decide with ~50% of the data)", "nealStory": "At Elephant Productivity Suite, Neal shipped an ML flashcard engine and scaled the app 17\u2192563 users in ONE quarter \u2014 a fast-moving 0\u21921 sprint where he acted on incomplete signals from 200+ interviews rather than waiting for certainty, and measured the outcome (16% exam-score lift, 38% review-time cut).", "factIds": ["ep-role", "ep-1"]}, {"value": "Be an owner / Dream big, start small", "nealStory": "Neal FOUNDED Biryani Blitz \u2014 a 0\u21921 hot-food vending platform he took from 180 customer interviews to a deployed machine at UC Berkeley with projected unit economics (~$145K ARR/machine, ~42% projected net margin). He owned the whole thing end to end and started with a single machine before scaling.", "factIds": ["bb-role", "bb-1"]}, {"value": "Operate at the lowest level of detail (DoorDash's signature trait)", "nealStory": "Neal built a privacy-first computer-vision telemetry system (OpenCV) that instrumented the impression\u2192approach\u2192purchase funnel on a physical vending machine \u2014 giving a piece of hardware e-commerce-grade conversion analytics. Shows he goes deep into the raw funnel data, not just top-line numbers.", "factIds": ["bb-2"]}, {"value": "Customer-obsessed, not competitor-focused / Truth seek", "nealStory": "Across ventures Neal has run 500+ user interviews (180 at Biryani Blitz, 200+ at Elephant, 200+ referenced in skills) and let that research drive what he built \u2014 e.g. translating developer-workflow pain points into a GitHub testing interface at SailLoft. He starts from real customer truth, not assumptions.", "factIds": ["bb-1", "ep-1", "sl-2"]}, {"value": "And not either/or (do both \u2014 speed AND quality)", "nealStory": "At SailLoft, Neal led the 0\u21921 launch of a Gerrit-based software-test product (Gerrit voting + Bazel) that cut manual tests 40% AND added real-time test-status visibility, plus a Chrome extension condensing client testing to a 2-click workflow \u2014 improving both efficiency and developer experience at once.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "1% better every day / measurable iteration", "nealStory": "Neal's QR loyalty app (React/Firebase) lifted repeat purchases 40%, and his AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cut weekly outreach time dramatically \u2014 concrete iterative improvements he instrumented and measured.", "factIds": ["bb-3"]}, {"value": "One team, one fight / influence without authority (cross-functional collaboration)", "nealStory": "As an intern PM at SailLoft, Neal translated developer pain points into shipped tooling \u2014 working across engineering and client-facing workflows without direct authority. His UNC PM Club (Director of Professional Development) and Ultimate Frisbee (President) roles reinforce leading teams toward a shared goal.", "factIds": ["sl-2", "ld-1", "ld-2"]}, {"value": "Metrics / experimentation rigor (Analytics round support)", "nealStory": "For the FieldPulse PRD, Neal defined 15+ KPIs with First-Time Fix Rate as the North Star for an AI predictive-restocking feature (RAG over usage logs/seasonality) \u2014 demonstrating he can pick a North Star, layer supporting metrics and guardrails, and reason about an AI product's success.", "factIds": ["fp-1"]}], "analyticalFocus": ["North Star metric selection + supporting/guardrail metrics for a 3-sided marketplace (consumer, Dasher, merchant health simultaneously)", "Experimentation / A-B testing design; distinguishing correlation vs. incremental causal impact (esp. for DashPass)", "Unit economics of delivery: cost per delivery, take rate, contribution margin (razor-thin margins)", "Supply-demand balancing metrics: Dasher availability, on-time rate, delivery ETA, order completion/cancel rate", "Diagnosing a metric drop: 'if metric X fell, how would you investigate?' (segment by geo, side of marketplace, time)", "Trade-off quantification: who wins/loses when you pull a lever (peak pay cost vs. consumer wait vs. merchant volume)", "Estimation / sizing questions (e.g. how many Dashers needed in a city, market sizing for a new vertical)"], "gotchas": ["Do NOT give generic 'add a shiny feature' roadmaps \u2014 DoorDash product sense is operational: fix a live order gone sideways, solve a Dasher shortage. Ground answers in real ops.", "ALWAYS name all three sides of the marketplace (consumers, Dashers, merchants) and state explicit trade-offs on who wins and who loses \u2014 this is the single biggest differentiator they test.", "Prioritization/execution round is the hardest \u2014 practice ruthlessly prioritizing under limited resources, not listing everything.", "'Operate at the lowest level of detail' is a real DoorDash trait \u2014 be ready to go deep into specific numbers/funnels; Neal's OpenCV funnel telemetry (bb-2) is a perfect proof point.", "For DashPass/metrics questions, isolate INCREMENTAL impact (would this order have happened anyway?) \u2014 don't confuse correlation with causation.", "Behavioral 'values' round maps to the 12 operating principles \u2014 pre-map one crisp STAR story per value; quantify impact and state the trade-off you made.", "Watch ledger presentation flags: 41.7% net margin \u2192 say '~42% projected'; 97% outreach-time cut \u2192 give a before\u2192after or soften; always label $145K ARR as 'projected.' Do not present projections as achieved results.", "Confirm work authorization before applying \u2014 the ledger flags it as unconfirmed and it's a common knockout field.", "GPA only if >= 3.5 (ledger note); grad May 2028 means Neal is targeting an APM/PM INTERN role, so lean on the 0\u21921 founder + user-research story, not seniority."], "sources": ["https://igotanoffer.com/blogs/product-manager/doordash-product-manager-interview", "https://www.tryexponent.com/guides/doordash-pm-interview", "https://interview.norahq.com/interview-guides/doordash-product-manager-interview-guide-2025", "https://www.joinleland.com/library/a/doordash-product-manager-interview", "https://www.interviewquery.com/interview-guides/doordash-product-manager", "https://prepfully.com/interview-guides/doordash-product-manager", "https://about.doordash.com/en-us/news/dash-forward-2025", "https://www.doordash.com/dashpass", "https://planspace.org/20251230-doordash_values/", "https://www.stockintent.com/blog/doordash-mission-statement-vision-core-values", "https://www.lewis-lin.com/posts/doordash-pm-interview-guide-high-velocity-operators/"]}, {"company": "Instacart", "products": ["Instacart Marketplace / Consumer app (grocery e-commerce, product discovery + ordering; four-sided marketplace: customers, shoppers, retailers, advertisers)", "Shopper app (fulfillment, batching, earnings management for the gig-shopper side)", "Caper Carts (AI-powered smart carts with computer-vision/sensor item recognition and in-aisle ads; ~100 cities across 15 states)", "Instacart Ads / Carrot Ads (retail-media platform; sponsored products, aisle-aware and inventory-aware ads, extended to partner storefronts and Caper Carts)", "Instacart+ (consumer subscription; free delivery, credit-back)", "Enterprise / Connected Stores platform: Storefront & Storefront Pro (white-label e-commerce), Carrot Tags (electronic shelf labels / pick-to-light), FoodStorm (order management for prepared foods; 3,000+ stores)"], "valuesAndBar": ["Customer/consumer obsession + deep empathy: identify real pain points, avoid generic user segments", "Ownership ('be an owner'): scope, plan, ship, communicate cross-functionally, and maintain your work end-to-end (discovery through launch)", "Four-sided-marketplace thinking: strong answers weigh impact on ALL of customers, shoppers, retailers, AND advertisers, not just the end consumer", "Structured product thinking: clarify -> users -> metrics/goals -> ideas -> prioritize (RICE/T-shirt) -> future work", "Metrics rigor: north-star + gut-check + counter-metric tied to business goals; senior candidates start FROM metrics and work backward to features", "Cross-functional leadership and collaboration through conflict (technical/project leadership, not people-management)", "Communicating technical concepts clearly to non-technical stakeholders", "Bias to measurable business impact expressed in concrete numbers (scale + result), not just dollar amounts", "For Caper / Ads roles the technical bar is higher: LLM/ML, CV, AdTech, payments, logistics experience is a differentiator; expect system-design-style probing"], "interviewFormat": ["Stage 1 - Recruiter phone screen: behavioral + role/team-specific fit (roles are team-specific and team-dependent; you apply to a specific leveled role e.g. Ads/Fulfillment/Consumer)", "Stage 2 - Hiring Manager interview (often for full-time; may be lighter for APM): past experience + product philosophy, scenario-based", "Stage 3 - Take-home Product Challenge / Case Study: solve a real Instacart problem across the four-sided marketplace and present to a panel; tests narrative structure, data use, comprehensiveness (this is the CORE gate for the APM program)", "Stage 4 - Virtual onsite loop: four back-to-back rounds, ~4 hours (can run ~1hr longer): (a) Product Sense, (b) Product Execution/metrics, (c) Cross-Functional Panel, (d) Leadership", "APM program specifics: ~7-person cohort, 18 months across two 9-month rotations, mentorship, US comp ~$113K-$150K; 2026 cycle applications ~early-mid March, decisions ~late June, start August"], "productSensePrompts": [{"prompt": "Improve the Instacart consumer app's product-discovery / search experience for a new grocery shopper who doesn't know what they want yet.", "approach": "Clarify segment (new vs power user, mobile) and goal (activation/AOV). Zero in on the 'blank-cart' cold-start pain point. North-star: first-order completion rate / time-to-first-cart. Ideas: AI-assisted 'shop by recipe/meal', personalized starter lists, buy-it-again seeding. Prioritize with RICE. Weigh the four sides: retailers (inventory availability) and advertisers (sponsored placements must not degrade relevance). Neal can lean on ep-1 (200+ interviews, ML-driven engagement) and bb-1 (180 interviews)."}, {"prompt": "You own Caper Carts. Design a feature to increase in-store basket size / conversion, and tell me how it also serves retailers and advertisers.", "approach": "Note this is a physical-retail x software problem across all four sides. Clarify: which retailer, item-recognition reliability. North-star: incremental basket size per trip; counter-metric: checkout friction / mis-scan complaints. Ideas: real-time in-aisle recommendations, aisle-aware Carrot Ads, dietary/deal tags via Carrot Tags. Neal's bb-2 (privacy-first OpenCV computer-vision funnel tracking on a PHYSICAL machine) is a near-perfect analog \u2014 physical-world conversion analytics \u2014 pair with bb-1."}, {"prompt": "Design a feature to improve the Shopper (gig worker) experience \u2014 e.g. batching, earnings visibility, or item-not-found handling.", "approach": "Pick the supply side deliberately (shows four-sided awareness). Clarify shopper persona (full-time vs casual). North-star: on-time batch completion / shopper retention; gut-check: items-found rate; counter-metric: customer refund rate. Ideas: smarter substitution suggestions, real-time earnings/tip transparency, route optimization. Emphasize the marketplace tradeoff: shopper efficiency vs customer satisfaction. Map to sl-1/sl-2 (workflow pain -> tooling that cut manual effort)."}, {"prompt": "Instacart Ads / Carrot Ads: how would you measure the health of the retail-media business, and what feature would grow it without hurting the consumer experience?", "approach": "Start FROM metrics (what senior candidates do): north-star = ad revenue per session / ROAS for advertisers; gut-check = advertiser retention; counter-metric = organic-relevance / consumer conversion degradation and search satisfaction. Feature idea: relevance-capped sponsored slots, closed-loop attribution to purchase. Explicitly balance advertiser monetization vs consumer trust vs retailer brand. Neal ties to fp-1 (defined 15+ KPIs with a North Star) and ep-1 (measurable lift metrics)."}], "behavioralMapping": [{"value": "Customer/consumer obsession & deep user empathy", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and used that research to scale the app 17->563 active users (33x) in one quarter and ship an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 research directly drove measurable user value.", "factIds": ["ep-1", "bb-1"]}, {"value": "Ownership / end-to-end execution (discovery through launch)", "nealStory": "Founded Biryani Blitz as Founder & AI PM: a full 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in 60s), founded after 180 customer interviews with a projected ~42% net margin business model \u2014 owned scope, build, ship, and go-to-market end to end.", "factIds": ["bb-role", "bb-1", "bb-3"]}, {"value": "Metrics design & data-driven impact (north-star thinking)", "nealStory": "Authored the FieldPulse predictive-restocking PRD defining 15+ KPIs with First-Time Fix Rate as the North Star, and shipped Elephant features with explicit before->after metrics (16% score lift, 38% time cut) \u2014 demonstrates north-star + supporting-metric design.", "factIds": ["fp-1", "ep-1"]}, {"value": "Cross-functional leadership & collaboration through conflict", "nealStory": "At SailLoft, translated developer-workflow pain points into a Gerrit-based internal test product and GitHub testing interface, working across dev/QA to cut manual tests 40% and accelerate PR-to-merge cycles ~25% \u2014 led a technical project (not people mgmt) to measurable business impact.", "factIds": ["sl-1", "sl-2", "sl-role"]}, {"value": "Physical-world / marketplace + technical depth (relevant to Caper & Ads roles)", "nealStory": "Built a privacy-first computer-vision (OpenCV) telemetry system on a physical vending machine tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics \u2014 directly analogous to Caper Cart's sensor/CV + retail-media problem space.", "factIds": ["bb-2", "bb-3"]}, {"value": "Influence / creative problem-solving & scrappiness", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40%; secured Wharton + UNC Innovation Labs backing ($5K) and reached the $200K Wharton Startup Challenge finals.", "factIds": ["bb-3", "bb-4", "ld-1"]}], "analyticalFocus": ["North-star + gut-check + counter-metric triads tied to business goals (Instacart explicitly probes this in Product Execution)", "Four-sided-marketplace economics: how a metric or feature trades off across consumers, shoppers, retailers, and advertisers", "Retail-media / Ads metrics: ROAS, ad revenue per session, sponsored-vs-organic relevance, advertiser retention, attribution", "Marketplace supply-demand balance: shopper retention/efficiency vs customer fill-rate & satisfaction, delivery time", "Funnel/conversion analytics (impression -> consideration -> purchase), AOV, order frequency, activation/first-order completion", "Estimation/sizing under ambiguity: designing metrics for an ambiguous problem and prioritizing with RICE / T-shirt sizing", "Physical-store metrics for Caper: basket size per trip, mis-scan/checkout-friction rate, in-aisle ad engagement"], "gotchas": ["Roles are team-specific and team-dependent \u2014 Neal should identify which team/product (Consumer, Ads, Fulfillment/Shopper, Enterprise/Caper) he's applying to and tailor examples accordingly.", "Single biggest differentiator vs other consumer PMs: ALWAYS reason across all four sides of the marketplace (customers, shoppers, retailers, advertisers). Answering only for the end consumer is the classic miss.", "The APM take-home Product Challenge is the core gate \u2014 it must show strategic thinking across the four sides and use data; practice structuring a narrative and presenting to a panel.", "Product Execution round wants a north-star + gut-check + counter-metric; strong candidates START from metrics and work backward to features \u2014 don't design features first then bolt on metrics.", "Show ideas that DIDN'T work / explicit tradeoffs to demonstrate judgment (interviewers reward this).", "Use precise user segmentation, not generic demographics ('busy parents doing weekly stock-up' not 'people who buy groceries').", "Ledger presentation risks: soften bb-3's '97% time cut' (near-ceiling, give before->after) and bb-1's '41.7% net margin' -> '~42%, projected'; label $145K ARR as projected. Never invent numbers beyond the ledger.", "Neal must confirm work authorization (ledger flags it UNCONFIRMED) \u2014 the APM application has a knockout work-auth field.", "For Caper/Ads roles the technical bar is higher (LLM/ML/CV, AdTech) and may include system-design questions \u2014 Neal's OpenCV/agentic-AI background is an asset here; lean into it for those teams.", "Leadership round is about project/technical leadership and measurable impact, NOT people management \u2014 frame SailLoft and Biryani Blitz as project leadership with numbers."], "sources": ["https://www.tryexponent.com/guides/instacart-product-manager-interview", "https://www.joinleland.com/library/a/how-to-get-into-the-instacart-apm-program", "https://www.instacart.careers/apm", "https://www.glassdoor.com/Interview/Instacart-Product-Manager-Interview-Questions-EI_IE714486.0,9_KO10,25.htm", "https://www.interviewquery.com/interview-guides/instacart-product-manager", "https://www.productmanagementexercises.com/interview-questions/instacart", "https://www.instacart.com/company/enterprise-platform/connected-stores/caper-carts", "https://company.instacart.com/enterprise-platform/retail-media/carrot-ads", "https://www.grocerydive.com/news/instacart-smart-carts-retail-media-soelbergs/757373/", "https://www.comparably.com/companies/instacart/mission", "https://www.keyvalues.com/instacart"]}, {"company": "Spotify", "products": ["Spotify Premium (subscription tier) and Free (ad-supported) tier", "AI DJ (personalized voice DJ, ~94M Premium users) and the new ChatGPT-like conversational AI assistant (2026)", "Discovery playlists: Discover Weekly, Release Radar, Daylist, New Music Friday, Fresh Finds", "Audiobooks in Premium (700K+ titles, 22 markets) + Audiobook Charts", "Podcasts (discovery on Home, 'In this episode' links, video podcasts)", "Spotify Wrapped (annual personalized recap)", "Prompted / AI Playlist (natural-language playlist generation)", "Narrated Articles (long-form magazine audio, 2026 test)"], "valuesAndBar": ["Band Manifesto \u2014 five core values: Innovative, Sincere, Passionate, Collaborative, Playful", "'No egos', transparency, candid/direct feedback, ideas over bureaucracy", "Data-driven decision-making (metrics-literacy is table stakes in the execution round)", "Structured reasoning + user empathy + connecting product ideas to BOTH user experience and business outcomes", "PM competency emphasis: initiative, introspection/self-awareness (openness about failure + learning), team leadership incl. conflict management, and genuine passion for audio/music", "'Playfulness' is explicitly a valued trait \u2014 they want people, not robots"], "interviewFormat": ["Process runs ~4 weeks to 3 months; ~4-6 total stages including application review", "Stage 1 \u2014 Recruiter / initial phone screen (~30-45 min): background, motivations, 'Why product management?', 'Why Spotify?', logistics, light behavioral/fit", "Stage 2 \u2014 Hiring manager / first round (~1 hr): PM skills, past experience, strategy + execution, behavioral 'Tell me about a time...' questions", "Stage 3 \u2014 On-site loop / final: 4-6 'band members' from different departments, ~1 hr each, covering distinct areas", "Loop areas typically: (a) Product Sense / Design, (b) Analytics + Execution (often split into a quantitative chunk and a product-sensibility chunk within one session), (c) Product Strategy / high-level growth thinking, (d) Leadership & Values (behavioral, mapped to the Band Manifesto)", "Execution round uses metrics frameworks (goal -> actions -> metrics; e.g. a GAME-style structure) and metric-debugging scenarios ('metric X is dropping week over week')"], "productSensePrompts": [{"prompt": "How would you improve podcast (or audiobook) discovery on Spotify?", "approach": "Clarify scope: which surface (Home, Search, Library) and which user (new-to-podcasts vs. power listener). Anchor on Spotify's actual gap \u2014 music discovery (Discover Weekly/DJ) is world-class but spoken-word discovery lags. Segment users, pick the underserved one (e.g. casual users who never open podcasts), state the job-to-be-done. Prioritize 2-3 solutions (e.g. cross-media recommendations 'because you love true-crime music playlists...', an audiobook/podcast row in DJ, sample/preview clips). Pick a North Star (spoken-word listening hours per WAU) and guardrail (music engagement must not drop). Neal can lean on his 500+ user-interview instinct (ep-1, bb-1) to justify segmentation."}, {"prompt": "Design a feature to help new/emerging artists grow their audience on Spotify.", "approach": "Two-sided marketplace framing: artists (supply) vs. listeners (demand). Clarify goal \u2014 is Spotify optimizing artist retention, listener discovery, or both? Empathize with the emerging-artist pain (cold-start, no algorithmic surface time). Ideate: guaranteed discovery slots in Release Radar/Fresh Finds, an artist-fan messaging/loyalty loop, a 'support local/emerging' toggle. Tie to business: healthier supply side = catalog moat + lower royalty concentration. North Star: % of streams going to long-tail artists; guardrail: listener satisfaction/skip rate. This maps cleanly to Neal's QR loyalty + repeat-purchase work (bb-3) and creator-side thinking."}, {"prompt": "How would you improve the experience for Free-tier users WITHOUT cannibalizing Premium conversions?", "approach": "This is Spotify's central business tension \u2014 nail it. State the strategic goal: Free is a funnel, not charity; improvements must increase conversion or ad revenue, not reduce upgrade intent. Map the Free-user journey and friction (shuffle-only historically, ad load, skip limits). Propose changes that raise engagement but preserve a reason to upgrade \u2014 e.g. smarter ad targeting, limited on-demand 'tastes' that create want, contextual upgrade nudges at moments of friction. Define North Star: Free->Premium conversion rate; guardrails: Free DAU/engagement AND ad revenue per free user. Explicitly call out the metric that could be 'gamed' (short-term engagement at expense of conversion) \u2014 interviewers reward this."}, {"prompt": "Design (or improve) Spotify's AI DJ / new conversational AI assistant.", "approach": "Very on-brand for 2026 \u2014 Spotify is pushing AI hard. Clarify: is the goal discovery, engagement, or retention/differentiation vs. Apple Music/YouTube? Pick the user (e.g. the 'decision-fatigued' listener who opens the app and doesn't know what to play). JTBD: 'help me find something to listen to with zero effort.' Ideate: multi-modal prompts (mood/activity), explainable recs ('I picked this because...'), feedback loop to correct the model, extension to podcasts/audiobooks. Business tie: AI DJ is Premium-only -> a conversion + retention lever. North Star: DJ/assistant WAU and downstream listening hours; guardrail: rec quality (skip rate) and cost-per-session. Neal's AI/RAG PRD (fp-1) and agentic-pipeline background (bb-3, skills) let him speak credibly to explainability and model feedback loops."}], "behavioralMapping": [{"value": "Innovative", "nealStory": "Founded Biryani Blitz \u2014 a 0->1 hot-food vending platform (fresh biryani in 60s) and built a privacy-first computer-vision funnel (impression->approach->purchase) to give a physical machine e-commerce-grade analytics, an approach that didn't exist off the shelf.", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "Innovative", "nealStory": "Authored a PRD for an AI predictive-restocking feature using RAG over usage logs/seasonality, designing a 3-flow UX with AI explainability and 15+ KPIs (First-Time Fix Rate as North Star) \u2014 shows he innovates on emerging tech, relevant to Spotify's AI DJ/assistant push.", "factIds": ["fp-1"]}, {"value": "Sincere", "nealStory": "'Tell me about a time you were candid / gave hard feedback or admitted a limitation': Neal can use the SailLoft tradeoff decision \u2014 choosing Gerrit auto-voting over a separate dashboard \u2014 being honest about what he DIDN'T build and why, or grounding claims in real user interviews rather than assumptions.", "factIds": ["sl-1", "sl-2"]}, {"value": "Passionate", "nealStory": "Scaled a student productivity app from 17 to 563 active users (33x) in one quarter via 200+ user interviews and shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 sustained, self-driven passion for a user problem.", "factIds": ["ep-role", "ep-1"]}, {"value": "Passionate", "nealStory": "'Tell me about initiative / going beyond the role': Biryani Blitz reached Wharton + UNC Innovation Labs backing ($5K) and $200K Wharton Startup Challenge finalist \u2014 evidence of relentless, self-started drive.", "factIds": ["bb-4"]}, {"value": "Collaborative", "nealStory": "'Tell me about a time you worked across a team / resolved conflict': At SailLoft, translated developer-workflow pain points into a GitHub testing interface and Chrome extension, accelerating PR-to-merge cycles ~25% \u2014 required aligning developers/clients around a shared workflow.", "factIds": ["sl-role", "sl-2", "sl-1"]}, {"value": "Collaborative", "nealStory": "Leadership as President of UNC Ultimate Frisbee (BatCH) and Director of Professional Development for the UNC PM Club \u2014 leading peers, not just individual output.", "factIds": ["ld-2", "ld-1"]}, {"value": "Playful", "nealStory": "The founder-energy of Biryani Blitz (fresh biryani in 60s, Shark Tank Season 18 applicant) is a naturally playful, memorable story Neal can tell with genuine enthusiasm \u2014 matches Spotify's explicit valuing of playfulness and 'bring your personality.'", "factIds": ["bb-1", "bb-4"]}], "analyticalFocus": ["Free-to-Premium conversion rate (the core business funnel; know the tension between engaging Free users and preservi
