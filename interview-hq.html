afety); graded on problem definition and picking the right user segment", "Behavioral round: hiring-manager-led, weights mission alignment + self-awareness; prompts on influence-without-authority and navigating disagreement", "System-design round is uncommon for APM but has appeared (e.g. auto-translation between users on different servers) \u2014 product + technical reasoning", "Total timeline ~3-8 weeks from recruiter screen to decision"], "productSensePrompts": [{"prompt": "Design a better onboarding flow for FIRST-TIME creators in Roblox Studio (people who have never built an experience).", "approach": "Clarify the goal (activation = publish first experience, not just open Studio) and pick the segment (e.g. teen player who plays daily but has never created). Map the funnel: install Studio -> first project -> first mechanic -> publish -> first visitor. Identify the biggest drop-off (blank-canvas paralysis / no reward loop). Propose 2-3 solutions ranked: templated 'remix an existing game' starter, guided AI-assist build (ties to Roblox's 2025 AI creator tools), and a fast path to a shareable link that surfaces first-play + first-Robux as the aha moment. North Star: % of new creators who publish AND get their first N visitors within 7 days. Neal can lean on ep-1 (17->563 users via onboarding + interviews) and bb-1 (0->1, 180 interviews) as pattern credibility."}, {"prompt": "Roblox is doing a brand collaboration (e.g. Build-A-Bear). Design the in-experience product for it.", "approach": "State who the collab serves (young players + the brand's IP fandom) and the business goal (engagement + UGC/avatar-item monetization, not just a marketing splash). Pick a core loop: build/customize your virtual bear -> it becomes an avatar companion/item usable across experiences -> optional physical<->digital tie-in code. Tie monetization to the real Roblox rails (UGC avatar items, game passes, dynamic pricing). Address the age-appropriateness/safety guardrails up front (Respect the Community). Metrics: collab experience DAU, avatar-item attach rate, D7 retention of participants, cross-experience use of the item."}, {"prompt": "How would you implement safety features for private messaging between players on Roblox?", "approach": "Lead with the community-first framing (large minor user base) \u2014 this maps directly to 'Respect the Community' + 'We are Responsible.' Segment by age (under-13 vs 13+ get different defaults). Layer defenses: default-off/allowlist-only DMs for minors, real-time ML text filtering + grooming-pattern detection, friction on new-contact messages, easy report/block, and human review escalation. Name the tradeoff explicitly (safety vs. social engagement/retention) and how you'd measure it: reported-incident rate, false-positive rate on filtering, and message-based friend conversion. Neal's bb-2 (privacy-first CV telemetry) shows he defaults to privacy-conscious design."}, {"prompt": "Improve avatar customization for players in under-connected / low-bandwidth or emerging-market regions.", "approach": "Clarify constraint (low-end devices, spotty connectivity, lower ARPU) and goal (raise avatar personalization + monetization without hurting performance). Diagnose: heavy 3D assets load slowly, Robux price is a barrier abroad. Solutions tied to real Roblox levers: lightweight/2.5D avatar item variants, aggressive asset caching/progressive load, and REGIONAL PRICING (Roblox shipped this in 2025) so items are locally affordable. North Star: avatar-item attach rate in target regions; guardrail: session frame-rate / load-time. This shows Neal knows Roblox's actual 2025 roadmap moves."}], "behavioralMapping": [{"value": "Get Stuff Done (bias to ship, relentless iteration)", "nealStory": "Biryani Blitz: founded and shipped a 0->1 hot-food vending platform live at UC Berkeley (fresh biryani in 60s) after grounding it in 180 customer interviews \u2014 took initiative from nothing to a deployed physical product.", "factIds": ["bb-role", "bb-1"]}, {"value": "Get Stuff Done / 'Tell me about a time you launched a product'", "nealStory": "SailLoft: led the 0->1 launch of an internal Gerrit + Bazel software-test product, cutting manual tests 40% with real-time test-status visibility \u2014 a shipped launch with a measurable outcome, ideal for the 'launched a product' prompt.", "factIds": ["sl-role", "sl-1"]}, {"value": "Take the Long View (long-term vision behind short-term decisions)", "nealStory": "Elephant Productivity Suite: scaled a student app 17->563 active users (33x) in one quarter driven by 200+ user interviews, then shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 invested in deep research and an ML bet that paid off in durable user value, not a quick hack.", "factIds": ["ep-role", "ep-1"]}, {"value": "Respect the Community / We are Responsible (owning consequences, privacy)", "nealStory": "Biryani Blitz: built a PRIVACY-FIRST computer-vision telemetry system (OpenCV) tracking the impression->approach->purchase funnel \u2014 deliberately chose privacy-conscious design while still getting e-commerce-grade analytics, showing he owns the unintended consequences of what he ships. Directly relevant to Roblox's minor-safety bar.", "factIds": ["bb-2"]}, {"value": "Get Stuff Done / influence & scrappy execution ('went out of your way to learn')", "nealStory": "Biryani Blitz: shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time ~97%, plus a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 self-taught agentic tooling to solve a real bottleneck.", "factIds": ["bb-3"]}, {"value": "Take the Long View / product craft (structured PM thinking the APM bar rewards)", "nealStory": "FieldPulse: authored a PRD for an AI predictive-restocking feature (RAG over usage logs, schedules, seasonality), designed a 3-flow UX with AI explainability, and defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 demonstrates the structured problem-definition + metrics thinking Roblox grades APMs on.", "factIds": ["fp-1"]}, {"value": "Influence without authority / navigating disagreement (behavioral round staples)", "nealStory": "SailLoft: translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and built a 2-click Chrome extension for client testing \u2014 as an intern he drove adoption of a workflow change across engineers he didn't manage (influence without authority).", "factIds": ["sl-2"]}, {"value": "Respect the Community / leadership & belonging", "nealStory": "Leadership: Director of Professional Development for the UNC PM Club and President of UNC Ultimate Frisbee (BatCH) \u2014 running a team/community, useful for 'lead a group toward a shared goal' and belonging prompts.", "factIds": ["ld-1", "ld-2"]}], "analyticalFocus": ["Prioritization under pressure and resource allocation \u2014 the game-based online assessment (Kaiju Cats-style) is literally a constrained optimization: maximize combined value of 3 agents in ~15 turns while avoiding hazards and hitting order bonuses. Practice thinking aloud about greedy vs. lookahead tradeoffs and be ready to WRITE a short essay justifying your strategy", "Defining the right North Star + guardrail metrics for a product change (e.g. new-creator activation, avatar-item attach rate, D7 retention) \u2014 Roblox grades problem framing and metric selection", "Creator-economy / marketplace economics: Robux flow, DevEx conversion (raised 8.5% in 2025), dynamic + regional pricing, developer payout channels \u2014 be able to reason about a pricing or monetization change and its second-order effects", "Engagement funnel metrics (DAU/MAU, hours engaged, bookings/ARPU, retention curves) and diagnosing a metric drop", "Estimation / market sizing framed around gaming and the creator economy (e.g. size the opportunity for a new avatar-item category or a regional-pricing rollout)", "Safety/trust metrics as a first-class analytical dimension (reported-incident rate, false-positive rate on ML filtering) given the minor user base"], "gotchas": ["The online assessment is GAMES, not LeetCode. It runs on the actual Roblox platform and you write short essays explaining your strategy \u2014 install and play the 'Kaiju Cats' practice game beforehand; being fluent in the Roblox client itself is part of the test", "Genuine interest in gaming / the creator economy is explicitly screened \u2014 Neal has no gaming credit in the ledger, so he must bring authentic, specific motivation (why Roblox's UGC/creator model excites him) and NOT fake domain experience", "Safety and younger-user protection is a recurring theme and ties to the top value 'Respect the Community' (Community > Company > Team > Individual). Any product answer that ignores age-appropriateness/safety will read as tone-deaf", "APM bar rewards STRUCTURE and learning ability over deep experience \u2014 Neal should foreground clear frameworks and how fast he learns systems, not overclaim seniority", "Do not invent gaming or Roblox-specific experience. Every behavioral story must trace to a ledger fact ID; Neal's edge is 0->1 shipping + 500+ interviews + technical/AI fluency, which he should map onto Roblox's world rather than pretending prior gaming work", "Ledger presentation flags to honor even verbally: bb-1's 41.7% margin -> say '~42%, projected'; bb-3's 97% -> give a before->after or soften (no baseline). These are near-ceiling/over-precise numbers that can trigger skepticism", "Work authorization is UNCONFIRMED in the ledger and is a knockout field \u2014 Neal must confirm before applying", "System-design round is 'uncommon but has appeared' for APM (e.g. auto-translation across servers) \u2014 prepare a lightweight product+technical answer just in case; don't be caught flat"], "sources": ["https://www.tryexponent.com/guides/roblox-associate-product-manager-apm-interview-guide", "https://www.tryexponent.com/guides/roblox-associate-product-manager-apm-interview-guide/questions", "https://about.roblox.com/newsroom/2024/04/roblox-values-principles", "https://about.roblox.com/newsroom/2025/09/roblox-annual-economic-impact-report", "https://www.sec.gov/Archives/edgar/data/1315098/000131509826000024/rblx-20251231.htm", "https://www.businesswire.com/news/home/20250905587466/en/Roblox-Unveils-AI-Monetization-and-Performance-Innovations-for-Creators", "https://adamkulik.com/blog/kaijugo", "https://www.interviewquery.com/interview-guides/roblox-product-manager", "https://prepfully.com/interview-questions/roblox/product-manager"]}, {"company": "Epic Games", "products": ["Fortnite \u2014 650M+ registered accounts, ~110M MAU early 2026; now an ecosystem, not one game (Battle Royale, LEGO Fortnite, Rocket Racing, Fortnite Festival) plus creator-made 'islands'", "Fortnite Discover \u2014 the recommendation/discovery surface that ranks and surfaces islands to players (THIS is the intern team's product; ~47% of player hours are on creator islands as of May 2026)", "Unreal Editor for Fortnite (UEFN) + Creator Economy 2.0 \u2014 creator tooling + engagement-payout pool; $1B+ paid to creators (milestone announced June 17, 2026)", "Unreal Engine \u2014 UE6 unveiled and UE5.8 shipped at Unreal Fest 2026; powered ~28% of Steam games released in 2024", "Epic Games Store \u2014 6000+ games from 3000+ partners; third-party PC game spend up 57% in 2025", "Rocket League (first major title moving to UE6)", "Fall Guys", "MegaGrants \u2014 $100M+ awarded to developers/artists/researchers (creator-empowerment signal)"], "valuesAndBar": ["Mission-driven: 'create fun games we want to play and build the art and tools to bring them to life' \u2014 culture is a stated hiring signal (mission cited by employees as top reason they work there)", "Creator empowerment / creator-first: MegaGrants ($100M+), UEFN, Creator Economy 2.0 ($1B+ payouts), keeping IP with creators \u2014 show you think about the creator/developer as a customer, not just the player", "Genuine passion for gaming is treated as a real hiring signal (expect 'favorite game / how would you improve it')", "Data-driven decision-making: the intern role explicitly wants ability to 'dig deep into data to find valuable insights' and analyze player-engagement metrics", "Problem decomposition: 'deep drive to decomp abstract problems and output tangible solutions'", "Clear communication + organization across cross-functional teams (engineers, designers, data scientists, QA)", "Technical fluency: familiarity with SQL, Python or similar analysis tools is a listed qualification"], "interviewFormat": ["Application: Epic hires year-round (no fixed deadline); summer-internship window roughly Sept\u2013March; must be legally authorized to work in the posting location (Cary, NC) \u2014 WORK AUTH is a knockout Neal must confirm", "Stage 1 \u2014 Recruiter / recruitment screening (~30 min): role, culture-fit, background and why-Epic / why-gaming", "Stage 2 \u2014 Technical assessment 'in some cases' (data/analytical for a technical-PM track; SQL/Python-flavored reasoning, logic/aptitude)", "Stage 3 \u2014 Panel interview with the team (Fortnite Discover): multiple interviewers from different functions; mix of behavioral (STAR), a data-driven / product case discussion, and product-sense on Fortnite/Discover", "Behavioral rounds use classic 'tell me about a time' prompts (deadline, conflict, leadership, critical feedback, teamwork); STAR strongly recommended", "Difficulty ~3/5 per candidate reports; ~23-day median time-to-hire for PM"], "productSensePrompts": [{"prompt": "You're a PM on Fortnite Discover. Millions of creator islands exist but a handful capture most playtime, and new/original islands struggle to get seen. How would you improve island discovery for players AND give newer creators a fair shot?", "approach": "Clarify the two-sided goal (player: fast path to a fun session; creator: fair chance to be surfaced) and pick a North Star (e.g. player hours on newly-discovered islands, or session-2 retention for players who tried a Discover-surfaced island). Segment players (returning vs. new, genre affinity) and creators (established vs. emerging). Diagnose the cold-start / rich-get-richer loop. Propose interventions: an 'exploration' row that reserves impressions for under-exposed quality islands, downranking near-duplicate/spam islands (real Epic move), personalization from play history, and a creator-growth incentive. Name the tradeoff: engagement now (show proven hits) vs. ecosystem health long-term (seed new creators). Define metrics + a guardrail against surfacing low-quality islands, and an A/B test to validate."}, {"prompt": "Epic wants to grow the Fortnite creator ecosystem. Design a feature that helps a brand-new creator get their first 1,000 players.", "approach": "Anchor to the creator persona and their funnel: publish \u2192 pass moderation \u2192 get impressions in Discover \u2192 convert impression to play \u2192 retain. Identify the biggest drop-off (likely impressions for zero-history islands). Feature ideas: a 'new creator' spotlight surface with capped guaranteed impressions, an in-editor quality/pre-check assistant so first islands clear the quality bar, and Creator Communities (follows/notifications \u2014 a real 2026 Epic feature) to convert first players into a returning base. Tie to Epic's real Creator Economy 2.0 engagement-pool payout so the incentive is aligned. Metrics: time-to-first-1K-players, new-creator 30-day survival, share of player hours going to islands <90 days old. Call the abuse risk (gaming the spotlight) and mitigation."}, {"prompt": "How would you measure whether Fortnite Discover is 'good'? Define the metrics for the Discover recommendation surface.", "approach": "Separate player-side and creator-side health. North Star candidate: total quality player-hours originating from Discover (not just clicks). Input/driver metrics: impression\u2192play conversion, session length and next-day return of players who entered via Discover, diversity of islands surfaced (anti-monopoly), and creator-side fairness (Gini/share-of-impressions across creators, new-creator surfacing rate). Guardrails: complaint/report rate, refund/abandon rate, time-to-first-fun. Explain leading vs. lagging indicators and how you'd trade off short-term engagement against long-term ecosystem diversity. Reference that creator islands are ~47% of player hours to justify why Discover quality is strategically load-bearing."}, {"prompt": "Epic could let creators PAY for more visibility in Discover (sponsored placement). Should they, and how would you design it without wrecking player trust?", "approach": "Frame it as a marketplace-design + trust tradeoff (Epic actually shipped a sponsored Discover row). Pros: monetization + a growth lever for creators who lack organic reach; cons: pay-to-win crowding out quality, player distrust if the feed feels like ads. Design guardrails: sponsored placements must still clear the quality/moderation bar, clear labeling, a cap on % of surface that is paid, and a relevance floor so paid islands still match the player. Metrics: incremental creator revenue vs. player trust proxies (report rate, Discover-session retention, complaints). Propose an experiment measuring whether paid placement cannibalizes long-term engagement. Show you weigh Epic's creator-first value against player experience."}], "behavioralMapping": [{"value": "Data-driven decision-making (analyze player-engagement metrics to find insights)", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and shipped an ML flashcard engine, scaling 17\u2192563 active users in one quarter (33x) while lifting exam scores 16% and cutting review time 38% \u2014 a clean before\u2192after where analysis drove the product decision and moved KPIs. Mirrors the Discover team's 'use data to identify new features and improve engagement.'", "factIds": ["ep-1", "ep-role"]}, {"value": "Building the analytics/measurement layer itself (instrumentation for engagement funnels)", "nealStory": "At Biryani Blitz, built a privacy-first OpenCV computer-vision telemetry system tracking the impression\u2192approach\u2192purchase funnel \u2014 literally gave a physical machine e-commerce-grade conversion analytics. Directly analogous to Discover's impression\u2192play conversion funnel the intern would analyze.", "factIds": ["bb-2", "bb-role"]}, {"value": "Decomposing abstract problems into shipped, tangible solutions (0\u21921)", "nealStory": "Founded Biryani Blitz after 180 customer interviews and launched a 0\u21921 hot-food vending platform at UC Berkeley (fresh biryani in 60s), with a projected ~$145K ARR/machine \u2014 took an ambiguous idea to a deployed product. Shows the 'decomp abstract problems \u2192 tangible output' bar Epic lists.", "factIds": ["bb-1", "bb-role"]}, {"value": "Cross-functional collaboration (engineers, designers, data scientists, QA)", "nealStory": "At SailLoft, led the 0\u21921 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel execution), cutting manual tests 40%, and translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge ~25% \u2014 worked directly across engineering workflows, matching Discover's cross-functional, developer-adjacent environment.", "factIds": ["sl-1", "sl-2", "sl-role"]}, {"value": "Leadership / taking charge of a team ('tell me about a time you led a team')", "nealStory": "President of UNC Ultimate Frisbee (BatCH) and Director of Professional Development for the UNC Product Management Club \u2014 real recurring leadership; pair with the Biryani Blitz founder role for a stronger 'led people to an outcome' story. (Note: add roster/team size and a shipped outcome, since title-only leadership is a weak signal.)", "factIds": ["ld-2", "ld-1", "bb-role"]}, {"value": "Automation / technical PM building tooling (agentic + full-stack)", "nealStory": "At Biryani Blitz, shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities cutting weekly outreach time ~97%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 demonstrates the technical-PM 'builds, not just specs' profile Epic's technical-PM track wants. (Phrase the 97% as a before\u2192after, not a bare percentage.)", "factIds": ["bb-3"]}, {"value": "PRD / KPI rigor and defining a North Star metric", "nealStory": "Authored the FieldPulse Predictive Restocking PRD (RAG over usage logs/schedules/seasonality), designed a 3-flow UX with AI explainability, and defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 shows exactly the metric-definition discipline needed for the 'how would you measure Discover' product-sense prompt.", "factIds": ["fp-1"]}, {"value": "Handling constraints / doing more with less (deadlines, resourcefulness)", "nealStory": "SailLoft internship was a compressed ~one-month engagement (Jun\u2013Jul 2025) yet still shipped a 0\u21921 test product and a 2-click Chrome extension \u2014 a concrete tight-deadline delivery story for the classic Epic 'meet a tight deadline' prompt.", "factIds": ["sl-role", "sl-1", "sl-2"]}], "analyticalFocus": ["Recommendation / discovery-surface metrics: impression\u2192play conversion, click-through, ranking quality", "Player engagement + retention: session length, next-day / D7 return, MAU, quality player-hours", "Two-sided ecosystem health: creator fairness (share-of-impressions distribution), new-creator surfacing rate, diversity of islands shown", "Creator monetization: engagement-payout pool share, in-island transaction revenue, Support-a-Creator conversion", "North Star selection + leading vs. lagging indicators, plus guardrail metrics (report/complaint rate, refund/abandon)", "A/B testing / experiment design to validate a Discover ranking change", "SQL / Python data-pulling and funnel analysis (Neal has SQL, Python, Tableau, Google Analytics per ledger skills)", "Cold-start / rich-get-richer estimation (why a few islands capture most of ~47% creator playtime)"], "gotchas": ["CRITICAL name collision: 'Epic Games' (Fortnite/Unreal, Cary NC) is NOT 'Epic Systems' (healthcare software, Verona WI). The Sphinx/Rembrandt aptitude exams belong to Epic SYSTEMS \u2014 do NOT prep for those for an Epic Games interview. Many search results and interview guides conflate the two.", "Work authorization is a hard knockout: the Epic Games intern posting requires legal authorization to work in Cary, NC for the internship duration. Neal's ledger lists workAuth as UNCONFIRMED \u2014 he must confirm before applying.", "This specific intern role is on the Fortnite Discover (recommendation/discovery) team and is a TECHNICAL PM role \u2014 expect SQL/Python-flavored data reasoning, not pure product-design. Lean into Neal's OpenCV funnel-telemetry and ML/analytics facts, not just interview counts.", "Gaming passion is a genuine signal \u2014 have a real favorite-game answer and a specific 'how I'd improve Fortnite Discover / this game' take. Don't fake enthusiasm; be specific.", "Don't over-claim on ledger numbers flagged as fabrication-risk: 41.7% net margin \u2192 say '~42%, projected'; 97% outreach-time cut \u2192 give a before\u2192after, not a bare percentage; $145K ARR \u2192 keep the word 'projected'.", "Product-sense answers should weigh Epic's creator-first value: a Discover change that boosts short-term engagement but starves new creators is the wrong answer \u2014 always name the ecosystem-health tradeoff.", "Some 'Epic Games PM interview' guides describe the full-time/senior loop (leadership vision round); the intern path is lighter: recruiter screen \u2192 optional technical assessment \u2192 team panel. Calibrate expectations to intern, not FTE.", "Epic reviews and hires year-round with no fixed deadline \u2014 apply early; roles fill as soon as a match is found."], "sources": ["https://www.interviewquery.com/interview-guides/epic-games-product-manager", "https://www.glassdoor.com/Interview/Epic-Games-Interview-Questions-E266904.htm", "https://www.epicgames.com/site/en-US/earlycareers", "https://www.tealhq.com/job/technical-product-management-intern_8e9439a6-877c-4e0b-a5d1-1913dc6c8813", "https://gamejobs.co/Technical-Product-Management-Intern-at-Epic-Games", "https://icon-era.com/statistics/epic-games/", "https://godisageek.com/2026/06/epic-ue6-uefn-payouts/", "https://www.fortnite.com/news/how-fortnite-discover-works", "https://www.fortnite.com/news/big-changes-for-discover", "https://naavik.co/digest/epics-strategic-shake-up/", "https://tech-insider.org/ca/fortnite-creator-economy-1-billion-2026/", "https://www.tubefilter.com/2026/06/17/epic-games-unreal-editor-for-fortnite-creator-payouts/", "https://canvasbusinessmodel.com/blogs/mission/epic-games-mission", "https://www.comparably.com/companies/epic-games/mission", "https://www.techprep.app/blog/epic-games-interview-process", "https://algocademy.com/blog/epic-games-interview-questions-a-comprehensive-guide-for-aspiring-game-developers/"]}, {"company": "Unity Technologies", "products": ["Unity Engine / Unity Editor (real-time 3D development platform; Unity 6 LTS released Oct 2024, Unity 6.1 adding Deferred+ rendering, Variable Rate Shading, Project Auditor, foldable/large-screen support)", "Unity AI (in-Editor AI creation tools using third-party models; successor to the now-deprecated Unity Muse which used first-party models)", "Unity LevelPlay (ad mediation platform, 25+ ad networks, A/B testing, real-time transparency reporting)", "Unity Ads network powered by Vector (self-learning AI/ML user-acquisition + ad-serving system; full migration to Vector completed May 2025)", "Tapjoy offerwall (rewarded marketplace experiences) and Ad Quality service", "Unity Grow (mobile app marketing/monetization/growth suite)", "Unity Cloud + Unity Gaming Services (backend, multiplayer, LiveOps)", "Unity Asset Store (marketplace for developer assets and tools)"], "valuesAndBar": ["Mission: democratize game development and enable creator/developer success \u2014 'the world is a better place with more creators in it'", "Unity's Principles are explicitly assessed in interviews (behavioral, STAR-style, tied to each principle)", "Principle - In it together: act like owners, be direct with good intent", "Principle - Go bold: do bold things, learn from failure, go big again", "Principle - Best ideas win: vigorous debate so the best idea wins regardless of who raised it", "Principle - Lead with empathy and respect; listen first to customers and colleagues", "Principle - Communicate with candor: be transparent, challenge assumptions", "Principle - Act with urgency: prioritize and move now", "Principle - Prioritize the greater good: customer/community value is paramount", "PM bar: entrepreneurial, adaptable, comfortable challenging the status quo and navigating ambiguity; strong communication + critical thinking (heavily weighted in the case presentation)"], "interviewFormat": ["Recruiter screen (~30 min): motivations, background, role/Unity overview", "Hiring manager interview (30-60 min phone/video): deep dive on relevant experience", "Skills assessment: role-specific evaluation, often including writing/communication", "PM-specific take-home case study: given a case to analyze independently for a set period, then present findings to a panel (evaluates critical thinking, communication, product-strategy articulation; expect 'what if' follow-ups)", "Onsite (final, usually video): team members ask job-specific questions + behavioral/situational questions explicitly mapped to Unity's Principles (STAR method expected)", "Reported total of ~5 interviews (HR, hiring manager, case study, STAR/behavioral panels). AI PM Intern role pays ~$29/hr and sits within AI@Unity working alongside researchers, engineers, and other PMs"], "productSensePrompts": [{"prompt": "How would you improve the Unity Asset Store for indie developers who struggle to discover high-quality assets?", "approach": "Clarify the user segment (solo indie vs. small studio) and their job-to-be-done (ship faster without reinventing). State goal: increase successful asset adoption and creator earnings. Map the funnel (search -> evaluate -> buy -> integrate -> reuse) and find the biggest drop-off (trust/quality signal at evaluation). Propose 2-3 solutions ordered by impact: AI semantic search + 'works with my Unity version/render pipeline' compatibility filter, verified-quality/review-authenticity badges, and one-click Editor import previews. Pick one, define success metric (asset attach rate per new project / creator revenue), name the tradeoff (curation quality vs. catalog breadth). Tie to 'more creators' mission."}, {"prompt": "Design an AI feature for the Unity Editor that helps a first-time developer build their first game faster.", "approach": "Segment on the beginner persona and their pain (blank-canvas paralysis, doesn't know Unity concepts/APIs). Goal: reduce time-to-first-playable and 30-day retention of new seats. Given Unity AI now uses third-party models, propose an in-Editor conversational assistant that generates starter scenes/scripts with inline explanations plus 'why this' explainability (leverage my FieldPulse AI-explainability instinct, fact fp-1). Prioritize guardrails: keep the human in the loop, don't overwrite work. North star: percentage of new users reaching a playable build in first session; guardrail metric = generated-code acceptance/edit rate. Note the tradeoff between hand-holding vs. teaching."}, {"prompt": "You own Unity LevelPlay. A mid-size mobile game studio's ad revenue (ARPDAU) is flat. How do you diagnose and grow it?", "approach": "Structure the metric: ARPDAU = impressions/DAU x fill rate x eCPM. Instrument the funnel and isolate which lever is flat. Hypotheses: too few ad networks in mediation (add to the 25+ pool), poor waterfall/bidding config, ad placement hurting session length, or creative fatigue. Recommend A/B testing placements and mediation setups (LevelPlay supports this) and using Vector's self-learning optimization. Watch the guardrail: retention/session length so monetization doesn't cannibalize engagement (the 'greater good' principle for players). Define success as ARPDAU lift with retention held neutral."}, {"prompt": "Should Unity build deeper generative-AI content tools into the Engine, and how would you measure success?", "approach": "Frame it as a strategy question. Segment users (hobbyist, indie, AAA) \u2014 value and risk differ by segment. Upside: lowers barrier, expands the creator base (core mission), differentiates vs. Unreal/Godot. Risks: IP/training-data trust, asset-marketplace cannibalization, quality dilution. Recommend a phased bet starting with productivity/assistive AI over full asset generation, gated by opt-in and provenance. North star: creator activation + retained paying seats; counter-metrics: Asset Store creator revenue and trust/complaint rate. Explicitly name what would make you kill it."}], "behavioralMapping": [{"value": "Go bold (do bold things, learn from failure, go big again)", "nealStory": "Founded Biryani Blitz \u2014 a 0->1 hot-food vending platform deployed at UC Berkeley after 180 customer interviews; Wharton Startup Challenge finalist and Wharton + UNC Innovation Labs backed. Frame the bold bet + what was learned iterating on the physical product.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "In it together / act like owners", "nealStory": "As founder-PM, owned the whole stack end to end \u2014 built the CV telemetry system and the AI lead-gen agent myself rather than waiting for resources; took full ownership of outcomes.", "factIds": ["bb-2", "bb-3"]}, {"value": "Lead with empathy and respect / listen first to customers", "nealStory": "Ran 200+ user interviews to scale Elephant Productivity Suite from 17 to 563 active users (33x) in a quarter; listened to student pain points before shipping the ML flashcard engine (16% exam-score lift, 38% review-time cut).", "factIds": ["ep-1", "ep-role"]}, {"value": "Act with urgency / bias to action", "nealStory": "In a 1-month SailLoft internship (Jun-Jul 2025) led a 0->1 Gerrit-based software-test product to launch, cutting manual tests 40% \u2014 shipped fast under a tight timeline.", "factIds": ["sl-role", "sl-1"]}, {"value": "Best ideas win / communicate with candor", "nealStory": "Translated developer-workflow pain into a GitHub testing interface and a 2-click Chrome extension, accelerating PR-to-merge ~25% \u2014 chose the simplest workflow that won on merit, defended the design tradeoff with engineers.", "factIds": ["sl-2"]}, {"value": "Prioritize the greater good / customer + community value", "nealStory": "Built the Biryani Blitz CV funnel as privacy-first by design (no PII), balancing analytics value against customer trust \u2014 a greater-good tradeoff. Reinforce with FieldPulse PRD where First-Time Fix Rate (customer outcome) was the North Star over vanity metrics.", "factIds": ["bb-2", "fp-1"]}, {"value": "Leadership / navigating ambiguity", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee \u2014 led peers through ambiguous, self-directed goals.", "factIds": ["ld-1", "ld-2"]}], "analyticalFocus": ["Ad monetization math: ARPDAU / ARPU decomposition (impressions per DAU x fill rate x eCPM), eCPM, fill rate, waterfall vs. in-app bidding", "User-acquisition economics: ROAS, CPI, LTV:CAC, retention curves (D1/D7/D30) \u2014 central to Vector and Unity Grow", "Ad mediation A/B testing and experiment design (LevelPlay supports A/B tests)", "Engagement vs. monetization tradeoff (session length / retention as guardrail metrics against ad load)", "Creator/developer funnel metrics: activation (time-to-first-playable), retained paying seats, Asset Store attach and creator revenue", "Defining a North Star + counter-metrics for an AI feature (acceptance/edit rate, trust/complaint rate)"], "gotchas": ["The case study is the make-or-break round: it is a prepare-independently-then-present-to-a-panel format, so rehearse a tight, structured slide narrative and expect 'what if' pushback \u2014 communication is scored as heavily as the answer.", "Behavioral rounds map explicitly to Unity's named Principles. Pre-map a STAR story to each principle (see behavioralMapping) so you can name the principle in your answer.", "Muse vs. Unity AI: Unity Muse (first-party models) is DEPRECATED; the current offering is Unity AI using third-party models. Do not pitch Muse as current \u2014 reference Unity AI.", "Know the product split: Unity monetizes via BOTH the creation side (Engine/Editor subscriptions, Asset Store) and the Grow/monetization side (LevelPlay, Vector ads, Tapjoy). The AI PM intern role sits in AI@Unity \u2014 tailor toward AI-in-Editor and AI-driven monetization (Vector).", "Unity is mid-turnaround after prior pricing/leadership controversy (the 2023 Runtime Fee) \u2014 show empathy for developer trust; don't propose monetization that erodes creator goodwill (violates 'prioritize the greater good').", "Neal's work authorization is UNCONFIRMED in the ledger \u2014 verify before applying since it is a common knockout field. Do not fabricate.", "Do not over-precise Neal's projected startup numbers (41.7% margin, 97% time cut are flagged); phrase as 'projected/approx' per ledger presentation notes.", "Competitors to reference intelligently: Unreal Engine, Godot (engine); AppLovin MAX, ironSource/Google AdMob (ad mediation) \u2014 useful framing in strategy/product-sense answers."], "sources": ["https://unity.com/blog/news/want-to-work-at-unity-heres-how-our-hiring-process-works", "https://www.interviewquery.com/interview-guides/unity-technologies-product-manager", "https://www.glassdoor.com/Interview/Unity-Technologies-Product-Manager-Interview-Questions-EI_IE455854.0,18_KO19,34.htm", "https://unity.com/careers/positions/product-manager-intern-ai-unity/1890993", "https://gamejobs.co/Product-Manager-Intern-AI-at-Unity", "https://www.levels.fyi/internships/Unity-Technologies/Product-Manager-Intern/", "https://unity.com/blog/unity-engine-2025-roadmap", "https://unity.com/products/levelplay", "https://unity.com/products/unity-ads", "https://unity.com/products/unity-ads/vector", "https://unity.com/features/ai", "https://unity.com/blog/engine-platform/unity-muse-ai-capabilities-in-editor-plus-new-updates", "https://unity.com/our-company", "https://dcf-model.com/blogs/vision/u-mission-vision"]}, {"company": "TikTok", "products": ["TikTok (short-form video / For You recommendation feed)", "TikTok Shop (in-app live + shoppable video e-commerce)", "TikTok LIVE (live streaming + LIVE Gifts creator monetization)", "Creator Rewards Program / Creator monetization tools", "CapCut (video editing app under the ByteDance/US JV)", "Lemon8 (lifestyle content app, Pinterest/Instagram-style)", "TikTok Ads Manager / TikTok for Business (advertiser tooling)"], "valuesAndBar": ["Mission: 'Inspire Creativity & Bring Joy'", "ByteStyle value: Always Day 1 (entrepreneurial mindset, keep pioneering instead of relying on past achievements)", "ByteStyle value: Be Candid and Clear (speak your mind, expose problems candidly, no 'managing up')", "ByteStyle value: Seek Truth and Be Pragmatic (independent thinker, get to the bottom of things, distill to fundamentals)", "ByteStyle value: Be Courageous and Aim for the Highest (take calculated risks for bigger gains, focus on ROI)", "ByteStyle value: Grow Together", "ByteStyle value: Champion Diversity and Inclusion", "PM competency emphasis: extreme data orientation \u2014 let empirical evidence, not intuition, drive decisions", "PM competency emphasis: speed and rapid experimentation (A/B testing) in one of the fastest-iterating product environments in tech", "PM competency emphasis: content-ecosystem thinking at massive scale (engagement mechanics, recommendation)", "PM competency emphasis: cross-functional shipping with globally distributed teams"], "interviewFormat": ["Overall ~3-5 week timeline; process is NOT standardized and varies by role/level/candidate", "Round 1 \u2014 Recruiter screen (~30 min): background, genuine interest in TikTok, mission/values alignment, availability", "Rounds 2-4 \u2014 Progressive video interviews, each ELIMINATORY (must pass each to advance; you cannot offset a weak round with a strong one \u2014 unlike Meta/Amazon/Google onsite loops)", "Interview content types: Product Design/Sense, Metrics/Analytics, Product Strategy, and Behavioral (fit)", "Often no single traditional 'onsite loop'; more a sequence of separate video rounds with team PMs + hiring manager", "Final stage typically hiring manager + HR/recruiter", "Logistics gotcha: one or more rounds may be with a China-based interviewer, so expect Chinese-timezone scheduling and possibly a non-native English speaker; some sources also mention a case study / presentation round"], "productSensePrompts": [{"prompt": "Design a TikTok feature that helps small/local businesses reach and convert customers (tie-in to TikTok Shop discovery).", "approach": "Clarify the segment (SMB seller, low ad budget, no studio) and the goal (discovery -> first sale). User: define the SMB persona and its jobs-to-be-done vs. a creator's. Pain points: hard to get discovered, no content skills, unclear ROI. Prioritize 1-2 (discovery + low-friction shoppable content). Solution: e.g. an AI-assisted 'shoppable clip' generator + auto-tagging into the For You/Shop graph + a simple funnel dashboard. Trade-offs: feed quality vs. commercial content density. North Star = SMB seller repeat-selling rate; guardrail = feed engagement/skip rate. Neal can lean on his real SMB/vending funnel-analytics work (bb-2) and lead-gen agent (bb-3)."}, {"prompt": "How would you evaluate the success of TikTok LIVE (or the Creator Rewards Program)? What metrics, and what is your North Star?", "approach": "Segment stakeholders: viewer, creator, TikTok. Map the funnel: LIVE discovery -> watch -> gift/engagement -> creator retention. Propose a North Star (e.g. weekly creator earning-retention, or gifting-viewer count) with input metrics (LIVEs started, avg watch time, gifter conversion, gift ARPU) and guardrails (report rate, refund/chargeback, creator churn). Show counter-metric thinking to avoid gaming (e.g. don't optimize gifts at the expense of viewer trust). Neal maps to his 15+ KPI / North Star definition work (fp-1) and conversion-funnel telemetry (bb-2)."}, {"prompt": "TikTok video completion rate drops 10% week-over-week. How do you investigate and respond?", "approach": "Treat as a metrics-debugging/execution question. First confirm the metric isn't broken (logging/instrumentation change, definition change) \u2014 this signals data rigor TikTok prizes. Then segment: geography, app version, cohort (new vs. existing), content category, device. Form hypotheses (recent recommendation-model change, a UI release, seasonality, a content-supply shift) and rank by likelihood x impact. Validate with the smallest query/experiment first; if a ranking change is suspected, check the holdout/control. Propose rollback vs. iterate decision criteria. Neal ties to his OpenCV impression->approach->purchase funnel instrumentation (bb-2) and A/B testing skill."}, {"prompt": "Should TikTok double down on e-commerce (TikTok Shop) in the US, and how would you sequence it?", "approach": "Strategy question \u2014 start with the goal (revenue diversification + creator monetization + defensibility). Assess where TikTok wins (native shoppable content + recommendation-driven demand generation vs. Amazon's search-driven intent). Pick a wedge (impulse/discovery categories: beauty, fashion, gadgets) and a beachhead motion (creator-led live selling). Trade-offs: feed trust and ad load, logistics/returns, regulatory/ownership overhang. Define entry metrics (GMV per DAU, buyer conversion, seller retention) and a kill/scale gate. Show calculated-risk framing to hit the 'Be Courageous / ROI' ByteStyle. Neal maps to his 0->1 launch + unit-economics modeling (bb-1)."}], "behavioralMapping": [{"value": "Seek Truth and Be Pragmatic (data-driven decisions)", "nealStory": "At Elephant Productivity Suite, Neal ran 200+ user interviews and used the findings + an ML flashcard engine to grow the app 17->563 active users in a quarter, lifting exam scores 16% and cutting review time 38% \u2014 decisions driven by user data and measured outcomes, not intuition.", "factIds": ["ep-1"]}, {"value": "Seek Truth and Be Pragmatic (getting to the bottom of things with data)", "nealStory": "At Biryani Blitz he built a privacy-first OpenCV telemetry system tracking the impression->approach->purchase funnel, giving a physical vending machine e-commerce-grade conversion analytics \u2014 instrumenting the truth rather than guessing why sales moved (directly analogous to a TikTok funnel/metrics investigation).", "factIds": ["bb-2"]}, {"value": "Always Day 1 (entrepreneurial mindset, 0->1 pioneering)", "nealStory": "Neal founded Biryani Blitz, a 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in 60s), after 180 customer interviews, with a projected ~42% net margin and ~$145K ARR/machine model \u2014 a from-nothing founder story that embodies Day-1 mentality.", "factIds": ["bb-role", "bb-1"]}, {"value": "Be Courageous and Aim for the Highest (calculated risks, ROI focus)", "nealStory": "Neal took the venture to external validation: backed by Wharton + UNC Innovation Labs ($5K) and became a $200K Wharton Startup Challenge finalist \u2014 pursuing a big, ROI-oriented bet and putting it in front of judges.", "factIds": ["bb-4"]}, {"value": "Speed & Rapid Experimentation / efficiency (fast iteration)", "nealStory": "He shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 shipping fast and automating for efficiency (present before->after phrasing rather than the raw 97%).", "factIds": ["bb-3"]}, {"value": "Be Candid and Clear / Cross-functional impact (translating pain into shipped product)", "nealStory": "At SailLoft, Neal led a 0->1 internal Gerrit + Bazel software-test product that cut manual tests 40%, and translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25% plus a 2-click Chrome extension \u2014 surfacing real problems candidly and shipping the fix cross-functionally.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Metrics ownership / North Star thinking (analytical rigor for the metrics round)", "nealStory": "Neal authored a PRD for an AI predictive-restocking feature (RAG over usage logs, schedules, seasonality) with a 3-flow UX and 15+ KPIs, choosing First-Time Fix Rate as the North Star \u2014 demonstrating exactly the metric-definition and guardrail thinking a TikTok metrics prompt tests.", "factIds": ["fp-1"]}, {"value": "Grow Together / Champion D&I (leadership and developing others)", "nealStory": "Neal serves as Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 roles about growing and organizing others (add team/roster size and a concrete shipped outcome to strengthen, per ledger note).", "factIds": ["ld-1", "ld-2"]}], "analyticalFocus": ["Engagement metrics: DAU/MAU, session length, video completion rate, watch time, retention curves", "Recommendation/For You feed quality metrics and how a ranking-model change propagates to engagement", "Creator-economy metrics: creator retention, LIVE Gifts / gifting ARPU, Creator Rewards payouts, creator supply health", "TikTok Shop e-commerce funnel: GMV, GMV per DAU, buyer conversion, seller retention, return/refund rate", "Metric-integrity debugging: distinguishing a real drop from an instrumentation/definition change before diving in", "Guardrail / counter-metric design to prevent gaming (e.g. trust/report rate, ad-load vs. engagement)", "A/B testing, holdouts, and reading experiment results for rapid iteration decisions", "Back-of-envelope estimation / market sizing (e.g. TikTok Shop US GMV potential, ARPU by market)"], "gotchas": ["Every round is ELIMINATORY \u2014 you cannot recover a weak round with a strong later one; treat each as pass/fail and prep evenly across product/metrics/strategy/behavioral.", "Expect a China-based interviewer on at least one round: be flexible on Chinese-timezone scheduling and speak clearly/plainly for a possibly non-native English speaker (aligns with the 'Be Candid and Clear' value).", "TikTok's process is explicitly NOT standardized \u2014 it varies by role, level, and candidate, so do not over-rely on a fixed script; be adaptable.", "Data orientation is the bar: TikTok wants evidence over intuition \u2014 always volunteer metrics, experiments, and how you'd validate; lead behavioral answers with quantified outcomes (Neal's ledger is metric-rich).", "Speed culture: show you can ship and iterate fast, not just plan \u2014 cite before->after shipping stories (SailLoft, Biryani Blitz agent).", "Product-sense answers should be TikTok-native: think content ecosystem, recommendation/For You, creator economy, and Shop \u2014 not generic app design.", "Ledger phrasing risks to correct live: soften the '97% time cut' (bb-3) into a before->after with a baseline, and round '41.7% net margin' (bb-1) to ~42% labeled 'projected'; do not invent any new numbers.", "Work authorization is UNCONFIRMED in the ledger and TikTok/ByteDance roles can have visa/knockout screens \u2014 Neal must confirm his status before applying.", "Be ready for trust-&-safety / 'addictive algorithm' and data-privacy questions given TikTok's regulatory and US-ownership context; have a balanced, user-wellbeing-plus-business answer."], "sources": ["https://www.productalliance.com/post/tiktok-pm-interview-process-in-2026-what-bytedance-really-looks-for", "https://igotanoffer.com/blogs/product-manager/tiktok-product-manager-interview", "https://www.tryexponent.com/blog/tiktok-interview-process", "https://lifeattiktok.com/philosophy", "https://www.bytedance.com/en/", "https://www.brightnetwork.co.uk/employer-advice/tiktok/tiktoks-values/", "https://www.interviewquery.com/interview-guides/tiktok", "https://ophyai.com/blog/company-guides/tiktok-interview-guide", "https://www.hurun.net/en-us/info/detail?num=C8RFJSYJCSBY", "https://metricool.com/lemon-8/", "https://eu.36kr.com/en/p/3066759952905088", "https://ads.tiktok.com/business/en/blog/tiktok-product-preview", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Yelp", "products": ["Yelp consumer app / reviews platform \u2014 the core connect-people-with-local-businesses discovery product (search, ratings, photos, reviews)", "Yelp Assistant \u2014 AI conversational chatbot (2024 launch, majorly expanded 2026) that understands complex needs, gives review-backed recommendations, and completes tasks in-conversation (reservations, quotes across 450+ service categories, delivery via DoorDash/Grubhub)", "Yelp Guest Manager \u2014 restaurant front-of-house SaaS: waitlist/reservations, party management, Guest Experience Surveys, analytics (powers in-Assistant restaurant bookings)", "Yelp Host & Yelp Receptionist \u2014 fully autonomous AI voice agents (Fall 2025) that answer restaurant/SMB phone calls, handle table management and bookings", "Yelp Fusion AI API \u2014 data-licensing/developer product letting third parties embed Yelp's trusted content into natural-language search and multi-turn conversational experiences", "Request-a-Quote / Yelp for Business \u2014 the services-side monetization surface (lead gen for pros, advertising) connecting consumers to service professionals", "Menu Vision & visual search \u2014 AI-matched dish photos over menus, natural-language photo search, QR menu scanning, 90-sec user videos (2026 release)", "New booking integrations (2026): Vagaro (beauty/wellness), Zocdoc (healthcare), RepairPal (auto), Calendly (pro consultations)"], "valuesAndBar": ["Core values: Be Unboring (creativity over conformity), Be Authentic (integrity/honest reviews are paramount \u2014 trust is the product), Be Supportive (community + collaboration), and Be Tenacious (battle smart, root for the underdog / small local business)", "Mission: connect people with great local businesses \u2014 anchor every product-sense answer to consumers AND local business owners (two-sided marketplace)", "Trust & data integrity over short-term revenue \u2014 Yelp neutralizes millions of fake reviews yearly and refuses to let advertisers buy/alter reviews; PM answers must protect review authenticity", "Data-driven decision-making \u2014 Yelp explicitly weights analytical rigor and planning steps from data", "Technical fluency expected of PMs \u2014 comfort with SQL and Python is called out; PMs work closely with eng", "Customer-oriented mindset + cross-functional collaboration (eng, design, marketing)", "Strong communication \u2014 translating technical <-> non-technical clearly", "AI-native product direction \u2014 Yelp is aggressively repositioning around conversational + agentic AI, so a genuine AI-product point of view is a differentiator"], "interviewFormat": ["3 rounds typical for PM (can be 4 for APM; exact count varies by hiring team)", "Round 1 \u2014 Recruiter phone screen (~30 min): background, motivation for Yelp, understanding of PM fundamentals", "Round 2 \u2014 Mid-stage interview(s) with a PM / senior manager (~45-60 min video): often technical + product depth", "Round 3 \u2014 Virtual on-site: 4-5 back-to-back interviews with cross-functional stakeholders (eng, design, marketing) covering product sense/design, analytical/metrics, communication, and behavioral", "For intern/APM phone interview specifically: expect product-fundamentals + motivation + a light product/analytical prompt", "Total timeline reported ~few weeks up to 2 months", "Yelp maintains an official PM interview-prep landing page (yelp.careers) \u2014 worth reviewing but light on specifics"], "productSensePrompts": [{"prompt": "Pick one thing in the current Yelp app and improve it (a known Yelp go-to opener).", "approach": "Clarify the user + goal (e.g. consumer discovery vs. business-owner tooling). Pick ONE segment, state a mission-aligned goal (better connect people to great local businesses). Identify 2-3 real pain points from user journey, prioritize by impact x effort x trust-risk, propose a solution, define a success metric, and name the tradeoff (e.g. personalization vs. review authenticity). Show you protect trust \u2014 the anti-fake-review value is core to Yelp."}, {"prompt": "Design an improvement to Yelp Assistant (their flagship AI product) \u2014 how would you make it more useful for a consumer with a complex, multi-step local task (e.g. planning a night out)?", "approach": "Frame as an agentic two-sided problem: consumer wants trusted, low-effort task completion; local businesses want qualified demand. Map the conversation flow (understand intent -> recommend with review-backed rationale -> complete task via booking partners). Address AI trust/explainability (cite sources, avoid hallucinated recs \u2014 Neal's FieldPulse PRD built AI explainability, fact fp-1). Metrics: task-completion rate, conversation-to-booking conversion, recommendation trust/CSAT. Tradeoff: automation speed vs. accuracy/authenticity."}, {"prompt": "Design a table-booking / reservation product for restaurants (maps to Yelp Guest Manager).", "approach": "Two-sided design: diner side (find + book fast) and restaurant side (fill covers, manage waitlist/party flow, reduce no-shows). Prioritize the restaurant operator as the underserved side (Be Tenacious / underdog small business). Define MVP, then metrics: bookings completed, seat-fill rate, no-show rate, host time saved. Connect to Yelp Host/Receptionist AI-call-answering as an adjacency. Name tradeoff: overbooking risk vs. utilization."}, {"prompt": "How would you build a ranked list of the top brunch spots in the country, and what equation/factors would you use? (Yelp's actual ranking/analytical prompt.)", "approach": "Treat as a metrics-design problem. Enumerate signals: rating, review volume/recency, review authenticity/spam-filtered weight, photo engagement, reservation/quote demand, geographic normalization. Build a weighted score, explicitly down-weight fake/paid signals (integrity value). Discuss cold-start and small-sample bias (a 5-star with 3 reviews vs 4.5 with 2,000). Validate against a held-out signal. This directly rewards Neal's KPI-design experience (fp-1: 15+ KPIs with a North Star)."}], "behavioralMapping": [{"value": "Be Authentic / customer-oriented (integrity + user research)", "nealStory": "Founded Biryani Blitz after 180 customer interviews and scaled Elephant Productivity Suite from 17->563 users via 200+ interviews \u2014 grounding product decisions in honest user truth rather than assumptions.", "factIds": ["bb-1", "ep-1"]}, {"value": "Be Tenacious (battle smart, ship as an underdog founder)", "nealStory": "As a solo student founder, launched a 0->1 physical hot-food vending platform at UC Berkeley, earned Wharton + UNC Innovation Labs backing and reached $200K Wharton Startup Challenge finalist \u2014 fighting through the hard, unglamorous 0->1 work.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Data-driven decision-making + analytical rigor (Yelp's core emphasis)", "nealStory": "Built a privacy-first computer-vision telemetry system tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics; and authored a PRD defining 15+ KPIs with First-Time-Fix-Rate as the North Star.", "factIds": ["bb-2", "fp-1"]}, {"value": "Be Unboring (creativity over conformity \u2014 most creative approach to complex product dev)", "nealStory": "Shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities to automate outreach, and used privacy-first CV to turn a vending machine into a conversion-analytics product \u2014 non-obvious, creative solutions to hard problems.", "factIds": ["bb-3", "bb-2"]}, {"value": "Cross-functional collaboration / handling deadlines & translating dev pain to product", "nealStory": "At SailLoft, led a 0->1 internal software-test product (Gerrit voting + Bazel) cutting manual tests 40%, and translated developer-workflow pain into a GitHub testing interface that accelerated PR-to-merge ~25% \u2014 bridging eng needs and product delivery on an internship timeline.", "factIds": ["sl-1", "sl-2"]}, {"value": "Be Supportive (measurable user impact / helping the community you serve)", "nealStory": "Shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 delivering concrete value back to the users/customers served.", "factIds": ["ep-1", "bb-3"]}], "analyticalFocus": ["Ranking / list-building metric design (e.g. top brunch spots) with weighted-signal equations and fake-review down-weighting", "Diagnosing metric movements across the two-sided marketplace (classic Yelp prompt: bookings +10k, quotes -8k, phone calls -5k \u2014 interpret the shift)", "Funnel conversion analysis (impression -> click -> lead/quote -> booking) \u2014 directly mirrors Neal's bb-2 CV funnel work", "North-Star + KPI-tree definition for a feature (fp-1 experience: 15+ KPIs)", "Estimation/sizing (e.g. size the market of local service requests, or daily reservations through Guest Manager)", "SQL/Python-level analytical comfort \u2014 be ready to describe how you'd query/segment data", "Trust & integrity metrics \u2014 fake-review detection rate, review authenticity, spam neutralization"], "gotchas": ["Do NOT propose anything that would let advertisers buy, alter, or influence reviews \u2014 Yelp's brand is built on refusing this; it is an instant credibility killer. Always protect review authenticity.", "Yelp is a TWO-SIDED marketplace (consumers + local business owners). Answers that only optimize the consumer side miss half the product; name the business-owner side explicitly.", "Yelp has pivoted hard to conversational + agentic AI (Yelp Assistant, Host, Receptionist, Fusion AI API). Show a genuine, current AI-product point of view \u2014 do not describe Yelp as just a static reviews site.", "The metric-movement question (bookings up, quotes/calls down) is a channel-shift trap \u2014 interpret it as demand migrating between contact channels, not necessarily a loss; don't jump to 'something is broken.'", "Ranking prompts test whether you handle small-sample bias and spam \u2014 a naive average-star-rating answer fails; weight by volume, recency, and authenticity.", "Technical bar is real for PMs (SQL/Python called out) \u2014 do not hand-wave analytical/technical questions.", "Neal's standout numbers have presentation risks: '41.7% net margin' should be softened to ~42% and labeled projected; '97% outreach time cut' needs a before->after framing; keep '$145K ARR' labeled projected (per ledger presentationNotes on bb-1, bb-3).", "Do not invent experiences \u2014 every behavioral answer must trace to a ledger fact ID; Neal has no direct Yelp/local-marketplace work, so frame the two-sided-marketplace analogy via Biryani Blitz (physical local food business + customer funnel)."], "sources": ["https://www.yelp.careers/us/en/product-management-interview-prep", "https://prepfully.com/interview-guides/yelp-product-manager-interview-guide", "https://www.interviewquery.com/interview-guides/yelp-product-manager", "https://www.glassdoor.com/Interview/Yelp-Associate-Product-Manager-Interview-Questions-EI_IE43314.0,4_KO5,30.htm", "https://blog.yelp.com/life-at-yelp/living-yelps-mission-and-values/", "https://blog.yelp.com/news/spring-product-release-2026/", "https://blog.yelp.com/news/spring-product-release-2025/", "https://blog.yelp.com/news/yelp-host-yelp-receptionist-launch/", "https://business.yelp.com/data/products/ai-api/", "https://www.yelp-ir.com/news/press-releases/news-release-details/2025/Yelp-Expands-AI-Features-to-Make-Local-Discovery-More-Conversational-Visual-and-Seamless/default.aspx", "https://matrixbcg.com/blogs/mission/yelp"]}, {"company": "eBay", "products": ["eBay Marketplace (core C2C/B2C auction + Buy It Now e-commerce platform; the app is the primary surface)", "Magical Listing / Magical Bulk Listing (GenAI photo-to-listing seller tool; next-gen version rolled out to casual sellers on iOS/Android per Q4 2025 earnings)", "Authenticity Guarantee (third-party physical inspection for sneakers, luxury watches, handbags, trading cards, and head-to-toe luxury apparel \u2014 surpassed 1M items inspected in a quarter)", "eBay Live (livestream/QVC-style shopping for collectibles, sneakers, pre-loved fashion, refurbished tech; expanded to UK, Germany, Australia + 'on Tour' in US)", "Conversational AI shopping agent / 'shopping companion' (agentic buyer-discovery assistant launched May 2025, currently limited US app rollout)", "Shop the Look & Explore (AI buyer-discovery: outfit combinations and preference/size-based recommendations, fashion-centric)", "Focus verticals / 'FGM' strategy: Collectibles (trading cards, sneakers), Pre-loved & luxury apparel, Refurbished/Certified electronics, Motors/Parts"], "valuesAndBar": ["Mission: 'We connect people and build communities to create economic opportunity for all' \u2014 every product answer should ladder up to enabling buyers AND sellers (two-sided marketplace)", "Core values: Trust, Inclusion, Innovation, Customer obsession (buyer + seller obsession)", "Trust & safety is a first-class product pillar (Authenticity Guarantee exists because trust drives GMV in high-value categories)", "Data/experimentation culture: OKRs cascading to squads; executive incentives tied to GMV mix, ad revenue growth, and customer satisfaction", "AI-native / innovation push: heavy 2025-2026 emphasis on GenAI for sellers (listing) and agentic AI for buyers (discovery) \u2014 being a technical, AI-fluent PM is a differentiator", "Cross-functional collaboration across business partners, buyers/sellers, dev teams, and QA is explicitly emphasized", "PM competency bar: product vision + strategy, marketplace two-sidedness reasoning, metrics rigor, and 'saying no' / prioritization judgment"], "interviewFormat": ["Recruiter / HR phone screen (~30 min): background, qualifications, role fit", "Hiring manager phone/telephonic interview (~45-60 min): experience deep-dive + core PM knowledge, gate to onsite", "Senior PM interview (~45 min): product-management expertise, often product sense + strategy", "Onsite loop: typically 3 rounds (~30-45 min each) mixing product design/sense, execution, analytical/estimation, behavioral leadership, and cross-functional collaboration; may include a case study or short presentation", "Total process runs roughly 4-5 weeks; intern/APM loops are a compressed version of the same competency mix"], "productSensePrompts": [{"prompt": "How would you improve the selling experience on the eBay app for a first-time / casual seller? (eBay's actual bet here is Magical Listing.)", "approach": "Clarify: mobile app, new casual seller, goal = increase completed listings + activation (first successful sale). Frame the two-sided marketplace: more/better listings -> better buyer selection -> GMV. Segment: casual declutterer vs. aspiring reseller. Pick casual-declutterer (highest friction, eBay's stated target). Pain points: photography, category/title/pricing anxiety, shipping setup. Solutions tiered by effort: (1) photo-to-listing GenAI autofill (validate against real Magical Listing), (2) suggested price bands from comps, (3) prepaid-label shipping default. North Star: listings that reach first sale; guardrail: listing quality / buyer return & dispute rate so AI autofill doesn't create bad data. Close on trust: bad auto-generated specifics erode buyer trust, so measure item-not-as-described rate."}, {"prompt": "Design a feature to help buyers discover items on eBay, where inventory is unique, unstructured, and hard to search (eBay's 'treasure hunt' problem \u2014 see the conversational AI shopping agent and Explore).", "approach": "Anchor on eBay's structural difference vs. Amazon: one-of-a-kind, long-tail, seller-described inventory where keyword search fails. User: browsing buyer with intent but no exact query ('vintage denim jacket, my size, under $80'). Propose a conversational/agentic discovery flow that does iterative reasoning over eBay's 30 years of category data. Trade-off discussion: precision (agent surfaces few great items) vs. serendipity (the 'treasure hunt' emotion that is eBay's brand). Address the real failure mode \u2014 users have called the agent 'an annoyance' \u2014 so gate on opt-in and only trigger on genuine intent signals. Metrics: search-to-view, view-to-purchase, and a discovery-specific 'items saved/watched' engagement metric; guardrail on session abandonment."}, {"prompt": "eBay's Authenticity Guarantee covers sneakers, watches, handbags, and trading cards. Which category should we expand authentication into next, and how would you design it?", "approach": "State the mechanism: physical third-party inspection removes buyer risk in high-value categories, unlocking higher AOV GMV and justifying take rate. Evaluate candidate categories on a framework: (1) counterfeit/dispute rate (buyer pain), (2) average order value (unit economics to cover inspection cost), (3) volume/liquidity, (4) authentication feasibility/cost. Compare e.g. luxury apparel (already expanding in UK 'head-to-toe'), fine jewelry, high-end electronics, collectible coins/currency. Recommend one (e.g. fine jewelry or coins) with reasoning. Design the flow: seller ships to authentication center -> inspect -> forward to buyer; handle the added latency trade-off vs. buyer trust. Metrics: category GMV lift, dispute-rate reduction, inspection turnaround time, incremental take rate; guardrail on false-reject rate that would anger legitimate sellers."}, {"prompt": "eBay Live (livestream shopping) is growing across collectibles and pre-loved fashion. How would you measure its success and what would you build next?", "approach": "Define the job-to-be-done: real-time, community-driven selling for emotionally-charged / collectible inventory (cards, sneakers, luxury). Success metrics: live GMV per stream, viewer-to-buyer conversion, seller (host) retention & repeat streams, and community metrics (concurrent viewers, chat engagement, follows). Because it is two-sided, separate host-supply health from buyer-demand health. Next build: propose seller tooling (scheduling, auction-during-stream, AI-generated stream titles reusing Magical Listing) OR buyer features (personalized 'live now in categories you follow' notifications). Pick one and justify by which side is the bottleneck. Guardrail: trust/authenticity in live sales (impulse buying + high AOV collectibles = fraud risk), so tie to Authenticity Guarantee."}], "behavioralMapping": [{"value": "Customer obsession / user research depth", "nealStory": "Scaled Elephant Productivity Suite from 17 to 563 active users (33x) in one quarter driven by 200+ user interviews, and shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 demonstrates obsessive user-research-to-shipped-outcome loop. Use for 'tell me about deeply understanding a customer.'", "factIds": ["ep-1", "ep-role"]}, {"value": "Innovation / 0-to-1 builder (AI-native)", "nealStory": "Founded Biryani Blitz, a 0-to-1 hot-food vending platform at UC Berkeley built after 180 customer interviews, and built a privacy-first OpenCV computer-vision funnel (impression->approach->purchase) giving a physical machine e-commerce-grade conversion analytics \u2014 shows inventing a novel product AND novel measurement. Directly relevant to eBay's AI push.", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "Bias for action / shipping under ambiguity", "nealStory": "At SailLoft led the 0-to-1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40% with real-time status visibility, in a 2-month internship \u2014 shows shipping a working product fast from ambiguous developer pain. Use for 'tight deadline' / 'walk through a product you launched.'", "factIds": ["sl-role", "sl-1"]}, {"value": "Analytical / metrics rigor (KPIs & North Star)", "nealStory": "Authored the FieldPulse predictive-restocking PRD: RAG over usage logs/schedules/seasonality, a 3-flow UX with AI explainability, and defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 demonstrates picking a North Star metric and structuring a metrics tree, exactly the eBay analytical bar.", "factIds": ["fp-1"]}, {"value": "Trust / doing the right thing (data quality & privacy)", "nealStory": "Deliberately built the Biryani Blitz CV telemetry as privacy-first (no PII, aggregate funnel only) \u2014 a values-driven product decision under pressure to just collect everything. Maps to eBay's trust value; pair with the Magical Listing 'don't let AI create bad/untrustworthy item data' product-sense point.", "factIds": ["bb-2"]}, {"value": "Influence / cross-functional collaboration & saying no", "nealStory": "At SailLoft translated scattered developer-workflow pain into a GitHub testing interface that accelerated PR-to-merge ~25% and a 2-click Chrome extension for client testing \u2014 required aligning devs, clients, and QA and choosing what NOT to build. Use for 'influence without authority' / 'how you prioritize / say no.'", "factIds": ["sl-2"]}, {"value": "Growth / measurable business impact", "nealStory": "Biryani Blitz: shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities cutting weekly outreach time ~97%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40%; venture is Wharton + UNC Innovation Labs backed ($5K) and a $200K Wharton Startup Challenge finalist. Use for 'drove growth / retention' and credibility.", "factIds": ["bb-3", "bb-4"]}, {"value": "Leadership / initiative", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH); Bridge to BCG invitee (~10% acceptance) \u2014 use for 'tell me about leading a team / a time you took initiative' (add roster/team size when telling it).", "factIds": ["ld-1", "ld-2", "ld-3"]}], "analyticalFocus": ["Market-sizing / Fermi estimation (Glassdoor/InterviewQuery report classic prompts: 'red cars in China', 'iPad sales in the US per year', 'Prime Video market size') \u2014 practice a clean top-down population->penetration->frequency structure", "Marketplace two-sided metrics: GMV = active buyers x purchase frequency x AOV x take rate; know how to decompose GMV and reason about supply (listings/sellers) vs. demand (buyers) health separately", "North Star + guardrail metric selection (Neal's FieldPulse PRD with First-Time Fix Rate as North Star is the on-brand story here)", "Cost / operations estimation: eBay-specific prompt reported \u2014 'how would you reduce eBay's operating cost by one-third'; be ready to reason about infra, trust/authentication cost, support, and marketing", "Trust & safety metrics: item-not-as-described rate, dispute/return rate, authentication false-reject rate \u2014 connect AI-generated listings to data-quality guardrails", "A/B testing / experimentation reasoning for feature rollouts (Neal has experimentation/A-B testing listed as a product skill)"], "gotchas": ["Always reason TWO-SIDED. eBay is a marketplace, not a retailer \u2014 a buyer feature that hurts seller supply (or vice versa) is a failed answer. Explicitly name which side you're optimizing and the impact on the other.", "Trust is not optional. eBay built Authenticity Guarantee because fraud/counterfeits kill GMV in high-AOV categories. Weave trust/authenticity guardrails into product-sense answers, especially anything AI-generated.", "Don't propose Amazon. eBay's identity is unique/long-tail/'treasure hunt' inventory. Answers that turn eBay into a structured-catalog retailer miss the point \u2014 lean into unique inventory, collectibles, and pre-loved/refurbished.", "Know the AI landscape and its warts: Magical Listing (sellers) and the conversational shopping agent (buyers) are the flagship 2025-2026 AI bets \u2014 but the buyer agent has been criticized as 'annoying' and is still a limited rollout. Show you'd measure and gate it, don't just cheerlead AI.", "For behavioral: Neal's numbers are strong but some are near-ceiling (bb-3 '97%' with no baseline, bb-1 '41.7%' over-precise projections). Present these as before->after with baselines and label projections as 'projected/estimated' \u2014 do not state them as booked results.", "Workauth and GPA are UNCONFIRMED in the ledger (identity + edu-3). Neal must confirm work authorization before applying (knockout field) and only volunteer GPA if >= 3.5.", "Do NOT invent experiences: every behavioral answer must trace to a ledger fact ID above. Neal has no e-commerce/marketplace job \u2014 bridge his marketplace fluency via Biryani Blitz (a physical two-sided vending marketplace with conversion analytics) rather than claiming eBay-like experience."], "sources": ["https://www.interviewquery.com/interview-guides/ebay-product-manager", "https://prepfully.com/interview-guides/ebay-product-manager", "https://www.glassdoor.com/Interview/eBay-Product-Manager-Interview-Questions-EI_IE7853.0,4_KO5,20.htm", "https://www.tryexponent.com/questions?company=ebay&role=pm", "https://panmore.com/ebay-inc-vision-statement-mission-statement-analysis-recommendations", "https://panmore.com/ebay-inc-organizational-culture-results-oriented-excellence-analysis", "https://innovation.ebayinc.com/stories/ebay-reduces-the-time-to-list-on-mobile-with-new-simplified-selling-tool-now-featuring-magical-listing-ai-technology/", "https://innovation.ebayinc.com/stories/ai-trends-to-watch-in-2026/", "https://www.retaildive.com/news/ebay-mobile-seller-listing-generative-AI/745054/", "https://fortune.com/2025/05/06/ebay-ai-agent/", "https://www.customerexperiencedive.com/news/ebay-rolls-out-conversational-ai-shopping-agent/747298/", "https://www.valueaddedresource.net/ebay-vp-ai-transformation-agentic-commerce/", "https://www.fashiondive.com/news/ebay-streetwear-authentication-guarantee/651939/", "https://www.ebayinc.com/stories/press-room/uk/ebay-launches-authenticity-guarantee-for-trading-cards-in-the-uk/", "https://www.sec.gov/Archives/edgar/data/1065088/000106508826000017/exhibit991erebayq42025.htm", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Canva", "products": ["Visual Suite 2.0 \u2014 unified workspace spanning Docs, Presentations, Whiteboards, Websites, and Canva Sheets in one file", "Magic Studio \u2014 the AI product suite (Magic Write, Magic Design, Background Remover, Magic Resize, Translate, Magic Charts, Dream Lab image gen)", "Canva AI \u2014 voice-enabled conversational creative assistant that unifies all generative AI tools into one workflow", "Canva Code \u2014 build interactive experiences/mini-apps with no code, via AI", "Canva Sheets \u2014 visual, AI-connected spreadsheets that feed Magic Studio at Scale for bulk branded content generation", "Canva Enterprise / Teams \u2014 brand kits, brand controls, approvals, and org-wide collaboration (the 'next 10 years: empower organizations' bet)", "Creative Operating System + Canva Design Model \u2014 Oct 2025 relaunch positioning Canva as an AI-native 'design-aware' OS to take on Adobe Creative Cloud; Affinity made free", "Canva Pro \u2014 the freemium subscription upgrade (the core free-to-paid monetization engine)"], "valuesAndBar": ["Six named core values are hard filters in a dedicated Culture/Values round \u2014 prepare an authentic STAR story for each: (1) Make Complex Things Simple, (2) Set Crazy Big Goals, (3) Empower Others, (4) Be a Force for Good, (5) Pursue Excellence, (6) Be a Good Human", "Make Complex Things Simple is THE signature value \u2014 it is also the product philosophy; every product answer must respect simplicity even while adding power/AI", "Set Crazy Big Goals \u2014 Canva expects ambition-at-scale thinking ('only 1% of the way there'); they want PMs who set targets others call unrealistic and hit them", "Design-first / user-empathy bar: even PMs are evaluated on genuine design thinking and care for the end user, not just metrics", "Scale reasoning: 240M+ (now 260M+) monthly active users \u2014 answers must reason about mass-consumer scale while preserving the simple core experience", "Product-usage is a filter: interviewers can immediately tell a real Canva user from an applicant \u2014 Neal must actively use Visual Suite, Magic Studio, and Sheets before interviewing", "Surface-level values answers do not advance; specificity and authenticity are explicitly required"], "interviewFormat": ["Overall: ~5-6 rounds over 3-6 weeks; reported ~2.5% acceptance rate \u2014 highly competitive", "Round 1 \u2014 Recruiter / phone screen (~30 min): background, motivation, role alignment, why Canva", "Round 2 \u2014 Craft Challenge (take-home, ~3-7 days): product strategy brief for a new feature/vertical, a prioritization framework, or a GTM strategy", "Round 3 \u2014 Craft Challenge Review / project presentation (45-60 min): walk through decisions and trade-offs; interviewers probe reasoning and push alternative approaches", "Round 4 \u2014 Product Sense interview (45-60 min): strategic thinking on Canva's real product challenges", "Round 5 \u2014 Culture / Values interview (45-60 min): explicit alignment against the six core values (STAR)", "Round 6 \u2014 Hiring Manager chat + cross-functional/peer collaboration round (30-45 min): team fit, career trajectory", "Note: public data is mostly for full PM roles; a dedicated Canva APM-intern track is not clearly documented, so expect a lighter/compressed version of the same structure \u2014 confirm with the recruiter"], "productSensePrompts": [{"prompt": "You're the PM for Canva AI (the conversational assistant). A first-time, non-designer user opens it with a blank canvas. What do you build next to get them to a finished design faster \u2014 without making the tool feel complicated?", "approach": "Anchor on the persona (non-designer, low confidence, wants a 'done' artifact, not a tool). Map the current idea->execution journey and find the drop-off (blank-canvas paralysis). Prioritize a guided intent-capture flow (ask what they're making + tone) that assembles a first draft they edit, over more raw generation power. Tie the North Star to time-to-first-satisfying-design and % of AI sessions that end in an export/share. Explicitly defend simplicity: hide advanced controls behind progressive disclosure. Neal can ground this in bb-2 (impression->approach->purchase funnel instrumentation) and ep-1 (ML flashcard engine + 200+ interviews)."}, {"prompt": "How would you convert Canva free users to Canva Pro without degrading the free experience?", "approach": "Frame the tension explicitly: free experience is the top-of-funnel growth engine (240M+ MAU) \u2014 degrading it is strategically fatal. Segment free users by intent (one-off vs. recurring creator, individual vs. team). Find natural 'value moments' where Pro capability is genuinely needed (Background Remover on a real photo, brand kit for a 2nd design, resizing for multi-platform) and surface upsell contextually a
