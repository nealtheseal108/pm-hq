ng upgrade incentive)", "Engagement: listening hours / minutes per user, sessions per week, DAU/MAU stickiness", "Retention & churn (subscription business \u2014 Premium retention and cohort retention)", "Content-format-specific engagement: podcast + audiobook listening hours vs. music (Spotify is diversifying beyond music)", "AI feature adoption: DJ / conversational-assistant WAU and downstream listening", "Metric-debugging: 'installs up 25% \u2014 causes and how to validate?' / 'metric X dropping WoW \u2014 what do you check first?'", "Metric-gaming awareness: identify how a proposed North Star could be gamed or become counter-indicative (interviewers reward this explicitly)", "Two-sided marketplace health: artist/creator supply metrics (share of streams to long-tail artists) alongside listener demand", "Unit economics / cost: royalty cost per stream, ad revenue per Free user, cost-per-AI-session"], "gotchas": ["Do NOT invent experiences \u2014 every behavioral answer must trace to a ledger fact ID above. Neal has NO music/audio-industry work experience, so lean on transferable 0->1, user-research, and AI-PM depth, plus genuine personal passion for Spotify as a listener.", "Watch the over-precise metrics: bb-1's '41.7% net margin' should be spoken as '~42%, projected'; bb-3's '97% time cut' has no baseline \u2014 give a before->after ('from ~Xh to ~Y min') or soften. These are fabrication-risk flags per the ledger.", "Interviewers deliberately challenge your assumptions and pile on follow-ups \u2014 the #1 candidate failure is not defending reasoning under pressure. Practice holding or gracefully updating your position with data.", "For the Free-vs-Premium product-sense prompt, candidates who ignore the business/cannibalization tension fail; always name the conversion guardrail.", "Always state a North Star metric AND at least one guardrail, and proactively note how the metric could be gamed \u2014 Spotify's execution round explicitly probes this.", "Bring 'playfulness' / personality \u2014 Spotify screens for it. A dry, robotic loop performance underperforms even with correct answers.", "Have crisp 'Why Spotify?' and 'Why PM?' answers ready for the recruiter screen; tie to a real product you use (e.g. DJ, Discover Weekly).", "Confirm Neal's work authorization and grad-year availability (May 2028) fit the intern posting \u2014 identity.workAuth is UNCONFIRMED in the ledger and is a knockout field.", "Layoff context (2023-24) means teams are lean and data-driven \u2014 frame yourself as high-leverage and cost-aware, not a resource-heavy hire."], "sources": ["https://igotanoffer.com/en/advice/spotify-product-manager-interview", "https://www.tryexponent.com/guides/spotify-pm-interview", "https://interview.norahq.com/interview-guides/spotify-product-manager-interview-guide-2026", "https://www.glassdoor.com/Interview/Spotify-Product-Manager-Interview-Questions-EI_IE408251.0,7_KO8,23.htm", "https://builtin.com/company/spotify/faq/culture-values", "https://www.shakebugs.com/blog/spotify-core-values/", "https://newsroom.spotify.com/2026-07-10/discovery-playlists-release-radar-control-updates/", "https://newsroom.spotify.com/2026-05-07/dj-expansion-4-new-languages/", "https://newsroom.spotify.com/2026-04-15/audiobook-charts-recaps-page-match-bookshop-update/", "https://techcrunch.com/2026/07/14/spotify-expands-its-ai-push-with-a-chatgpt-like-music-assistant/", "https://www.companieshistory.com/spotify-mission-statement", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Dropbox", "products": ["Dropbox core file sync/storage/sharing (the flagship cloud storage product)", "Dropbox Dash \u2014 AI-powered universal search & knowledge management across connected apps (Slack, Google Drive, Canva, Gong, Monday.com); now positioned as a context-aware AI teammate with an MCP server that plugs into Claude/Cursor/Goose (strategic bet, 2025)", "Dropbox Sign (e-signatures, formerly HelloSign)", "DocSend (secure document sharing, tracking analytics, virtual data rooms \u2014 the paid replacement for the discontinued built-in Send & Track)", "Dropbox Replay (video/image/audio review with frame-accurate feedback)", "Dropbox Paper (collaborative docs)", "Dropbox Backup, Passwords, and Vault (protection/security add-ons)"], "valuesAndBar": ["Core value: 'Make Work Human' \u2014 compassionate culture, prioritize human needs (ties to Dropbox's Virtual First remote model)", "Core value: 'Keep It Simple' \u2014 reduce complexity for users; Dropbox brand is built on simplicity/ease of use", "Core value: 'Be Worthy of Trust' \u2014 privacy, security, reliability with users' files/data", "Core value: 'They Win, We Win' \u2014 customer success first; think from the user/customer outcome", "Core value: 'Own It' \u2014 accountability, bias to action, end-to-end ownership", "PM competency bar: balance USER EMPATHY with BUSINESS STRATEGY (connect product decisions to company KPIs/profitability)", "Bar: think COMPANY-WIDE across the product ecosystem, not just one feature \u2014 guardrail metrics matter", "Bar: structured, rigorous thinking; ask clarifying questions before answering; 'how you answer is as important as what you say'", "Bar: demonstrate measurable business impact with quantifiable data"], "interviewFormat": ["Fully remote over Zoom (Dropbox is 'Virtual First'). Total process ~3-4 weeks.", "Round 1 \u2014 Recruiter screen (~30 min): resume walk-through, 'Why Dropbox and why now?'. Avoid sounding scripted.", "Round 2 \u2014 Product Sense interview (~45 min): pick a well-known product and iterate on it; ~50% rejection rate, a common down-leveler. Qualitative problem framing before quantitative solutions.", "Round 3 \u2014 Hiring Manager round (~45 min): projects with measurable business impact; behavioral (hardest thing worked on, conflict resolution). You meet the HM twice in the process.", "Round 4 \u2014 Virtual Onsite (~5 hours) with sub-rounds: (a) Product Presentation (1 hr, panel of ~3 PMs from outside your team \u2014 present a product you owned start-to-finish; spend <50% on 'what', focus on 'how'/'why'); (b) Analytical/Execution (1 hr, most technical, highest down-leveler \u2014 metrics design, root-cause diagnosis, A/B tests; GAME framework Goals\u2192Actions\u2192Metrics\u2192Evaluate); (c) Cross-Functional/behavioral (1 hr, business leader from another team \u2014 stakeholder mgmt, competing priorities); (d) Culture Fit (1 hr, product leader \u2014 collaboration style); (e) Final HM follow-up (1 hr).", "Note: for interns/new-grad (NGPM/APM) the loop is typically compressed \u2014 recruiter screen, a product-sense round, and a smaller onsite \u2014 but the round TYPES (product sense, execution/analytical, behavioral/culture) are the same."], "productSensePrompts": [{"prompt": "How would you improve Dropbox Dash (the AI universal search product)? Pick 2-3 improvements.", "approach": "Clarify scope: which user (individual knowledge worker vs. IT admin at a business) and which goal (Dropbox is positioning Dash as an AI teammate, not just search). Segment users, pick the frustrated-knowledge-worker who wastes time hunting across Slack/Drive/Notion. List pain points (can't trust results, no cross-app context, security worries), prioritize by reach x impact x Dropbox's 'Keep It Simple' value, then propose features (e.g., proactive surfacing/answers before you search, verified-source citations for trust, a permissions-aware 'ask a person' handoff). Tie each to a North Star metric like weekly active searchers or time-to-answer. Nod to the MCP-into-Claude/Cursor angle as a distribution lever."}, {"prompt": "Design a feature to get Dropbox's individual free/consumer users to adopt an AI feature (e.g., Dash or Dropbox AI).", "approach": "Frame the tension: Dropbox's install base is huge but the strategic bet (Dash) is B2B-leaning. Pick the consumer segment (students, freelancers, photographers) and their job-to-be-done (find/summarize my own files). Design a low-friction, in-context AI entry point ('summarize this folder', 'find that contract'), respect 'Be Worthy of Trust' with clear privacy defaults, and define an adoption funnel: exposure -> first AI action -> repeat -> retention. Call out guardrail metrics (core storage engagement shouldn't drop, support tickets)."}, {"prompt": "You're PM for Dropbox Sign / DocSend. How would you grow it, and what would you build next?", "approach": "Identify the ecosystem play: Dropbox wants users to stay inside its suite rather than bounce to competitors. Map the workflow (share doc -> track engagement -> sign -> store). Find the drop-off (e.g., users export to a competitor to e-sign). Propose a tighter cross-product loop and an analytics/insight feature that leverages DocSend's tracking data. Prioritize with a reach/effort matrix; define success as cross-product attach rate and paid conversion, with a guardrail on complexity (Keep It Simple)."}, {"prompt": "Dropbox's core file-storage market is mature/declining in growth. What new product or bet should Dropbox make, and why?", "approach": "Strategy-level answer. State the reality (storage is commoditized; Dropbox already pivoted strategy to Dash/AI). Use a framework: where does Dropbox have a right to win? (trusted access to users' distributed work content + permissions). Propose 2-3 bets, evaluate on market size, strategic fit to 'a more enlightened way of working', and defensibility. Recommend one, define how you'd validate it cheaply (customer interviews, MVP), and the metric that proves the thesis."}], "behavioralMapping": [{"value": "Own It (end-to-end ownership, bias to action)", "nealStory": "Founded Biryani Blitz: ran 180 customer interviews, built the 0->1 hot-food vending platform deployed at UC Berkeley, and drove it to projected ~$145K ARR/machine \u2014 full ownership from research to shipped, revenue-bearing product.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "They Win, We Win (customer/user success first)", "nealStory": "Scaled Elephant Productivity Suite from 17 to 563 active users (33x) in one quarter driven by 200+ user interviews, and shipped an ML flashcard engine that lifted user exam scores 16% and cut review time 38% \u2014 user outcomes as the whole point.", "factIds": ["ep-role", "ep-1"]}, {"value": "Keep It Simple", "nealStory": "At SailLoft, translated messy developer-workflow pain into a GitHub testing interface and built a Chrome extension that condensed client testing to a 2-click workflow \u2014 removing complexity for the user.", "factIds": ["sl-2", "sl-role"]}, {"value": "Be Worthy of Trust (privacy, reliability)", "nealStory": "Built a privacy-first computer-vision telemetry system (OpenCV) for Biryani Blitz that gave a physical machine e-commerce-grade funnel analytics without compromising customer privacy \u2014 trust designed in from the start.", "factIds": ["bb-2"]}, {"value": "Analytical rigor / measurable business impact (execution bar)", "nealStory": "Led the 0->1 launch of a Gerrit-based internal software-test product (Gerrit voting + Bazel) that cut manual tests 40% with real-time visibility, and accelerated PR-to-merge cycles ~25% \u2014 data-quantified execution wins.", "factIds": ["sl-1", "sl-2"]}, {"value": "Structured product thinking / defining metrics (Analytical round)", "nealStory": "Authored the FieldPulse PRD for an AI predictive-restocking feature (RAG over usage logs/seasonality), designed a 3-flow UX with AI explainability, and defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 directly rehearses Dropbox's GAME/metrics-design round.", "factIds": ["fp-1"]}, {"value": "Cross-functional / persuading others / competing priorities", "nealStory": "Shipped an AI lead-gen agent across 100+ universities (cutting weekly outreach ~97%) and a QR loyalty app that lifted repeat purchases 40% \u2014 juggling engineering builds, growth, and go-to-market simultaneously as a solo founder-PM.", "factIds": ["bb-3"]}, {"value": "Leadership / influence without authority", "nealStory": "Serves as Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH); invited to Bridge to BCG (~10% acceptance) \u2014 sustained leadership and selective recognition.", "factIds": ["ld-1", "ld-2", "ld-3"]}], "analyticalFocus": ["Defining success metrics / North Star + supporting metrics for a product or feature (e.g., for Dash)", "Guardrail / counter-metrics across the product ecosystem (Dropbox stresses company-wide, not single-feature, thinking)", "Root-cause diagnosis of a metric decline ('Metric A dropped \u2014 how do you find why?')", "A/B test design and validation (e.g., validate a new landing page or an AI feature)", "Identifying biases/threats that invalidate an experiment (novelty effect, selection bias, network effects)", "GAME framework: Goals -> Actions -> Metrics -> Evaluate", "Adoption / retention funnels for AI features (exposure -> first action -> repeat)", "Business framing: tie metrics to company KPIs and profitability"], "gotchas": ["Product Sense is a ~50% down-leveler and Analytical/Execution is the highest down-leveler \u2014 do NOT jump to solutions; ALWAYS ask clarifying questions and state assumptions first. Neal's founder instinct to 'just build' can read as skipping structure.", "Don't sound scripted in the recruiter screen; have a crisp, genuine 'Why Dropbox and why now?' \u2014 reference the Dash/AI strategic pivot and 'a more enlightened way of working', not generic 'I love your product'.", "In the Product Presentation, spend <50% of time on WHAT you built \u2014 Dropbox wants the HOW and WHY (tradeoffs, decisions). Neal's bullets are metric-heavy; he must narrate the reasoning behind the numbers.", "Think company-wide / ecosystem, not single-feature. When asked to improve one product, name guardrail metrics on the rest of the suite.", "Watch over-precise numbers from the ledger: present 41.7% net margin as '~42% projected' and the 97% outreach cut as a before->after, or it reads as fabricated (per ledger presentationNotes).", "Neal's work is startup/solo-founder heavy \u2014 be ready for 'how do you work cross-functionally / handle a stakeholder who disagrees?' where he must show he can operate inside a big org, not just alone. Map to SailLoft (internal dev stakeholders) and PM Club.", "Dropbox is Virtual First / remote \u2014 expect Zoom rounds and possibly questions about async collaboration and self-direction; frame remote/self-managed work positively.", "Confirm work authorization early (ledger flags it as unconfirmed) \u2014 it's a knockout field for interns."], "sources": ["https://www.tryexponent.com/guides/dropbox-product-manager-interview-guide", "https://www.tryexponent.com/guides/dropbox-ngpm", "https://www.productalliance.com/product-management-cheat-sheets/dropbox-pm-intervew-prep", "https://prepfully.com/interview-guides/dropbox-product-manager", "https://builtin.com/company/dropbox/faq/mission-purpose-impact", "https://blog.dropbox.com/topics/company/spring-2025-release-dropbox-dash-search-videos-images-create-content-fast", "https://blog.dropbox.com/topics/news/fall-2025-release-dropbox-dash-context-aware-ai-teammate", "https://dropbox.gcs-web.com/news-releases/news-release-details/introducing-dropbox-dash-business-ai-powered-universal-search", "https://www.dropbox.com/all-products", "https://help.dropbox.com/installs/dropbox-capture-end-of-support"]}, {"company": "Box", "products": ["Box Content Cloud / Intelligent Content Management (ICM) \u2014 the core platform for secure content lifecycle management, collaboration, and governance across 100K+ customers", "Box AI \u2014 natively integrated AI models over enterprise content (Q&A, summarization, content generation) with enterprise-grade security/compliance", "Box AI Agents / the new Box Agent (Apr 2026) \u2014 natural-language agents that reason and orchestrate across content to produce finished outputs", "Box Automate (launched Apr 2026) \u2014 agentic workflow orchestration that routes work across people, Box Agents, and enterprise systems (successor/expansion of Box Relay)", "Box Sign \u2014 e-signature (20+ languages, signer auth, templates), included with Box", "Box Hubs \u2014 AI-powered content portals (Enterprise Advanced tier)", "Box DocGen \u2014 document generation from templates + data", "Box Extract \u2014 AI metadata/data extraction from unstructured documents", "Box Relay \u2014 no-code workflow automation and approval routing", "Box Governance / eDiscovery \u2014 retention, legal holds, compliance (GDPR, CCPA)"], "valuesAndBar": ["The 7 official Box values: (1) Bring Your ___ Self to Work, (2) Be an Owner. It's Your Company., (3) Take Risks. Fail Fast. GSD (Get Stuff Done), (4) Blow Our Customers' Minds, (5) Be Candid and Assume Good Intent, (6) Make Mom Proud (integrity/ethics), (7) 10x It! (ambitious, order-of-magnitude thinking)", "Enterprise customer empathy \u2014 deep understanding of B2B buyers vs. end users (IT admin/security buyer vs. everyday content user)", "Data-driven decision-making and analytical rigor; defend prioritization frameworks", "Lead by influence, not authority \u2014 align cross-functional teams (eng, design, peer PMs) and drive consensus in high-stakes B2B settings", "Product strategy + domain expertise \u2014 understand the B2B SaaS / content-management landscape and where Box fits, plus compliance/security domains", "AI-first orientation \u2014 Box is repositioning as an AI-first enterprise content platform; agentic AI fluency is a strong signal for 2026"], "interviewFormat": ["4-round process, ~3-5 weeks total", "Round 1 \u2014 Recruiter screen: baseline experience, domain relevance, culture fit", "Round 2 \u2014 Hiring Manager: past product launches, prioritization, and genuine interest in Box Content Cloud / ICM", "Round 3 \u2014 Virtual onsite loop: 4-5 distinct panels covering product design/strategy, execution/analytics, and technical/domain knowledge", "Round 4 \u2014 Cross-functional interviews with engineering leaders, designers, and peer PMs (collaboration + influence)", "Question types observed: product design (e.g. design a dashboard for IT admins), feature prioritization across competing enterprise demands, success metrics for compliance features, launch under constraints + recovery plans, behavioral tied to Box values, technical/domain (legal holds, data retention, search over encrypted docs, GDPR/CCPA)", "Heavy weight on culture fit and enterprise empathy; PM competencies mirror standard PM loops (product sense, execution, analytical, behavioral, light technical)"], "productSensePrompts": [{"prompt": "Box AI Agents let a user ask natural-language questions across all their enterprise content. Design an improvement to make AI answers more trustworthy for a regulated enterprise customer (e.g. legal or healthcare).", "approach": "Clarify the user (compliance-conscious knowledge worker) and the JTBD (get a correct, defensible answer fast without leaking restricted content). Enumerate trust pain points: hallucination, citing content the user lacks permission to see, no source traceability, stale content. Prioritize by (trust impact x frequency). Propose: inline source citations linked to the exact file/section, permission-aware retrieval that respects Box's existing access controls, confidence signals, and an 'answer provenance' panel. Pick a North Star (verified-answer rate / % answers with cited sources accepted) and guardrail metrics (permission-violation rate = 0). Note Box's differentiator vs. generic LLMs: it already owns the governed content + permissions layer."}, {"prompt": "Design a Box feature to improve content collaboration for a large enterprise where teams are drowning in files and can't find the right version.", "approach": "Segment users: content creators, reviewers/approvers, and IT admins. Root-cause 'can't find it': search relevance, version sprawl, unclear ownership, permission friction. Ideate: AI-powered semantic search over content (leverage Box AI), auto-surfaced 'canonical version,' Box Hubs as curated portals, and metadata auto-tagging via Box Extract. Prioritize with reach x impact x confidence x effort. North Star: time-to-find-content / weekly active content actions; guardrail: no increase in over-shared/exposed files. Tie back to Box value '10x It!' \u2014 order-of-magnitude reduction in search time, not incremental."}, {"prompt": "How would you design an onboarding experience for Box Sign to win users away from a dominant incumbent (e.g. DocuSign)?", "approach": "Frame the wedge: Box Sign is native to content already living in Box, so no export/re-upload. Target the switcher who already stores contracts in Box. Map the first-run journey: send first signature in under 2 minutes, template reuse, and signer authentication for security-conscious buyers. Differentiate on the two-buyer dynamic (end-user ease + IT admin governance/audit trail). Metrics: activation = % new users who send a first envelope in week 1; retention = repeat-send rate; and attach rate to existing Box seats. Call out the growth loop: recipients of a Box Sign request get exposed to Box."}, {"prompt": "Design an admin dashboard for a Box IT administrator to monitor AI usage and content-security risk across the org.", "approach": "Identify the persona (IT/security admin, accountable for compliance, not a daily content user) and their JTBD: prove the org is safe + compliant while enabling AI. Prioritize the top jobs: detect risky sharing/exposure, monitor Box AI usage and data access, enforce retention/legal-hold policies, and audit. Design principles: surface anomalies first (alerts over raw logs), one-click remediation, and drill-down from org to file. Success metrics: mean-time-to-detect a risky share, % policy coverage, admin weekly active use. Trade-off to state aloud: alert sensitivity vs. noise/fatigue. This directly mirrors Box's observed 'design a dashboard for IT admins' prompt."}], "behavioralMapping": [{"value": "Be an Owner. It's Your Company. / Take Risks. Fail Fast. GSD", "nealStory": "Founding and running Biryani Blitz: a 0\u21921 hot-food vending platform he founded, built, and deployed at UC Berkeley after 180 customer interviews \u2014 full end-to-end ownership from research to shipped product to fundraising. Frame as taking a risk, moving fast, and getting stuff done as the accountable owner.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Blow Our Customers' Minds (customer empathy / user research depth)", "nealStory": "Scaled Elephant Productivity Suite from 17\u2192563 active users (33x) in one quarter driven by 200+ user interviews, and shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 obsessive listening to users translated into a measurably delightful product outcome.", "factIds": ["ep-role", "ep-1"]}, {"value": "10x It! (ambitious, order-of-magnitude thinking)", "nealStory": "The AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time 97% \u2014 an order-of-magnitude efficiency gain, not incremental. Note per ledger: soften '97%' with a before\u2192after framing to avoid an over-precise/no-baseline red flag.", "factIds": ["bb-3"]}, {"value": "Be Candid and Assume Good Intent / Lead by influence across cross-functional teams", "nealStory": "At SailLoft, led the 0\u21921 launch of an internal Gerrit-based software-test product by translating developer-workflow pain points into a GitHub testing interface \u2014 required aligning with and influencing engineers (candid feedback on their workflow) with no direct authority. Directly answers Box's 'influence disagreeing stakeholders / cross-functional leadership' prompts.", "factIds": ["sl-role", "sl-1", "sl-2"]}, {"value": "Enterprise customer empathy + analytical rigor (execution/metrics)", "nealStory": "Built a privacy-first computer-vision telemetry system (OpenCV) tracking the impression\u2192approach\u2192purchase funnel for Biryani Blitz, giving a physical machine e-commerce-grade conversion analytics \u2014 demonstrates defining and instrumenting the right metrics. Pair with the FieldPulse PRD where he defined 15+ KPIs with First-Time Fix Rate as the North Star to show metrics/prioritization judgment on an enterprise/B2B-flavored feature.", "factIds": ["bb-2", "fp-1"]}, {"value": "Make Mom Proud (integrity / doing right by the user) + AI-first product judgment", "nealStory": "The FieldPulse Predictive Restocking PRD: authored an AI/RAG feature over usage logs with a 3-flow UX that intentionally built in AI explainability \u2014 chose transparency for the user over a black-box result. Reinforces Box's AI-first, trust-centric enterprise positioning (AI you can trust with governed content). Also anchor: Director of Professional Development, UNC PM Club, shows values-driven contribution.", "factIds": ["fp-1", "ld-1"]}], "analyticalFocus": ["Success metrics for compliance/governance features (e.g. retention adoption, policy coverage, audit completeness) \u2014 Box specifically probes 'metrics for compliance-focused features'", "North Star + guardrail metric selection for AI features (verified-answer rate, permission-violation rate = guardrail)", "Enterprise B2B funnel metrics: seat activation, feature attach rate to existing Box seats, expansion/net revenue retention (Box is a seat-based enterprise SaaS with $1.06B backlog, 100K+ customers)", "Launch-under-constraints and recovery planning: what to measure when a goal is missed and how to build a recovery plan", "Prioritization frameworks (RICE / reach-impact-confidence-effort) applied across competing enterprise demands and the two-buyer split (end user vs. IT/security admin)", "AI-usage and adoption metrics for agentic features (Box AI Agents / Box Automate): task completion rate, time saved, agent trust/acceptance rate"], "gotchas": ["Box is ENTERPRISE B2B, not consumer \u2014 always distinguish the buyer (IT/security/compliance admin) from the end user (content collaborator). Neal's ledger skews consumer/0\u21921 (Biryani Blitz, Elephant); explicitly bridge his SailLoft dev-tools + FieldPulse enterprise PRD experience to show B2B empathy.", "Know the current product names for 2026: Box AI Agents, the new Box Agent (Apr 2026), and Box Automate (launched Apr 2026) \u2014 Box is repositioning as 'AI-first Intelligent Content Management.' Referencing outdated framing (just 'file storage / Dropbox competitor') is a red flag.", "Do NOT reduce Box to 'cloud storage' \u2014 they explicitly brand as Intelligent Content Management (ICM). Storage is table stakes; the story is AI + governance + workflow over content.", "Culture fit is weighted 'exceptionally high' \u2014 prepare specific stories mapped to the 7 named values, especially 'Make Mom Proud' (integrity) which appears as a named behavioral prompt.", "Compliance/security domain vocabulary matters (legal holds, data retention, eDiscovery, GDPR/CCPA, permission-aware AI). Neal should learn the basics even for an intern role.", "Per fact-ledger presentation notes: soften over-precise metrics \u2014 '97%' outreach cut (no baseline), '41.7% net margin' (round to ~42%, label projected), and label projected ARR as projected. Do not present projections as realized results.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must confirm before applying; enterprise employers screen on this.", "Neal is class of May 2028 (rising sophomore/junior) \u2014 target the APM/PM INTERN track, not full-time PM; calibrate story scope to internship level."], "sources": ["https://careers.box.com/en/life-at-box/ (Box's 7 official company values)", "https://www.box.com/products-and-features (AI-powered Box products)", "https://www.box.com/about-us", "https://dataford.io/interview-guides/box/product-manager (Box PM interview rounds and question types)", "https://www.stocktitan.net/sec-filings/BOX/10-k-box-inc-files-annual-report-4a4b882ac9a5.html (FY2026 10-K: AI strategy, $1.06B backlog, 100K+ customers)", "https://www.sec.gov/Archives/edgar/data/1372612/000119312526098466/box-20260131.htm (Box FY2026 Form 10-K)", "https://www.boxinvestorrelations.com/news-and-media/news/press-release-details/2026/Box-Launches-Box-Automate-to-Orchestrate-Agentic-Workflows/default.aspx (Box Automate launch, Apr 2026)", "https://support.box.com/hc/en-us/articles/50484310851347-Introducing-the-New-Box-Agent-Apr-2026 (New Box Agent, Apr 2026)", "https://moorinsightsstrategy.com/research-notes/box-introduces-box-ai-to-bring-the-power-of-ai-to-enterprise-content/ (Box AI overview)", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json (Neal's verified fact ledger)"]}, {"company": "Atlassian", "products": ["Jira (flexible project/work management; 125K+ customers) and Jira Software for dev teams", "Confluence (connected team knowledge workspace; 100K+ customers)", "Trello (visual kanban board, consumer-friendly/PLG top-of-funnel)", "Jira Service Management (ITSM/ESM for IT & HR; 65K+ customers)", "Rovo (AI: Search, Chat, and Agents across Atlassian + connected SaaS) \u2014 the strategic AI bet", "Loom (async video messaging; acquired 2023)", "Bitbucket (Git source-code management) and Compass (developer/service portal)", "Jira Product Discovery (JPD) \u2014 PM-facing idea prioritization tool", "Jira Align (enterprise agile planning)"], "valuesAndBar": ["Five core values: (1) Open company, no bullshit; (2) Build with heart and balance; (3) Don't #@!% the customer; (4) Play, as a team; (5) Be the change you seek. There is a dedicated values interview, often run by someone outside the hiring team.", "PM competency is evaluated across four pillars: Lead & Inspire (influence without authority), Craft Mastery ('T-shaped' GM + Artist + Scientist, customer-first), Deliver Outcomes (measurable customer/business impact, not output), Great Communicator (clear, simple, audience-aware storytelling).", "'Don't #@!% the customer' is the load-bearing value in interviews \u2014 every design/analytical answer should visibly protect the user. Reason out loud about who you might harm and how you'd avoid it.", "Use 'we' language when describing wins (Play as a team); credit the team, don't over-claim solo heroics.", "Atlassian is a B2B SaaS / product-led-growth (PLG) company. Show you understand bottoms-up adoption, free-to-paid conversion, and multi-product 'System of Work' expansion \u2014 not just top-down enterprise sales.", "Scoring: interviewers rate 1-4; a 1 is auto-reject, 2 needs a compensating 4, 3+ is offer range. All four interviewers + hiring manager align post-loop.", "APM program feeds the same PM track; extra weight on foundational product thinking and storytelling, and on genuine interest in Atlassian/B2B SaaS."], "interviewFormat": ["Recruiter screen (~20-30 min): why PM, why Atlassian, why B2B SaaS, communication check.", "1-2 phone interviews with PMs (45-60 min each): a product design, analytical, or strategy question mirroring on-site.", "Optional take-home (~3 hours): product design or strategy deliverable presented as a doc/deck; tests structured analytical + strategic thinking.", "On-site loop (up to 4 hours) = 4 interviews: 3 pillar interviews (Craft/Design, Deliver Outcomes/Analytical, Lead & Inspire/Strategy) + 1 dedicated Values interview.", "Debrief: all 4 interviewers + hiring manager meet to align on a single recommendation."], "productSensePrompts": [{"prompt": "How would you improve Confluence for a first-time user who was just invited to their team's workspace? (onboarding / activation design)", "approach": "Clarify the goal (activation = reach an 'aha' moment fast) and constraint (PLG, bottoms-up: the invited user may not be the buyer). Segment users (invited IC vs. team admin vs. cross-functional viewer). Pick the invited IC. Map their journey: land on empty/dense space -> friction is 'I don't know where to start or what's relevant to me.' Prioritize pain points, then propose 2-3 solutions (a personalized 'what's relevant to you' home feed, a guided first-doc/template moment, surfacing @mentions and pages they were tagged in). Tie to a North Star: time-to-first-meaningful-action / week-1 activation. Explicitly protect the user ('Don't #@!% the customer' \u2014 no dark patterns, no notification spam). Close with the one experiment to validate."}, {"prompt": "Design an AI feature for Jira using Rovo. What problem do you solve for whom, and how do you avoid eroding trust?", "approach": "Anchor on Atlassian's AI strategy (Rovo = Search, Chat, Agents across the System of Work). Choose a sharp user + job: e.g., an engineering lead who wastes time writing status updates and triaging duplicate tickets. Propose a Rovo agent that auto-drafts sprint summaries and flags likely-duplicate issues, human-in-the-loop. Spend real time on trust/safety: explainability (show source tickets), confidence + easy correction, never auto-close, respect permissions/data boundaries \u2014 this directly hits 'Don't #@!% the customer' and Craft's 'Scientist' rigor. Metrics: adoption, time saved, and a guardrail metric (false-duplicate rate, undo rate)."}, {"prompt": "Trello vs. Jira: Trello is loved by individuals/small teams but users churn or fail to upgrade as their team grows. How would you diagnose and fix this?", "approach": "Frame as a PLG conversion/retention problem inside a multi-product portfolio. Diagnose first: is it a graduation problem (Trello outgrown, users leave the ecosystem) vs. a monetization problem (they'd pay but see no value)? Use funnel data (board size, member count, power-up usage at churn). Two strategic paths: (a) deepen Trello for growing teams (better reporting, automation) risking cannibalizing Jira, or (b) build a smooth Trello->Jira/JPD migration bridge to keep them in the System of Work. Recommend (b) with a lightweight in-product nudge when a board hits complexity thresholds. Metrics: cross-product adoption, net revenue retention, not just Trello MAU."}, {"prompt": "Define the North Star metric and supporting metrics for Jira Service Management, then walk through how you'd investigate a 15% drop in weekly active agents.", "approach": "North Star candidate: resolved requests per active agent per week (captures value delivered, not vanity usage); supporting = median time-to-resolution, CSAT, ticket deflection via self-service/Rovo. For the drop, use a structured triage: internal vs. external (deploy/bug vs. seasonality/customer churn), segment by plan/geo/customer-size/platform, check if it's a measurement artifact vs. real. Form hypotheses (a regression broke a workflow, a big customer churned, a pricing change), prioritize by likelihood x impact, and state the data you'd pull to confirm. Tie back to customer impact and what you'd do in the first 24 hours."}], "behavioralMapping": [{"value": "Don't #@!% the customer (customer obsession)", "nealStory": "Founded Biryani Blitz off 180 customer interviews and scaled Elephant Productivity 17->563 users via 200+ interviews \u2014 decisions were driven by user research, not assumptions. Lead with how the research changed the product.", "factIds": ["bb-1", "ep-1"]}, {"value": "Craft Mastery / customer-first design (Artist + Scientist)", "nealStory": "Built a privacy-first CV telemetry system tracking the impression->approach->purchase funnel \u2014 deliberately privacy-first shows protecting the customer while still instrumenting for insight; pair with the ML flashcard engine that lifted exam scores 16% and cut review time 38% (Scientist rigor).", "factIds": ["bb-2", "ep-1"]}, {"value": "Deliver Outcomes (impact over output)", "nealStory": "SailLoft: led the 0->1 Gerrit-based internal test product cutting manual tests 40% and accelerating PR-to-merge ~25% \u2014 framed as measurable outcomes, and highly relevant since Atlassian sells dev-workflow tooling (Bitbucket/Jira). Emphasize the outcome moved, not the effort.", "factIds": ["sl-1", "sl-2"]}, {"value": "Lead & Inspire / influence without authority", "nealStory": "As a SailLoft intern, translated developer-workflow pain points into shipped GitHub testing interface changes \u2014 influencing engineers with no formal authority; plus UNC PM Club Director of Professional Development leadership.", "factIds": ["sl-2", "ld-1"]}, {"value": "Great Communicator / structured product thinking", "nealStory": "Authored the FieldPulse PRD: a 3-flow AI predictive-restocking feature (RAG) with AI explainability and 15+ KPIs (First-Time Fix Rate as North Star) \u2014 demonstrates crisp PRD storytelling and North-Star metric definition, directly the JSM/Rovo prompt skills.", "factIds": ["fp-1"]}, {"value": "Play, as a team (use 'we' language)", "nealStory": "President of UNC Ultimate Frisbee and Director of Professional Development in the PM Club \u2014 reframe accomplishments as team wins; when telling any story above, credit collaborators and use 'we'.", "factIds": ["ld-2", "ld-1"]}, {"value": "Be the change you seek / bias to action & 0->1", "nealStory": "Shipped an AI lead-gen agent across 100+ universities cutting weekly outreach time ~97% and a QR loyalty app lifting repeat purchases 40% \u2014 self-directed initiative that shipped and moved numbers; Wharton/UNC-backed, $200K challenge finalist as external validation.", "factIds": ["bb-3", "bb-4"]}], "analyticalFocus": ["Defining North Star + supporting/guardrail metrics for B2B SaaS products (activation, engagement, retention, expansion).", "PLG funnel metrics: signup -> activation -> habit -> team invite/collaboration -> free-to-paid conversion -> multi-product adoption (System of Work).", "Net revenue retention / expansion within accounts (Atlassian's land-and-expand, seat growth, cross-sell Jira<->Confluence<->JSM<->Rovo).", "Metric-decline diagnosis: structured triage (internal vs external, segmentation, measurement artifact vs real), hypothesis prioritization by likelihood x impact.", "AI product metrics for Rovo-style features: adoption, task success/time saved, plus trust guardrails (accuracy, undo/override rate, hallucination/false-positive rate).", "Simple estimation/market-sizing (e.g., TAM for a new Confluence or JSM segment) \u2014 show assumptions clearly and sanity-check."], "gotchas": ["'Don't #@!% the customer' is a literal, cited value \u2014 say it (or clearly embody it) and reason about customer harm in every design/analytical answer.", "Use 'we', not 'I', for accomplishments \u2014 Atlassian's handbook explicitly says they want to hear you celebrate the team. Neal's founder stories skew solo; consciously credit collaborators.", "Neal's ledger red flags to phrase carefully: 41.7% net margin -> say '~42%, projected'; 97% outreach-time cut -> give a before->after and label it; $145K ARR is a projection \u2014 always say 'projected'. Interviewers probe over-precise numbers.", "It's B2B SaaS, not consumer \u2014 don't pitch consumer-ad/engagement playbooks; think teams, admins, seats, and bottoms-up adoption. Recruiter screens explicitly for genuine B2B SaaS interest.", "There is a distinct Values interview (often an outside interviewer) \u2014 prepare a values-specific story set, not just craft/analytical answers.", "Scoring is unforgiving: a single '1' auto-rejects. Don't leave any pillar weak; have a story ready for each of the four pillars.", "Don't confuse Jira Product Discovery / Trello / Jira \u2014 know which product serves which user (Trello = individuals/small teams PLG; Jira = eng/scaled teams; JPD = PMs; JSM = IT/HR).", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must confirm before applying; it is a common knockout field.", "Neal graduates May 2028, so target the APM/PM intern track specifically (not full-time PM); frame foundational product thinking + storytelling, which is where APM loops weight."], "sources": ["https://www.atlassian.com/company/values", "https://www.atlassian.com/company/careers/resources/career-growth/product-managers", "https://www.tryexponent.com/guides/atlassian-pm-interview", "https://www.joinleland.com/library/a/nail-the-atlassian-product-management-interview", "https://medium.com/@izzykohout/a-guide-to-apm-at-atlassian-the-recruitment-process-how-to-prepare-b57686d88a14", "https://www.interviewquery.com/interview-guides/atlassian-product-manager", "https://prepfully.com/interview-questions/atlassian/product-manager", "https://www.sec.gov/Archives/edgar/data/1650372/000165037226000024/teamq32026shareholderlet.htm", "https://www.atlassian.com/software (product lineup: Jira, Confluence, Trello, JSM, Bitbucket, Compass, Loom, Rovo)"]}, {"company": "Twilio", "products": ["Programmable Messaging API (SMS, WhatsApp, RCS, chat)", "Programmable Voice (IVR, recording/transcription, speech recognition)", "Twilio SendGrid (email API + Marketing Campaigns, deliverability)", "Twilio Segment (Customer Data Platform: collect, unify, activate first-party data)", "Twilio Verify (OTP / identity verification / phone-number lookup)", "Twilio Flex (programmable cloud contact center)", "Twilio Engage (marketing/Journeys built on Segment)", "ConversationRelay (GA at SIGNAL 2025 \u2014 build voice AI agents with your choice of LLM; real-time streaming, interruption handling)", "Conversational Intelligence / Voice Intelligence (turns calls & messages into structured insights)", "Twilio AI Assistants (unified 'One Twilio' agentic layer over comms + Segment data)"], "valuesAndBar": ["The Twilio Magic \u2014 four values: We are Builders, We are Owners, We are Curious, We are Positrons", "Builders: 'Wear the customer's shoes,' 'Draw the owl' (embrace ambiguity/ship despite uncertainty), 'Write it down' (documentation-heavy culture \u2014 strong for PRD-oriented PMs), organize into small teams, 'learn cheap lessons'", "Owners: 'Trust is what we sell,' think long term, 'have a point of view,' 'disagree and commit,' 'ruthlessly prioritize,' be frugal, 'pick up the trash' (do the unglamorous work)", "Curious: be humble, embrace the uncomfortable, seek the truth, 'share problems not solutions,' progress over perfection", "Positrons: be genuine ('no shenanigans'), empower others, be inclusive, ask how you can help", "PM competency emphasis per interview guides: customer obsession (wear the customer's shoes), ownership/detail-sweating, clear written communication, bold-but-rigorous thinking, methodical prioritization", "Developer-first company culture: Twilio's customers are developers building on APIs \u2014 PMs are expected to reason about DX (docs, SDKs, latency, reliability, self-serve onboarding), not just end-user UX"], "interviewFormat": ["Stage 1 \u2014 Recruiter screen (~15-30 min): background, why Twilio, why this team, culture-fit signal", "Stage 2 \u2014 Hiring manager screen: deep dive on PM experience, product vision/strategy, how you prioritize, stakeholder management (sometimes a light case)", "Stage 3 \u2014 Case study / take-home assignment (sometimes skipped for less-experienced or intern candidates)", "Stage 4 \u2014 Onsite/virtual panel: four to six 1:1 rounds with diverse interviewers, including at least one director-level and one dedicated culture-fit ('Twilio Magic') interviewer", "Five assessed dimensions across the panel: Behavioral, Analytical (metrics investigation), Product Design, Product Strategy, Execution", "Note: published structure is for the general PM funnel; a specific APM/PM-intern track is not separately documented publicly \u2014 expect a compressed version (recruiter + HM + 1-2 panel rounds) and lean on behavioral + product-sense + a metrics question"], "productSensePrompts": [{"prompt": "You're PM for Twilio Verify (OTP/phone-number verification). Users complain that too many legitimate logins get blocked or delayed. How would you improve the product?", "approach": "Clarify the user: Verify serves DEVELOPERS who embed it, and their END USERS who receive OTPs. Segment: false-positive fraud blocks, SMS delivery latency in certain geos, and channel fallback (SMS -> voice -> WhatsApp -> silent network auth). Prioritize by frequency x severity: pick 'legitimate users blocked' (directly hurts developer conversion funnels = revenue). Propose solutions: adaptive risk scoring, Verify Fraud Guard tuning, and silent network-based auth (SNA) as a frictionless primary path with OTP fallback. North-star: successful-verification rate; guardrails: fraud/toll-fraud cost per verification, developer-integration time. Tie to 'wear the customer's shoes' (the developer) and 'ruthlessly prioritize.'"}, {"prompt": "Design an AI-powered feature for Twilio Flex (the programmable contact center) to make support agents more effective.", "approach": "State the goal: reduce handle time + raise CSAT without hurting resolution quality. Users = contact-center agents (primary), supervisors, end customers. Leverage Twilio's real assets \u2014 Conversational Intelligence (call/chat -> structured data) and ConversationRelay/AI Assistants. Feature: real-time AI copilot that surfaces suggested replies, auto-drafts summaries, and flags sentiment/escalation risk from live transcription. UX = 3 flows (live-assist, post-call auto-summary, supervisor coaching dashboard) with explainability so agents trust suggestions (echo Neal's FieldPulse PRD pattern, fp-1). Metrics: North Star = First Contact Resolution; supporting = avg handle time, CSAT, suggestion-acceptance rate. Address trust/hallucination risk (Curious value: progress over perfection, human-in-the-loop)."}, {"prompt": "Pick a north-star metric and success metrics for the Twilio SendGrid Email API. How would you know it's healthy?", "approach": "Frame two customer layers: developers integrating the API and their recipients. North Star = successfully delivered-and-engaged emails (not just 'sent') \u2014 because SendGrid's core value prop is DELIVERABILITY. Break into input metrics: API uptime/latency, delivery rate, inbox-placement (vs spam), bounce/complaint rate; and outcome metrics: open/click for marketing tiers, developer time-to-first-successful-send (activation). Counter-metrics: sender-reputation damage, spam-trap hits. Explain tradeoff: optimizing raw send volume can tank deliverability \u2014 so guardrail on reputation. Ties directly to 'Trust is what we sell.'"}, {"prompt": "How would you improve developer onboarding / time-to-first-API-call for a new Twilio developer signing up for Messaging?", "approach": "Anchor on Twilio's developer-first identity: activation = first successful SMS sent. Map the funnel: signup -> get credentials -> read docs -> copy quickstart -> send test message -> go to production (buy number, verify sender, A2P 10DLC registration). Identify the biggest drop-off \u2014 A2P/10DLC compliance registration is notoriously the friction point. Propose: guided in-console setup wizard, pre-filled code snippets in the dev's language, sandbox test numbers, and proactive nudges. Metrics: North Star = % of signups reaching first production message within 24h; guardrail = support-ticket volume, fraud/spam signups. Cite 'draw the owl' (ship a v1 despite ambiguity) and 'write it down' (docs as product)."}], "behavioralMapping": [{"value": "We are Builders \u2014 draw the owl / ship 0->1 under uncertainty", "nealStory": "Founded Biryani Blitz: took a 0->1 hot-food vending platform from concept to a live deployment at UC Berkeley (fresh biryani in 60s), grounding it in 180 customer interviews and building the CV telemetry funnel himself \u2014 building despite heavy ambiguity.", "factIds": ["bb-role", "bb-1", "bb-2"]}, {"value": "We are Builders \u2014 wear the customer's shoes (deep user research)", "nealStory": "Scaled Elephant Productivity Suite from 17 to 563 active users in one quarter by running 200+ user interviews and turning that research into an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 research translated directly into shipped, measurable outcomes.", "factIds": ["ep-role", "ep-1"]}, {"value": "We are Owners \u2014 ruthlessly prioritize & have a point of view (tell me about a tradeoff)", "nealStory": "At SailLoft, led the 0->1 launch of a Gerrit-based internal test product, choosing Gerrit auto-voting + Bazel execution to cut manual tests 40% \u2014 a deliberate architecture/tradeoff decision with real-time test-status visibility rather than building a separate dashboard.", "factIds": ["sl-role", "sl-1"]}, {"value": "We are Owners \u2014 think long term / trust is what we sell (developer-first judgment)", "nealStory": "At SailLoft, translated developer-workflow pain into a GitHub testing interface that accelerated PR-to-merge cycles ~25% and shipped a Chrome extension condensing client testing to a 2-click workflow \u2014 obsessing over developer experience, Twilio's core customer.", "factIds": ["sl-2"]}, {"value": "We are Curious \u2014 progress over perfection / bias toward action (AI feature under ambiguity)", "nealStory": "Authored the FieldPulse PRD for an AI predictive-restocking feature (RAG over usage logs/schedules/seasonality), designing a 3-flow UX with AI explainability and defining 15+ KPIs with First-Time Fix Rate as the North Star \u2014 structured a fuzzy AI problem into a shippable, measurable spec.", "factIds": ["fp-1"]}, {"value": "We are Builders / Owners \u2014 scrappy, frugal, be frugal & turn bold ideas into action", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time dramatically, plus a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 earned Wharton + UNC Innovation Labs backing ($5K) and reached the $200K Wharton Startup Challenge finals on a shoestring.", "factIds": ["bb-3", "bb-4"]}, {"value": "We are Positrons \u2014 empower others / lead & mentor", "nealStory": "Serves as Director of Professional Development for the UNC Product Management Club and President of the UNC Ultimate Frisbee team \u2014 leadership and empowering peers; also a Bridge to BCG invitee (~10% acceptance).", "factIds": ["ld-1", "ld-2", "ld-3"]}], "analyticalFocus": ["Metric-drop investigation: 'A key metric is down \u2014 how do you investigate?' (Twilio's named Analytical dimension). Practice a structured breakdown: internal vs external, funnel-stage isolation, segment by geo/channel/customer-tier, correlate with releases.", "North-star & success-metric definition for API products (e.g. SendGrid deliverability, Verify successful-verification rate, Messaging activation) \u2014 distinguish input vs output vs counter-metrics", "Developer activation & funnel metrics: time-to-first-API-call, signup -> first production message conversion, self-serve onboarding drop-off", "Usage-based / consumption revenue reasoning: Twilio monetizes per-message/per-minute/per-verification \u2014 be ready to reason about volume x price, gross margin, and dollar-based net expansion (DBNE)", "Deliverability / reliability / fraud tradeoffs as guardrail metrics (spam rate, sender reputation, toll-fraud cost, false-positive block rate)", "Estimation/sizing: e.g. size the market for OTP verifications or SMS volume for a given vertical \u2014 use segmentation and reasonable assumptions"], "gotchas": ["Twilio is DEVELOPER-FIRST: the primary 'user' in most product-sense answers is the developer building on the API, not just the end consumer. Explicitly name both layers or you'll look like you don't understand the business.", "Know the current 'One Twilio' AI strategy (SIGNAL 2025): ConversationRelay, Conversational Intelligence, AI Assistants, and Segment-powered personalization. Referencing these shows you did homework \u2014 but don't overclaim; they're recent GA/beta.", "'Write it down' is a literal cultural value \u2014 lean into your PRD experience (fp-1, the FieldPulse PRD) and structure answers crisply; rambling reads as anti-cultural.", "'Trust is what we sell' \u2014 for communications infra, reliability/deliverability/fraud-prevention are first-order, not afterthoughts. Always add guardrail metrics to any north-star answer.", "Do NOT inflate ledger numbers. Per the ledger's presentationNotes: soften the 97% outreach-time cut (bb-3, near-ceiling, no baseline) and round 41.7% net margin to ~42% and label it 'projected' (bb-1). Frame projections as projections.", "Segment (CDP) and SendGrid (email) are Twilio-owned but distinct brands recently unified into twilio.com \u2014 don't treat them as separate companies.", "Work authorization is UNCONFIRMED in the ledger (identity.workAuth) \u2014 Neal must confirm before applying; several tech funnels have knockout questions.", "APM/intern-specific round structure is not publicly documented; the pack assumes a compressed version of the general PM funnel. Confirm the actual format with the recruiter."], "sources": ["https://www.tryexponent.com/guides/twilio-product-manager-interview", "https://www.twilio.com/en-us/company/values", "https://www.twilio.com/en-us/blog/signal-2025-product-announcements", "https://www.twilio.com/en-us/press/releases/signal2025-sf", "https://investors.twilio.com/news-releases/news-release-details/twilio-unveils-next-generation-customer-engagement-platform", "https://www.twilio.com/en-us/blog/company/bringing-sendgrid-and-segment-to-twilio", "https://prepfully.com/interview-questions/twilio/product-manager", "https://www.glassdoor.com/Interview/Twilio-Product-Manager-Interview-Questions-EI_IE410790.0,6_KO7,22.htm", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "Zoom", "products": ["Zoom Workplace \u2014 the AI-first unified collaboration platform bundling Meetings, Team Chat, Whiteboard, Mail/Calendar, Docs, and Clips", "Zoom AI Companion (3.0) \u2014 agentic AI assistant across the suite (meeting summaries, action items, personal workflows); the flagship 'AI-first' bet", "Zoom Docs \u2014 AI-native docs that pull meeting summaries into tables, extract insights, categorize feedback", "Zoom Phone \u2014 cloud PBX / VoIP with AI call insights and AI Receptionist/Virtual Agent (SMS)", "Zoom Contact Center \u2014 CCaaS with AI Companion call summaries and Virtual Agent, bundled at no extra cost", "Zoom Team Chat \u2014 persistent messaging inside Workplace", "Zoom Events / Webinars / Sessions \u2014 virtual and hybrid event platform", "Zoom Rooms & hardware \u2014 conference-room hardware/software for hybrid offices", "Zoom Meetings \u2014 the legacy flagship video conferencing product"], "valuesAndBar": ["Single unifying core value: CARE \u2014 broken into Care for Customers, Company, Communities, Teammates, and Ourselves. Behavioral answers should tie back to caring for the customer.", "Mission/motto: 'Delivering Happiness' \u2014 founder Eric Yuan's original value; every decision framed as 'does this deliver happiness to the customer?'", "Strategic bar: 'AI-first work platform for human connection' \u2014 they now expect PMs to think AI-native, not just video. Show you can design agentic/AI features responsibly.", "Enterprise/B2B lens: build for ADMINS and IT buyers, not just end users. Security, compliance, and governance are first-class PM concerns.", "Customer obsession + speed: candidates are judged on user empathy, prioritization, and balancing speed vs. quality.", "Fiscal discipline signal: FY2025 saw ~5.8pt GAAP operating-margin expansion and ~$2B operating cash flow \u2014 Zoom values PMs who tie features to durable business outcomes, not vanity metrics."], "interviewFormat": ["Total process ~4-6 weeks. Reported PM/APM funnel is 4 core rounds (senior roles add leadership + optional panel).", "Round 1 \u2014 Recruiter screen (30-45 min): background, motivation, 'Why Zoom?', enterprise-software interest, resume walkthrough.", "Round 2 \u2014 Hiring Manager (45-60 min): hybrid behavioral + lightweight case. 'Tell me about a time\u2026' plus product thinking and B2B acumen (past launches, technical trade-offs with engineering).", "Round 3 \u2014 Product Design / Sense (60 min): the core round. Design or improve a Zoom feature for a specific enterprise segment (e.g. governance dashboard for IT admins, meeting-summary features for regulated industries).", "Round 4 \u2014 Execution / Technical (60 min): diagnostic + metrics scenarios (e.g. 'enterprise churn increased 15% \u2014 diagnose', define KPIs), plus light systems/technical (WebRTC basics, encryption, API design).", "Round 5 (senior only) \u2014 Leadership & Behavioral with Director/VP: judgment, cross-functional influence, cultural (CARE) alignment.", "Round 6 (optional, Staff+ only) \u2014 Panel/onsite presentation.", "APM/intern-specific structure is NOT publicly documented; expect a compressed version of the above (likely recruiter + HM + a combined product-sense/execution round)."], "productSensePrompts": [{"prompt": "You're the PM for Zoom AI Companion. Design a feature that helps a busy manager who attends 8+ meetings/day actually act on what was decided.", "approach": "Clarify: which segment (IC vs. manager vs. exec) and platform. Pick the overwhelmed manager persona. Frame the top pain (decisions/action items get lost across meetings). Propose an agentic 'follow-through' feature: AI Companion auto-extracts action items, assigns owners, drafts follow-ups in Team Chat/Mail, and surfaces a daily digest. Prioritize by reach x impact x confidence x effort. Tie to CARE/'delivering happiness' (reduces cognitive load) and enterprise trust (admin controls, data boundaries, no training on customer data). North-star metric: % of AI-generated action items completed; guardrail: false-positive/hallucination rate."}, {"prompt": "Design a governance dashboard for IT admins to monitor and enforce meeting-security policies across a 10,000-seat enterprise.", "approach": "State that the user is the ADMIN/IT buyer, not the meeting host \u2014 Zoom's key insight. Identify jobs-to-be-done: audit who's out of policy, enforce encryption/recording/guest rules, respond to incidents fast. Sketch 3 flows: policy configuration, real-time compliance monitoring with drill-down, and alerting/remediation. Address security perception head-on (a historic Zoom pain point). Metrics: % of meetings compliant, time-to-detect a violation, admin time saved. Note trade-off: dashboard depth vs. cognitive overload \u2014 start with the top 3 risk signals."}, {"prompt": "What features would you launch to expand Zoom deeper into the healthcare vertical?", "approach": "Segment the vertical (clinicians, patients, health-system IT/compliance). Anchor on regulated-industry needs: HIPAA-compliant telehealth, BAA coverage, audit logs, EHR (Epic) integration, and AI meeting summaries that are safe for PHI. Prioritize a telehealth-optimized waiting-room + AI clinical-note-draft feature. Discuss build-vs-partner and go-to-market via IT/compliance buyer. Metrics: telehealth MAU, provider adoption, compliance-audit pass rate. Flag the gotcha: AI summarization of PHI needs opt-in, data-residency, and no-model-training guarantees."}, {"prompt": "Enterprise adoption of Zoom Docs is flat three months post-launch. Diagnose why and propose fixes.", "approach": "This is really an execution/analytics prompt disguised as product sense. Structure: define 'adoption' (created a doc? recurring weekly use?), then build a funnel (aware -> tried -> retained). Segment by company size, role, and whether they use AI Companion. Form hypotheses: discoverability inside Workplace, weak switching incentive vs. Google Docs/Notion, missing AI hook. Propose experiments: surface Docs from meeting summaries (integration wedge), measure activation lift. North-star: weekly active docs per active account; guardrail: no cannibalization of core meeting engagement."}], "behavioralMapping": [{"value": "Care for Customers / customer obsession (user research depth)", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews to grow the app 17->563 active users (33x) in one quarter, then shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 research directly drove a shipped outcome customers felt.", "factIds": ["ep-1", "ep-role"]}, {"value": "Delivering Happiness / measurable customer impact", "nealStory": "Biryani Blitz QR loyalty app (React/Firebase) lifted repeat purchases 40% \u2014 tie the 'delighting the customer so they come back' story to Zoom's 'deliver happiness' motto.", "factIds": ["bb-3", "bb-role"]}, {"value": "Build for admins/enterprise + technical trade-offs (execution ownership)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40%; chose auto-voting on Gerrit over a separate dashboard \u2014 a concrete build-for-the-internal-user trade-off that maps to Zoom's 'design for the IT/admin buyer' bar.", "factIds": ["sl-1", "sl-role"]}, {"value": "Cross-functional influence / translating pain into shipped tooling", "nealStory": "At SailLoft, translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge ~25% and built a Chrome extension condensing client testing to a 2-click workflow \u2014 shows working across dev/stakeholder lines to ship.", "factIds": ["sl-2"]}, {"value": "AI-first / agentic product thinking (Zoom's strategic bar)", "nealStory": "Shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%, and built the Biryani Blitz OpenCV computer-vision funnel \u2014 directly demonstrates AI-native building for Zoom's AI-Companion strategy.", "factIds": ["bb-3", "bb-2"]}, {"value": "Ownership / 0->1 founder judgment (bias to build)", "nealStory": "Founded Biryani Blitz after 180 customer interviews, launched a 0->1 hot-food vending platform at UC Berkeley (fresh biryani in 60s), Wharton+UNC Innovation Labs-backed ($5K), $200K Wharton Startup Challenge finalist \u2014 the 'tell me about a high-stakes launch you owned end to end' answer.", "factIds": ["bb-1", "bb-4"]}, {"value": "Metrics/KPI rigor (Execution round)", "nealStory": "Authored the FieldPulse AI predictive-restocking PRD: RAG over usage logs/schedules/seasonality, a 3-flow UX with AI explainability, and 15+ KPIs with First-Time Fix Rate as the North Star \u2014 a ready-made 'how do you define success metrics' story.", "factIds": ["fp-1"]}], "analyticalFocus": ["Diagnose a metric regression (e.g. 'enterprise churn up 15%' or 'Zoom Docs adoption flat') \u2014 funnel decomposition + segmentation + hypothesis testing", "Define a North-Star metric and guardrail metrics for a new AI feature; separate adoption vs. engagement vs. retention", "Enterprise/B2B metrics: seat expansion, net revenue retention, admin/IT adoption, security-compliance rate \u2014 not just consumer DAU/MAU", "AI-specific metrics: action-item completion rate, summary accuracy / hallucination (false-positive) rate, AI feature attach/adoption", "Prioritization under constraints: reach x impact x confidence x effort across competing features (e.g. AI summaries vs. breakout analytics vs. a ServiceNow integration)", "Business-outcome literacy: connect features to margin/cash-flow and durable revenue, reflecting Zoom's FY2025 fiscal-discipline signal", "Light technical/systems fluency: WebRTC basics, real-time latency, load balancing at peak, data encryption, API design"], "gotchas": ["Do NOT design only for the end user \u2014 Zoom's #1 tip is that the buyer is the IT/admin/decision-maker. Always name the admin persona in product-sense answers.", "Security perception is a real historical Zoom wound (Zoombombing, encryption criticism). Proactively address security/compliance/data-privacy in any design; don't wait to be asked.", "Zoom is now 'AI-first.' Answering as if it's just a video-call company signals you didn't do homework \u2014 reference AI Companion 3.0 and the Zoom Workplace suite.", "Know the competitive frame: Microsoft Teams (bundled with M365) is the existential threat; also Google Meet, Slack, Genesys/Five9 (contact center). Feature-bloat and long enterprise sales cycles are known pain points.", "For AI features, name responsible-AI guardrails: no training on customer data, opt-in, hallucination/accuracy metrics, admin controls \u2014 especially for regulated verticals (healthcare/finance).", "Neal's numbers need careful phrasing per ledger notes: '97% time cut' (bb-3) is near-ceiling with no baseline \u2014 give a before->after; '41.7% net margin' (bb-1) is over-precise/projected \u2014 say '~42% projected'. Never present projections as actuals.", "APM/intern-specific round structure is not publicly confirmed \u2014 prepare for the full PM loop but expect it compressed; ask the recruiter to confirm the format.", "Ledger flags workAuth as UNCONFIRMED and gradYear May 2028 \u2014 for an intern role, be ready on availability/authorization; Neal must confirm these, do not assume."], "sources": ["https://sirjohnnymai.com/blog/zoom-pm-interview-guide-2026/", "https://www.glassdoor.com/Interview/Zoom-Communications-Product-Manager-Interview-Questions-EI_IE924644.0,19_KO20,35.htm", "https://prepfully.com/interview-questions/zoom/product-manager", "https://www.interviewquery.com/interview-guides/zoom-product-manager", "https://www.productmanagementexercises.com/interview-questions/zoom", "https://www.zoom.com/en/about/", "https://dcf-model.com/blogs/vision/zm-mission-vision", "https://www.comparably.com/companies/zoom-video-communications/questions/3842718/what-are-zoom-s-company-values", "https://news.zoom.com/zoom-launches-ai-companion-3-0/", "https://news.zoom.com/ec26-zoom-workplace/", "https://www.zoom.com/en/products/ai-assistant/", "https://www.zoom.com/en/products/contact-center/resources/contact-center-ai/"]}, {"company": "Workday", "products": ["Workday HCM (Human Capital Management) \u2014 core cloud suite for the entire employee lifecycle", "Workday Financial Management \u2014 cloud ERP/finance, general ledger, accounting, financial close", "Workday Adaptive Planning \u2014 FP&A planning, budgeting, forecasting, workforce planning", "Workday Illuminate \u2014 agentic AI platform (2024/25) with AI Agents for HR, Finance, and industry (e.g. Audit Agent for financial anomalies, Frontline Agent for shift swaps)", "Workday Recruiting \u2014 data-rich ATS built into HCM (2025 Gartner Magic Quadrant Leader); embeds HiredScore AI", "Workday Prism Analytics \u2014 data hub blending Workday + external data (Salesforce, ERP, sheets) for governed reporting", "Workday Peakon Employee Voice \u2014 AI-driven employee sentiment/engagement analytics", "Workday People Analytics, Workday Payroll, Workday Learning, Workday Talent Optimization, Workday Time Tracking / Scheduling / Labor Optimization"], "valuesAndBar": ["Six official core values: Employees, Customer Service, Innovation, Integrity, Fun, Profitability (in that stated order; Employees first is the cultural anchor)", "Employees first: a people-first business \u2014 'it's our product and our attitude at work'; high-performers who bring their best selves and speak up respectfully", "Customer Service: relentlessly deliver meaningful value and are deeply committed to customer success (customer-centric product bar)", "Innovation: innovate with urgency in a fiercely competitive industry; create an environment where it is safe to take risks", "Integrity: culture of honesty for the long haul (critical given they handle sensitive HR/payroll/financial data)", "VIBE \u2014 Value Inclusion & Belonging for Everyone (their DEI framework, backed by Employee Belonging Councils)", "PM competency emphasis: passion for the role AND for Workday specifically, alignment with the core values, product sense, technical/data acumen, and cross-functional collaboration (especially with engineering)", "Business bar (2026 context): 'Rule of 40' profitability discipline + an agentic-AI pivot via Illuminate \u2014 PMs are expected to think about both value delivery and margin"], "interviewFormat": ["Not standardized \u2014 focus varies by product area (Exponent); expect variation, but the arc is consistent", "Stage 1: Recruiter/HR phone screen (30-45 min) \u2014 informal, walk through yourself and your resume, interest in the role and in Workday", "Stage 2: A more technical phone/video screen with a senior PM \u2014 how you've applied technology in projects and at work", "Stage 3 (onsite/virtual loop): typically 3+ interviews (some report 4-7 interviewers x ~45 min for senior roles) with PMs, engineers, and business partners", "Round types across the loop: (1) general product sense/design, (2) execution + analytical/metrics + data understanding, (3) behavioral tied to core values, plus a light technical/'work with engineering' round", "Technical round has a relatively low bar for PM/APM; example prompts have included designing systems like an online class-registration system", "Overall difficulty rated ~3.1/5 on Glassdoor for APM \u2014 friendly interviewers, collaborative tone; 1-2 weeks between stages", "Behavioral is explicitly mapped to the six values \u2014 prepare a story per value, especially Customer Service, Employees (collaboration/conflict), and Innovation (risk-taking)"], "productSensePrompts": [{"prompt": "How would you design/improve Workday Recruiting (their ATS) for a large enterprise recruiter drowning in applicants?", "approach": "Clarify user (enterprise TA leader / recruiter, not the candidate) and business goal (time-to-fill, quality-of-hire). Segment the funnel: requisition to sourcing to screening to interview to offer. Identify the biggest pain (volume triage) and propose an Illuminate/HiredScore-style AI ranking feature with explainability so recruiters trust and can audit it (integrity + compliance angle \u2014 bias/EEOC risk). North Star: quality-adjusted time-to-fill; guardrail metrics: adverse-impact ratio, recruiter trust/override rate. Neal can lean on fp-1 (RAG + AI explainability + KPI-tree, First-Time-Fix as North Star) as a direct analogue."}, {"prompt": "Design an AI 'agent' for Workday Illuminate that helps a manager run performance reviews or workforce planning.", "approach": "Anchor on Workday's agentic pivot: move from assistive (summarize) to agentic (execute). Pick one workflow (e.g. calibration/review drafting). Define the human-in-the-loop boundary (agent drafts, manager approves) \u2014 critical for integrity and legal exposure. Metrics: review-cycle time reduction, manager edit rate, employee-perceived fairness (tie to Peakon sentiment). Discuss data-privacy guardrails given sensitive HR data. Neal maps to bb-3 (agentic pipeline: Node/Playwright/Gemini) and fp-1 (AI explainability)."}, {"prompt": "Workday primarily sells to CHROs/CFOs, but the daily users are employees. How would you improve the everyday employee (self-service) experience \u2014 e.g. requesting time off, viewing pay, benefits enrollment?", "approach": "Name the two-sided tension: buyer (CHRO) vs. end-user (employee), and that employee delight drives adoption which drives renewal (customer success). Reframe around the 'employees first' value. Pick one journey (time-off or payslip clarity), map friction, propose a mobile-first, conversational (Illuminate assistant) flow. Metrics: self-service completion rate, support-ticket deflection, employee NPS/Peakon sentiment. Neal maps to ep-1 (scaled a student productivity app 17\u2192563 via 200+ interviews \u2014 consumer-grade UX empathy inside a utility product)."}, {"prompt": "How would you define success metrics for Workday Adaptive Planning (or a new financial-close feature), and what would you A/B test?", "approach": "Distinguish adoption vs. value metrics. For planning: forecast accuracy improvement, planning-cycle time, number of scenarios modeled, cross-functional participation (finance+HR+ops in one plan). North Star candidate: reduction in plan-to-actual variance. Discuss why classic A/B testing is hard in enterprise SaaS (few tenants, long cycles) \u2014 use phased rollouts, cohort/holdout by customer segment, and qualitative CAB feedback. Neal maps to bb-2 (built CV telemetry: impression\u2192approach\u2192purchase funnel = defining a measurement system from scratch) and fp-1 (15+ KPIs with a North Star)."}], "behavioralMapping": [{"value": "Customer Service (deeply committed to customer success)", "nealStory": "SailLoft: turned developer-workflow pain points into a shipped Gerrit-based test product and a GitHub testing interface, cutting manual tests 40% and accelerating PR-to-merge ~25% \u2014 solved the actual user's daily friction, not what was assumed.", "factIds": ["sl-1", "sl-2"]}, {"value": "Employees / cross-functional collaboration (work with engineering, speak up respectfully)", "nealStory": "SailLoft internship as a Product Management + Development intern \u2014 sat between developers and product, translated pain points into engineering-buildable interfaces (Gerrit voting + Bazel), living the PM-engineering interface Workday screens for.", "factIds": ["sl-role", "sl-2"]}, {"value": "Innovation (innovate with urgency; safe to take risks)", "nealStory": "Biryani Blitz: launched a 0\u21921 hot-food vending platform at UC Berkeley and shipped an agentic AI lead-gen pipeline (Node/Playwright/Gemini) across 100+ universities \u2014 took a real risk building net-new AI infrastructure to move fast.", "factIds": ["bb-1", "bb-3"]}, {"value": "Customer obsession via user research (data-informed, listen first)", "nealStory": "Founded Biryani Blitz after 180 customer interviews and scaled Elephant productivity app 17\u2192563 users (33x) in one quarter via 200+ interviews \u2014 decisions grounded in talking to users, not assumptions.", "factIds": ["bb-1", "ep-1"]}, {"value": "Integrity / dealing with ambiguity honestly (analytical rigor with sensitive data)", "nealStory": "Built a privacy-first computer-vision telemetry funnel (OpenCV) for Biryani Blitz \u2014 chose privacy-preserving measurement deliberately, relevant to Workday's integrity + data-sensitivity bar; and authored a PRD (FieldPulse) with AI explainability so users can trust/audit AI output.", "factIds": ["bb-2", "fp-1"]}, {"value": "Ownership / bias for action (drive results end to end)", "nealStory": "As founder & AI PM of Biryani Blitz, drove it to a $200K Wharton Startup Challenge finalist and $5K Wharton/UNC Innovation Labs backing while shipping product \u2014 owned the whole outcome, not a slice.", "factIds": ["bb-role", "bb-4", "bb-1"]}, {"value": "Delivering measurable value / impact under constraints", "nealStory": "Elephant Productivity Suite: shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 connected a shipped feature to measured user outcomes, exactly the value-delivery bar Workday expects.", "factIds": ["ep-1"]}, {"value": "Leadership / developing others", "nealStory": "UNC Product Management Club Director of Professional Development and UNC Ultimate Frisbee (BatCH) President \u2014 led peers and built others' capabilities outside of formal work.", "factIds": ["ld-1", "ld-2"]}], "analyticalFocus": ["Enterprise SaaS metrics: net revenue retention, seat/adoption rate, time-to-value, churn/renewal drivers, and 'Rule of 40' (growth + margin) \u2014 Workday's stated 2026 discipline", "Defining a North Star + KPI tree for a feature (Neal has done this in fp-1 with 15+ KPIs) \u2014 expect 'what metrics would you track and why'", "HR/Finance domain metrics: time-to-fill, quality-of-hire, cost-per-hire (Recruiting); forecast accuracy, plan-to-actual variance, planning-cycle time (Adaptive Planning); financial-close cycle time (Illuminate Audit Agent)", "Experimentation in enterprise: why classic A/B is hard (few large tenants, long sales/usage cycles) \u2014 phased rollouts, holdout cohorts by customer segment, qualitative Customer Advisory Board feedback", "AI/agentic metrics: agent task-completion rate, human override/edit rate, hallucination/error rate, and explainability/trust \u2014 increasingly central given Illuminate", "Guardrail/responsibility metrics given regulated HR data: adverse-impact ratio in AI hiring, privacy compliance (GDPR, SOC 2), audit-log completeness", "Basic data literacy / 'work with engineering' technical understanding: funnel analysis (Neal has impression\u2192approach\u2192purchase funnel via bb-2), SQL, dashboards"], "gotchas": ["Workday sells B2B to CHROs/CFOs but the daily users are employees \u2014 always separate 'buyer' from 'end user' in product-sense answers; a common trap is optimizing only for the admin.", "This is sensitive-data territory (payroll, PII, financials, hiring). Any AI/feature answer must address integrity, privacy, bias/adverse-impact, and human-in-the-loop \u2014 omitting this reads as naive to their core value of Integrity.", "Don't treat it as a consumer-app design question. Enterprise = multi-tenant, compliance (SOC 2, GDPR, data residency), long adoption cycles, and champion/procurement dynamics.", "Show genuine interest in Workday specifically (Exponent flags 'passion for the role and Workday'). Reference Illuminate, the agentic AI pivot, and 'employees first' by name \u2014 generic PM answers underperform here.", "Know the platform buzzword: Workday's architecture is the Object Management System/Server (OMS) \u2014 an in-memory object model, not a classic RDBMS. Not required for APM but referencing it signals prep in the technical round.", "The technical round is real but low-bar for PM/APM (e.g. design an online class-registration system) \u2014 don't over-engineer; show structured OOP/system thinking and collaboration with engineering.", "Behavioral must map to their six named values. 'Fun' and 'Profitability' are real values \u2014 a story showing team energy or business/margin awareness (e.g. bb-1 projected margin, bb-4 funding) can differentiate.", "Neal's ledger is startup/consumer-heavy; explicitly bridge each story to enterprise HR/finance context, and avoid over-precise numbers flagged in the ledger (round 41.7%\u2192~42% 'projected'; soften the 97% outreach cut with a before\u2192after)."], "sources": ["https://www.workday.com/en-us/company/about-workday/core-values.html", "https://newsroom.workday.com/2025-09-16-Workday-Illuminate-TM-Expands-with-New-AI-Agents-for-HR,-Finance,-and-Industry", "https://newsroom.workday.com/company-overview-products", "https://www.tryexponent.com/guides/workday-pm-interview", "https://www.glassdoor.com/Interview/Workday-Associate-Product-Manager-Interview-Questions-EI_IE197851.0,7_KO8,33.htm", "https://www.techinterview.org/companies/workday/", "https://markets.financialcontent.com/wral/article/predictstreet-2026-1-9-workday-wday-2026-the-agentic-ai-pivot-and-the-rule-of-40-mandate", "https://www.workday.com/en-us/company/about-workday/value-inclusion-belonging-for-everyone.html", "https://www.workday.com/en-us/products/adaptive-planning/workforce-planning/overview.html", "https://www.workday.com/en-us/resources/prism-analytics/data-hub-use-cases.html"]}, {"company": "PayPal", "products": ["PayPal core wallet & checkout (Buy button, Pay in 4 / BNPL)", "Venmo (P2P payments, Venmo debit/credit card, Pay with Venmo, teen accounts)", "Fastlane by PayPal (guest-checkout accelerator competing with Shop Pay)", "Braintree (merchant/enterprise payment processing)", "Zettle by PayPal (SMB in-person card reader / POS)", "Xoom (international remittance / cross-border cash send)", "Honey (deal/coupon browser extension & shopping rewards) \u2014 note: reportedly under strategic review/possible divestiture", "PYUSD (PayPal USD stablecoin) & crypto", "PayPal Open / PayPal Complete Payments (unified merchant platform)", "PayPal Everywhere / PayPal debit car
