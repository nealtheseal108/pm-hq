Amplitude, and Amplitude MCP (natural-language analytics + agentic insights, plus Agent Analytics to measure AI-agent impact)", "Data Governance (trusted, complete event data with one taxonomy/metrics model)"], "valuesAndBar": ["Core values: Humility, Ownership, Growth Mindset (Amplitude's three stated cultural values \u2014 expect at least one behavioral question mapped to each)", "Humility = show vulnerability, no politics, be transparent about missing targets and seek the best solution over being right", "Ownership = take initiative on problems beyond your own scope; drive outcomes for customers/company/team, not just yourself", "Growth mindset = continuous learning, adapt and improve, treat feedback as fuel", "PM competency bar (from Amplitude's own PM-interview guide): think about the whole picture, reach a logical answer, use structured frameworks, center user/customer needs, and listen + adapt for the greater good", "Amplitude is deeply metrics-native: strong bias for the North Star Metric framework (one output metric + a small set of controllable inputs) and product-led growth (acquisition/retention/monetization)", "AI-era framing: Amplitude positions itself as the AI analytics platform, so AI fluency and 'how would you use data/AI to decide' is a live theme"], "interviewFormat": ["Overall: lengthy, multi-round loop, typically ~3-4 weeks end to end (per aggregated interview reviews)", "Round 1 \u2014 Recruiter phone screen: motivation ('What do you know about Amplitude?'), background fit, logistics", "Round 2 \u2014 Hiring manager screen: role fit, past-product deep dive, why-Amplitude", "Middle rounds \u2014 Product sense / product design (improve-a-product prompts) and Analytical/metrics/execution (a spiked-metric or metric-definition prompt); usually worked live in a shared doc", "Behavioral / values interview: questions explicitly mapped to Humility, Ownership, Growth Mindset plus cross-functional conflict", "Some roles include a case study or panel presentation; live case studies are ~60% of PM loops vs ~40% take-home (general benchmark, not Amplitude-confirmed)", "NOTE: Amplitude does NOT publish an APM/intern-specific loop; the above is the general PM loop and should be treated as directional for an intern role, which is often lighter (recruiter + HM + 1-2 skill rounds)"], "productSensePrompts": [{"prompt": "You're the PM for Amplitude Session Replay. Adoption among existing Analytics customers is low. How would you increase the number of teams that regularly watch replays?", "approach": "Clarify the goal (activation vs habitual use) and pick a North Star: weekly teams that watch >=1 replay tied to an insight. Segment users (PMs, designers, support, growth) and their jobs-to-be-done. Diagnose the funnel: aware -> enabled (SDK/instrumentation) -> first replay -> recurring. Hypothesize friction: setup cost, not knowing when a replay is useful, no path from a funnel drop-off to the exact replay. Prioritize solutions that leverage the integrated platform edge \u2014 e.g. one-click 'watch the sessions behind this funnel drop' from an Analytics chart. Define input metrics (replays-per-funnel-view, time-to-first-replay) and a guardrail (data/privacy). Trade off effort vs impact, propose an A/B test using Amplitude Experiment, and state what would make you kill it."}, {"prompt": "How would you improve Amplitude's onboarding so a new customer reaches their first 'aha' insight faster?", "approach": "Define the aha for Amplitude = the moment a user sees a real insight from THEIR data (e.g. a retention curve or a funnel drop-off), not a demo. North Star: % of new workspaces reaching first self-serve insight within 7 days. Map onboarding: instrument events -> define taxonomy/North Star metric -> build first chart. Biggest drop is usually instrumentation + event taxonomy (hard, technical). Propose Guides/Surveys-driven in-app onboarding, templated 'starter dashboards' by vertical, and AI (Ask Amplitude) to generate a first chart from a natural-language question so value precedes full instrumentation. Prioritize by reach x friction, define input metrics, and note the tension between fast time-to-value and long-term data-governance hygiene."}, {"prompt": "Design an AI agent feature for Amplitude that helps a non-technical PM answer their own data questions. What is it and how do you measure success?", "approach": "Start with the user and pain: PMs wait on data teams for answers, creating a bottleneck. Define the JTBD: 'ask a question in plain English, get a trustworthy chart + explanation.' Scope an MVP of Ask Amplitude / AI Agents: natural-language -> query -> chart + narrative + suggested follow-ups, grounded in the governed event taxonomy so answers are trustworthy. Address the core risk head-on: hallucinated/wrong metrics erode trust, so add explainability (show the query/definitions it used) and confidence signals. North Star: self-serve questions answered without a data-team handoff; inputs = query success rate, follow-through on suggested actions, correction rate. Guardrail: accuracy/trust score. Tie back to Amplitude's platform moat (one metrics model) and to the analytical-explainability work I did on FieldPulse."}, {"prompt": "A key customer's weekly active users dropped 15% week-over-week in Amplitude's own dashboards. Walk me through how you diagnose it.", "approach": "Treat as an execution/metric-drop case. First clarify: is this a real change or a measurement/instrumentation artifact? Check data pipeline (event volume, a recent SDK/tracking release, taxonomy change) before assuming behavior. Then decompose WAU = new + retained + resurrected - churned, and slice by platform, geo, app version, cohort, and time (holiday/seasonality). Look for a step-change (release/outage) vs gradual erosion (retention decay). Form hypotheses, rank by likelihood + impact, and validate each with a specific Amplitude report (funnels, retention, segmentation). Communicate the leading hypothesis, the confirming query, and the fix + monitoring plan. This mirrors the CV conversion-funnel telemetry I built at Biryani Blitz (bb-2), where I debugged impression->approach->purchase drop-offs."}], "behavioralMapping": [{"value": "Ownership", "nealStory": "Founded Biryani Blitz and drove it 0->1: ran 180 customer interviews, built and deployed the vending platform at UC Berkeley, and owned the full model (projected ~$145K ARR/machine, ~42% net margin). I took a problem no one assigned me and drove outcomes end to end.", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Ownership", "nealStory": "At SailLoft I led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40% \u2014 I owned a problem beyond my own tasks that improved the whole team's workflow.", "factIds": ["sl-role", "sl-1"]}, {"value": "Growth Mindset", "nealStory": "With Elephant Productivity Suite I scaled the app 17->563 active users (33x) in one quarter by running 200+ user interviews and iterating \u2014 shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38%. I learned fast from users and kept improving the product.", "factIds": ["ep-role", "ep-1"]}, {"value": "Growth Mindset", "nealStory": "I'm a CS + Business double major actively skilling into AI-native product work (built agentic pipelines with Node/Playwright/Gemini and a RAG PRD for FieldPulse), and I was a Bridge-to-BCG invitee (~10% acceptance) \u2014 I deliberately seek stretch and learning.", "factIds": ["fp-1", "bb-3", "ld-3", "edu-1"]}, {"value": "Humility (data over ego / listen and adapt)", "nealStory": "I let user research overrule my instincts: across ventures I ran 500+ interviews, and at Biryani Blitz I built privacy-first CV telemetry (OpenCV) to measure the real impression->approach->purchase funnel rather than trusting my gut on what was working.", "factIds": ["bb-2", "bb-1", "ep-1"]}, {"value": "Cross-functional conflict / influence without authority", "nealStory": "At SailLoft I translated developer-workflow pain into a GitHub testing interface and a 2-click Chrome extension, accelerating PR-to-merge ~25% \u2014 I had to align engineers who didn't report to me around a workflow change by grounding it in their pain points.", "factIds": ["sl-2", "sl-1"]}], "analyticalFocus": ["North Star Metric framework \u2014 define one output metric plus a few controllable input metrics (Amplitude's signature framework; expect them to test it)", "Funnel / conversion analysis and diagnosing metric drops (WAU/DAU decomposition, retention curves, segmentation)", "Retention and product-led growth loops (acquisition -> activation -> retention -> monetization)", "Time-to-value / activation metrics (first-insight, aha-moment) for a self-serve analytics product", "Distinguishing real behavior change from instrumentation/measurement artifacts (data governance + taxonomy)", "A/B test / experiment design and reading results (Amplitude Experiment), including guardrail metrics", "Back-of-envelope estimation and sizing (Neal can anchor with real numbers: projected ~$145K ARR/machine, 33x user growth, 16%/38% product lifts)"], "gotchas": ["Amplitude does not publish a dedicated APM/intern loop \u2014 the round structure above is the general PM loop and is directional only; confirm the exact stages with the recruiter for the intern posting.", "Do NOT overclaim on the resume numbers: bb-1's 41.7% net margin and $145K ARR are PROJECTED (say 'projected/~42%'), and bb-3's 97% outreach-time cut is near-ceiling with no baseline (give a before->after or soften). These invite drill-down.", "Know the North Star framework cold and be able to define it for a specific product live \u2014 Amplitude will notice if you use it loosely.", "Center the USER/customer in every product answer and explicitly 'listen and adapt' \u2014 Amplitude's stated bar is picking the best solution for the greater good over being right (humility).", "Have a crisp, current 'why Amplitude' + 'what do you know about Amplitude' answer: name real products (Analytics, Session Replay, Experiment, Guides & Surveys, CDP, Amplitude AI/Ask Amplitude) and their AI-analytics positioning.", "Be ready for the AI-trust angle: if you propose an AI feature, proactively address hallucination/wrong-metric risk with explainability \u2014 a naive 'just add AI' answer will be marked down.", "Work authorization is UNCONFIRMED in the ledger \u2014 Neal must confirm before applying (intern knockout field).", "Interview-question examples in Amplitude's own guide are generic (Facebook/Instagram, improve Netflix) \u2014 practice the METHOD, but expect them to swap in an Amplitude-specific product prompt."], "sources": ["https://amplitude.com/amplitude-analytics", "https://amplitude.com/compare/best-product-analytics-tools", "https://amplitude.com/solutions/product", "https://amplitude.com/blog/amplitude-cultural-values", "https://amplitude.com/blog/scaling-culture", "https://amplitude.com/blog/product-management-interview-questions", "https://amplitude.com/north-star-hub", "https://amplitude.com/books/north-star/about-north-star-framework", "https://www.glassdoor.com/Interview/Amplitude-Interview-Questions-E1143936.htm", "https://algo.monster/interview-guides/amplitude", "https://climbtheladder.com/amplitude-interview-questions/", "https://www.interviewpal.com/questions/amplitude-interview-questions", "https://builtin.com/company/amplitude/faq/workplace-perception"]}, {"company": "Gusto", "products": ["Full-service payroll \u2014 automated federal/state/local tax filing, unlimited payroll runs, all 50 states; the core flagship product (originally launched as ZenPayroll)", "Benefits administration \u2014 integrated health insurance brokerage, native 401(k), workers' comp, FSA/HSA/commuter benefits", "HR tools \u2014 hiring & onboarding (offer letters, e-signing, I-9/W-4), org charts, PTO/time-off request flows (now default on every plan in 2026), performance tools", "Time tracking & scheduling \u2014 clock-in/out, project tracking, and AI-generated compliant shift schedules", "Contractor payments \u2014 pay 1099 contractors and international contractors alongside W-2 employees", "Gusto Wallet \u2014 employee-facing app: debit card + spending account, savings goals, budgeting/spending insights, and Cashout on-demand/early pay access", "Gus \u2014 in-product AI assistant (launched late 2024, GA in 2026): generates reports, executes actions like approving time-off, navigates 50+ jurisdiction compliance, builds shift schedules; first enterprise payroll app in OpenAI's ChatGPT directory (Jan 2026)", "Gusto Embedded \u2014 payroll-as-an-API (RESTful, OAuth2, sandbox/SDKs) letting vertical SaaS, fintechs, and neobanks embed payroll; powers Chase Payment Solutions / JPMorgan", "Gusto for Accountants / partner program \u2014 tools and revenue share for accountants and bookkeepers who manage payroll for client businesses"], "valuesAndBar": ["Customer Obsessed \u2014 Gusto frames PMs not as 'building software' but as helping business owners hire, pay, insure and support their teams; strong sense of mission/purpose", "Dream Big Then Make It Real \u2014 vision paired with concrete shipping/execution", "Raise the Bar \u2014 high quality standard; 'Be proud of the how' (the process matters, not just the outcome)", "Learn Fast, Repeat \u2014 rapid iteration; the Gus team shipped weekly on a fluid 90-day roadmap, 'startup within a startup'", "Act with Bold Conviction / Debate then commit \u2014 take a clear stance, disagree openly, then align", "Ownership mentality \u2014 every employee empowered to make the company better; 'we are all builders'", "Do what's right (even when hard) and be transparent \u2014 share information, mistakes, and victories; don't optimize for the short term", "Build with humility / embody a service mindset", "Mission: 'create a world where work empowers a better life' \u2014 reimagining payroll, benefits and HR for modern SMBs (peace of mind, great place to work, personal prosperity)", "PM bar for interns: deep understanding of Gusto's product AND mission (serving SMBs), clear communication, and evidence of user empathy \u2014 cultural/mission fit is explicitly weighted heavily"], "interviewFormat": ["Recruiter/PM phone screen (~30 min): background, career aspirations, and motivation \u2014 expect a strong 'why Gusto / why SMB payroll' pull here", "Take-home or case study (~2-3 hours): analyze a product problem or develop a product strategy; be ready to present it", "2-3 video/virtual interviews: mix of product sense, execution, and behavioral", "Onsite/final loop: 4-6 interviews with PMs, engineers, designers, and cross-functional stakeholders; often includes presenting the case + a feedback session", "Hiring-manager round: typically a case plus behavioral", "Reported overall: 5-7 rounds over ~20-30 days for full PM roles (intern loops are usually shorter/compressed); question mix roughly 40% product, 30% technical/analytical (metrics/data), 30% behavioral", "Culture/mission-fit is a distinct, deliberate evaluation thread \u2014 one round is essentially cross-functional culture fit"], "productSensePrompts": [{"prompt": "Gusto's AI assistant 'Gus' can already generate reports and approve time-off. What should the next Gus feature be for a 5-person restaurant owner, and how would you decide?", "approach": "Anchor on the persona: a time-poor, non-expert SMB owner whose #1 pain is compliance anxiety and admin time. Segment jobs-to-be-done (run payroll, stay compliant, schedule staff, understand cash). Prioritize on frequency x pain x AI-fit x trust-risk. A strong pick: proactive compliance alerts ('you added an employee in a new state \u2014 here's what to file') because it hits Gusto's core value prop and is low-regret if Gus asks for confirmation. Design for trust: AI proposes, human confirms; show the 'why'. North-star: tasks completed via Gus / reduction in support contacts. Tie back to 'work empowers a better life.'"}, {"prompt": "Design onboarding for a first-time business owner running their very first payroll on Gusto.", "approach": "Frame the emotional state: anxious, afraid of penalties, unsure of terminology. Map the funnel: sign-up -> connect bank/tax IDs -> add employees -> first pay run -> confirmation. Reduce cognitive load with progressive disclosure, plain-language explanations, and a 'we've got you' compliance safety net (Gusto auto-files taxes \u2014 surface that reassurance). Identify the biggest drop-off risk (gathering tax/bank info) and design async save + guided help. Success metrics: time-to-first-payroll, first-run completion rate, first-run error rate, and 30-day retention. Trade-off: speed vs. accuracy \u2014 err toward validation because a payroll error is catastrophic trust loss."}, {"prompt": "Should Gusto build a feature that helps SMBs hire and onboard their first employee? How would you scope an MVP?", "approach": "Establish strategic fit: hiring is the top of the SMB employer lifecycle and a wedge to grow accounts from 1 to many employees (expands revenue per customer). MVP: job-post templates + offer letter + e-sign + auto-collect I-9/W-4/direct-deposit, flowing straight into payroll (the integration is the moat vs. point tools). Cut: ATS/interview scheduling for v1. Metrics: % of new SMBs who add a 2nd employee, onboarding completion, time-to-productive. Risk: scope creep into recruiting \u2014 stay in Gusto's 'pay & comply' lane. Reference Gusto's real 2026 move of adding unpaid/external team members to the org chart as adjacent evidence."}, {"prompt": "Gusto Embedded lets partners like Chase embed payroll via API. As PM, how would you improve adoption/activation for embedding partners?", "approach": "Note the two-sided nature: the customer is the developer/partner, the end-user is the SMB. Define activation as 'partner ships payroll to first real customer.' Instrument the developer funnel: docs -> sandbox key -> first sandbox payroll -> production go-live. Attack the biggest friction (sandbox realism, compliance edge cases, support latency) with better SDKs, seeded test data, and clear go-live checklists. Metrics: time-to-first-sandbox-call, sandbox-to-production conversion, partner-attributed businesses live. Trade-off: white-label flexibility vs. Gusto's compliance guarantees \u2014 protect the compliance layer since it's the value prop. This prompt tests whether you understand B2B2B/platform products, not just consumer UI."}], "behavioralMapping": [{"value": "Customer Obsessed / user empathy", "nealStory": "At Elephant Productivity Suite, ran 200+ user interviews and used them to scale the app from 17 to 563 active users (33x) in one quarter, shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 research directly drove shipped, measured value. (Also cite Biryani Blitz's 180 customer interviews.) Frame it as talking to real users and building what they needed, which mirrors Gusto's SMB-obsession.", "factIds": ["ep-1", "bb-1"]}, {"value": "Dream Big Then Make It Real (0->1 execution)", "nealStory": "Founded Biryani Blitz and launched a 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in 60s), founded after 180 customer interviews, with projected ~$145K ARR/machine \u2014 a big vision turned into a real deployed product, backed by Wharton + UNC Innovation Labs and a $200K Wharton Startup Challenge finalist spot.", "factIds": ["bb-1", "bb-role", "bb-4"]}, {"value": "Raise the Bar / Be proud of the how (quality, judgment, trade-offs)", "nealStory": "At SailLoft, led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel), cutting manual tests 40% with real-time status visibility, and made a deliberate design trade-off (auto-voting on Gerrit vs. a separate dashboard). Shows caring about the process/craft, not just the result.", "factIds": ["sl-1", "sl-2"]}, {"value": "Learn Fast, Repeat / Ownership mentality (ambiguity, scrappy iteration)", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time ~97%, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 as a founder wearing PM + builder hats, rapidly iterating with no playbook. Mirrors Gusto's 'startup within a startup' Gus team.", "factIds": ["bb-3", "bb-2"]}, {"value": "Act with Bold Conviction / Debate then commit (data-informed decisions, prioritization)", "nealStory": "Authored the FieldPulse PRD for an AI predictive-restocking feature (RAG over usage/seasonality data), designing a 3-flow UX with AI explainability and defining 15+ KPIs with First-Time Fix Rate as the North Star \u2014 took a clear stance on what mattered and committed to a single north-star metric.", "factIds": ["fp-1"]}, {"value": "Build with humility / service mindset (leadership, developing others)", "nealStory": "Serves as Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leading and developing peers in service of the team rather than self. (Bridge to BCG invitee, ~10% acceptance, as a credibility signal.)", "factIds": ["ld-1", "ld-2", "ld-3"]}], "analyticalFocus": ["North-star metric selection and defending it (Neal has direct reps: First-Time Fix Rate on FieldPulse, exam-score/review-time on Elephant)", "Activation & onboarding funnel metrics \u2014 time-to-first-payroll, first-run completion/error rate (payroll is high-stakes so error rate matters)", "Retention & expansion \u2014 SMB net retention, % of accounts adding a 2nd employee, seats per account (Gusto grows by expanding within accounts)", "Conversion funnel analytics \u2014 Neal built CV telemetry tracking impression->approach->purchase at Biryani Blitz; map that funnel-thinking to SaaS sign-up->activation", "AI feature metrics \u2014 Gus adoption: % of customers using Gus, tasks completed via Gus, support-contact deflection, trust/confirmation rates", "Platform/B2B2B metrics for Gusto Embedded \u2014 sandbox-to-production conversion, partner-attributed businesses live, time-to-first-API-call", "Trade-off & prioritization framing (RICE/impact-effort), and estimation/market-sizing (e.g., size the US SMB payroll TAM: ~30M+ small businesses)", "Guardrail metrics \u2014 payroll accuracy, compliance/filing error rate, and support volume as counter-metrics to any growth push"], "gotchas": ["Confirm work authorization before applying \u2014 the ledger flags it as UNCONFIRMED and it's a common knockout field.", "Mission-fit is graded, not decorative: be able to articulate WHY SMB payroll/HR matters (owners are non-experts terrified of compliance penalties). Generic 'I love product' answers underperform here.", "Payroll is unforgiving \u2014 never pitch 'move fast and break things' unqualified. Show you understand accuracy/compliance/trust as guardrails. Pair boldness with 'AI proposes, human confirms.'", "Know the difference between Gusto's three audiences: employers (buyer), employees (Gusto Wallet), and Embedded partners/developers. Don't answer a B2B2B question as if it's a consumer app.", "Don't overstate ledger numbers: 41.7% net margin -> say '~42%, projected'; 97% outreach-time cut -> give a before/after or soften; $145K ARR is a projection \u2014 keep the word 'projected'. Interviewers probe metrics.", "Gusto's flagship is payroll (formerly ZenPayroll, rebranded 2015) \u2014 don't call it 'just an HR tool.' It's an all-in-one people platform now at $1B+ ARR, 400K+ businesses, ~$9.3B valuation.", "For product-sense, Gusto is US-centric and SMB-focused (mostly <100 employees) \u2014 proposing enterprise or heavy-international features signals weak product context.", "Have a crisp POV on Gus and AI: Gusto is leaning hard into AI (first payroll app in the ChatGPT directory). Neal's AI-native/RAG/agent experience (bb-3, fp-1) is a strong hook \u2014 use it."], "sources": ["https://gusto.com/product", "https://gusto.com/about", "https://gusto.com/partner-resources/gusto-mission-values-and-partner-program", "https://www.comparably.com/companies/gusto/mission", "https://builtin.com/company/gusto/faq/culture-values", "https://www.keyvalues.com/gusto", "https://gusto.com/product/showcase/spring-2026", "https://embedded.gusto.com/", "https://embedded.gusto.com/product/payroll-api", "https://www.paymentsdive.com/news/jpmorgan-gusto-embedded-payroll-services-fintech/694349/", "https://gusto.com/product/mobile", "https://support.gusto.com/hub/Employees-and-managers/Benefits/Gusto-Wallet", "https://www.saastr.com/how-gusto-built-gus-their-ai-assistant-serving-400k-small-businesses-lessons-from-the-trenches/", "https://support.gusto.com/article/250211164235690/Use-Gusto-s-AI-assistant-Gus", "https://sirjohnnymai.com/blog/gusto-pm-interview-guide-2026", "https://www.interviewquery.com/interview-guides/gusto-product-manager", "https://www.glassdoor.com/Interview/Gusto-Product-Manager-Interview-Questions-EI_IE1069704.0,5_KO6,21.htm", "https://prepfully.com/interview-questions/gusto/product-manager", "https://gusto.com/resources/hiring/interview-questions/product-manager", "https://research.contrary.com/company/gusto"]}, {"company": "Squarespace", "products": ["Squarespace Website Builder (Fluid Engine drag-and-drop editor) \u2014 the flagship all-in-one website creation platform", "Blueprint AI \u2014 AI-guided site builder that generates site structure and starter copy from a short business description (now on every plan)", "Squarespace Commerce / online stores \u2014 ecommerce, physical & digital products, tiered plans (Basic/Core/Plus/Advanced) with varying transaction fees", "Squarespace Payments \u2014 Squarespace's own integrated native payment processing", "Acuity Scheduling \u2014 appointment booking & scheduling platform for service businesses (consultants, trainers)", "Squarespace Domains \u2014 domain registration and management", "Bio Sites \u2014 link-in-bio / single-page mobile sites for creators and social profiles", "Unfold \u2014 social media content & story-design/creation app", "Email Campaigns \u2014 built-in email marketing tool", "Enterprise / client collaboration tools and courses/memberships (surfaced in the annual 'Squarespace Refresh' release)"], "valuesAndBar": ["Be the customer \u2014 develop empathy for user needs; build to a standard you'd want for yourself (Squarespace literally builds on its own platform)", "Design is not a luxury \u2014 thoughtful, excellent design should be universally accessible; 'design is the ultimate competitive advantage'", "Build the ideal / Optimize toward ideals \u2014 bold ideas refined iteratively toward a high bar", "Learn fast, act fast \u2014 rapid learning and decisive action", "Protect creativity \u2014 give ideas (and creative customers) room to develop; champion creators", "Simplify \u2014 reduce complexity for the end user", "Vision: 'a future where everyone can be an entrepreneur' \u2014 mission is democratizing good design", "PM bar: generalist evaluation \u2014 strong product sense grounded in DESIGN/craft + taste, clear execution with metrics AND counter-metrics, customer empathy, and evidence you've shipped 0->1"], "interviewFormat": ["Typically 3 rounds over ~3-5 weeks (PM offers can average ~46 days end-to-end)", "Round 1 \u2014 Recruiter/phone screen (~30 min): background, interest in role, culture fit, basic qualifications", "Round 2 \u2014 Hiring Manager interview: deep dive on a product you built/shipped end-to-end (discovery -> launch); often includes a 'product you like and how you'd improve it' + a counter-metrics probe", "Round 3 \u2014 'Superday' onsite loop: a take-home case study / presentation delivered to a panel (PMs, designers, engineers), plus multiple 30-60 min sessions covering product sense, execution, analytical, and behavioral", "Generalist evaluation model: assessed on core PM competencies first, then matched to a team", "Intern track (Early Career): generally a take-home assessment + a technical interview + a soft-skills/behavioral interview; exact mix varies by department (non-technical interns skip/lighten the technical round)"], "productSensePrompts": [{"prompt": "How would you improve the onboarding experience for a first-time Squarespace user who wants to sell physical goods? (a real, documented Squarespace prompt)", "approach": "Clarify the user (solo creator vs. established SMB migrating from Shopify) and the goal (time-to-first-sale). Map the current funnel: sign up -> pick template/Blueprint AI -> add products -> connect Squarespace Payments -> configure shipping/tax -> publish. Identify the biggest drop-off (shipping/tax setup and payment connection are classic friction). Propose 2-3 interventions tied to the 'Simplify' + 'Design is not a luxury' values \u2014 e.g. an AI-assisted product-import + smart shipping defaults, progressive disclosure so users aren't overwhelmed. Pick a North Star (time-to-first-published-store or time-to-first-sale) and name counter-metrics (refund/chargeback rate, published stores that never transact). Prioritize by reach x impact x effort and state the tradeoff you chose."}, {"prompt": "Squarespace's mission is 'a future where everyone can be an entrepreneur.' Design a feature that helps a non-technical creator (e.g. a yoga instructor) go from zero to booking paid clients this week.", "approach": "Anchor on the persona and the entrepreneurial job-to-be-done: get discovered, get booked, get paid. Note Squarespace already has the pieces (site + Acuity Scheduling + Payments + Bio Sites) and lean into integration rather than net-new. Propose a Blueprint-AI-driven 'service business' flow that auto-scaffolds a bookable site + availability + payment in one guided path. Tie to 'Be the customer' (empathy for a non-technical solo operator) and 'Learn fast, act fast'. Define success (activated bookable sites, first paid booking within 7 days) and counter-metrics (setup abandonment, no-show/refund rate)."}, {"prompt": "Evaluate Blueprint AI (Squarespace's AI site builder). What's the biggest risk to the product and how would you measure whether it's actually helping users?", "approach": "Frame the value prop (collapse the 'blank canvas' problem for non-designers) against the core tension with 'Design is not a luxury' \u2014 AI-generated sites risk feeling generic/samey and diluting Squarespace's design-quality brand. Risks: low-quality output erodes trust; users generate but don't publish; over-automation removes the sense of ownership/creativity ('Protect creativity'). Measure: generation -> publish conversion, edits-after-generation (signal of usefulness vs. re-do), retention/site longevity, and a quality/taste guardrail (design-quality score, support tickets). Recommend keeping the human in the loop at each step (which the product already does)."}, {"prompt": "Squarespace and Wix/Shopify overlap heavily. If you were PM, what one bet would you make to differentiate Squarespace, and how would you validate it?", "approach": "Differentiate on Squarespace's defensible moat \u2014 design/taste and the all-in-one creator-entrepreneur stack (site + scheduling + payments + email + bio sites) \u2014 rather than competing on Shopify's commerce depth or Wix's flexibility. Propose a concrete bet (e.g. own the 'service-based solo entrepreneur' segment where Acuity + Payments + design quality beat competitors). Validate with a lean experiment: target segment landing/onboarding, measure activation and retention vs. control, run user interviews for the qualitative 'why.' Explicitly acknowledge the tradeoff (focus vs. broad SMB TAM)."}], "behavioralMapping": [{"value": "Be the customer (customer empathy / user research)", "nealStory": "Founding Biryani Blitz after 180 customer interviews, and scaling Elephant Productivity from 17 to 563 users via 200+ user interviews \u2014 Neal repeatedly turns direct customer conversations into shipped product decisions (500+ interviews across ventures).", "factIds": ["bb-1", "ep-1", "positioning"]}, {"value": "Build the ideal / ship 0->1 (bold ideas, iterative refinement)", "nealStory": "Led the 0->1 launch of an internal Gerrit-based software-test product at SailLoft (Gerrit voting + Bazel), and built the 0->1 Biryani Blitz vending platform at UC Berkeley \u2014 proof of taking an idea from nothing to a working, adopted product.", "factIds": ["sl-1", "bb-1", "bb-2"]}, {"value": "Learn fast, act fast (execution & speed)", "nealStory": "Shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities that cut weekly outreach time dramatically, and translated dev-workflow pain into a GitHub testing interface that accelerated PR-to-merge cycles ~25% \u2014 fast iteration on real bottlenecks.", "factIds": ["bb-3", "sl-2"]}, {"value": "Execution with metrics AND counter-metrics (the documented Superday probe)", "nealStory": "Elephant's ML flashcard engine lifted exam scores 16% while cutting review time 38% (two paired metrics), and the FieldPulse PRD defined 15+ KPIs with First-Time Fix Rate as the North Star \u2014 Neal can speak to primary success metrics and guardrails/counter-metrics.", "factIds": ["ep-1", "fp-1"]}, {"value": "Design is not a luxury / built a privacy-first, well-crafted system", "nealStory": "Built a privacy-first computer-vision telemetry system (OpenCV) that gave a physical vending machine e-commerce-grade conversion analytics \u2014 a case of thoughtful design/craft applied to an unglamorous problem, plus the QR loyalty app that lifted repeat purchases 40%.", "factIds": ["bb-2", "bb-3"]}, {"value": "Protect creativity / disagreement & collaboration (documented behavioral prompt)", "nealStory": "For the 'time you disagreed with a designer/eng manager' prompt, use the SailLoft tradeoff decision (choosing auto-voting on Gerrit vs. a separate dashboard) and cross-functional work translating developer pain points into product \u2014 shows resolving disagreement with judgment.", "factIds": ["sl-1", "sl-2"]}, {"value": "Empower individuals / leadership", "nealStory": "Director of Professional Development for the UNC Product Management Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leading and enabling others; use for 'tell me about a time you led without formal authority.'", "factIds": ["ld-1", "ld-2"]}], "analyticalFocus": ["Conversion-funnel diagnosis (documented prompt: 'conversion dropped 5% overnight \u2014 how do you diagnose?') \u2014 segment by cohort, platform, geo, funnel step; isolate instrumentation vs. real regression", "North Star + counter-metric design for a subscription/SaaS creator product (activation, time-to-first-published-site, time-to-first-sale)", "SaaS/subscription economics: free-trial-to-paid conversion, plan-tier upgrade/downgrade, churn/retention, ARPU across Basic/Core/Plus/Advanced", "Ecommerce/commerce metrics: GMV, take rate / transaction-fee economics, refund & chargeback rates", "Onboarding & activation funnel metrics (sign-up -> template/Blueprint AI -> publish -> transact) and drop-off analysis", "AI feature efficacy: generation -> publish conversion, post-generation edit rate, quality/taste guardrails", "Estimation/sizing: market sizing for a Squarespace feature or the creator/SMB TAM"], "gotchas": ["DESIGN IS THE DIFFERENTIATOR: Squarespace competes on taste/craft, not feature count. In product-sense answers, weigh design quality and simplicity, not just 'add more features' \u2014 'Design is not a luxury' and 'Simplify' are literal values they screen for.", "Be your own customer: they built Squarespace ON Squarespace. Show you'd actually use/dogfood the product; ground answers in the real creator/SMB/solo-entrepreneur persona, not abstract users.", "The counter-metric question is documented and near-guaranteed ('what counter-metrics did you track?'). Prepare paired metrics \u2014 Neal's Elephant 16% score lift + 38% time cut, and FieldPulse's 15+ KPIs with a North Star, are ideal.", "Know the current product suite precisely: Fluid Engine, Blueprint AI, Acuity Scheduling, Squarespace Payments, Bio Sites, Unfold, Domains, Email Campaigns. Do NOT mention Tock as a Squarespace product \u2014 Squarespace SOLD Tock to American Express in June 2024.", "Take-home / case presentation is part of the loop \u2014 practice presenting a crisp product case to a mixed panel (PMs, designers, engineers), not just answering verbally.", "Neal's experiences are AI/technical-founder heavy; Squarespace is a design-first consumer/SMB creator platform. Reframe the 500+ interviews and 0->1 shipping around the entrepreneur/creator persona and design empathy, not just AI/dev-tools.", "Neal's work authorization is UNCONFIRMED in the ledger \u2014 confirm before applying; internship postings may have knockout eligibility fields.", "Avoid over-precise or unbaselined metrics live: per ledger presentation notes, round 41.7% to ~42% (projected) and give a before->after for the 97% outreach-time cut."], "sources": ["https://www.squarespace.com/about/company/ (official values & mission)", "https://www.comparably.com/companies/squarespace/mission", "https://dataford.io/interview-guides/squarespace/product-manager (PM interview rounds & example questions)", "https://www.glassdoor.com/Interview/Squarespace-Product-Manager-Interview-Questions-EI_IE466343.0,11_KO12,27.htm", "https://www.interviewquery.com/interview-guides/squarespace-product-manager", "https://www.squarespace.com/careers/early-career (intern/early-career process)", "https://www.teamblind.com/company/Squarespace/posts/squarespace-interview", "https://www.toolworthy.ai/tool/squarespace (Blueprint AI on every plan)", "https://www.sitebuilderreport.com/what-is-squarespace (Fluid Engine, product overview 2026)", "https://en.wikipedia.org/wiki/Squarespace (product suite; Tock sold to Amex June 2024)", "https://support.squarespace.com/hc/en-us/articles/5237452094989-Everything-you-can-do-with-Squarespace (Acuity, Bio Sites, Unfold, Domains, Email Campaigns)", "https://www.squarespace.com/scheduling (Acuity Scheduling)", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json (Neal's verified experiences)"]}, {"company": "Wix", "products": ["Wix Harmony \u2014 flagship AI website builder launched Jan 21, 2026; hybrid of agentic/generative-design AI ('vibe coding') plus manual drag-and-drop editing; replaces the retired Wix ADI", "Wix Editor \u2014 the classic drag-and-drop website builder (with AI assistance folded in) for mainstream users and existing projects", "Wix Studio \u2014 pro/agency-oriented builder launched Oct 2023, with responsive CSS-grade control and AI capabilities for designers/developers", "AI Site Generator \u2014 conversational flow that generates a starting site from a short chat, then hands off to the Editor to refine", "Wix eCommerce / Stores \u2014 online store, payments (Wix Payments), plus vertical business apps: Wix Bookings, Wix Restaurants/Restaurant ordering, Wix Hotels", "Velo by Wix \u2014 full-stack open dev platform for adding custom JavaScript, DBs, and APIs on top of Wix sites", "App Market \u2014 third-party app marketplace (80/20 developer/Wix revenue split)", "Legacy/retired: Wix ADI (Artificial Design Intelligence) \u2014 no longer supported for new sites; features folded into Harmony/Editor"], "valuesAndBar": ["Work for the users' success \u2014 user obsession is the #1 stated value; every product decision should trace to a user pain/need", "Build the best products in the world \u2014 product-excellence and craft bar", "Ownership \u2014 'each person owns what they do'; in interviews be explicit about YOUR part in collective work, what you owned end-to-end and how you made it happen", "Transparency and directness \u2014 honest, direct feedback and communication", "Allow failures \u2014 'do, test, try, and fail'; bias to action and experimentation over analysis paralysis", "Measure everything \u2014 data-driven; quantify impact and define KPIs for everything", "Care about people / no assholes \u2014 collaboration, humility, kindness", "Have fun / passion \u2014 hire people who genuinely care about their craft and the product", "For the SPM (Student PM) program specifically: they want people who 'don't just USE AI \u2014 you BUILD with it'; curiosity, adaptability, and a tangible thing you created with AI"], "interviewFormat": ["General PM track (~4 stages): (1) recruiter/HR phone screen; (2) take-home home assignment; (3) on-site/interview walking through the assignment \u2014 defend decisions, articulate users/pains/needs and how you prioritized features; (4) HR interview for values/culture fit", "Home assignment is the signature step \u2014 examples reported: design a website as a wireframe (given ~2 weeks); pick 6 websites (3 you love, 3 you like) and build a site that tells your story; wireframe-only deliverables with NO supporting docs so your product thinking has to speak for itself", "Product-sense screens: pick a favorite app, name its KPIs and how you'd improve it; how would you monetize more of an e-commerce site; pick an app and a feature you'd change and walk your reasoning/workflow", "There is a Project-Management / capabilities test in some loops", "Student Product Manager (SPM '26) program (the intern-equivalent path): Round 1 application; Round 2 hands-on challenge; Round 3 60-90 min 'get to know you' interview discussing your challenge; Round 4 HR/culture-fit interview. Structure = Aug-Dec bootcamp (product research, strategy, UX, data, AI tooling) then Jan-Jul rotations on real product teams; paid from day one", "Values-driven hiring: expect explicit probing on Ownership (your part in team work) and 'building with AI' throughout"], "productSensePrompts": [{"prompt": "Wix Harmony lets a non-technical user describe their business in a chat and get a full site via generative AI. Design (or improve) the first-run onboarding flow for a first-time small-business owner. What's the North Star metric?", "approach": "Clarify user (non-technical SMB owner, low patience, high anxiety about 'looking professional') and the job-to-be-done (a live, credible site fast). Map the funnel: prompt/describe -> AI generates -> edit/refine -> publish -> get first visitor/sale. Design for the classic AI-gen risk: the 'blank-response' and 'this-isn't-quite-right' moments \u2014 add guided nudges, easy regeneration, and manual-edit escape hatches (Wix's own hybrid thesis). North Star = time-to-first-published-site or 7-day activation (published + connected domain/first content edit), with guardrails on edit-abandonment. Tie to Wix value 'work for users' success' and 'measure everything.'"}, {"prompt": "How would you increase monetization / revenue per user on Wix eCommerce sites (the store owners, not Wix's own upsell)?", "approach": "Segment merchants by GMV stage (pre-first-sale, growing, established) \u2014 different levers per stage. For early merchants, focus on conversion of THEIR shoppers (checkout friction, trust badges, abandoned-cart recovery); for established, upsell tools (subscriptions, upsell/cross-sell blocks, marketing/email, Wix Payments adoption). Prioritize with a reach x impact x confidence x effort (RICE) lens; propose an A/B test for the top bet. Note the two-sided incentive: helping the merchant earn more increases their willingness to stay on higher Wix tiers \u2014 align the merchant's success metric (their revenue) with Wix's (retention/ARPU)."}, {"prompt": "Wix retired ADI and replaced it with Harmony's agentic builder. If you were PM, how would you decide whether the AI-first flow is actually better than the classic drag-and-drop Editor, and for whom?", "approach": "Frame as a segmentation + metrics question, not a religious one. Define success by segment: novices (speed, completion, confidence) vs. pros/agencies (control, fidelity \u2014 where Studio/Editor may still win). Instrument the funnel: generation acceptance rate, edits-after-generation, publish rate, 30-day retention, and downgrade-to-manual rate. Run a holdout/A-B or cohort comparison. Recommend a hybrid default (AI to start, manual to finish) \u2014 which is exactly Wix's stated Harmony thesis \u2014 and let data route power users to Studio. Shows 'allow failures / measure everything.'"}, {"prompt": "Pick your favorite app and tell us the KPIs you'd use to measure its success and one feature you'd improve. (Wix's actual reported screening question \u2014 be ready with a specific app.)", "approach": "Pick one app, state its core value prop and primary user in one line. Define a metric hierarchy: North Star (captures core value delivered), then input/driver metrics, then guardrail/counter-metrics. Choose ONE improvement, justify with a user pain, size the opportunity, define the success metric and how you'd A/B test it, and name the tradeoff/risk. Keep it structured and crisp \u2014 Wix rewards clear ownership of reasoning."}], "behavioralMapping": [{"value": "Work for the users' success (user obsession)", "nealStory": "Founded Biryani Blitz off 180 customer interviews, and at Elephant scaled 17->563 users via 200+ interviews \u2014 decisions traced directly to observed user pains, not assumptions. Lead with the interview-driven insight -> feature -> measurable outcome chain.", "factIds": ["bb-1", "ep-1"]}, {"value": "Ownership (owned it end-to-end, made it happen)", "nealStory": "At SailLoft led the 0->1 launch of an internal Gerrit+Bazel software-test product end-to-end, cutting manual tests 40% \u2014 be explicit about what I personally owned from spec to ship and the tradeoff I chose (auto-voting on Gerrit vs. a separate dashboard).", "factIds": ["sl-1", "sl-role"]}, {"value": "Build with AI (SPM's core bar \u2014 you BUILD with AI, don't just use it)", "nealStory": "Shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities cutting outreach time dramatically, built a privacy-first OpenCV CV telemetry funnel for the vending machine, and authored the FieldPulse RAG predictive-restocking PRD \u2014 concrete AI things I built, not just used.", "factIds": ["bb-3", "bb-2", "fp-1"]}, {"value": "Measure everything / data-driven", "nealStory": "Built e-commerce-grade conversion analytics on a physical machine via the impression->approach->purchase CV funnel; defined 15+ KPIs (First-Time Fix Rate as North Star) in the FieldPulse PRD; quantified exam-score +16% and review-time -38% at Elephant.", "factIds": ["bb-2", "fp-1", "ep-1"]}, {"value": "Allow failures / bias to action (do, test, try, fail)", "nealStory": "0->1 founder shipping fast under uncertainty: launched a physical hot-food vending platform at UC Berkeley (fresh biryani in 60s) and iterated a QR loyalty app that lifted repeat purchases 40% \u2014 talk about a bet that missed and what the experiment taught me.", "factIds": ["bb-1", "bb-3"]}, {"value": "Transparency/directness & care about people (leadership, no assholes)", "nealStory": "Director of Professional Development for the UNC PM Club and President of UNC Ultimate Frisbee (BatCH) \u2014 leading peers, giving direct feedback, and building team culture (add roster/team size and a concrete outcome to avoid title-only).", "factIds": ["ld-1", "ld-2"]}, {"value": "Build the best products in the world (product excellence / craft)", "nealStory": "Elephant ML flashcard engine that lifted exam scores 16% and cut review time 38%, plus a rigorous FieldPulse PRD with a 3-flow UX and AI explainability \u2014 evidence of caring about craft and measurable quality, not just shipping.", "factIds": ["ep-1", "fp-1"]}], "analyticalFocus": ["North Star metric selection and metric hierarchies (input/driver vs. guardrail/counter-metrics) \u2014 Wix's 'measure everything' value plus the 'pick an app, name its KPIs' screener", "Activation and time-to-value funnels for site creation (describe -> generate -> edit -> publish -> first visitor/sale)", "Conversion-funnel analysis (Neal's OpenCV impression->approach->purchase funnel is a direct analog to web funnels)", "Monetization / ARPU / retention math for a freemium SaaS with a two-sided incentive (merchant success drives Wix retention)", "Feature prioritization frameworks (RICE / reach-impact-confidence-effort) with a defensible ranking", "A/B testing and holdout/cohort design to compare AI-first vs. manual flows", "Sizing an opportunity / estimation (be ready for a market-size or 'how many' back-of-envelope)"], "gotchas": ["The home assignment is THE differentiator \u2014 often wireframe-only with NO supporting docs, so your product thinking must show through the design itself; and you'll have to verbally defend every decision (users, their pains, prioritization). Prepare to justify tradeoffs, not just describe.", "For the intern/student path, the real program is the Wix SPM ('Student Product Manager') \u2014 note it is Israel/Wix-Campus-based (bootcamp in-person 5 days/week, then 3 days/week during school year, ~22 hrs) and requires 3rd/4th-year status. Confirm location and work authorization fit before over-investing (ledger flags Neal's workAuth as UNCONFIRMED). Application window has historically been extremely short (opened ~April 19 for 24 hours only).", "SPM explicitly wants people who BUILD with AI, not just prompt it \u2014 Neal's AI-agent, OpenCV, and RAG-PRD work is the exact proof point; lead with it, not with 'I use ChatGPT.'", "Ownership is probed literally: don't say 'we' about team work without stating YOUR specific piece and how you ensured it happened. Rehearse the SailLoft and Elephant stories in first-person-owned terms.", "Know Wix's CURRENT lineup \u2014 Wix ADI is RETIRED (don't pitch it as live); the flagship is Wix Harmony (agentic/hybrid) as of Jan 2026. Referencing the hybrid AI+manual thesis shows you did homework.", "Fix the ledger's flagged presentation risks before behavioral answers: round 41.7% -> ~42% and keep 'projected'; give a before->after for the '97% outreach cut' rather than the bare percentage; quantify leadership roles (roster/team size) so they aren't title-only.", "'Have fun / passion' is a real screen \u2014 Wix filters for genuine enthusiasm and 'no assholes'; be personable and specific about why THIS product excites you, not generic."], "sources": ["https://www.wixspm.com/", "https://careers.wix.com/wix-way", "https://careers.wix.com/post/interviewing-at-wix-know-what-we-value-in-people", "https://careers.wix.com/how-we-hire", "https://www.wix.engineering/post/ownership-and-freedom-reflecting-our-core-values-in-the-hiring-process", "https://www.glassdoor.com/Interview/Wix-Product-Manager-Interview-Questions-EI_IE391615.0,3_KO4,19.htm", "https://dataford.io/interview-guides/wix/product-manager", "https://prepfully.com/interview-questions/wix.com", "https://nextsprints.com/wix-interview-questions", "https://www.ziprecruiter.com/career/job-interview-question-answers/wix-product-manager", "https://en.wikipedia.org/wiki/Wix.com", "https://www.wix.com/blog/wix-ai-tools", "https://www.wix.com/studio/blog/wix-studio-ai-capabilities", "https://support.wix.com/en/article/adi-sites-no-longer-supported", "https://portersfiveforce.com/blogs/mission/wix", "https://www.comparably.com/companies/wix-com/mission", "/Users/nealt1/Downloads/veer-pm-system-master/applications/_master/fact-ledger.json"]}, {"company": "GoDaddy", "products": ["Airo (agentic AI assistant / Airo.ai) \u2014 conversational AI that registers domains, builds & publishes a Website Builder site, generates logos, drafts policy templates, and orchestrates specialized sub-agents (customer comms, marketing calendar, appointment scheduling, domain activation/protection); Airo Plus is the paid tier (~$59.88/yr intro)", "Airo for WordPress \u2014 May 2026 launch; AI creates/edits a full WordPress site inside the native dashboard, auto-installs plugins, generates a WooCommerce storefront from one conversation; access to 60,000+ plugins, no platform lock-in", "Domains \u2014 flagship registrar business (~84M domains under management); .com from ~$4.99 first year, aftermarket/domain investing", "Websites + Marketing \u2014 DIY website builder (~$10\u201321/mo) with SEO, social posting, email marketing, online appointments, and ecommerce/marketplace selling", "Managed WordPress Hosting (plus shared, VPS, dedicated hosting)", "GoDaddy Payments / Commerce \u2014 payment acceptance, physical & digital products, inventory, shipping, discount codes, multi-channel selling", "Microsoft 365 email / Professional Email", "Security add-ons \u2014 SSL, DDoS protection, CDN, malware scanning, WAF", "GoDaddy Guides \u2014 24/7 human customer support (a brand differentiator)"], "valuesAndBar": ["Mission: empower entrepreneurs everywhere \u2014 give ~20M+ SMB/solopreneur customers the tools and help to start, grow, and run their businesses online", "Core value: Own Outcomes \u2014 every team owns the CUSTOMER's success end-to-end, not just their piece; strong accountability bar", "Core value: Build Value \u2014 create enduring value; leadership optimizes for long-term free cash flow, so PM impact framed in durable customer + business value", "Core value: Join Forces \u2014 cross-team collaboration; PMs partner with eng, design, support, marketing", "Core value: Work Courageously \u2014 take smart risks, speak up, challenge", "Core value: Live Passionately \u2014 energy, empathy, customer obsession (embodied in 24/7 'real people' Guides support)", "PM competency emphasis: customer-obsession for NON-technical SMB users ('owners want outcomes, not a tech stack'); data-driven decision-making; ability to reason about GoDaddy's own product surface in the final round", "Emerging-talent / intern bar: experience-focused, discuss real shipped work, career aspirations, culture-add"], "interviewFormat": ["Recruiter phone screen \u2014 interest, background, PM experience, logistics (light 'small talk')", "Technical / PM-craft round \u2014 video call with a technical specialist or Senior PM; PM theory, methodology, and a walk-through of products you've delivered (metrics, tradeoffs)", "Behavioral round \u2014 with a Principal PM or senior product leader; past experiences, problem-solving, teamwork, leadership; described as relaxed/experience-focused", "Possible final round \u2014 a presentation or case study: present a product idea or an improvement to a CURRENT GoDaddy offering (product-sense + strategic thinking)", "Intern/emerging-talent variant: 2\u20133 interviews with hiring manager + direct reports; more experience & aspiration focused than a heavy case gauntlet"], "productSensePrompts": [{"prompt": "Improve GoDaddy Airo for a first-time small-business owner who has never built a website. Where would you focus?", "approach": "Anchor on the mission ('owners want outcomes, not a tech stack'). Segment: the non-technical solopreneur vs. the semi-technical side-hustler. Pick the non-technical persona. Map the journey (idea -> domain -> site -> logo -> get first customer) and find the highest-drop-off step (likely 'blank page' / not knowing what to say to the AI). Propose a guided conversational intake + templated business types that pre-fill the plan, plus an explicit 'approve before publish/buy' trust checkpoint (Airo already asks approval for domain reg/publish). Prioritize by reach x impact x confidence; North Star = % of new users who publish a live site AND acquire their first customer within 7 days. Tie back to Own Outcomes: measure the customer's business outcome, not just site creation."}, {"prompt": "Design a feature that helps GoDaddy customers get their FIRST paying customer after they launch a website.", "approach": "Reframe: GoDaddy wins when the SMB wins (Own Outcomes / Build Value). Users' real job-to-be-done is revenue, not a website. Ideate across Airo's agent surface: auto-generated Google Business Profile + local SEO, one-click social/marketing-calendar posts, an appointment/booking widget, GoDaddy Payments quick-checkout link. Prioritize the lowest-effort-to-first-dollar path (e.g., a shareable payment link + booking page) for service businesses. Metrics: time-to-first-transaction, % of sites that process a payment within 30 days, retention lift of 'earned-first-dollar' cohort. Call out the risk of over-promising and eroding trust if leads don't convert."}, {"prompt": "How would you decide whether GoDaddy should double down on Airo for WordPress vs. its own Websites + Marketing builder?", "approach": "Frame as portfolio strategy, not either/or. Segment by customer sophistication: W+M for non-technical simplicity-seekers; Airo for WordPress for pros/agencies who need extensibility (60k+ plugins, no lock-in) but want AI speed. Note the strategic hedge: WordPress removes lock-in objections and captures the agency/pro segment GoDaddy would otherwise lose. Decision criteria = incremental TAM, cannibalization vs. net-new, LTV/retention per segment, and margin (managed hosting attach). Recommend serving BOTH with clear positioning, and a metric to watch: net-new WordPress customers who would NOT have chosen W+M."}, {"prompt": "Pick a metric to measure the success of GoDaddy Airo, and defend it.", "approach": "Distinguish company North Star from feature metric. Reject vanity metrics (sites created) because Own Outcomes means customer success, not activity. Propose a North Star like 'activated businesses that reach first revenue/first customer' with input metrics: conversation-to-published-site rate, agent-task completion & approval rate, plugin/commerce attach, and 90-day retention. Guardrail metrics: support-contact rate and trust/approval-abandonment (customers bailing when Airo asks to buy a domain). Show you'd instrument the impression->approach->purchase-style funnel to find drop-off \u2014 directly reusing Neal's CV telemetry experience."}], "behavioralMapping": [{"value": "Own Outcomes", "nealStory": "Biryani Blitz: founded the venture after 180 customer interviews and owned the full 0->1 outcome \u2014 from user research to a deployed hot-food vending platform at UC Berkeley with projected unit economics (~$145K ARR/machine, ~42% net margin). Owned the customer's success end-to-end, not one slice.", "factIds": ["bb-role", "bb-1"]}, {"value": "Own Outcomes", "nealStory": "Elephant Productivity Suite: took accountability for the user-growth outcome, scaling 17->563 active users (33x) in one quarter via 200+ interviews and shipping an ML flashcard engine that lifted exam scores 16% and cut review time 38% \u2014 owned a measurable customer result, not just a feature.", "factIds": ["ep-role", "ep-1"]}, {"value": "Build Value (durable customer + business value)", "nealStory": "Biryani Blitz CV telemetry: built a privacy-first OpenCV system tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics \u2014 enduring instrumentation that compounds decision quality over time. Maps directly to GoDaddy's data-driven, long-term-value framing.", "factIds": ["bb-2"]}, {"value": "Build Value", "nealStory": "SailLoft: led 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel) that cut manual tests 40% with real-time status visibility \u2014 durable internal leverage, not a one-off.", "factIds": ["sl-role", "sl-1"]}, {"value": "Join Forces (cross-team collaboration)", "nealStory": "SailLoft: translated developer-workflow pain points into a GitHub testing interface that accelerated PR-to-merge cycles ~25%, and built a Chrome extension condensing client testing to a 2-click workflow \u2014 worked across developers and clients to ship, not in isolation.", "factIds": ["sl-2"]}, {"value": "Work Courageously (smart risks, 0->1 ambiguity)", "nealStory": "Biryani Blitz: took a real founder risk building a novel hardware+software category, earned Wharton + UNC Innovation Labs backing ($5K) and became a $200K Wharton Startup Challenge finalist \u2014 bet on an ambiguous, unproven idea and pushed it forward.", "factIds": ["bb-4"]}, {"value": "Work Courageously / bias to ship with AI", "nealStory": "Biryani Blitz: shipped an AI lead-gen agent (Node, Playwright, Gemini) across 100+ universities that cut weekly outreach time dramatically, plus a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 moved fast and shipped autonomous AI, GoDaddy's Airo-style agentic direction.", "factIds": ["bb-3"]}, {"value": "Live Passionately (customer obsession / empathy)", "nealStory": "Across ventures Neal ran 500+ customer interviews (180 at Biryani Blitz, 200+ at Elephant, plus SailLoft user research) \u2014 deep empathy for non-technical/end users, mirroring GoDaddy's obsession with SMB owners who 'want outcomes, not a tech stack.'", "factIds": ["bb-1", "ep-1", "ld-1"]}, {"value": "AI/agentic product depth (Airo relevance)", "nealStory": "FieldPulse PRD: authored a PRD for an AI predictive-restocking feature (RAG over usage logs, schedules, seasonality) with a 3-flow UX including AI explainability and 15+ KPIs (First-Time Fix Rate as North Star) \u2014 shows Neal can spec agentic/RAG features and define metrics, directly relevant to Airo.", "factIds": ["fp-1"]}], "analyticalFocus": ["Funnel conversion analytics (impression -> approach -> purchase) and where users drop off \u2014 Neal has direct hands-on experience via the Biryani Blitz OpenCV telemetry", "Activation & time-to-value metrics: conversation-to-published-site rate, time-to-first-customer / time-to-first-transaction for SMB users", "Retention & LTV by customer segment (non-technical DIY vs. agency/pro WordPress); attach rate of hosting, payments, email", "North Star vs. input/guardrail metric selection \u2014 expect 'pick a metric for Airo and defend it', rejecting vanity metrics in favor of customer-outcome metrics", "Estimation/sizing: TAM for SMB website/commerce, cannibalization vs. net-new when launching adjacent products (Airo for WP vs. Websites + Marketing)", "Pricing/monetization reasoning: intro vs. renewal pricing dynamics (domains, Airo Plus), upsell paths", "A/B testing and experiment design to validate feature bets (in Neal's skills: experimentation/A-B testing, Google Analytics, SQL, Tableau)"], "gotchas": ["GoDaddy does NOT run a formal Google-style APM program \u2014 treat 'APM' as a general PM/intern track; the process is lighter and more experience-focused, not a heavy case gauntlet. Do not over-index on rehearsed Google-APM frameworks.", "The technical/PM round is a real product WALK-THROUGH: be ready to narrate a shipped product with concrete metrics AND the tradeoff you chose. Use SailLoft (the auto-voting-on-Gerrit vs. separate-dashboard tradeoff) or Elephant.", "Customer is the NON-TECHNICAL small-business owner, not an engineer. Frame product-sense answers around 'outcomes, not a tech stack' \u2014 candidates who design for power users miss GoDaddy's core persona.", "Tie answers to 'Own Outcomes': GoDaddy measures the CUSTOMER's business success (did the SMB get a customer / make money), not just product activity. Reject vanity metrics explicitly.", "Know that Airo is agentic (asks approval before buying a domain / publishing) \u2014 trust and human-in-the-loop are product features, not afterthoughts. Mention trust/approval friction as a real metric.", "Ledger phrasing discipline: '41.7% net margin' should be softened to ~42% and labeled projected; '97% time cut' has no baseline \u2014 give a before->after or soften. '$145K ARR' must stay labeled 'projected'. Do not present projections as realized results.", "Neal must supply work authorization and GPA (list GPA only if >= 3.5); these are unconfirmed in the ledger and can be knockout fields.", "The final round may ask you to improve a CURRENT GoDaddy product \u2014 have a specific, researched improvement to Airo or Websites + Marketing ready, not a generic app."], "sources": ["https://www.interviewquery.com/interview-guides/godaddy-product-manager", "https://www.glassdoor.com/Interview/GoDaddy-Product-Manager-Interview-Questions-EI_IE35337.0,7_KO8,23.htm", "https://www.tryexponent.com/questions?company=godaddy&role=pm", "https://prepfully.com/interview-questions/godaddy/product-manager", "https://careers.godaddy/emergingtalent", "https://aboutus.godaddy.net/newsroom/news-releases/press-release-details/2026/GoDaddys-Airo-for-WordPress-Delivers-AI-that-Builds-Grows-and-Continuously-Improves-Websites/default.aspx", "https://www.prnewswire.com/news-releases/godaddys-airo-for-wordpress-delivers-ai-that-builds-grows-and-continuously-improves-websites-302767409.html", "https://aboutus.godaddy.net/newsroom/news-releases/press-release-details/2025/GoDaddy-Brings-Agentic-AI-to-Small-Businesses-with-Launch-of-Airo-ai/default.aspx", "https://www.godaddy.com/airo", "https://www.godaddy.com/resources/news/what-is-godaddy-airo", "https://www.useluminix.com/reports/company-overviews/godaddy-company-overview-domain-registrar-smb-platform-business-model-and-market-position-2026", "https://builtin.com/company/godaddy/faq/culture-values", "https://www.comparably.com/companies/godaddy/mission", "https://twitter.com/GoDaddy/status/567789760074240001", "https://checkthat.ai/brands/godaddy/pricing"]}, {"company": "JPMorgan Chase & Co.", "products": ["Chase Mobile app (ranked #1 in active users among digital banking apps; pay bills, Chase QuickDeposit check deposit, invest via self-directed trades or managed portfolios)", "Chase.com (the #1 most-visited banking portal in the U.S.)", "Zelle via Chase QuickPay (real-time P2P money movement embedded in Chase Mobile)", "Chase Online Bill Pay", "Chase-managed portfolios & self-directed investing (You Invest / J.P. Morgan Wealth Management in-app)", "Chase small-business digital products (cash-flow tools, digital lending/onboarding)", "J.P. Morgan Payments Developer Portal & APIs (embedded/B2B payments; an actual reported interview subject)", "Internal DevSecOps / developer platforms (surfaced in reported JPMC PM interview prompts)"], "valuesAndBar": ["JPMC's 'How We Do Business' rests on 4 tenets: (1) Exceptional Client Service, (2) Operational Excellence, (3) Commitment to Integrity/Fairness/Responsibility, (4) A Great Team & Winning Culture", "Five core competencies interviewers score against ALL candidates: Client Focus, Teamwork, Integrity, Leadership, and Drive for Results", "Data-driven rigor: they explicitly reward quantified impact ('reduced X by 50%', 'latency 4s -> 600ms'); vague claims are penalized \u2014 plays directly to Neal's metric-heavy ledger", "Risk discipline / 'fortress balance sheet' mindset \u2014 expect them to probe how you weigh downside, compliance, and trust (regulated financial product, not a growth-at-all-costs consumer app)", "Long-term thinking and ownership mentality over short-term wins", "Integrity is described as 'paramount' with 'zero tolerance for unethical behavior' \u2014 expect at least one ethics/judgment behavioral prompt"], "interviewFormat": ["Product/Project/Client Ops track sits inside the 'Emerging Talent Summer Experience' internship program (this is the intern umbrella, not a standalone APM title). Roles are broad \u2014 product + project + client operations blended.", "Stage 1 \u2014 Online application (resume + location preference). U.S. work authorization is a hard knockout: program offers NO immigration sponsorship. Neal must confirm his work-auth status (ledger flags this as UNCONFIRMED).", "Stage 1b \u2014 Pymetrics-style neuroscience/behavioral games and/or an online assessment shortly after applying (rolling basis \u2014 apply early).", "Stage 2 \u2014 HireVue recorded video interview: ~30 sec to read each prompt, 2-3 min to record; no live human. Predictable topics: teamwork, leadership, a challenge, 'why JPMorgan'. Use STAR + quantified outcomes.", "Stage 3 \u2014 First-round interview (usually virtual), 2-4 weeks later.", "Stage 4 \u2014 Final round / 'Superday': 3-5 back-to-back 30-60 min interviews mixing competency, motivational, product-sense/case, and light technical/analytical content.", "Reported PM case format: analyze a JPMC-relevant scenario (e.g. prioritize features for a new banking app; design a feature for the Payments Developer Portal; set OKRs for a DevSecOps platform) \u2014 sometimes a classic abstract design prompt like 'design a fridge for blind people'.", "Process is rolling and averages ~2 weeks to hire once moving; whole funnel spans a few months."], "productSensePrompts": [{"prompt": "How would you prioritize the roadmap for the Chase Mobile app's next quarter? (a reported JPMC prompt: 'prioritize features for a new banking app')", "approach": "Anchor to a North Star tied to JPMC's client-focus tenet (e.g. active users / primary-bank relationship depth, echoing Chase Mobile being #1 in active users). Segment users (mass-market checking, small business, self-directed investors, wealth). Frame trade-offs on a value-vs-effort grid but ADD a risk/compliance axis (this is regulated banking, not a growth app) \u2014 surface trust, fraud, and regulatory cost as first-class criteria. Prioritize a beachhead segment, name 2-3 candidate features, tie each to a measurable KPI, and state what you'd de-scope. Neal should reference his real prioritization judgment from the SailLoft Gerrit test product (sl-1) and Elephant's 15+ KPI / North-Star framing (fp-1)."}, {"prompt": "Design a feature to improve customer adoption of the J.P. Morgan Payments Developer Portal (a reported JPMC prompt).", "approach": "Clarify the user = external developers/fintechs integrating payments APIs, not consumers. Adoption North Star = time-to-first-successful-API-call and % of signups reaching production. Map the developer funnel (discover -> sign up -> sandbox -> first call -> go live) and find the drop-off. Propose a concrete feature (e.g. interactive sandbox with pre-filled test data, or a 2-click Postman/SDK quickstart). Neal has a direct, credible story here: at SailLoft he translated developer-workflow pain into a GitHub testing interface and a 2-click Chrome extension that cut client testing to 2 clicks (sl-2) \u2014 reference that developer-empathy work explicitly."}, {"prompt": "Define OKRs, strategy, and goals for a new internal DevSecOps / developer platform at JPMorgan (a reported JPMC prompt).", "approach": "Distinguish strategy (why: reduce release risk & dev friction across thousands of engineers) from Objectives (qualitative) and Key Results (measurable). Example O: 'Make shipping to prod fast AND safe.' KRs: cut manual test effort X%, reduce PR-to-merge cycle time, raise automated security-scan coverage. Tie to JPMC's Operational Excellence tenet and risk discipline. Neal's strongest ledger match: SailLoft Gerrit-based test product cut manual tests 40% (sl-1) and the GitHub interface accelerated PR-to-merge ~25% (sl-2) \u2014 these are literally DevSecOps-adjacent outcomes he can cite."}, {"prompt": "Chase wants to grow primary-bank relationships among Gen-Z / students. What product would you build?", "approach": "Define 'primary bank' = where paycheck/direct-deposit lands and daily spend flows. Do lightweight user research first (Neal's superpower). Identify the Gen-Z job-to-be-done (frictionless money movement, budgeting, building credit safely). Propose one feature (e.g. goal-based savings + spend insights, or friend-to-friend Zelle experience), define adoption + retention + primary-relationship KPIs, and address the risk lens (fraud on P2P, responsible-lending for credit-building). Neal should lean on Elephant Productivity: he scaled a student app 17->563 (33x) in a quarter via 200+ interviews and shipped an ML engine with 16% score lift / 38% time cut (ep-1) \u2014 proof he can build for a student segment with real research and measurable results."}], "behavioralMapping": [{"value": "Client Focus (exceptional client service)", "nealStory": "Elephant Productivity: ran 200+ user interviews and scaled the student app 17->563 active users (33x) in one quarter \u2014 plus 180 customer interviews founding Biryani Blitz. Frame as 'I start every product with the customer's real pain, validated at scale, then ship to the metric.'", "factIds": ["ep-1", "bb-1"]}, {"value": "Drive for Results (data-driven, quantified impact)", "nealStory": "SailLoft: led the 0->1 Gerrit-based test product that cut manual tests 40% and built a GitHub interface accelerating PR-to-merge ~25%. Every claim is a before->after number \u2014 exactly the quantified-impact JPMC rewards in HireVue.", "factIds": ["sl-1", "sl-2"]}, {"value": "Leadership (built something end-to-end; led without authority)", "nealStory": "Biryani Blitz: founded and led a 0->1 hot-food vending platform deployed at UC Berkeley, backed by Wharton + UNC Innovation Labs ($5K) and a $200K Wharton Startup Challenge finalist. Answers 'tell me about something you built end-to-end' and 'a project you led/are most proud of.'", "factIds": ["bb-role", "bb-1", "bb-4"]}, {"value": "Teamwork / influence without authority (difficult stakeholder)", "nealStory": "SailLoft: as an intern, translated senior developers' workflow pain into a shipped GitHub testing interface + 2-click Chrome extension \u2014 had to align engineers around a workflow change with no formal authority. Also UNC PM Club Director of Professional Development and Ultimate Frisbee President for team-leadership color.", "factIds": ["sl-2", "ld-1", "ld-2"]}, {"value": "Integrity / judgment (do the right thing, risk discipline)", "nealStory": "Biryani Blitz: built a PRIVACY-FIRST computer-vision telemetry system (OpenCV) that tracks the conversion funnel without capturing identifiable data \u2014 a genuine 'chose the ethical/harder design' story that maps to JPMC's zero-tolerance integrity bar and risk mindset.", "factIds": ["bb-2"]}, {"value": "Adaptability / handling roadblocks (pivot on feedback)", "nealStory": "Biryani Blitz: shipped an AI lead-gen agent (Node/Playwright/Gemini) across 100+ universities cutting weekly outreach time dramatically, and a QR loyalty app (React/Firebase) that lifted repeat purchases 40% \u2014 iterating scrappily when the manual approach didn't scale. Answers 'how do you handle roadblocks / pivot on market feedback.'", "factIds": ["bb-3"]}], "analyticalFocus": ["Product KPI selection & North-Star definition \u2014 expect 'as a PM, what KPIs matter most to you?' Neal cites 15+ KPIs with First-Time Fix Rate as North Star (fp-1) and Elephant's 16% score lift / 38% time cut (ep-1)", "Adoption & conversion funnel metrics (impression->approach->purchase; developer signup->first-call->production) \u2014 Neal built a real CV-based conversion funnel at Biryani Blitz (bb-2)", "Backlog/engineering health & prioritization ('how do you determine backlog health', 'how do you prioritize') \u2014 Neal's Gerrit test-status visibility work (sl-1)", "Retention & repeat-usage (40% repeat-purchase lift, bb-3; 33x active-user growth, ep-1)", "Basic estimation/market-sizing for a banking product (be ready to size a user base or transaction volume)", "Light data reasoning \u2014 one reported technical prompt was 'how do you handle imbalanced data'; know the concept even for a PM role", "Financial-product framing: unit economics / margin thinking (Neal has projected ARR & net-margin modeling from Biryani Blitz, bb-1 \u2014 useful for a bank)"], "gotchas": ["WORK AUTHORIZATION IS A HARD KNOCKOUT: the Emerging Talent Summer program explicitly offers NO immigration sponsorship. Ledger flags Neal's work-auth as UNCONFIRMED (identity.workAuth) \u2014 he must confirm U.S. authorization before applying or it's an automatic reject.", "This is NOT a Google-style APM. The role is a blended 'Product/Project Management/Client Operations' intern inside a large regulated bank \u2014 expect ops/stakeholder/coordination work, not pure greenfield product. Position Neal as a builder who also executes and coordinates, not just an ideas person.", "Bring the RISK/COMPLIANCE lens to every product answer. In consumer banking, 'move fast' is wrong; they reward trust, fraud-awareness, and regulatory trade-offs. A growth-at-all-costs answer will read as naive.", "HireVue is recorded with no human and a tight 2-3 min window \u2014 Neal must pre-draft STAR answers with the metric said OUT LOUD. Quantified impact is described as 'non-negotiable.' His numbers are his edge; make sure they land verbally.", "Fix over-precise ledger numbers in PHRASING before interviews (per ledger presentationNotes): say '~42% projected net margin' not '41.7%', and give a before->after baseline for the '97% outreach-time cut' (bb-3) so it doesn't sound fabricated. JPMC scrutinizes numbers.", "'Why JPMorgan' is near-guaranteed and must be specific \u2014 reference a real product (Chase Mobile #1 in active users, the Payments Developer Portal, Zelle) and a real value (client focus / integrity), not generic 'big prestigious bank' filler.", "Have a crisp answer for 'what makes a good PM' and 'how do you influence without authority' \u2014 both are documented JPMC PM prompts; Neal's intern-with-no-authority SailLoft story (sl-2) is the ready-made example.", "GPA: ledger says list only if >=3.5. Competitive finance funnels filter on GPA \u2014 Neal should decide deliberately, not default to omitting/including."], "sources": ["https://www.jpmorganchase.com/about/business-principles", "https://www.jpmorganchase.com/content/dam/jpmc/jpmorgan-chase-and-co/documents/how-we-do-business.pdf", "https://www.jpmorganchase.com/careers/explore-opportunities/programs/et-experience", "https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/job/210730011", "https://www.tryexponent.com/questions?company=jp-morgan-chase&role=pm", "https://www.interviewquery.com/interview-guides/jp-morgan-chase-product-manager", "https://www.glassdoor.com/Interview/JPMorganChase-Product-Manager-Interview-Questions-EI_IE5224839.0,13_KO14,29.htm", "https://ophyai.com/blog/company-guides/jpmorgan-interview-guide", "https://igotanoffer.com/blogs/finance/jpm-hirevue-interview", "https://media.chase.com/news/chase-mobile-app-named-number1", "https://www.americanbanker.com/news/jpmorgan-chase-aims-to-build-zelle-like-network-for-b2b-payments"]}]};</script>
<script>(function () {
  var IQ = window.IQ || {};
  var FR = IQ.frameworks || [], SB = IQ.storyBank || [], CQ = IQ.commonQuestions || [], CO = IQ.companies || [];
  var app = document.getElementById("app");
  var esc = function (s) { return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (m) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]; }); };
  function ids(a) { return (a || []).map(function (x) { return '<span class="fid">' + esc(x) + "</span>"; }).join(""); }

  function tab(id, l) { return '<button data-tab="' + id + '">' + l + "</button>"; }
  function view(id, inner) { return '<section class="view" data-view="' + id + '">' + inner + "</section>"; }

  function frameworksHtml() {
    var cards = FR.map(function (f) {
      return '<div class="fc"><div class="fct"><span class="fn">' + esc(f.type) + '</span><span class="fw">' + esc(f.framework) + '</span></div>'
        + '<div class="fwhen">' + esc(f.when) + "</div>"
        + '<ol class="fsteps">' + f.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>"
        + '<div class="ftip"><b>Edge:</b> ' + esc(f.tips) + "</div></div>";
    }).join("");
    return '<div class="panel"><div class="phead"><h2>Frameworks</h2><span class="hint">the ~80% shared across every PM interview</span></div><div class="pad">' + cards + "</div></div>";
  }
  function storyHtml() {
    var cards = SB.map(function (s) {
      var gap = !s.factIds || !s.factIds.length;
