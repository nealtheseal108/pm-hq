 intern track.", "programStructure": "CONFIRMED: Databricks runs a real new-grad/rotational APM-equivalent program ('Associate Product Manager, New Grad' in the US, 'Product Manager, New Grad' in Amsterdam/Berlin) that recurs annually (both a 2026 and a live 2027 cohort req found) -- a standing program, not a one-off. Qualifications are nearly verbatim identical to the intern JD (CS/engineering major, SQL/Python, hands-on AI-tooling use), same team list, same 'own your project end-to-end' language. New-grad APMs get a dedicated mentor and are pooled into a named annual cohort explicitly connected with 'other interns' -- a real structural signal for conversion. Base salary: $133K-$150K (new-grad APM) vs. intern's ~$52/hr. A separate 'Associate Product Manager, Employee Experience' req is an internal-tools/IT role, NOT part of the new-grad cohort track -- don't conflate. Above APM, all PM titles (Sr./Staff) are pure experienced-hire with a confirmed 5+ years floor across multiple live postings; no visible mid-level 'regular PM' bridging APM and Senior PM was found in postings pulled.", "acceptedResumePatterns": ["New-grad APM req (confirmed, live 2027 posting): CS/related-engineering bachelor's or master's graduating in the named window, first-hand SQL and/or Python, hands-on AI-tooling use for personal + development projects, analytical/data-driven decision-making, communication that 'makes complex topics simple' for technical and non-technical stakeholders -- essentially the intern JD with 'currently pursuing' swapped for a graduation-date window.", "Experienced-hire Sr./Staff PM reqs (confirmed across 3 live postings): 5+ years PM experience is the standard floor, explicitly on 'platform or infrastructure products, ideally in ML/AI, data, or cloud services'; CS/EE or equivalent technical degree 'strongly preferred'; prior software-engineering experience explicitly flagged as 'a significant plus' -- engineer-to-PM is a named positive signal at senior level.", "Enterprise B2B PM fluency is an explicit Staff-level line item: 'proven enterprise B2B product management experience with highly technical customers, including shipped platform products and enterprise deal experience,' plus pricing/packaging/commercialization ownership -- meaningfully heavier GTM/commercial scope than intern or new-grad-APM JDs.", "A lower-confidence aggregator (dataford.io, not corroborated against a live posting) cites a mid-level '3+ years PM, preferably B2B SaaS/Cloud/Developer Tools' profile with SQL required and Spark/Python/PLG/MLOps as 'nice-to-have' -- lower than the 5+ years seen on every live posting actually pulled; treat as an older/lower band or approximation, not confirmed current.", "Real named Databricks PMs' LinkedIn accounts (moderate-high confidence) show a consistent through-line: prior hands-on technical/infra work at an adjacent data or cloud-platform company (a data-scientist-turned-founder; a HashiCorp/AWS Glue-Athena alum; one who took Databricks Marketplace 0-to-GA) -- not a pure generalist-PM background.", "Glassdoor-aggregated accounts describe a 'PRD assignment' and case-study presentation as standard for full-time (non-intern) candidates -- accepted candidates can point to real PRD-writing experience, not just analysis skills."], "differentiators": ["'First-principles' reasoning over intuition/competitor-mimicry, explicitly tied to a heavier, higher-stakes case study/PRD assignment at the full-time level than at the intern level.", "B2B SaaS/enterprise acumen framed as understanding BOTH the economic buyer (CIO/CTO) and the technical end user (data scientist/engineer) simultaneously -- a full-time-specific evaluation axis.", "The take-home case study/PRD assignment is confirmed as a standard, heavier full-time component: prompt days in advance, slide deck/PRD produced, presented to a panel with Q&A, evaluated on depth of analysis, GTM, and risk. One Glassdoor account: 'recruiter, hiring manager, then 4 interviews, and a PRD assignment.'", "Onsite loop is explicitly structured (per multiple guides) into 3-4 named rounds -- Product Sense, Technical Feasibility, Leadership, Behavioral -- more formalized than the intern-level screen.", "A Blind post characterizes the loop as Amazon-like 'dive deep': pick one project, go deep via behavioral questioning, not framework-driven case prompts -- distinct texture from the intern loop's case-interview-style prep.", "Recruiter screen explicitly screens for values alignment ('customer obsession,' 'data-first decision-making') before any technical assessment.", "At Staff/Senior level: ownership of pricing, packaging, commercialization strategy, and real enterprise deal experience -- a full-time-only bar not present in intern/new-grad material.", "Technical fluency called 'non-negotiable' -- not expected to write production code, but must sustain genuine architectural conversation with engineers (APIs, data pipelines, latency, distributed compute/Spark, Data Warehouse vs. Lakehouse) -- consistent with but pushed harder than the intern-level bar."], "firmSpecificRedFlags": ["Purely consumer-app product sense with no B2B/enterprise metrics fluency (e.g. no familiarity with NDR, time-to-value) -- a heavier full-time-specific version of the intern-level red flag.", "Inability to hold up under a technical 'dive deep' on system architecture, API design, latency/throughput trade-offs, or distributed systems -- named Technical Feasibility round failure mode.", "Treating the case-study/PRD take-home as a lightweight formality -- called 'often the biggest hurdle,' drives go/no-go decisions per multiple sources.", "Weak or missing go-to-market/risk analysis within the case study -- called out as separating strong from weak full-time candidates specifically.", "Below the 5+ years PM-experience bar with no compensating strong technical background for Sr./Staff roles -- these postings don't appear to flex the way some FAANG consumer-PM reqs do.", "Single-source, unverified Blind culture notes describe 'founders run the show,' increasing politics at scale, and 'almost zero autonomy' at some levels -- a culture-fit caveat, not a resume screen, but worth knowing."], "internToFTConversion": "No Databricks-PM-specific, sourced conversion rate or documented process was found despite extensive searching -- a genuine information gap, not an oversight. What's confirmed/inferable: (1) the intern JD and new-grad-APM JD share nearly verbatim qualifications and the identical team list, both promising a 'dedicated mentor' -- structurally the new-grad APM cohort looks like the natural landing spot for converted interns, though no document explicitly says so. (2) A non-PM-specific aggregator (AnalyzeMyOffer, sourced from DOL/H-1B filings, spans Eng/ML/Product together) cites a 'strong return-offer pipeline' and $159,505 average post-conversion Level-1 wage, roughly consistent with the $133K-150K APM range but not PM-specific or high-confidence. (3) A community claim of 65-80% return-offer rates and $200-220K+ new-grad comp could not be traced to a primary source -- unverified/thin. (4) General industry benchmarks (NACE 2025, not Databricks-specific): 2024 intern-class full-time offer rate industry-wide was 62% (5-year low), in-person averaging 72% vs. 56% hybrid/remote; Meta ~63.1%, Microsoft ~75-80% cited as peer data points. (5) General (non-Databricks) conversion tactics: the assigned mentor is typically the single most influential voice in a return-offer decision; a 30-60-90-day framework (learn month 1, ship a real deliverable month 2, make an explicit case month 3) is the commonly cited playbook; shipping ahead of schedule and engaging outside your immediate project both recur as conversion signals. Databricks' JD naming a 'dedicated mentor' at both intern and new-grad-APM level makes this general pattern directly applicable even without a Databricks-specific writeup.", "nealFitSignals": ["New-grad APM req's qualifications (CS/engineering major, SQL/Python, hands-on AI-tooling, communicating to mixed audiences) are nearly identical to the intern req he already matches well -- his CS+Business degree, Black Box/aistocktriage depth, and agentic-AI project usage would carry over directly to a future APM cohort.", "SailLoft (building for an internal engineering audience inside a real toolchain) is a close structural analog to Databricks' developer/engineer-empathy requirement, which persists from intern through experienced-hire level.", "FieldPulse's PRD-writing experience is a real, concrete asset given full-time loops confirmed include an actual PRD/case-study assignment evaluated on depth of analysis and GTM thinking -- exactly the deliverable type he'd be asked to produce.", "Because the new-grad APM cohort and PM intern cohort are explicitly pooled together in Databricks' own program language, a strong Summer 2027 internship there puts him structurally close to the mentor/cohort relationships that matter most for conversion, per the general pattern above.", "US citizenship and relocation flexibility clear the same location logistics already confirmed favorable for the intern track."], "nealGaps": ["IMPORTANT TIMING MISMATCH: Neal's graduation (May 2028) does not line up with any currently-live APM new-grad cohort window (2026 cohort: Fall2025/Spring2026 grads; 2027 cohort: Fall2026/Spring2027 grads). He is NOT a direct near-term applicant to the APM new-grad program as it exists today. His realistic path is (a) a strong Summer 2027 PM internship converting into a later (likely 2028) cohort -- not yet posted/confirmed to exist -- or (b) applying to whatever the equivalent new-grad program looks like closer to his actual graduation, with real uncertainty since program specifics could change by then.", "No confirmed enterprise B2B stakeholder experience (dealing with an economic buyer like a CIO/CTO) -- named as a Sr./Staff-level differentiator and increasingly relevant as he'd grow from APM into more senior scope; SailLoft is the closest analog but was internal/single-org, not multi-enterprise-customer scale.", "No visible preparation for the 'Amazon-style dive deep' behavioral format described on Blind for the full-time loop -- distinct from the case-interview-framework prep associated with the intern loop; nothing in his current materials suggests deliberate practice for sustained single-project deep-dive behavioral questioning.", "Unconfirmed whether the new-grad APM loop is identical to, lighter than, or heavier than the full experienced-hire PM loop (case study + PRD + 3-4 round onsite) -- don't assume the intern-level prep transfers; safer to prepare for the heavier PRD/case-study format documented for full-time hires generally.", "Given the confirmed 5+ years bar on every Sr./Staff posting pulled, any Databricks PM role beyond APM/new-grad is multi-year-out for Neal -- keep prep focused on the intern-to-APM track, not experienced-hire requirements he can't yet meet."], "youtubeSourcesFound": ["Interview with a Product Manager from Databricks | Alex Jiang | Ep. 11 -- https://www.youtube.com/watch?v=gNba7WRKdBQ (title/topic match only, not independently verified)", "What's the role of product manager at Databricks -- https://www.youtube.com/watch?v=NE5NUFfnXJs (title/topic match only, not independently verified)", "No dedicated FAANG/big-tech PM-interview career-coach channel doing a Databricks-specific breakdown or mock interview was found despite targeted searching -- a real scarcity finding, these two videos are the only Databricks-PM-specific YouTube content surfaced across all queries."], "sourceTypes": ["Official Databricks careers page -- verbatim JDs fetched directly for APM New Grad (2027 cohort), Sr. PM Free Edition, Staff PM AI Platform, Sr. PM Technical, plus Amsterdam/Berlin new-grad PM and the separate APM Employee Experience req", "Third-party job-board mirrors (Built In, LinkedIn Jobs, Greenhouse) for 2026 APM cohort details", "First-pers t the qualitative direction (fresher = better odds, ghost/stale postings are common) is real.", "action": "The scraper now stamps every role with a firstSeen timestamp; the Open Now tab flags anything first seen in the last 48h with a NEW badge. Work that badge first, every time, before touching older postings in the list.", "confidence": "medium", "bulletNote": "This is a BEHAVIORAL edge (an application habit), not resume content on its own \u2014 its resume payoff is already captured in the scraper bullet under the Coverage edge above ('flagging newly-posted roles within 48 hours' is this exact lever, stated as a shipped feature).", "draftBullets": [], "sources": ["https://clarifycapital.com/ghost-jobs-2026"]}, {"edge": "Guaranteed US work authorization (citizen, no sponsorship ever)", "why": "Real, but narrower than the obvious framing. A $100,000 supplemental H-1B fee (proclamation effective Sept 21 2025, upheld in court Dec 2025, running through Sept 2026) does NOT apply to change-of-status petitions filed by F-1/OPT students already in the US -- meaning most international CS/business students at target schools converting OPT-to-H-1B are largely insulated from this specific fee. What IS real: the 2026 wage-weighted H-1B lottery multiplies entries by wage level (a Level IV role gets 4x the entries of a Level I), which structurally disadvantages entry-level/intern-tier sponsorship regardless of the fee headlines -- so international candidates are a genuinely weaker bet for internship-to-FT conversion at the entry-level tier specifically. Also worth knowing: STEM OPT participation hit 165,524 students in 2024 (up 54% YoY), CS the single most popular F-1 major -- the competing international CS applicant pool is large and growing, not shrinking, so this edge is real but not as dominant as the headlines suggest.", "action": "Don't lean on a generic 'no sponsorship needed' line -- it's true but weakly differentiated since most direct UNC/CS peer competitors are also citizens. State it plainly on every application (still a hard knockout field to clear), but the more valuable use of citizenship is the defense-tech lane above, where it's not a soft preference but a hard gate.", "confidence": "medium", "bulletNote": "This is an APPLICATION-FORM field ('authorized to work? Y/N', 'require sponsorship? Y/N'), not resume bullet content \u2014 don't force it into a bullet. Just make sure it's answered correctly and prominently on every application.", "draftBullets": [], "sources": ["https://www.americanimmigrationcouncil.org/blog/trump-100000-fee-h-1b-visa/", "https://www.cdflaborlaw.com/blog/uscis-clarifies-the-100000-h-1b-visa-fee", "https://www.tryalma.com/learn/stem-opt-extension-statistics"]}, {"edge": "Non-target-school alumni respond more because they're asked less often", "why": "CHECKED AND NOT SUBSTANTIATED -- downgraded from the original hypothesis. Every source found for 'alumni response rates beat cold outreach' traces back to uncredentialed career-coaching SEO content with no named study, sample size, or methodology; the specific numbers cited for the same claim ranged wildly (25-40%, 40-60%, 60-80%, '5x') with no reconciliation -- a classic sign of content mills copying and inflating each other, not real data. No source addressed the specific differential claimed (do Stanford alumni at Google get more inbound requests than UNC alumni, causing UNC alumni to respond more readily). This is a plausible-sounding intuition with zero real evidentiary backing found.", "action": "Don't build strategy on the assumption that UNC alumni respond meaningfully better than target-school alumni -- there's no evidence for it either way. The real, well-established lever is just that warm alumni outreach beats cold outreach in general, which is unsurprising and worth doing regardless of school. The Pipeline's alumni-search link is still useful (finding a warm intro is table stakes, not a school-specific edge) -- just don't overweight the non- <script>(function () {
  var RD = window.RD || {};
  var STRONG = (RD.strongVerbs || []).map(function (v) { return v.toLowerCase(); });
  var WEAK = (RD.weakVerbs || []).map(function (v) { return v.toLowerCase(); });
  var app = document.getElementById("app");
  var esc = function (s) { return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (m) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]; }); };
  var CLICHE = ["leverage", "synergy", "best-in-class", "seamless", "robust", "holistic", "game-changing", "world-class", "cutting-edge", "spearhead"];
  var SELF = ["passionate about", "eager to learn", "self-starter", "results-driven", "detail-oriented", "hard-working", "hardworking", "motivated", "strategic thinker", "team player", "go-getter", "highly accomplished"];

  // ---------- bullet extraction ----------
  function bullets(text) {
    return text.split("\n").map(function (l) { return l.replace(/^\s*[-•*•▪–]\s*/, "").trim(); })
      .filter(function (l) { return l.length >= 25 && /[a-z]/i.test(l); });
  }
  // digits that carry impact (exclude dates, phones, versions, years)
  function impactDigits(b) {
    var s = b
      .replace(/\b(19|20)\d{2}\b/g, " ")                 // years
      .replace(/\b\d{3}[-.]?\d{3}[-.]?\d{4}\b/g, " ")     // phones
      .replace(/\bv?\d+\.\d+(\.\d+)?\b/g, " ")            // versions
      .replace(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*\d{0,4}/gi, " ");
    return /\d/.test(s);
  }
  function firstWord(b) { return (b.match(/^([A-Za-z']+)/) || ["", ""])[1].toLowerCase(); }

  // ---------- per-bullet diagnosis ----------
  function diagnose(b) {
    var lo = b.toLowerCase(), issues = [], wins = [];
    var fw = firstWord(b);
    if (WEAK.indexOf(fw) >= 0 || /^(responsible|duties|worked|helped|assisted|involved|participated|supported|coordinated|managed|led|oversaw|handled)$/.test(fw))
      issues.push({ t: "weak opener", d: "Opens with a weak verb — lead with an ownership verb (Owned, Shipped, Cut, Drove, Killed…)." });
    else if (STRONG.indexOf(fw) >= 0) wins.push("strong verb");
    if (/^\w+ing\b/.test(b)) issues.push({ t: "gerund opener", d: "Starts with an -ing gerund; use past-tense ownership (‘Shipped’, not ‘Shipping’)." });
    if (/responsible for|duties included/.test(lo)) issues.push({ t: "responsibility, not impact", d: "‘Responsible for’ describes a job, not a result. State what you moved." });
    if (!impactDigits(b)) issues.push({ t: "no metric", d: "No quantified outcome — add a number (%, $, x, users, time saved) or defensible scope." });
    else wins.push("quantified");
    if (/\d[\d,.]*\s?(->|→|to)\s?\d/.test(b)) wins.push("before→after");
    var hasOut = /revenue|arr|retention|conversion|activation|drop-?off|churn|engagement|adoption|nps|dau|mau|growth|sign-?ups?/.test(lo);
    var hasMech = /\bby\b|\bvia\b|\bthrough\b|\bafter\b/.test(lo);
    if (hasOut && hasMech && impactDigits(b)) wins.push("dual-metric causality");
    else if (impactDigits(b) && !hasMech) issues.push({ t: "no mechanism", d: "Names a result but not the lever YOU pulled. Add ‘…by [what you did]’ so it reads as your decision." });
    if (/\b\d{1,3}\.\d+\s?%/.test(b)) issues.push({ t: "over-precise %", d: "Oddly-precise % (e.g. 41.7%) reads as fabricated — round it (‘~42%’)." });
    if (/\b(9[0-9]|100)\s?%/.test(b) && !/\d[\d,.]*\s?(->|→|to)\s?\d/.test(b)) issues.push({ t: "near-ceiling, no baseline", d: "≥90% improvement with no before→after baseline reads as inflated. Show the baseline." });
    var cl = CLICHE.filter(function (w) { return lo.indexOf(w) >= 0; });
    if (cl.length) issues.push({ t: "buzzword", d: "Cut filler: " + cl.join(", ") + "." });
    var sf = SELF.filter(function (w) { return lo.indexOf(w) >= 0; });
    if (sf.length) issues.push({ t: "self-praise", d: "‘" + sf[0] + "’ is an unproven adjective — replace with an outcome that proves it." });
    if (/(\bwe\b|our team)/.test(lo) && STRONG.indexOf(fw) < 0) issues.push({ t: "collective ownership", d: "‘We/our team’ with no personal decision verb hides YOUR contribution." });
    return { issues: issues, wins: wins };
  }

  // ---------- whole-resume score ----------
  function scoreResume(text) {
    var bs = bullets(text), n = bs.length || 1, lo = text.toLowerCase();
    var quant = bs.filter(impactDigits).length;
    var strongOpen = bs.filter(function (b) { return STRONG.indexOf(firstWord(b)) >= 0; }).length;
    var weakOpen = bs.filter(function (b) { var f = firstWord(b); return WEAK.indexOf(f) >= 0 || /^(responsible|worked|helped|assisted|managed|led|involved|participated|supported|coordinated|oversaw|handled)$/.test(f) || /^\w+ing\b/.test(b); });
    var dual = bs.filter(function (b) { var l = b.toLowerCase(); return impactDigits(b) && /revenue|arr|retention|conversion|activation|drop-?off|churn|engagement|adoption|growth|sign-?ups?/.test(l) && (/\bby\b|\bvia\b|\bthrough\b|\bafter\b/.test(l)); }).length;
    var kill = bs.some(function (b) { return /\b(killed|cut|deprecated|descoped|deferred|deprioriti[sz]ed|chose .* over|instead of|rather than)\b/i.test(b); });
    var guard = bs.some(function (b) { return /\b(while (holding|keeping)|without (increasing|hurting|raising)|at (flat|constant)|no (increase|regression) in)\b/i.test(b); });
    var failure = bs.some(function (b) { return /\b(failed|didn'?t work|learned|pivot(ed)?|killed|abandoned|wrong|mistake)\b/i.test(b); });
    var grad = /(20\d{2})\b/.test(text) && /(expected|graduat|class of|b\.?s\.?|b\.?a\.?)/i.test(text);
    var workauth = /(work authoriz|citizen|visa|cpt|opt|sponsor|us person|eligible to work)/i.test(text);
    var firstBulletQuant = bs.length ? impactDigits(bs[0]) : false;
    var overPrecise = bs.filter(function (b) { return /\b\d{1,3}\.\d+\s?%/.test(b); }).length;
    var openers = {}; bs.forEach(function (b) { var f = firstWord(b); if (STRONG.indexOf(f) >= 0) openers[f] = (openers[f] || 0) + 1; });
    var maxOpener = Math.max.apply(null, [0].concat(Object.keys(openers).map(function (k) { return openers[k]; })));
    var repetitive = strongOpen > 0 && maxOpener / strongOpen > 0.4;

    var dims = [];
    function dim(name, weight, pct, note) { dims.push({ name: name, weight: weight, pct: Math.max(0, Math.min(100, Math.round(pct))), note: note }); }
    dim("Quantification & Metrics", 18, (quant / n) * 100 * (overPrecise ? 0.85 : 1),
      quant + "/" + n + " bullets quantified" + (overPrecise ? " · " + overPrecise + " over-precise %" : ""));
    dim("Strong Verbs & Ownership", 15, (strongOpen / n) * 100 - (repetitive ? 12 : 0),
      strongOpen + "/" + n + " strong openers" + (weakOpen.length ? " · " + weakOpen.length + " weak" : "") + (repetitive ? " · too repetitive" : ""));
    dim("Bullet Structure (dual-metric causality)", 14, (dual / n) * 130,
      dual + "/" + n + " bullets pair an outcome with the lever you pulled");
    dim("Positioning & Front-Loading", 12, (firstBulletQuant ? 70 : 30) + (/\b(pm|product)\b/i.test(text.slice(0, 400)) ? 30 : 0),
      firstBulletQuant ? "first bullet is quantified ✓" : "first bullet not quantified — your top-left is prime real estate");
    dim("Tradeoff Judgment (kill / chose-over)", 9, kill ? 100 : 0,
      kill ? "shows prioritization ✓" : "no KILL/CUT/‘chose X over Y’ bullet — add one to prove judgment");
    dim("Guardrail / Counter-metric", 6, guard ? 100 : 40,
      guard ? "shows metric rigor ✓" : "consider one bullet that held a guardrail (‘…without hurting X’)");
    dim("Credibility (honest, not inflated)", 8, (failure ? 100 : 55) - overPrecise * 10,
      failure ? "has an honest learning/kill bullet ✓" : "100% wins reads inflated — one honest bet adds trust");
    dim("Eligibility Signals", 8, (grad ? 60 : 0) + (workauth ? 40 : 0),
      (grad ? "grad year ✓ " : "add grad year · ") + (workauth ? "work-auth ✓" : "add work-auth signal"));
    dim("Length & Mechanics", 10, n <= 22 ? 100 : Math.max(40, 100 - (n - 22) * 6),
      n + " impact bullets" + (n > 22 ? " — likely >1 page; trim" : " ✓"));

    var total = dims.reduce(function (a, d) { return a + d.pct * d.weight; }, 0) / dims.reduce(function (a, d) { return a + d.weight; }, 0);
    var flags = [];
    bs.forEach(function (b) { var dg = diagnose(b); if (dg.issues.length) flags.push({ b: b, issues: dg.issues }); });
    return { total: Math.round(total), dims: dims, flags: flags, nBullets: n };
  }

  // ---------- JD match ----------
  function jdMatch(resume, jd) {
    var rl = resume.toLowerCase(), fams = RD.keywordFamilies || [], out = [];
    fams.forEach(function (f) {
      var inJD = f.keywords.filter(function (k) { return jd.toLowerCase().indexOf(k.toLowerCase()) >= 0; });
      var covered = inJD.filter(function (k) { return rl.indexOf(k.toLowerCase()) >= 0; });
      var missing = inJD.filter(function (k) { return rl.indexOf(k.toLowerCase()) < 0; });
      if (inJD.length) out.push({ family: f.family, inJD: inJD.length, covered: covered.length, missing: missing });
    });
    var totIn = out.reduce(function (a, f) { return a + f.inJD; }, 0) || 1;
    var totCov = out.reduce(function (a, f) { return a + f.covered; }, 0);
    return { pct: Math.round(totCov / totIn * 100), fams: out };
  }

  var CSTOP = ["the","and","for","with","that","this","from","have","has","are","was","were","been",
    "being","into","onto","your","their","them","they","its","not","but","who","what","when","where",
    "how","why","which","than","then","also","more","most","some","any","all","own","per","via",
    "without","within","across","over","under","after","before","while","each","every","both","either",
    "neither","only","just","much","many","such","same","other","another","these","those","because",

  // pull each accepted-pattern sentence's most distinctive terms (crude but consistent with
  // the JD Match tab's own keyword-family approach) so we can check whether YOUR draft touches it
  function keyTerms(s) {
    var words = (s || "").toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(Boolean);
    var seen = {}, out = [];
    words.forEach(function (w) {
      if (w.length < 5 || CSTOP.indexOf(w) >= 0 || seen[w]) return;
      seen[w] = 1; out.push(w);
    });
    return out.slice(0, 6);
  }

    var weak = '<div class="chips">' + (RD.weakVerbs || []).slice(0, 40).map(function (v) { return '<span class="chip bad">' + esc(v) + "</span>"; }).join("") + "</div>";
    var mets = (RD.metricTypes || []).map(function (m) { return '<div class="mrow"><b>' + esc(m.category) + '</b><span>' + m.examples.map(esc).join(" · ") + "</span></div>"; }).join("");
    var gold = (RD.goldBullets || []).map(function (g) { return '<div class="gold"><div class="gw">✗ ' + esc(g.original) + '</div><div class="gs">✓ ' + esc(g.improved) + '</div><div class="gy">' + esc(g.why) + "</div></div>"; }).join("");
    var flags = '<ul class="rf">' + (RD.redFlags || []).map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>";
    return '<div class="panel"><div class="phead"><h2>Strong verbs</h2><span class="hint">lead with these</span></div><div class="pad">' + verbs + "</div></div>"
      + '<div class="panel"><div class="phead"><h2>Weak verbs / phrases</h2><span class="hint">flagged by the scorer</span></div><div class="pad">' + weak + "</div></div>"

      + '<div class="panel"><div class="phead"><h2>Your resume — weak → strong</h2><span class="hint">from the teardown of your master resume</span></div><div class="pad">' + gold + "</div></div>"
      + '<div class="panel"><div class="phead"><h2>Instant-reject red flags</h2><span class="hint">never ship these</span></div><div class="pad">' + flags + "</div></div>";
  }
})();
