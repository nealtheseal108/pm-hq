<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resume HQ — PM</title><meta name="theme-color" content="#6d28d9"></head><body><style>:root{--bg:#f7f7fb;--surface:#fff;--surface-2:#f0f0f7;--ink:#14121c;--muted:#6b6880;--faint:#a5a2b8;--line:#e6e5ef;--line-2:#d6d4e4;--accent:#6d28d9;--accent-2:#5b21b6;--accent-soft:#ece5fb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 2px rgba(20,18,28,.04),0 4px 16px rgba(20,18,28,.06);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:13px}
@media (prefers-color-scheme:dark){:root{--bg:#0f0d16;--surface:#191622;--surface-2:#221e2e;--ink:#ece9f4;--muted:#9a95ac;--faint:#635e75;--line:#2a2537;--line-2:#382f47;--accent:#a78bfa;--accent-2:#8b5cf6;--accent-soft:#2a1f45;--ok:#3fca6a;--warn:#f59e0b;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0}
.wrap{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;max-width:940px;margin:0 auto;padding:24px 20px 80px;-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:11px}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
h1{font-size:25px;letter-spacing:-.02em;font-weight:800;margin:0}
.status{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:9px 0 0}.status b{color:var(--accent-2)}
nav.tabs{display:flex;gap:6px;margin:20px 0 4px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:20}
nav.tabs button{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
nav.tabs button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
section.view{display:none;margin-top:12px}section.view.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px 13px;border-bottom:1px solid var(--line)}
.phead h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;margin:0}.phead .hint{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.pad{padding:14px 17px}.muted{color:var(--muted);font-size:13px}
textarea,input,select{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lb{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:10px 0 4px}
.brow{display:flex;align-items:center;gap:12px;margin-top:10px}
.btn{font-family:var(--sans);font-size:13px;font-weight:650;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:9px 16px;cursor:pointer}.btn:hover{background:var(--accent-2)}
.lnk{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline}
.scorehead{display:flex;align-items:center;gap:18px;padding:16px 17px;border-bottom:1px solid var(--line)}
.ring{width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p,0)*1%),var(--surface-2) 0);position:relative}
.ring{background:var(--surface-2);border:3px solid var(--c)}
.ring b{font-family:var(--mono);font-size:26px;font-weight:800;line-height:1}.ring span{font-size:9px;color:var(--faint);position:absolute;bottom:12px}
.gtext b{font-size:16px;display:block}.gtext span{font-size:12.5px;color:var(--muted)}
.dims{padding:10px 17px 4px}
.dimrow{padding:9px 0;border-top:1px solid var(--line)}.dimrow:first-child{border-top:none}
.dimtop{display:flex;justify-content:space-between;align-items:baseline}.dn{font-size:13px;font-weight:600}.dp{font-family:var(--mono);font-size:14px;font-weight:700}
.track{height:6px;background:var(--surface-2);border-radius:99px;margin:5px 0 4px;overflow:hidden}.fill{height:100%;border-radius:99px}
.dnote{font-size:11.5px;color:var(--muted)}
.flags{padding:6px 17px 14px}.flags h3{font-size:13px;margin:12px 0 6px}
.flag{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface-2)}
.fb{font-size:13px;font-weight:600;margin-bottom:4px}
.flag ul{margin:4px 0 0;padding-left:18px}.flag li{font-size:12.5px;color:var(--muted);margin:3px 0}.flag li b{color:var(--bad)}
.wins{font-size:11.5px;color:var(--ok);font-weight:600;margin-top:2px}
.pbad{font-size:10px;font-weight:700;color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent);padding:2px 7px;border-radius:6px}
.pok{font-size:10px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent);padding:2px 7px;border-radius:6px}
.allgood{padding:14px 17px;color:var(--ok);font-size:13.5px;font-weight:600}
.tip{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}.tip b{color:var(--accent-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.built{font-size:14px;line-height:1.5;padding:12px 14px;border:1px dashed var(--line-2);border-radius:9px;color:var(--faint);min-height:48px}
.built.has{color:var(--ink);border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.built.has::after{content:attr(data-score);display:block;font-family:var(--mono);font-size:10px;color:var(--accent-2);margin-top:6px}
.copy{margin-top:10px;font-size:12px;font-weight:650;color:var(--accent-2);background:var(--accent-soft);border:none;border-radius:8px;padding:7px 14px;cursor:pointer}
.jdscore{font-family:var(--mono);font-size:26px;font-weight:800}
.miss{margin-top:5px}.mk{display:inline-block;font-size:11px;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:6px;padding:2px 8px;margin:2px 4px 0 0}
.ecards{padding:10px 14px}.ecard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:var(--surface-2)}
.ecard h3{font-size:14px;margin:0 0 5px;color:var(--accent-2)}.ecard .ewhy{font-size:13px;margin:0 0 5px}.ecard .ehow{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.fit{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.fit-strong{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.fit-medium{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}.fit-weak{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.fsig{margin:4px 0 2px;padding-left:18px}.fsig li{font-size:12.5px;margin:3px 0}
.moves{margin:0;padding-left:20px}.moves li{font-size:13px;margin:7px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px}
.chip.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.mrow{padding:7px 0;border-top:1px solid var(--line)}.mrow:first-child{border-top:none}.mrow b{font-size:13px;display:block}.mrow span{font-size:12px;color:var(--muted)}
.gold{border-left:3px solid var(--accent);padding:8px 12px;margin:10px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.gold .gw{font-size:12.5px;color:var(--bad);margin-bottom:3px}.gold .gs{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:4px}.gold .gy{font-size:11.5px;color:var(--muted)}
.rf{margin:0;padding-left:20px}.rf li{font-size:12.5px;color:var(--muted);margin:5px 0}
footer{margin-top:22px;padding:0 4px;font-size:11.5px;color:var(--faint);line-height:1.5}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>

<script>window.RD = {"strongVerbs": ["Owned", "Shipped", "Launched", "Drove", "Cut", "Grew", "Scaled", "Built", "Rebuilt", "Redesigned", "Architected", "Defined", "Scoped", "Spearheaded", "Prioritized", "Killed", "Deprecated", "Doubled", "Tripled", "Reduced", "Increased", "Lifted", "Raised", "Boosted", "Accelerated", "Streamlined", "Automated", "Negotiated", "Secured", "Won", "Converted", "Retained", "Acquired", "Validated", "Diagnosed", "Resequenced", "Overhauled", "Consolidated", "Migrated", "Integrated", "Instrumented", "Authored", "Delivered", "Executed", "Championed", "Founded", "Bootstrapped", "Piloted", "Iterated", "Optimized", "Unblocked", "Aligned", "Rallied", "Mobilized", "Orchestrated", "Introduced", "Established", "Pioneered", "Generated", "Slashed", "Eliminated"], "weakVerbs": ["Responsible for", "Duties included", "Worked on", "Worked with", "Helped", "Helped with", "Helped to", "Assisted", "Assisted with", "Assisted in", "Involved in", "Participated in", "Supported", "Contributed to (as opener)", "Coordinated", "Collaborated with", "Partnered with", "Managed (as bare opener)", "Led (as bare opener)", "Oversaw", "Handled", "Dealt with", "Was tasked with", "Took part in", "Engaged in", "Familiar with", "Exposed to", "Learned", "Gained experience in", "Performed analysis", "Performed cohort analysis", "Analyzed data (with no decision)", "Built a dashboard (with no decision)", "Identified an opportunity (with no action)", "Tracked", "Monitored", "Gathered requirements", "Passionate about", "Eager to learn", "Self-starter", "Results-driven", "Detail-oriented", "Hard-working", "Motivated", "Strategic thinker", "Data-driven (as bare adjective)", "Customer-obsessed (as bare adjective)", "Synergy", "Thought leader", "Successfully", "Various", "In order to", "By creating a plan", "A wide range of", "Cross-functionally (with no specifics)"], "metricTypes": [{"category": "Growth / Acquisition", "examples": ["activation rate 12%->16%", "weekly active users 17->563 (33x)", "free-to-paid conversion 3.2%->7.5% (+134%)", "signup drop-off cut 22%", "first 50 paying customers in 3 months"]}, {"category": "Retention / Engagement", "examples": ["30-day retention 21%->26%", "churn 8%->5% (~$180K/yr saved)", "repeat purchases +40%", "DAU/WAU ratio +9pts", "session frequency 2x"]}, {"category": "Revenue / Monetization", "examples": ["~$1.4M annual revenue (est.)", "projected ~$145K ARR/machine", "ARPU +18%", "first $250K ARR", "gross margin ~40%"]}, {"category": "Efficiency / Cost / Velocity", "examples": ["manual test runs cut ~40%", "weekly outreach 10 hrs -> <30 min", "payout setup time 4:00 -> 2:30", "shipped weekly for 6 months", "dev speed 2x via internal tool"]}, {"category": "Quality / Performance", "examples": ["exam scores +16%", "review time -38%", "First-Time Fix Rate +12pts", "latency -30%", "uptime 99.9%"]}, {"category": "Scope / Scale (defensible when outcome data is missing)", "examples": ["180 customer interviews", "200+ user interviews", "deployed across 100+ universities", "first PM on a 0->1 tool", "owned $3.2M ARR product line, 120K users"]}], "bulletFormula": {"name": "Metric-First PM XYZ (dual-metric causality)", "template": "[Decision verb] + [named product/scope] + [quantified OUTPUT metric] + by/via [the INPUT mechanism you drove] + [named cross-functional partners, if any]. Formally: 'Accomplished X (result) as measured by Y (metric) by doing Z (mechanism).' Lead with the number when it is the hook. Every bullet must pass the 'so what?' test and name the lever that proves YOU moved the metric \u2014 not just that you sat near a team that hit it.", "examples": [{"weak": "Responsible for the mobile checkout experience and working with engineering.", "strong": "Cut mobile checkout drop-off 22% by shipping a one-tap flow with 2 engineers and a designer, adding ~$1.4M ARR (est.)."}, {"weak": "Performed cohort analysis on user retention.", "strong": "Killed onboarding step 3 after cohort analysis showed 30% drop-off there, lifting 30-day retention 21%->26% in 10 weeks."}, {"weak": "Led the launch of an internal software-test product.", "strong": "Owned the 0->1 build of an internal Gerrit+Bazel test tool at SailLoft (early-stage dev-tools startup); chose auto-voting on Gerrit over a separate dashboard, cutting manual test runs ~40% for the eng team."}, {"weak": "Shipped an AI lead-generation agent that saved a lot of time.", "strong": "Built and shipped an AI lead-gen agent (Node, Playwright, Gemini) that auto-sourced contacts across 100+ universities, cutting my weekly outreach from ~10 hrs to <30 min."}, {"weak": "Worked on a student productivity app and did user research.", "strong": "Grew a student productivity app 17->563 weekly active users (33x) in one quarter; ran 200+ interviews that surfaced spaced-repetition gaps, then shipped an ML flashcard engine lifting exam scores ~16% and cutting review time 38%."}, {"weak": "President of the club, managed members and organized events.", "strong": "As club President, aligned a 25-player roster + 3 captains (no direct authority) on a new practice/travel system, growing active membership ~30%."}, {"weak": "Built a computer-vision analytics system for the vending machine.", "strong": "Built a privacy-first computer-vision telemetry system (OpenCV) tracking an impression->approach->purchase funnel; used it to kill low-converting menu placements, lifting approach->purchase ~15%."}]}, "rubric": [{"dimension": "Quantification & Metrics", "weight": 18, "whatGreatLooksLike": "Nearly every bullet carries a defensible number with a baseline/timeframe and the product lever that moved it. Numbers are round (~40%, not 41.7%) and read as owned, not inflated. Output metrics are paired with an input mechanism.", "checks": ["% of experience/project bullets containing at least one digit >= 60 (count bullets, count those matching /[0-9]/, compute ratio)", "flag any bullet with zero digits as 'unquantified' and list it", "flag oddly-precise percentages matching /\\b\\d{1,3}\\.\\d+%/ (e.g. 41.7%) as fabrication-risk; reward rounded numbers", "reward bullets containing a before->after pair: regex /\\d[\\d,.]*\\s?(->|\u2192|to)\\s?\\d[\\d,.]*/ or two numbers with an arrow", "reward bullets that contain BOTH an output metric token (revenue|ARR|retention|conversion|activation) AND an input/mechanism clause introduced by ' by ' or ' via '", "flag near-ceiling numbers (>=90% improvement, regex /\\b(9[0-9]|100)%/) that lack a baseline in the same bullet as needs-defense"]}, {"dimension": "Strong Verbs & Ownership", "weight": 15, "whatGreatLooksLike": "Every bullet opens with a decision/ownership verb (Owned, Shipped, Launched, Drove, Cut, Grew). No task/filler openers. Individual contribution is clear; group 'we' phrasing is rare.", "checks": ["% of bullets whose first word (after stripping bullet char/whitespace) is in the STRONG_VERBS set >= 80", "flag any bullet whose first word is in WEAK_VERBS set (Responsible, Managed, Worked, Helped, Assisted, Led as bare, Collaborated, Involved, Participated, Supported, Coordinated)", "flag any bullet opening with a gerund (regex /^\\s*[-\u2022*]?\\s*\\w+ing\\b/) e.g. 'Managing', 'Working'", "flag bullets containing 'responsible for' or 'duties included' (case-insensitive substring)", "penalize collective-only ownership: bullet contains ' we ' or ' our team ' but no first-person decision verb"]}, {"dimension": "Bullet Structure & Product-Sense Chain", "weight": 14, "whatGreatLooksLike": "Bullets follow Verb + named scope + quantified outcome + mechanism, <=2 lines each. Discovery bullets show the chain: evidence (N interviews / data) -> decision -> measured result. Specific user segment + specific pain named, not generic 'improved UX'.", "checks": ["flag bullets longer than ~2 lines: char length > 200 (approx 2 lines at ~100 chars)", "reward product-sense chain: bullet contains a research-count token (regex /\\b\\d+\\+?\\s*(user |customer )?(interviews|surveys|usability)/i) AND a downstream metric digit", "flag generic filler phrases: 'improve user experience','improve UX','various','a wide range of','in order to','by creating a plan','cross-functional' with no adjacent number", "reward named specificity: presence of a named product/tool inside the bullet (capitalized proper noun or tool from KEYWORD set) rather than 'a B2C SaaS app'", "3-5 bullets per role (count bullets under each role header; flag roles with >5 or <2)"]}, {"dimension": "Positioning, Spike & F-Pattern Front-Loading", "weight": 12, "whatGreatLooksLike": "A top-third positioning line declares one archetype+domain (e.g. '0->1 AI Product Builder'). The FIRST bullet under the most-recent role is the single strongest quantified outcome. One coherent through-line, not a task inventory.", "checks": ["detect a summary/headline line in the top ~5 lines that matches an archetype token (Growth|Platform|Monetization|0->1|AI Product|Fintech PM etc.); flag absence", "first bullet under the most-recent (topmost) experience role contains a digit; flag if it does not", "penalize opening summary containing bare adjectives with no metric: regex /(results-driven|passionate|detail-oriented|hard-working|motivated|self-starter)/i", "reward repetition of a single archetype/domain keyword across >=3 bullets (through-line signal)"]}, {"dimension": "Leadership / Influence-Without-Authority", "weight": 8, "whatGreatLooksLike": "A leadership section (or bullets) shows LED initiatives with team size + a moved metric + influence over people not managed. No bare title inventory.", "checks": ["leadership section bullets contain at least one digit (team size or outcome); flag a leadership section that is 100% title-only (no digits)", "reward tokens indicating influence-without-authority: 'aligned','influenced','no direct authority','rallied','built consensus' co-occurring with a number", "flag leadership entries that are only role names (President, Director, Invitee) with no verb+outcome clause"]}, {"dimension": "Technical / AI Fluency (verifiable)", "weight": 8, "whatGreatLooksLike": "Named tools appear inside impact bullets (SQL, Amplitude, Figma, OpenCV, RAG, Gemini). AI work is shown as a shipped outcome with a clickable live/demo/repo URL, not a bare 'AI' skill.", "checks": ["reward tool names embedded in bullets (count KEYWORD tool tokens appearing inside bullet text, not only in Skills)", "flag a bare 'AI' or 'Machine Learning' skill entry that never appears inside any bullet with an outcome", "reward presence of a clickable artifact URL (regex /(https?:\\/\\/|github\\.com|\\.app|\\.dev|\\.com\\/)/) in header OR next to a shipped project", "for APM/technical targets, reward presence of SQL and at least one analytics tool (Amplitude|Mixpanel) token"]}, {"dimension": "ATS Parse-Safety & Mechanics", "weight": 9, "whatGreatLooksLike": "Single column, standard section headings, consistent Month-YYYY dates on every entry, contact info in body, one page, zero typos, consistent formatting.", "checks": ["all dated entries use Month-YYYY (regex /\\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s+\\d{4}\\b/); flag numeric-only (01/2024), quarter (Q1 2024), or season (Spring 2024) dates", "standard headings present: Experience/Work Experience, Education, Skills (case-insensitive match); flag creative headings ('What I Built','My Journey')", "one-page heuristic: total non-empty lines <= ~50; flag if over", "flag inconsistent date formats across entries (mix of 'Jan 2024' and '2024')", "spellcheck / typo pass on common misspellings; flag any (typos are documented instant reject)", "flag em-dash/curly-quote/fancy-bullet chars that can garble strict parsers"]}, {"dimension": "Eligibility & Knockout Fields", "weight": 8, "whatGreatLooksLike": "Grad/class year and work authorization are surfaced in the header where a 6-8s scan and knockout screen hit first. Target-track eligibility is unambiguous.", "checks": ["detect graduation/class-year token (regex /(Expected|Grad(uation)?)\\s*(May|Jun|Dec)?\\s*20\\d{2}/i) in the TOP third; flag if only buried in Education", "detect a work-authorization token (regex /(work auth|authorized to work|F-1|CPT|OPT|US citizen|no sponsorship)/i); flag absence", "if targeting flagship APM intern tracks (penultimate-year required), flag a first-year/sophomore grad year as an eligibility risk"]}, {"dimension": "Org Context & Attribution Honesty", "weight": 8, "whatGreatLooksLike": "Unfamiliar employers get inline scale context (headcount/revenue/users). Metrics use 'contributed to'/'enabled' or a stated mechanism instead of sole causation. Projections are labeled.", "checks": ["reward inline org-scale context near company names: regex /\\b(\\d[\\d,]*\\+?\\s*(person|employee|user|customer)s?|\\$\\d[\\d.,]*[KMB]\\+?\\s*(rev|ARR))/i", "flag projected numbers stated as fact: bullet contains 'projected'/'ARR'/'margin' figure without the word 'projected'/'est'/'~' nearby", "reward attribution-honest phrasing 'contributed to'/'enabled'/'helped drive' when tied to a company-level metric", "flag sole-causation on a company-level metric ('drove 20% revenue growth') with no mechanism clause"]}], "redFlags": ["Any typo or misspelling (77% of hiring managers reject on a single typo \u2014 documented instant reject).", "Inconsistent or non-standard date formats across entries (numeric-only, Q1 2024, Spring 2024) that break strict parsers and can miscalculate YOE against a knockout.", "Two-column layout, tables, sidebars, or contact info in the header/footer layer (parse-break in the majority of ATS).", "A bullet with zero numbers that is a pure task/responsibility statement ('Responsible for the roadmap').", "Bullet opening with 'Responsible for', 'Worked on', 'Helped', 'Assisted', 'Duties included', or a gerund ('Managing').", "Bare self-praise adjectives with no evidence ('passionate about product', 'highly accomplished leader', 'results-driven self-starter').", "Oddly-precise fabrication-risk metrics (e.g. 41.7%) or projected numbers stated as fact without a 'projected'/'est.' label.", "Near-ceiling improvement (>=90%) with no baseline in the same bullet ('cut outreach time 97%').", "Sole-causation claim on a company-level metric with no mechanism ('my feature drove 20% revenue growth').", "A leadership section that is a pure title inventory (President, Director, Invitee) with no team size, verb, or outcome.", "A bare 'AI' / 'Machine Learning' skill line with no shipped outcome and no clickable artifact URL.", "Over two pages for an early-career/APM candidate, or best achievement buried on page 2 / in an older role.", "Applying a first-year/sophomore resume to a flagship APM INTERNSHIP track requiring penultimate-year status (class-year knockout).", "Missing work-authorization signal when required (true knockout that drops the candidate before content is read).", "Generic product-sense bullets with a vague segment ('improved user experience') even if a number is present \u2014 reads as a null signal."], "keywordFamilies": [{"family": "Strategy", "keywords": ["Product Strategy", "Product Vision", "Product Roadmap", "Roadmapping", "Go-to-Market (GTM)", "North Star Metric", "Product Discovery", "Market Analysis", "Competitive Analysis", "Product-Market Fit", "0->1 / Zero-to-One"]}, {"family": "Execution / Agile", "keywords": ["Agile", "Scrum", "Sprint Planning", "User Stories", "Backlog Grooming", "Acceptance Criteria", "Product Requirements Document (PRD)", "MVP", "Release Management", "Shipping / Launch"]}, {"family": "Stakeholder / Influence", "keywords": ["Cross-Functional Collaboration", "Stakeholder Management", "Executive Communication", "Influence Without Authority", "People Management", "Alignment", "Prioritization (RICE, MoSCoW, Kano)"]}, {"family": "Metrics / Analytics", "keywords": ["KPIs", "OKRs", "Retention", "Conversion", "Activation", "ARR / MRR", "Funnel Analysis", "Cohort Analysis", "A/B (split) Testing", "Counter-Metrics", "ARPU", "Churn"]}, {"family": "Research / Discovery", "keywords": ["User Interviews", "User Research", "Usability Testing", "User Personas", "Voice of Customer (VoC)", "Jobs-to-be-Done (JTBD)", "Customer Discovery", "Journey Mapping"]}, {"family": "Tools", "keywords": ["Jira", "Confluence", "Amplitude", "Mixpanel", "Figma", "Productboard", "Aha!", "SQL", "Looker", "Tableau", "GitHub", "Linear", "Notion"]}, {"family": "Technical / AI (2026 signal)", "keywords": ["AI Product", "LLM", "Machine Learning", "AI-powered features", "RAG (Retrieval-Augmented Generation)", "Model Evaluation / Evals", "Prompt Engineering", "API Design", "Latency / Cost / Quality tradeoffs", "Python", "Data-Informed Decisions"]}, {"family": "Business / Technical Foundation", "keywords": ["P&L Ownership", "Unit Economics", "Business Strategy", "Pricing / Monetization", "Growth", "Platform / Infrastructure", "Marketplace", "B2B SaaS", "Consumer / B2C"]}], "edgePlaybook": [{"lever": "Dual-metric causality (input mechanism + output result)", "why": "Output-only bullets ('grew revenue 20%') read as taking credit for a team number; adding the input mechanism proves YOU had the causal product insight. This is the single strongest differentiator between a mid-PM and a senior-PM bullet.", "how": "Append a ' by [mechanism]' clause to every output metric: 'lifted activation 41%->63% by cutting signup steps 5->2'. Scorer rewards bullets where a number causes an action."}, {"lever": "First-bullet-is-the-whole-resume bet", "why": "Recruiters scan ~7s in an F-pattern; the top third gets ~80% of attention and often only the first bullet of the first role is read. A generic opening bullet caps the resume's ceiling regardless of later strength.", "how": "Place the single strongest quantified revenue/retention/activation outcome as bullet #1 under the most-recent role. Never let bullet #1 be a responsibility statement."}, {"lever": "Do-things-that-dont-scale as a first-class metric", "why": "Manual, direct customer contact ('180 customer interviews', 'onboarded first 25 customers hands-on') is the canonical YC customer-obsession signal, is impossible to fake, and is the cheapest credible product-sense proof for a low-experience candidate.", "how": "Quantify unscalable user contact as a number and chain it: interviews run -> insight surfaced -> decision shipped -> metric moved."}, {"lever": "URL-as-proof for AI/technical claims", "why": "2026 signal shift: Microsoft/Meta interviewers literally click resume URLs, and LinkedIn's APB is a no-resume shipped-demo path. An unlinked 'AI' claim reads as hollow; a clickable prototype/repo is a verified signal worth more than any bullet.", "how": "Add one clickable live-demo/repo link in the header and next to each shipped project. Describe AI bullets with model + outcome ('integrated Gemini agent -> outreach 10hrs->30min')."}, {"lever": "Named-archetype positioning (pick one lane)", "why": "Top-5% resumes declare ONE spike (e.g. '0->1 AI Product Builder', 'B2B fintech Growth PM'); the forgettable 95% try to look well-rounded and read as generic. Recruiters can only file you in one memorable slot in a 7s scan.", "how": "Add a top-third positioning line with archetype+domain and repeat that vocabulary across >=3 bullets to create a through-line."}, {"lever": "Rounded numbers + labeled projections as an anti-fabrication signal", "why": "Oddly-precise figures (41.7%) read as MORE suspicious, not more rigorous; round defensible numbers read as more senior. Projections stated as fact get punctured in a 15-min screen.", "how": "Convert '41.7%' -> '~40%'; label projections '(projected, unit-economics model)'; convert ceiling numbers with no baseline ('cut 97%') into before->after ('10 hrs -> 30 min')."}, {"lever": "Reframe the single scope-influencing moment in a non-PM role", "why": "APM screeners pattern-match adjacent roles (analyst, SWE, UX, founder) IF you surface the one moment you influenced product scope. That one bullet converts an IC into a PM candidate better than the whole role does.", "how": "For each non-PM role, write one bullet: identified need -> drove decision -> shipped -> metric. Add the road-not-taken ('chosen over X to protect Y') to signal prioritization judgment (highest-weighted APM competency)."}, {"lever": "Inline org-scale context on unfamiliar employers", "why": "A 6-8s F-pattern scan can't weight an unknown employer without scale numbers; adding them is cheap, high-leverage, and rarely done by underclassmen.", "how": "Append '| 180+ person, >$25M rev' or 'early-stage dev-tools startup, YC S23' style context next to each unfamiliar company name."}, {"lever": "Design for knockouts, not a mythical keyword guillotine", "why": "The real automated gate is form-field knockouts (work auth, YOE, grad date), not resume keyword density. Spending effort gaming parsers is wasted; eligibility accuracy + human-scan quality is what converts.", "how": "Surface grad year + work auth in the header; answer form knockouts precisely; ensure resume dates corroborate entered YOE. Do NOT keyword-stuff."}, {"lever": "Method-name tokens for cheap rigor", "why": "Dropping 'RICE', 'JTBD', 'North Star + counter-metrics', or 'AARRR' in-context signals structured thinking in ~3 words without a case study.", "how": "Embed one method name inside an impact bullet (not a skills dump): 'set First-Time Fix Rate as North Star and defined its counter-metrics (false-restock rate, tech drive time)'."}], "missingLevers": [{"lever": "Prioritization-judgment / the-thing-you-killed as a first-class scored signal", "why": "Judgment under scarcity is the single highest-weighted APM interview competency, yet the spec only mentions 'road-not-taken' once as a sub-clause. A resume full of shipped wins with zero kill/cut/deprioritize decisions reads as an order-taker, not a PM. The kill decision is the cheapest, least-fakeable proof of product judgment for a low-experience candidate.", "how": "Add a dedicated reward for bullets naming an explicit tradeoff: a KILL/DEPRIORITIZE verb (Killed, Cut, Deprecated, Deferred, Descoped) OR a 'chose X over Y to protect Z' / 'over' construction. Require at least ONE such bullet per resume; flag resumes that are 100% additive wins with no cut/kill/tradeoff as 'no demonstrated prioritization.'"}, {"lever": "Counter-metric / guardrail rigor (not just an output+input pair)", "why": "The junior tell is 'lifted conversion 40%' with no guardrail. The senior tell is 'lifted conversion 40% while holding refund rate flat.' The spec rewards output+input but never checks that the candidate protected against the obvious gaming vector \u2014 which is precisely what separates a real North Star framework from a vanity metric.", "how": "Reward bullets containing a metric-moved clause AND a guardrail/counter-metric clause ('without/while holding/at flat/no increase in [second metric]'). Elevate this above the current single input+output reward, which is easier to fake."}, {"lever": "JD/target-diffing \u2014 score the resume AGAINST a specific role, not in a vacuum", "why": "The entire rubric scores a resume standalone. But interview rate is a function of resume-to-JD FIT, not absolute quality. A brilliant growth resume sent to a platform-PM req gets rejected. Tailoring the spike vocabulary and surfacing the 2-3 JD 'must-haves' verbatim is the highest-ROI move and the spec has no mechanism for it.", "how": "Accept a target JD as input; extract its top required competencies/tools; score coverage of THOSE tokens in the top third; flag a mismatch between the declared archetype and the JD archetype. Reward verbatim mirroring of the JD's stated responsibilities in the summary line."}, {"lever": "A calibrated failure / learning bullet", "why": "Top PM screens explicitly probe 'tell me about a bet that failed.' A resume that pre-empts this with one honest 'shipped X, it underperformed, killed it and pivoted to Y (+metric)' bullet signals intellectual honesty and iteration speed \u2014 a strong positive, and impossible to coach convincingly if fake. Every bullet being a monotonic win reads as inflated.", "how": "Reward (do not require) at most one bullet with a failure->learning->recovery chain: a negative-outcome token followed by a decision verb and a recovery metric. Flag resumes where 100% of outcomes are positive as 'unbelievably clean \u2014 reads inflated.'"}, {"lever": "Scope-of-ownership ladder (feature -> surface -> product -> P&L)", "why": "Two bullets with identical metrics differ enormously by scope owned. 'Owned a button' vs 'owned the $3.2M checkout P&L' is the seniority signal recruiters actually rank on. The spec rewards named scope but doesn't grade the ALTITUDE of that scope.", "how": "Classify each ownership bullet by scope tier (feature / flow-surface / product-line / P&L-or-org) via token detection ($/ARR/P&L/roadmap-for vs single-feature nouns). Reward at least one bullet at product-line-or-higher altitude for mid/senior targets; for APM, reward one 0->1 or end-to-end-surface bullet."}, {"lever": "Recency-weighting and metric-decay", "why": "A 33x growth story from 3 years ago in an internship carries far less weight than a modest recent win, but the spec treats all quantified bullets equally. Recruiters discount stale, junior-context metrics heavily. The strongest recent bullet is what the 7-second scan actually prices.", "how": "Weight metric-quality checks by role recency (topmost role bullets count more); flag when the single most impressive metric on the resume lives in the OLDEST/most-junior role rather than the most recent."}, {"lever": "Decision-velocity / shipping-cadence proof", "why": "For 0->1 and startup PM lanes, 'how fast do you ship and learn' beats any single outcome. 'Shipped weekly for 6 months' or 'ran 8 A/B tests in a quarter' is a rare, credible velocity signal the spec lists as an example metric but never rewards structurally.", "how": "Reward cadence tokens (weekly/every sprint/N experiments in [timeframe]) as a distinct signal, especially co-located with an iteration/learning verb, for 0->1 and growth targets."}, {"lever": "Insight-quality, not just research-count", "why": "'200 interviews' is a scale flex; '200 interviews surfaced that power users abandoned at import, not onboarding' is an INSIGHT. The spec rewards the interview COUNT + downstream metric but never checks that a non-obvious, specific insight sits between them \u2014 which is the actual product-sense signal.", "how": "Require the product-sense-chain reward to also match a specific-insight clause (a named segment + a named counterintuitive behavior/pain) between the research-count and the metric \u2014 not just 'ran N interviews ... moved metric.'"}], "strongerChecks": ["Prioritization check: flag resumes with zero KILL/CUT/DEPRIORITIZE/'chose X over Y' bullets as 'no demonstrated tradeoff judgment' (regex for /\\b(killed|cut|deprecated|descoped|deferred|deprioriti[sz]ed|chose .* over |instead of|rather than)\\b/i must match >=1 bullet).", "Counter-metric check: reward bullets matching an output-metric AND a guardrail clause /\\b(while (holding|keeping)|without (increasing|hurting|raising)|at (flat|constant)|no (increase|regression) in)\\b/i.", "Monotonic-wins check: if 100% of outcome bullets are positive and none contain a failure/learning token, flag 'reads inflated \u2014 add one honest bet-that-failed bullet.'", "Insight-specificity check: for any bullet with a research-count token, require a co-occurring named-segment + specific-behavior pattern (e.g. capitalized segment noun + a verb like 'abandoned/churned/skipped at [named step]'); flag research counts that lead to a metric with NO stated insight as 'scale flex, no insight.'", "Scope-altitude classifier: tag each ownership bullet as feature / surface / product-line / P&L using tokens ($, ARR, P&L, 'roadmap for', 'product line', 'org') and report the resume's max altitude; flag if max altitude is 'feature' for non-intern targets.", "Recency check: locate the resume's single highest-impact metric; flag if it sits outside the topmost (most recent) role.", "JD-fit delta (requires JD input): compute overlap between JD-extracted must-have tokens and resume top-third tokens; flag coverage < ~50% and flag archetype mismatch between declared positioning line and JD archetype.", "Number-meaningfulness guard: don't count digits in non-impact contexts \u2014 exclude dates, phone/zip, version numbers, and 'attended N / N meetings / N years' from the 60% quantification ratio so vanity digits can't pass the check.", "Verb-diversity check: flag when >40% of bullets open with the SAME strong verb (e.g. every bullet starts 'Owned') as 'coached/templated' \u2014 real ownership varies.", "Cadence check: reward /\\b(weekly|every (sprint|week)|\\d+\\s+(experiments|A/B tests|releases|launches)\\s+in\\s+(a|one|\\d+)\\s+(quarter|month|weeks?))\\b/i for 0->1 and growth targets.", "Clich\u00e9-density (beyond openers): flag body-text buzzwords not just openers \u2014 'leverage', 'synergy', 'spearhead' (as noun), 'best-in-class', 'seamless', 'robust', 'holistic', 'game-changing' anywhere in a bullet.", "Positioning-uniqueness heuristic: flag an archetype line that is ONLY a generic lane token with no domain+differentiator (e.g. bare 'Growth PM' vs 'B2B fintech activation PM, 0->1 in regulated payments') as 'undifferentiated lane.'"], "goldBullets": [{"original": "Launched a 0->1 hot-food vending platform deployed at UC Berkeley (fresh biryani in 60s); founded after 180 customer interviews; projected $145K ARR/machine at 41.7% net margin.", "improved": "Launched a 0->1 hot-food vending platform (fresh biryani in 60s), deployed at UC Berkeley after 180 customer interviews; first machine on track to ~$145K ARR at ~40% net margin (projected, unit-economics model).", "why": "Splits owned facts from a projection so the number survives a 'how did you calculate that?' probe. 41.7% is fake-precise (trained fabrication red flag); ~40% reads more senior. Labeling it 'projected' pre-empts the over-attribution trap without weakening the scale signal."}, {"original": "Shipped an AI lead-generation agent (Node, Playwright, Gemini) across 100+ universities, cutting weekly outreach time 97%; QR loyalty app (React/Firebase) lifted repeat purchases 40%.", "improved": "Built and shipped an AI lead-gen agent (Node, Playwright, Gemini) that auto-sourced contacts across 100+ universities, cutting my weekly outreach from ~10 hrs to <30 min; a React/Firebase QR loyalty app lifted repeat purchases ~40% by rewarding a 5th-visit free item.", "why": "'97%' with no baseline reads inflated; a before->after (10 hrs -> 30 min) is self-verifying and defensible. Adds the causal mechanism to the 40% (the loyalty lever) \u2014 the input metric is what proves HE moved it, not that he sat near the number."}, {"original": "Led the 0->1 launch of an internal Gerrit-based software-test product (Gerrit voting + Bazel execution), cutting manual tests 40% with real-time test-status visibility.", "improved": "Owned the 0->1 build of an internal Gerrit+Bazel automated-test tool at SailLoft (early-stage dev-tools startup); chose to auto-vote on Gerrit over a separate dashboard, cutting manual test runs ~40% for the eng team.", "why": "Adds inline org-scale context so an unfamiliar employer gets weighted in the F-pattern scan, and surfaces the specific tradeoff decision HE made ('chose X over Y'). Prioritization judgment is the highest-weighted APM competency (35-40%); 'Led the launch' alone hid it."}, {"original": "Scaled a student productivity app 17->563 active users (33x) in one quarter via 200+ user interviews; shipped an ML flashcard engine that lifted exam scores 16% and cut review time 38%.", "improved": "Grew a student productivity app 17->563 weekly active users (33x) in one quarter; ran 200+ interviews that surfaced spaced-repetition gaps, then shipped an ML flashcard engine lifting self-reported exam scores ~16% and cutting review time 38%.", "why": "Makes the research a lever not a deliverable (interviews -> insight -> shipped decision -> metric), the three-part product-sense chain. Specifying 'weekly active' and 'self-reported' hardens the metrics against interview cross-check while keeping the 33x hook."}, {"original": "Authored a PRD for an AI predictive-restocking feature (RAG over usage logs, schedules, seasonality); designed a 3-flow UX with AI explainability and defined 15+ KPIs (First-Time Fix Rate as North Star).", "improved": "Authored a PRD for an AI predictive-restocking feature (RAG over usage logs + seasonality), designing a 3-flow UX with AI explainability; set First-Time Fix Rate as the North Star and defined its counter-metrics (false-restock rate, tech drive time).", "why": "'15+ KPIs' signals breadth-without-judgment; naming the North Star PLUS its counter-metrics signals metric ownership and tradeoff thinking \u2014 exactly the analytical station interviewers score. Also add a live link to the PRD/prototype, since 2026 reviewers click URLs."}, {"original": "\\textbf{UNC Ultimate Frisbee (BatCH)} --- President $\\cdot$ \\textbf{Bridge to BCG} --- Invitee (~10% acceptance)", "improved": "UNC Ultimate Frisbee (BatCH) - President: aligned a 25-player roster + 3 captains (no direct authority) on a new practice/travel system, growing active membership ~30%. Bridge to BCG - Invitee (~10% acceptance).", "why": "The entire Leadership section had zero outcomes and read as a title list (the #1 reject trigger). This converts a role name into an influence-without-authority story with a team size and a metric \u2014 the cleanest campus-leadership->PM bridge Google/Uber/Atlassian explicitly screen for."}, {"original": "Built a privacy-first computer-vision telemetry system (OpenCV) tracking the impression->approach->purchase funnel, giving a physical machine e-commerce-grade conversion analytics.", "improved": "Built a privacy-first computer-vision telemetry system (OpenCV) tracking an impression->approach->purchase funnel, giving a physical vending machine e-commerce-grade analytics; used it to kill low-converting menu placements and lift approach->purchase ~X%.", "why": "The bullet currently ends at 'built the capability' (an analyst/eng deliverable) with no decision or metric. Adding what the data DROVE (killed placements) + an outcome number converts it from a capability statement into a scored PM decision. Neal should backfill the real X."}], "strengths": ["Metric-first, mechanism-attached bullets are already the house style. Lines like 'cutting manual tests 40% with real-time test-status visibility' and 'lifted exam scores 16% and cut review time 38%' pair an output number with the product lever that moved it \u2014 exactly the dual-metric causality the teardowns say separates a mid-PM from a senior-PM bullet. This is the single most reusable pattern here.", "Founder/0->1 framing is YC-native and reads as the shape of the work, not the title. 'Launched a 0->1 hot-food vending platform,' 'Led the 0->1 launch,' and 'Scaled ... 17->563 active users (33x)' mirror the literal verbatim language of real YC job posts ('zero-to-one,' 'from scratch,' 'run scrappy MVP pilots'). A founder-led reader skims for this exact silhouette.", "Do-things-that-dont-scale proof is present and quantified: 'founded after 180 customer interviews' and '200+ user interviews.' Manual, direct customer contact is the canonical Paul Graham YC customer-obsession signal and is impossible to fake \u2014 it is the strongest available product-sense evidence for someone with no shipped-at-scale product.", "Scrappiness is shown through personally-built artifacts, not adjectives: he built the CV telemetry system (OpenCV), shipped the AI lead-gen agent (Node/Playwright/Gemini), and the QR loyalty app (React/Firebase) himself. This satisfies the startup 'deliver the product yourself' hard requirement and doubles as the 2026 verifiable AI-build signal.", "Technical fluency is embedded in outcomes, not dumped as bare keywords. Tools appear inside impact bullets (OpenCV in the telemetry funnel, Gemini in the outreach agent, RAG in the PRD) \u2014 the research explicitly rewards tool-names-in-context and discounts a bare 'AI' skill line. Strong decision for the 20-25% technical weighting of an APM screen.", "Mechanically clean and ATS-parse-safe: single column, standard headings (Education/Experience/Projects/Leadership/Skills), consistent Month-Year dates on every dated entry, contact info in the body (not the header layer), one page, GitHub URL present. This clears the strictest-parser (Taleo) rules by default and survives the 6-8 second F-pattern scan.", "Skills section functions as a search index, not decoration \u2014 it duplicates critical nouns (PRDs, A/B testing, KPIs/OKRs, Jira, SQL, RAG, Figma) that also appear in bullets, so recruiter Boolean filters surface him even though the same skills are already proven in context."], "gaps": ["Class-year / eligibility is buried and unmanaged. Grad 'Expected May 2028' sits inside Education, not the header where a 6-8s scan and knockout screen hit first. As a rising-junior/sophomore he is INELIGIBLE for flagship APM internship tracks that require penultimate-year status \u2014 the resume does nothing to steer toward the correct track (this is fine for YC/startup targets, which is the stated use, but is a live auto-reject risk if reused for Google/Meta intern flagships).", "No work-authorization line anywhere. Work auth is a documented true knockout field that drops a candidate before any human reads the content. Even a single header token would neutralize it.", "The Leadership section carries ZERO metrics and no through-line \u2014 it is the one section that reads like a title inventory. 'Director of Professional Development,' 'President,' 'Invitee' name roles with no outcome, no team size, no influence-without-authority story. Google/Uber/Atlassian all explicitly screen for LED initiatives; this is his highest-leverage underdeveloped real estate.", "Fabrication-risk metrics that can be punctured in a 15-minute screen: 'projected $145K ARR/machine at 41.7% net margin' is a projection stated as fact, and 41.7% is exactly the oddly-precise figure recruiters are trained to distrust (round, defensible numbers read as MORE senior). 'cutting weekly outreach time 97%' is a near-ceiling number with no baseline \u2014 both need honest framing ('projected'/'~40%') or a decomposable baseline he can defend live.", "No verifiable live-demo/prototype URL. He has a GitHub handle but no clickable shipped-artifact link. 2026 signal shift: Microsoft/Meta interviewers literally click resume URLs, and LinkedIn's APB is a no-resume, shipped-60s-demo path. He has THREE shippable products (loyalty app, CV telemetry, lead-gen agent) and links none of them \u2014 a large, cheap asymmetric miss.", "No single declared spike/archetype. The resume spans food-vending, dev-tooling, and edtech productivity \u2014 impressive range for YC, but there is no top-third positioning line ('0->1 AI Product Builder' or similar) to give a recruiter one memorable slot. Currently the reader has to synthesize the identity themselves during a 7-second scan.", "Inline org-scale context is thin. SailLoft and Elephant get no headcount/revenue/user-base framing ('180+ person, >$25M rev' style), so a reviewer skimming the F-pattern can't weight the unfamiliar employers. Biryani Blitz has strong context (Wharton/UNC/Shark Tank), but the two W-2-style roles are un-contextualized.", "Individual-vs-collective ownership is mostly good but 'Led the 0->1 launch of an internal Gerrit-based software-test product' at a 2-month internship risks reading as inflated scope; it would be stronger with the specific decision HE made and the team size he influenced without authority."], "firmSignals": {"universalPatterns": ["One-page, single-column, ATS-safe PDF (no tables/columns/graphics), education near top for early-career, hyperlinked GitHub/portfolio \u2014 this exact format is the accepted norm at nearly every firm.", "Every bullet is quantified with outcome metrics (users, %, revenue, latency, conversion). Unquantified 'responsible for' bullets are the single most-cited screen-out across all firms; multiple sources report adding metrics improved callback rate substantially.", "The 'Accomplished X as measured by Y by doing Z' bullet structure (Google/Amazon's published formula) works everywhere \u2014 action verb + skill + quantified result.", "0-to-1 builder / founder evidence substitutes for a formal PM title at every PM-track firm. Owning the full product loop (user research -> spec -> build -> ship -> measure) beats a passive but prestigious internship.", "Depth over breadth: 2-3 substantial, defensible projects with live GitHub (READMEs, tests, deployed) beat a long list of shallow repos. SWE interviewers grill exact metrics and personal ownership ('I' not 'we').", "A prior technical internship is near table-stakes for SWE tracks and strong signal for PM \u2014 Freeport covers this.", "Apply EARLY in the rolling cycle (first 72 hours to first 2 weeks); late applications are a self-inflicted disadvantage regardless of resume strength.", "Authentic, firm-specific 'why this company' tied to real products/mission beats generic interest; spray-and-pray reads as a red flag.", "AI-native / shipped-AI work (agents, RAG, evals) is a genuine 2026 weight-adder across PM and SWE tracks, provided it links to a real artifact rather than listing 'AI' as a bare skill.", "Referrals materially help (reported ~3x recruiter-screen lift at some firms) but are explicitly not mandatory at any of them.", "User-research evidence (Neal's 500+ interviews) is a rare, quantifiable PM differentiator screened for at essentially every PM-track firm.", "Technical/data-infrastructure PM tracks (Databricks confirmed, plausibly similar at other data/dev-tools platforms) increasingly state SQL/Python/AI-tool usage as LITERAL requirements on the posting itself, not soft preferences \u2014 worth explicitly naming these tools on the resume rather than assuming technical depth is inferred from projects alone."], "firmSignalCards": [{"firm": "Google", "topSignals": ["Google's own X-Y-Z bullet formula on EVERY line ('Accomplished X as measured by Y by doing Z') \u2014 the single most Google-specific resume tell", "Reframing non-PM founder/side-project work AS PM experience via storytelling (the accepted 'talked about it as if he was a PM' archetype)", "Visible mix of the 3 things Google screens: shipped product + data/analytics literacy (SQL, metrics driving decisions) + user research", "'Leadership and initiative' as a concrete artifact (founded/led something), not membership", "GPA shown only if >3.5; integrity on transcript treated as bigger deal than a mediocre GPA"], "differentiator": "Storytelling that turns non-PM experience into a credible end-to-end PM narrative \u2014 'how you tell the story,' not the literal title.", "nealFit": "strong", "nealAction": "Rewrite Biryani Blitz and the 500+ interviews as full product cycles in strict X-Y-Z form, surfacing metrics that DROVE decisions (not just model performance) to hit the analytics screen."}, {"firm": "Meta", "topSignals": ["Product sense framed as 'building for billions of real people' with DAP/MAP-style metrics (retention, activation, engagement) \u2014 not DAU/MAU", "Leadership by influence, not authority \u2014 'rallied cross-functional team,' explicitly NOT 'CEO of the product' / solo-hero framing", "Entrepreneurship, consulting, or civic-engagement backgrounds (the 3 named high-hit-rate profiles)", "Scrappiness / 0-to-1 under constraint as a named Meta signal", "Correct-lane awareness: apply to standard PM summer internship (penultimate-year), NOT Meta University (freshmen/soph only); RPM is full-time post-grad"], "differentiator": "Product sense + analytical experimentation (A/B-tested decisions) weighted over project-management chops, plus leadership-by-influence over solo output.", "nealFit": "medium", "nealAction": "Add a bullet showing he rallied engineers/designers around a shared goal (influence, not solo build) and reframe Biryani Blitz metrics as retention/activation/engagement outcomes."}, {"firm": "Amazon", "topSignals": ["Story bank explicitly mapped to the 16 Leadership Principles in STAR form, ~60% on Action, 'I' not 'we' \u2014 Customer Obsession is the flagship", "Per-req GRADUATION-YEAR gate is the top filter (many SDE reqs say a single year e.g. '2027 only') \u2014 must match May-2028 window", "SDE: two-problem OA (medium warm-up + harder graph/tree/DP/heap) in 70-90 min, think out loud, state complexity", "PMT track: technical-plus-business bridge \u2014 metric ownership + system-design/API tradeoff reasoning", "Applied early (Jan for summer); referrals low-impact for interns, direct apps convert"], "differentiator": "Leadership Principles fit is weighted at or above coding for interns \u2014 authentic self-reflective STAR stories (including 'what I'd do differently') mapped to specific LPs.", "nealFit": "strong", "nealAction": "Build a curated LP-mapped STAR story bank (Biryani Blitz = Customer Obsession/Ownership/Bias for Action/Deliver Results) and verify the correct grad-year req before applying."}, {"firm": "Microsoft", "topSignals": ["Interdisciplinary 'business + tech + UX' framing \u2014 the exact trio recruiters singled out (Neal's CS+Business maps directly)", "Technical fluency you can DISCUSS (frameworks/APIs/languages) because a SWE runs part of the PM loop", "Customer-discovery/design-thinking artifacts (design sprints, user interviews shaping a product)", "2026 responsible-AI judgment: reasoning about privacy-vs-speed tradeoffs and using AI agents to streamline workflows", "Resume keyword-tailored to the specific req + a technical-skills block naming Azure/ADX; public GitHub non-negotiable"], "differentiator": "A novel self-designed interdisciplinary story fusing business + tech + UX, plus ability to reframe lived experience as PM thinking on the spot (non-standardized loop rewards authentic domain depth over memorized frameworks).", "nealFit": "strong", "nealAction": "Add a crisp cross-functional coordination story (how he split work across eng/design/data) and a PM-keyword + Azure/ADX skills pass, since founder builds may read as solo."}, {"firm": "Airbnb", "topSignals": ["Design-led product sense: full host AND guest customer-journey mapping (two-sided marketplace literacy)", "Storytelling + authentic 'belonging'/mission fit weighted as heavily as credentials \u2014 unusual vs peer FAANG", "Take-home is a LIVE panel presentation \u2014 narrative packaging/communication is a graded axis", "User empathy over pure number-crunching (metrics without customer story get down-weighted)", "Do NOT redesign Airbnb itself as the headline project (reads as unoriginal)"], "differentiator": "Cultural/values ('belonging') fit and design-driven storytelling graded at least as heavily as raw credentials \u2014 authentic mission-driven narrative over resume-stuffing.", "nealFit": "medium", "nealAction": "Reframe one project (e.g. Biryani Blitz) around two-sided host/guest-style user thinking and produce a customer-journey/storytelling artifact, since his profile reads builder/quant, not design-narrative."}, {"firm": "DoorDash", "topSignals": ["Three-sided-marketplace tradeoff reasoning (customers vs Dashers vs merchants; who wins/who loses)", "Operational failure-mode thinking ('a live order goes sideways,' 'a neighborhood runs out of drivers') over vision decks", "PM data literacy as table-stakes: SQL + A/B testing + metric definition/iteration", "SWE: OA of 2 Medium/Hard (reportedly harder than the onsite) \u2014 100+/NeetCode-150 reps; backend Kotlin/Java/Scala + microservices", "Authentic why-DoorDash (every employee Dashes 4x/year); a documented skew means non-targets need a differentiated founder/project portfolio"], "differentiator": "Operational/execution 'mini-GM' thinking \u2014 fixing live marketplace failure modes under ambiguity, not proposing shiny new features.", "nealFit": "medium", "nealAction": "Lean the food/logistics Biryani Blitz founder story as authentic why-DoorDash + three-sided-marketplace framing, and add explicit SQL/A-B-testing PM bullets (plus a referral to offset non-target skew)."}, {"firm": "Salesforce", "topSignals": ["Enterprise/B2B/platform systems thinking (multi-stakeholder, compliance, Customer 360) \u2014 the top differentiator vs consumer-app sense", "'Track record of shipping' \u2014 'I built X that did Y for Z users' (one accepted intern built an AI recommendation engine in 6 weeks)", "AI-native framing tied to Agentforce/Einstein/next-best-action", "Salesforce-ecosystem depth (Trailhead badges, Dreamforce/Agentforce keynote awareness) woven into answers, not generic frameworks", "Reframing non-PM (SWE/founder) roles 'through a PM lens' with measurable impact"], "differentiator": "Enterprise systems thinking \u2014 understanding complex B2B/platform/multi-stakeholder environments rather than consumer product sense.", "nealFit": "medium", "nealAction": "Recast the AI-native builds as enterprise/multi-stakeholder AI product work (mirroring Agentforce/recommendation-engine framing) and earn Trailhead badges to signal ecosystem depth; his projects otherwise read consumer-scale."}, {"firm": "Atlassian", "topSignals": ["Everything graded against the named '4 Pillars': Communication, Leadership, Product Intuition/Craft, Execution/Drive \u2014 map bullets to these", "The 72-hour take-home teardown is decisive (~40% fail): find ONE genuinely 'meaty' problem with business value, NOT a feature laundry list", "0-to-1 driven-a-product evidence explicitly substitutes for formal PM titles (a small fraction APMs are CS/eng)", "B2B / developer-tools affinity (Jira/Confluence/Trello) over consumer-only product sense", "Structured storytelling: problem -> users -> assumptions -> solution -> success metrics"], "differentiator": "The 72-hour take-home teardown graded on finding one prioritized 'meaty' problem with business value \u2014 ruthless prioritization is the make-or-break filter.", "nealFit": "medium", "nealAction": "Practice ruthless prioritization to ONE meaty B2B/dev-tools problem for the take-home (his builder instinct to propose many features is the #1 failure point) and build genuine Atlassian-suite affinity."}, {"firm": "Ramp", "topSignals": ["'Slope over intercept' \u2014 a visibly steep 0-to-1 build trajectory matters more than school pedigree", "SWE: CTF app gate (a non-standard CTF-style gate) precedes any human review \u2014 treat as required, not a nuisance", "SWE: CodeSignal Industry Coding OA (one problem, 4 layered levels, 90 min) with recurring concurrency/API/banking themes \u2014 spec-layering, not classic LeetCode", "'Everyone is a builder who owns problems end-to-end'; AI-native products explicitly foregrounded in current postings", "Fintech domain density (spend/cards/payments/fraud/reconciliation) and NYC-HQ in-person bias"], "differentiator": "'Slope over intercept' \u2014 a steep, self-driven builder trajectory of things actually shipped, filtered via non-standard practical formats (CTF gate, spec-layering OA) rather than LeetCode grinding.", "nealFit": "strong", "nealAction": "Prepare the CTF gate + CodeSignal spec-layering/concurrency format specifically, and bridge Black Box's financial-data work explicitly toward Ramp's spend/cards/reconciliation domain."}, {"firm": "Plaid", "topSignals": ["Explicit API/fintech keywords: 'built REST endpoints,' 'OAuth 2.0 flow,' 'JWT/auth,' 'JSON data pipeline,' third-party API integration", "Failure-mode fluency \u2014 idempotency, exactly-once, retries, circuit breakers, duplicate detection, reconciliation under unreliable upstream data (the deepest differentiator)", "Product-minded engineering: awareness that Plaid's customers are DEVELOPERS (clean API contracts, error codes, docs as UX)", "SWE: practical OA (transaction categorization, duplicate detection, fixing a broken codebase) over LeetCode DP, but still clean/fast on mediums", "PM: published case study (research -> PRD -> prototype -> metric) with SQL/Amplitude/Figma tooling; a documented skew"], "differentiator": "A 'failure-mode mindset' \u2014 proactively reasoning about idempotency, retries, and duplicate detection under unreliable upstream financial data; hand-waving here is a documented disqualifier.", "nealFit": "medium", "nealAction": "Retrofit a Black Box story into Plaid's vocabulary \u2014 REST endpoints, OAuth, JSON pipelines, and explicit dedup/idempotency/reconciliation logic \u2014 turning finance-adjacent work into fintech-API-native signal."}, {"firm": "Bloomberg L.P.", "topSignals": ["A shipped project with REAL users still running (durability/impact > project quantity) \u2014 the interview opens by walking through resume projects", "C++ / systems / real-time streaming-data depth (STL, RAII, smart pointers) \u2014 the default Terminal-team language signal", "Genuine markets curiosity tied to actual Bloomberg products (bond pricing, options Greeks, yield curves, the Terminal) for BFE/financial-product teams", "Medium-to-hard DS&A prep (LRU cache, streaming median, trees/graphs) \u2014 the OA + first round gate", "GPA at/above the 3.3 floor; 1+ year of school remaining"], "differentiator": "A durable, still-running shipped project with real users, narrated well in the opening project-walkthrough round \u2014 impact/craftsmanship over project count.", "nealFit": "medium", "nealAction": "Reframe Black Box as engineered real-time streaming data infrastructure (latency, data structures) for the BFE markets-curiosity angle, and close the DS&A gap for the medium-to-hard OA."}, {"firm": "JPMorgan Chase", "topSignals": ["Code for Good hackathon is the highest-yield entry path (easier to convert than the direct SEP req; scored on teamwork + Git contribution + mentor acknowledgment)", "A deployed full-stack/MERN web app (React/Node/DB) \u2014 the hackathon deliverable rewards this over backend/ML-only", "HackerRank OA is a hard pre-review gate (~2 easy + 1 medium: arrays/strings/sliding window/backtracking) \u2014 near-perfect score expected", "GPA at/above the stated 3.2 floor, prominently listed; CS/eng major preference", "AI-assisted development competency (named 2025+ differentiator) + the JPMorgan Forage virtual experience as a cheap interest signal"], "differentiator": "The Code for Good hackathon pathway \u2014 a team-scored, collaboration-and-delivery route that converts better than the standard SEP req.", "nealFit": "medium", "nealAction": "Target the Code for Good hackathon (not just SEP), build/surface a deployed full-stack React/Node app, and grind the HackerRank-style OA to near-perfect; also add the Forage line and confirm GPA >=3.2 is shown."}, {"firm": "Palantir", "topSignals": ["Project-first resume: 'problem -> technical approach -> quantified result' with LIVE GitHub of non-trivial, documented, defensible code", "Every bullet survivable under a 15-min deep-dive grill on exact metrics, tradeoffs, and true ownership ('I' not 'we')", "FDSE = technical + product/client hybrid ('startup CTO/CEO inside Palantir') \u2014 comfort with ambiguity, spec-less problems, end-to-end ownership", "A genuine, specific mission articulation for the government/defense-adjacent work (founder-level offer approval; culture fit is a real gate; US-gov FDSE needs citizenship)", "Meritocracy stance de-prioritizes elite-school pedigree \u2014 strong builder track record can override a non-target school"], "differentiator": "Being energized by ambiguity plus a load-bearing, specific mission conviction (defense/government) that founders must approve \u2014 culture/mission fit is a genuine gate, not a formality.", "nealFit": "strong", "nealAction": "Develop a genuine, specific 'why Palantir's institutional/government mission' answer and confirm Biryani Blitz/Black Box/AI projects have clean, public, documented GitHub repos he can defend end-to-end."}, {"firm": "Jane Street", "topSignals": ["Competitive-programming credential (ICPC/Codeforces-Red/USACO Platinum/Putnam) is the true override signal \u2014 the documented non-target backdoor", "Clean, correct, incrementally-extensible code (interview layers requirements onto one problem: Connect-K, Tetris rotation, Merkle tree, LRU)", "Deep fluency in ONE language over many; explicitly do NOT cosplay OCaml to seem like a fit", "Depth over breadth \u2014 a few substantial correctly-engineered projects (compilers/systems/research) beat shallow hackathon lists", "~80% Ivy+/tier-1 CS pedigree; a personal trading bot is an authentic, cited stand-out signal"], "differentiator": "A competitive-programming rating/placement \u2014 the one credential that can override GPA and non-target school in a <1%, prestige-heavy funnel.", "nealFit": "weak", "nealAction": "Convert the Black Box trading bot into a clean, defensible deep artifact and build live incremental-implementation fluency (Connect-K/LRU style); without a CP credential the prestige headwind is real, so this is a reach."}, {"firm": "Anthropic", "topSignals": ["Not a fit by design: no PM/SWE internship or APM program exists \u2014 PM roles are experienced hires ($385K-460K, 2+ yrs PM min); applying to a nonexistent intern posting signals no research", "Only early-career on-ramps are the Anthropic Fellows Program (4-mo research residency, Python-fluent) and Claude Corps", "Technical credibility EMBEDDED in impact bullets + proof-of-work artifacts (shipped AI projects, personally-built agentic evals / SWE-bench-style suites)", "Daily frontier-tool user (Claude Code) who can articulate desired model-behavior changes", "A defensible, specific AI-safety point of view (naming where you DISAGREE with Anthropic's published work) \u2014 the culture round is the real bar"], "differentiator": "Technical depth beats seniority ('junior PMs with strong AI skills beat senior PMs without them'), gated by a culture interview testing genuine safety conviction and intellectual honesty.", "nealFit": "weak", "nealAction": "Treat this as a future/Fellows target, not a 2027 intern app: build a public agentic-eval suite (SWE-bench-style), become a documented daily Claude Code user, and write a defensible AI-safety POV."}, {"firm": "Datadog", "topSignals": ["Systems thinking weighted unusually high \u2014 volunteer consistency/availability tradeoffs, caching, bottleneck analysis; treat observability/monitoring as a first-class design concern", "An 'observability-flavored' project (a 'mini-Datadog' metrics/logging/tracing tool) is a documented interview-trigger; OSS to dd-trace/datadog-agent noted", "Go proficiency is a differentiator (Datadog's backend is primarily Go) + cloud/infra (AWS/GCP, Terraform, Prometheus/Grafana)", "PM: technical-plus-business profile with B2B/enterprise product exposure; the PM technical round (whiteboard a system design) is the hardest part", "Apply in first ~72 hours; skip the cover letter; a documented skew so UNC is fine"], "differentiator": "Systems/observability thinking weighted unusually high for both tracks \u2014 treating monitoring/scale tradeoffs as first-class is the specific tell interviewers reward.", "nealFit": "strong", "nealAction": "Build a small 'mini-Datadog' observability project (ideally in Go) and reframe Black Box bullets with systems-scale metrics (latency/throughput/availability tradeoffs) to hit the systems-thinking screen."}, {"firm": "Databricks", "topSignals": ["Live PM Intern req explicitly requires (not just prefers) a CS/engineering major, practical SQL and/or Python, and hands-on AI-tool usage \u2014 stricter, literal technical gating than most peer PM internships", "Databricks PMs' 'customer' is internal engineers and enterprise technical practitioners, not consumers \u2014 developer/engineer empathy is the core differentiator, not consumer product sense", "AI-forward framing tied to Databricks' own Mosaic AI / Genie push \u2014 hands-on agentic-AI/LLM project work maps almost verbatim to the JD's stated requirement", "Full end-to-end ownership language in the JD ('design through launch and iteration') rewards candidates who can point to owning a build, not just analysis", "Fluency in the 'modern data stack' vocabulary (lakehouse, Delta Lake, Unity Catalog, Spark) is what separates strong candidates in the (adjacent, not intern-confirmed) full-time PM loop \u2014 plausibly relevant at the intern level too"], "differentiator": "Data/AI-infrastructure technical depth + developer empathy \u2014 the opposite axis from Salesforce's enterprise-B2B-platform differentiator; Databricks screens for hard technical fluency, not business/enterprise systems thinking.", "nealFit": "strong", "nealAction": "Translate Black Box and project-aistocktriage's distributed-systems/ML depth into Databricks' own vocabulary (lakehouse, Delta Lake, Spark, MLflow) instead of assuming it transfers automatically \u2014 the underlying technical bar (CS major, SQL/Python, hands-on AI tools) is already a near-literal match, this is a framing fix, not a skills gap."}], "nealPriorityMoves": ["Do a global quantification + X-Y-Z rewrite of every bullet (Biryani Blitz, Freeport, Black Box, AI projects) into 'Accomplished X as measured by Y by doing Z' with real user/%/revenue/latency metrics. This is the single move that unlocks the MOST firms \u2014 it is the top screen at Google, Amazon, Meta, Atlassian, DoorDash, Datadog, Bloomberg, Palantir, and Plaid simultaneously.", "Close the LeetCode/DS&A gap with a NeetCode-150-level grind. It is the hard, pre-human-review gate for every SWE track (Amazon, DoorDash, Bloomberg, JPMorgan, Datadog, Ramp, Plaid, Jane Street, Palantir) and Neal's most concrete blocker.", "Reframe Biryani Blitz + the 500+ user interviews as a full PM product cycle (research -> spec -> build -> ship -> measure, 'I'-owned) \u2014 this converts his strongest asset into the title-substitute that every PM-track firm (Google, Meta, Microsoft, Airbnb, DoorDash, Salesforce, Atlassian) explicitly accepts.", "Audit/clean public GitHub for the 2-3 flagship projects (READMEs, architecture diagrams, tests, deployment) so every listed project is defensible under a deep-dive grill \u2014 required at Palantir, Datadog, Bloomberg, Plaid, Jane Street, Microsoft.", "Add explicit PM data-literacy signals (SQL, A/B testing, metric definition/ownership) plus a technical-skills block \u2014 needed for DoorDash, Plaid, Salesforce, Amazon PMT, and the analytical screens at Google/Meta.", "Apply early in each rolling cycle and secure 1-2 referrals, prioritizing non-target-skew firms (DoorDash, Plaid) where a referral gives ~3x screen lift and offsets UNC not being a core feeder school.", "Build firm-specific domain artifacts where the payoff is highest: a 'mini-Datadog' observability tool (Go) for Datadog, a fintech-API/idempotency retrofit of Black Box for Plaid/Ramp, Trailhead badges for Salesforce, and the JPMorgan Forage + a deployed full-stack app for Code for Good.", "Deprioritize (for Summer 2027): Anthropic has no intern/APM funnel (experienced-hire only), and Jane Street is a CP-pedigree reach without a competitive-programming credential \u2014 spend that time on the strong/medium-fit firms instead."], "_sourcing": "Firm signals are distilled from PUBLIC sources (accepted-resume threads, published teardowns/samples, program pages, observable public profile patterns). Precise internal stats have been softened where unverifiable. Treat as directional, not gospel \u2014 verify current process on the source before relying on any specific claim."}, "firmResearch": [{"firm": "Google", "roleFocus": "Associate Product Manager (APM) Internship \u2014 Summer, for rising seniors / penultimate-year students; ~13-week US-based program that feeds the full-time APM pipeline. Publicly cited as ~8,000 applicants for ~40 spots (~0.5-1% acceptance).", "acceptedResumePatterns": ["No formal PM title required \u2014 accepted candidates repeatedly reframe founder/startup/side-project work AS their equivalent PM experience. The most-cited example (Joseph Choi, iykyk) built an ecommerce business, co-founded a clothing brand, and assembled a 9-person eng+design team to build a dating app end-to-end (user research -> product dev), then talked about it 'as if he was a PM.'", "One page, plain/AI-scannable format (10-11pt, 1in margins, no graphics). Education near top for students; GPA shown only if >3.5; hyperlinked LinkedIn/GitHub/portfolio.", "Bullets follow Google's own published X-Y-Z formula: 'Accomplished [X] as measured by [Y], by doing [Z].' Every accomplishment is quantified (users, %, revenue, latency) \u2014 this is the single most repeated Google-specific resume signal.", "Visible mix of the three things Google says it screens for: (1) shipped/built product or software, (2) data/analytics literacy (SQL, metrics informing decisions), (3) user research (qualitative or quantitative user studies) \u2014 plus design awareness.", "Demonstrated 'leadership and initiative' as a concrete artifact: founded a club, led a hackathon team, ran an org, or drove a project independently \u2014 not just membership.", "'Experience leading entrepreneurial efforts or outreach within organizations while building cross-functional relationships' \u2014 this exact phrase from the JD shows up in accepted profiles as founder/team-lead work spanning eng + design + business.", "Technical fluency signalled but not deep CS \u2014 enough to 'work well with engineers' (languages listed, projects with real code/GitHub), not LeetCode-grade algorithm depth.", "Application-timing / referral behavior: accepted candidates commonly applied on the day the req opened and/or got a Googler referral to speed review (referrals help but are explicitly not mandatory).", "Observable LinkedIn trajectory of interns/APMs: penultimate-year students at strong CS/eng programs, often with a prior tech internship OR a self-driven venture, plus a public-facing 'builder' artifact (co-founder title, launched app, published project)."], "differentiators": ["Storytelling over frameworks: the standout theme across first-person accounts is turning non-PM experience into a credible PM narrative \u2014 'how you tell the story and show you gained relevant skills' \u2014 rather than having the literal title.", "Quantified impact on EVERY bullet via X-Y-Z; unquantified 'responsible for' bullets are the clearest failure mode Google recruiters call out.", "End-to-end product ownership: candidates who ran the full loop (user research -> spec -> build -> ship -> measure) on even a scrappy project beat candidates with a fancier but passive internship.", "'Googliness' signalled through the profile: humility, creativity, drive, comfort with ambiguity, and collaboration \u2014 evidenced by cross-functional team leadership, not asserted.", "Data-driven framing: showing metrics defined problems/decisions (not just outcomes) distinguishes analytical candidates.", "Genuine product interest for Google's ecosystem \u2014 accepted candidates network with Googlers and reference specific Google products, signalling real motivation vs. spray-and-pray."], "firmSpecificRedFlags": ["Unquantified bullets \u2014 Google recruiters explicitly downrank accomplishments with no [Y] measurement.", "Presenting side projects as hobbies rather than as owned product cycles with users and metrics \u2014 wastes the strongest asset a no-title candidate has.", "Integrity issues on transcript/GPA \u2014 first-person accounts stress Google verifies transcripts and treats fabrication as a bigger red flag than a mediocre GPA.", "Pure-SWE positioning with no user/product/leadership signal \u2014 technical depth alone reads as an engineering, not APM, profile.", "Multi-page or over-designed resume; listing trivial skills; paragraph bullets \u2014 all cut against the one-page, AI-scannable norm.", "Applying late in the cycle for a ~40-spot program where day-one applications and referrals materially help."], "nealFitSignals": ["Founded Biryani Blitz (0->1 hardware+AI, Wharton finalist) \u2014 a textbook match for Google's 'leading entrepreneurial efforts' and the accepted 'assembled a team to build X end-to-end' archetype; this IS his equivalent-PM-experience story.", "500+ user interviews \u2014 directly hits Google's 'user studies (qualitative/quantitative research)' screen; a rare, concrete, quantifiable PM signal most no-title applicants lack.", "SWE intern at Freeport (ships fast) \u2014 provides the 'works well with engineers' technical-fluency signal without needing deep CS/PM titles.", "AI-native (agents/RAG/OpenCV) + Black Box trading system (13/13 forward run) \u2014 quantified, buildable artifacts that fit X-Y-Z framing and 'demonstrated passion for building products.'", "CS + Business at UNC, rising to penultimate year (May 2028) with US citizenship and full relocation flexibility \u2014 meets eligibility exactly (technical-adjacent degree, returning student, US work auth).", "Cross-functional builder-PM archetype (hardware + AI + business + user research) maps cleanly to Google's 'cross-functional relationships' and 'Googliness' (creativity, drive, ambiguity)."], "nealGaps": ["No formal PM title \u2014 not disqualifying (many accepted APMs had none), but requires deliberate reframing of Biryani Blitz/Black Box as full product cycles with X-Y-Z metrics, not as engineering or startup 'hobby' lines.", "Resume-craft risk: his real assets must be quantified on every bullet (users acquired, %, revenue, accuracy, latency) \u2014 a builder resume can read as SWE unless the user/metric/decision layer is made explicit.", "Data/analytics-decisions signal may be implicit \u2014 should surface SQL/metrics that DROVE product decisions (not just model performance) to hit Google's analy
