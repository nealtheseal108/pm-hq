fetch("resources.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  var e=(d&&d.entries)||[];
  var dates=e.map(x=>x.dateAdded).filter(Boolean).sort();
  var last=dates.length?dates[dates.length-1]:null;
  var days=last?Math.round((Date.now()-new Date(last))/86400000):null;
  var stale=days!=null&&days>7;
  var meta=document.getElementById("intel-meta");
  var countLine = e.length + (e.length===1?" note":" notes");
  var dateLine = last ? ("snapshot " + last) : "no date on file";
  var staleLine = stale ? ("<div style=\"color:var(--now);font-weight:700;margin-top:1px\">" + days + "d stale — re-check &rarr;</div>") : "<div style=\"margin-top:1px\">view &rarr;</div>";
  if(meta) meta.innerHTML = countLine + " · " + dateLine + staleLine;
}).catch(function(){var m=document.getElementById("intel-meta");if(m)m.textContent="see Resources →";});
</script>

1793870505, "lastSeen": 1794257430, "removedAt": 1794303607, "active": false}, {"company": "WebFX", "title": "Web Developer Intern", "location": "Harrisburg, PA", "url": "https://go.vansh.nyc/13v?s=y", "src": "closed", "nyc": false, "term": "", "firstSeen": 1793524017, "lastSeen": 1793986502, "removedAt": 1794006849, "active": false}, {"company": "West Bend Insurance", "title": "IT Software Engineer Intern", "location": "West Bend, WI", "url": "https://go.vansh.nyc/13x?s=y", "src": "closed", "nyc": false, "term": "", "firstSeen": 1793524017, "lastSeen": 1793956678, "removedAt": 1793986502, "active": false}, {"company": "Western Magnetics", "title": "Software Engineer Intern", "location": "South San Francisco, CA", "url": "https://go.vansh.nyc/13y?s=y", "src": "closed", "nyc": false, "term": "", "firstSeen": 1793524017, "lastSeen": 1794333055, "removedAt": 1794352553, "active": false}], "updated": 1794420556, "feedUrl": "feed-swe.json", "marketEdges": {"_sourcing": "Structural/strategic edges over the broader applicant pool -- distinct from resume-wording tactics (see Resume HQ's Edge Playbook for those). Grounded in this repo's own research (RECRUITING-BLINDSPOTS.md, config.md, per-firm-resume-patterns.json) plus a completed 2026-specific deep-research pass (16 tool calls, real sources checked for each claim, weak claims explicitly downgraded rather than kept for optimism). Confidence levels reflect what was actually verified, not what would be nice to be true.", "edges": [{"edge": "Defense-tech / gov-cloud PM-adjacent pipeline is citizenship-gated and demonstrably talent-constrained", "why": "This is the strongest edge found, with real 2026 evidence behind it. The Pentagon/OPM 'War Force' initiative (launched June 30, 2026) is explicitly recruiting AI/software talent for 2-year DoD tours paying up to ~$200K, requiring US citizenship plus clearance eligibility. Independently, only ~2 million people in the US hold an active federal security clearance (under 0.6% of the population), and the cleared population has dropped nearly 1 million since 2013 even as DoD's FY2026 budget hit $961.6B with heavy AI/cyber emphasis -- a real, citizenship-driven hiring-side supply crunch. Shield AI's own 2026 internship posting requires being 'authorized to work in the United States'; dual-use defense-tech firms (Anduril, Shield AI, Saronic, Skydio) sponsor clearances post-hire and keep entry-level roles uncleared, meaning the citizenship bar screens the applicant pool before the clearance timeline (8-24 months) ever becomes the bottleneck. This structurally and quantifiably shrinks competition versus a Google/Meta APM req open to the whole world's talent pool.", "action": "Treat defense-tech/gov-cloud as its own distinct funnel, not one of 19 equally-weighted targets. Build 2-3 warm intros specifically at Anduril, Shield AI, Saronic (confirmed hiring PM-adjacent/strategy-ops interns in 2026). Frame Black Box explicitly as 'agentic decision systems under uncertainty' -- that maps directly onto defense-tech's actual pitch (autonomous systems, ISR, decision support), far more precisely than a generic consumer-PM framing would.", "confidence": "high", "draftBullets": ["Architected an autonomous forecasting system (Black Box) that trades live on Kalshi under real market uncertainty by building an LLM-driven agentic signal pipeline, RSA-PSS-signed order execution, and a WebSocket data layer, holding a 0.150 Brier score across a 13/13 forward-testing run."], "sources": ["https://www.opm.gov/news/news-releases/war-force-to-recruit-top-engineers-to-enhance-american-military-technological-dominance/", "https://www.militarytimes.com/news/pentagon-congress/2026/07/06/pentagon-launches-war-force-campaign-in-push-for-software-engineers/", "https://news.clearancejobs.com/2026/06/30/pentagon-and-opm-launch-war-force-recruiting-and-hiring-initiative-for-ai-and-software-engineers/", "https://breakingdefense.com/2026/06/pentagon-seeks-to-hire-hundreds-of-software-engineers-for-2-year-tours/", "https://jobs.lever.co/shieldai/1721f9b3-b098-4988-bbb6-2d0382936be5"]}, {"edge": "Rare triple-combination: technical depth + real 0-to-1 shipped product + genuine agentic-AI fluency, all three at once", "why": "Most competing APM applicants are strong on ONE of these axes -- either technical (CS-only) or business (no real technical depth) -- and very few have BOTH plus a real, deployed, revenue-generating 0-to-1 product (Biryani Blitz) AND hands-on agentic-AI building experience (Black Box's LLM/agent pipeline) that predates the current wave of vague 'I used ChatGPT' resume claims.", "action": "Lead with this exact combination explicitly in positioning (already the core thesis of the per-firm resume research and the Compare-to-Optimal tool) -- the edge is real but only pays off if stated as ONE coherent identity, not scattered across three unrelated bullets.", "confidence": "high", "summaryLine": "CS + Business builder who ships: architected an autonomous trading system (Black Box \u2014 0.150 Brier, 13/13 live) and founded a 0\u21921 hardware/AI product (Biryani Blitz \u2014 Shark Tank S18, 200+ user interviews). Technical depth and product ownership, not one or the other.", "bulletNote": "This edge is a POSITIONING line, not a standard bullet \u2014 it's meant for a resume summary/headline or an interview 30-second pitch, since it explicitly names the combination across two experiences rather than describing one accomplishment. See summaryLine.", "draftBullets": [], "sources": []}, {"edge": "AI-tool fluency is bifurcated in 2026 -- claiming it is now a negative signal, shipping with it is a real one", "why": "Confirmed real and important to get right: 78% of job applications now carry AI-generated content, and a 2025 survey of 600 hiring managers found 33.5% claim to spot AI-generated resumes in under 20 seconds -- meaning a bare 'I used AI tools' claim now reads as a NEGATIVE signal (oversaturated, associated with low-effort applications), not neutral. But a distinct signal -- having actually SHIPPED something real with agentic tooling (a working MCP server, an autonomous system with real usage, verifiable architecture decisions) -- is a genuine differentiator specifically because the claimed-vs-real gap is so wide that recruiters in AI-adjacent roles now ask for public artifacts precisely to filter out the bare claims. Caveat: this evidence is strongest for AI/ML engineering hiring; the read-through to PM-specific recruiting (which traditionally emphasizes product judgment over technical build skill) is a reasonable inference, not directly confirmed.", "action": "Never write a bare 'used ChatGPT/Claude' resume bullet -- it now reads as a red flag. Instead make Black Box's technical substance verifiable: link the actual repo/architecture, be ready to describe specific agent-orchestration decisions (why Kalshi, what the forecasting pipeline does, what broke and how it was fixed) so it survives a technical follow-up. Position it as evidence of technical judgment and PM-engineering collaboration credibility -- a rarer trait among CS+Business PM applicants who've only taken classes, not shipped agent systems.", "confidence": "medium", "draftBullets": ["Shipped Black Box, a full agent-orchestration forecasting pipeline, by designing signal generation, confidence calibration, and automated RSA-PSS order signing, verifiable via a public repo and a live 13/13 forward-testing run."], "sources": ["https://www.forbes.com/sites/rachelwells/2026/03/18/ai-resumes-are-sabotaging-the-hiring-process-67-of-managers-reveal/", "https://resumepulse.ai/blog/hiring-managers-reject-ai-resumes-2026", "https://jobcannon.io/blog/ai-resume-statistics-2026"]}, {"edge": "Coverage edge: the custom scraper surfaces companies/postings most applicants never find", "why": "Most applicants source targets from word-of-mouth, career fairs, and the same 2-3 famous GitHub tracker repos everyone already uses -- meaning those postings get the most applicants. The 159-company pipeline includes real, live, currently-open roles at companies most peers have never heard of (Glean, Addepar, Rubrik, Greenlight Financial, etc.) sourced via jobright/simplify/direct ATS integration -- structurally lower applicant-to-seat ratio than the famous names. The deep-research pass independently validated the underlying mechanism: real (if imprecisely-quantified) data shows 18-30%+ of postings are effectively stale/ghost and freshness matters directionally, even though exact 'X% more responses' multipliers circulating online aren't from verifiable primary research.", "action": "Don't let prestige bias crowd out the less-famous-but-real targets -- the Pipeline is already season-sorted; work through the full list, not just the household names at the top. The scraper's real value is filtering OUT stale postings so effort concentrates on genuinely fresh reqs. Bonus: the scraper itself (Python + Playwright, 6 ATS integrations, observability/health tracking, carry-forward reliability logic) is a real, shipped technical artifact worth a resume line in its own right \u2014 see the draft bullet.", "confidence": "medium", "draftBullets": ["Built and operate a multi-tier internship-tracking system (Python + Playwright, 6 ATS integrations) that surfaces 159+ live PM/APM postings by automatically filtering stale listings and flagging newly-posted roles within 48 hours."], "sources": ["https://clarifycapital.com/ghost-jobs-2026", "https://clarifycapital.com/job-seekers-beware-of-ghost-jobs-survey", "https://www.entrepreneur.com/business-news/millions-of-job-postings-are-for-ghost-jobs-study/499415"]}, {"edge": "Timing/velocity: applying within the first 24-48h of a posting going live", "why": "Directionally real and already the repo's own documented #1 low-effort lever, but the deep-research pass could NOT verify the precise magnitude claims ('2-3x more interviews') circulating online as rigorous primary research -- they read as marketing content, not peer-reviewed or platform-official data, and nothing is internship-specific. Net: don't repeat a specific multiplier as fact, but the qualitative direction (fresher = better odds, ghost/stale postings are common) is real.", "action": "The scraper now stamps every role with a firstSeen timestamp; the Open Now tab flags anything first seen in the last 48h with a NEW badge. Work that badge first, every time, before touching older postings in the list.", "confidence": "medium", "bulletNote": "This is a BEHAVIORAL edge (an application habit), not resume content on its own \u2014 its resume payoff is already captured in the scraper bullet under the Coverage edge above ('flagging newly-posted roles within 48 hours' is this exact lever, stated as a shipped feature).", "draftBullets": [], "sources": ["https://clarifycapital.com/ghost-jobs-2026"]}, {"edge": "Guaranteed US work authorization (citizen, no sponsorship ever)", "why": "Real, but narrower than the obvious framing. A $100,000 supplemental H-1B fee (proclamation effective Sept 21 2025, upheld in court Dec 2025, running through Sept 2026) does NOT apply to change-of-status petitions filed by F-1/OPT students already in the US -- meaning most international CS/business students at target schools converting OPT-to-H-1B are largely insulated from this specific fee. What IS real: the 2026 wage-weighted H-1B lottery multiplies entries by wage level (a Level IV role gets 4x the entries of a Level I), which structurally disadvantages entry-level/intern-tier sponsorship regardless of the fee headlines -- so international candidates are a genuinely weaker bet for internship-to-FT conversion at the entry-level tier specifically. Also worth knowing: STEM OPT participation hit 165,524 students in 2024 (up 54% YoY), CS the single most popular F-1 major -- the competing international CS applicant pool is large and growing, not shrinking, so this edge is real but not as dominant as the headlines suggest.", "action": "Don't lean on a generic 'no sponsorship needed' line -- it's true but weakly differentiated since most direct UNC/CS peer competitors are also citizens. State it plainly on every application (still a hard knockout field to clear), but the more valuable use of citizenship is the defense-tech lane above, where it's not a soft preference but a hard gate.", "confidence": "medium", "bulletNote": "This is an APPLICATION-FORM field ('authorized to work? Y/N', 'require sponsorship? Y/N'), not resume bullet content \u2014 don't force it into a bullet. Just make sure it's answered correctly and prominently on every application.", "draftBullets": [], "sources": ["https://www.americanimmigrationcouncil.org/blog/trump-100000-fee-h-1b-visa/", "https://www.cdflaborlaw.com/blog/uscis-clarifies-the-100000-h-1b-visa-fee", "https://www.tryalma.com/learn/stem-opt-extension-statistics"]}, {"edge": "Non-target-school alumni respond more because they're asked less often", "why": "CHECKED AND NOT SUBSTANTIATED -- downgraded from the original hypothesis. Every source found for 'alumni response rates beat cold outreach' traces back to uncredentialed career-coaching SEO content with no named study, sample size, or methodology; the specific numbers cited for the same claim ranged wildly (25-40%, 40-60%, 60-80%, '5x') with no reconciliation -- a classic sign of content mills copying and inflating each other, not real data. No source addressed the specific differential claimed (do Stanford alumni at Google get more inbound requests than UNC alumni, causing UNC alumni to respond more readily). This is a plausible-sounding intuition with zero real evidentiary backing found.", "action": "Don't build strategy on the assumption that UNC alumni respond meaningfully better than target-school alumni -- there's no evidence for it either way. The real, well-established lever is just that warm alumni outreach beats cold outreach in general, which is unsurprising and worth doing regardless of school. The Pipeline's alumni-search link is still useful (finding a warm intro is table stakes, not a school-specific edge) -- just don't overweight the non-target-school angle in strategy.", "confidence": "low", "bulletNote": "This is an OUTREACH edge (who you message, not what your resume says) \u2014 not resume bullet content. The action item is using the Pipeline's Alumni link, not writing anything new.", "draftBullets": [], "sources": []}], "notSubstantiated": ["Non-target-school alumni respond at higher rates specifically because they're asked less often -- no real study found; treat as unverified intuition, not an exploitable edge (kept above with honest low confidence rather than deleted, since the underlying action -- do alumni outreach -- is still worth doing for other reasons)."]}, "health": {"total": 1752, "bySrc": {"workday": 7, "greenhouse": 38, "lever": 14, "careerpage": 5, "github": 1264, "ashby": 8, "carried": 416}, "errBySrc": {"workday": 30, "greenhouse": 12, "lever": 3}, "carried": 1143, "trend": [2373, 2387, 2399, 2382, 2432, 2440, 2463, 2462], "updated": 1794420556}, "applied": [{"company": "American Express", "status": "applied"}, {"company": "Datadog", "status": "applied"}, {"company": "Appian", "status": "applied"}, {"company": "Databricks", "status": "rejected"}, {"company": "Microsoft", "status": "applied"}, {"company": "Salesforce", "status": "rejected"}, {"company": "Skydio", "status": "applied", "role": "Hardware Product Management Intern"}, {"company": "Atlassian", "status": "applied"}, {"company": "Chainlink Labs", "status": "applied"}, {"company": "Roblox", "status": "applied"}, {"company": "Mastercard", "status": "applied"}, {"company": "IBM", "status": "applied"}, {"company": "BNY", "status": "applied"}, {"company": "OpusClip", "status": "applied"}, {"company": "Apple", "status": "applied", "role": "Engineering Program Management Undergrad Internship (200664330-3810)", "date": "2026-09-09"}, {"company": "Workiva", "status": "applied", -11-11"}, {"company": "Subsea7", "status": "irrelevant", "role": "Product Intern", "url": "https://jobright.ai/jobs/info/6ac676f8064da25272e1a838?utm_campaign=1047&utm_source=git", "date": "2026-11-11"}, {"company": "Subsea7", "status": "irrelevant", "role": "Product Intern Job Details | Subsea7", "url": "https://jobright.ai/jobs/info/6ac9fad9002e496d4beeb999?utm_source=1099&utm_campaign=Product%20Management", "date": "2026-11-11"}], "title": "SWE Recruiting HQ", "status": "Software Engineer <b>internships</b> \u00b7 Fall 2026 \u2192 Summer 2027 \u00b7 171 targets \u00b7 sorted <b>easiest-LC first</b>", "key": "swe-pipeline-v1", "flag": "swe-targets-v1", "trackers": [["SimplifyJobs \u00b7 Summer 2026", "SJ", "Canonical daily SWE-intern list", "https://github.com/SimplifyJobs/Summer2026-Internships", true], ["vanshb03 \u00b7 Summer 2027", "GH", "Auto + community 2027 SWE list", "https://github.com/vanshb03/Summer2027-Internships", true], ["speedyapply \u00b7 SWE S2027", "SA", "Location-tagged S2027 SWE board", "https://github.com/speedyapply/2027-SWE-College-Jobs", true], ["speedyapply \u00b7 AI/ML S2027", "SA", "S2027 AI/ML-adjacent board", "https://github.com/speedyapply/2027-AI-College-Jobs", true], ["Ouckah / cvrve \u00b7 S2027", "CV", "Dead link \u2014 repo 404s, no 2027 version exists", "https://github.com/cvrve/Summer2025-Internships", false], ["Simplify.jobs", "SM", "No single SWE-wide list URL (scoped lists only) \u2014 reference", "https://simplify.jobs/", false], ["LinkedIn \u00b7 SWE Intern", "LI", "\"software engineer intern\" + referrals", "https://www.linkedin.com/jobs/search/?keywords=software%20engineer%20intern", false], ["NeetCode 150", "NC", "LC pattern prep \u2014 start here", "https://neetcode.io/practice", false], ["UNC Handshake", "HS", "School portal, SSO-walled \u2014 check manually", "https://joinhandshake.com/", false]]};
window.PLAYBOOK_HTML = "<h2>SWE Recruiting Playbook \u2014 Fall 2026 \u2192 Summer 2027</h2>\n\n<p><strong>Track:</strong> Software Engineer Intern. <strong>Bias:</strong> easiest LeetCode rounds first.</p>\n<p><strong>Your edge:</strong> you already *ship* (Freeport SWE, Black Box, fast PR velocity \u2014 Jason:</p>\n<p>&quot;working very fast&quot;). Interviews are the gap, not ability. This playbook attacks the</p>\n<p>gap with the least LC friction.</p>\n\n<p>---</p>\n\n<h3>The one-line strategy</h3>\n\n<p>Apply broadest where the coding bar is lowest, prep LC in parallel, and let the</p>\n<p>scraper surface roles so you apply within 48h of a post. **149 targets, sorted so</p>\n<p>the no-LC and easy-LC companies sit at the top of your pipeline.**</p>\n\n<ul>\n<li><strong>7 no-LC</strong> \u2014 aptitude test / take-home / behavioral only</li>\n<li><strong>60 easy</strong> \u2014 one easy OA, MCQ, or behavioral-heavy loops</li>\n<li><strong>75 medium</strong> \u2014 standard easy-medium LC (very doable with 4\u20136 weeks of prep)</li>\n<li><strong>7 hard</strong> \u2014 LC-hard gauntlet (Databricks, Anthropic, OpenAI, SpaceX\u2026) \u2014 swing later</li>\n</ul>\n\n<h3>Timing reality (read this first)</h3>\n\n<p>It&#x27;s mid-July 2026. <strong>Fall 2026 SWE intern windows are mostly CLOSED</strong> \u2014 they opened</p>\n<p>last winter/spring. What&#x27;s still live *right now*: rolling employers (retail,</p>\n<p>insurance, finance, defense) and late startup posts. So:</p>\n\n<p>1. <strong>Now:</strong> hit the rolling/no-LC companies for a Fall &#x27;26 long-shot, and start LC.</p>\n<p>2. <strong>Late Aug\u2013Nov:</strong> the <strong>Summer 2027</strong> wave opens \u2014 same 149 boards, same scraper,</p>\n<p>   nothing to rebuild. That&#x27;s where the real volume is. Treat Fall &#x27;26 as a warm-up</p>\n<p>   and S2027 as the main event.</p>\n\n<p>---</p>\n\n<h3>Where the LC bar is lowest (start here)</h3>\n\n<p><strong>No LeetCode at all</strong> \u2014 logic/aptitude, take-home, or pure behavioral:</p>\n<ul>\n<li><strong>Epic Systems</strong> \u2014 aptitude + logic test, zero LC. Ships offers fast.</li>\n<li><strong>Capital One</strong> \u2014 &quot;power day,&quot; behavioral + light coding, famously approachable.</li>\n<li><strong>Progressive, Liberty Mutual, USAA, State Farm, Nationwide</strong> \u2014 insurance; behavioral-first.</li>\n<li><strong>Lockheed / RTX / Northrop / Boeing</strong> \u2014 defense; little-to-no LC but <strong>US citizenship</strong> required.</li>\n</ul>\n\n<p><strong>Easy OA / MCQ / behavioral-heavy:</strong></p>\n<ul>\n<li><strong>Finance:</strong> Fidelity, Vanguard, Charles Schwab, Wells Fargo, Discover, Visa, Mastercard, Fiserv, American Express.</li>\n<li><strong>Hardware-cos w/ software roles:</strong> Cisco, Dell, HP, Intel, Micron, Qualcomm, TI, Garmin.</li>\n<li><strong>Health/retail/industrial:</strong> CVS, Cigna, Humana, Abbott, Medtronic, J&amp;J, Target, Home Depot, Lowe&#x27;s, John Deere, Caterpillar, FedEx, UPS.</li>\n</ul>\n\n<p>Land one of these early \u2192 confidence + a name on the resume \u2192 the medium-LC loops get easier.</p>\n\n<h3>The medium tier (your bread and butter)</h3>\n\n<p>75 companies with standard easy-medium LC. This is where most *good* SWE internships</p>\n<p>live \u2014 Salesforce, Adobe, PayPal, Microsoft, Amazon, Bloomberg, the fintech/SaaS</p>\n<p>startups (Figma, Notion, Ramp, Plaid, Brex\u2026), and the games studios. 4\u20136 weeks of</p>\n<p>focused prep makes all of these realistic.</p>\n\n<p><strong>Amazon note:</strong> medium OA (debugging + 2 medium + work-style survey), <strong>rolling</strong>,</p>\n<p>closes silently when full \u2192 apply the day it posts.</p>\n\n<p>---</p>\n\n<h3>LC prep plan (the gap-closer)</h3>\n\n<p>You don&#x27;t need 500 problems. You need <strong>patterns</strong> + <strong>speed</strong>.</p>\n\n<p>1. <strong>Foundation (week 1\u20132):</strong> arrays/strings, hashmaps, two-pointers, sliding window.</p>\n<p>   ~80% of easy/easy-medium OAs. Source: NeetCode 150 (do the &quot;easy&quot; + early &quot;medium&quot;).</p>\n<p>2. <strong>Core patterns (week 3\u20134):</strong> binary search, stack/queue, linked list, trees/BFS-DFS,</p>\n<p>   basic DP. Blind 75 covers the canonical set.</p>\n<p>3. <strong>Speed (ongoing):</strong> timed sets, 2\u20133 problems/day, explain out loud (you&#x27;ll do this live).</p>\n<p>4. <strong>Behavioral (parallel):</strong> 6 STAR stories from Freeport / Black Box / Blitz. The</p>\n<p>   no-/easy-LC companies weight this heavily \u2014 it&#x27;s half the loop.</p>\n\n<p>Rule of thumb: with the foundation done you can already pass the <strong>67 no-/easy-LC</strong></p>\n<p>targets. Don&#x27;t wait for &quot;LC-ready&quot; to apply there \u2014 apply now, prep for the mediums.</p>\n\n<h3>Application tactics</h3>\n\n<ul>\n<li><strong>Speed &gt; polish.</strong> A surfaced role gets applied to within 48h. Rolling employers</li>\n</ul>\n<p>  fill silently.</p>\n<ul>\n<li><strong>One strong SWE resume</strong>, bullet-pointed by impact (you have the material \u2014 Freeport</li>\n</ul>\n<p>  Insiders PR, Black Box, ship velocity). Mirror the JD&#x27;s stack in your skills line.</p>\n<ul>\n<li><strong>Referrals move the needle most.</strong> LinkedIn: filter for UNC alumni + 2nd-degree at</li>\n</ul>\n<p>  target companies; short, specific ask. Handshake for school pipeline.</p>\n<ul>\n<li><strong>Track everything in the HQ pipeline</strong> \u2014 status per company, easiest-LC first.</li>\n</ul>\n\n<h3>How to use the HQ</h3>\n\n<ul>\n<li><strong>Pipeline tab</strong> \u2014 all 149 targets, sorted no-/easy-LC first, with an LC badge and</li>\n</ul>\n<p>  apply links. Tap the status pill to advance (Researching \u2192 Applied \u2192 Interviewing \u2192</p>\n<p>  Offer). Saved on your device.</p>\n<ul>\n<li><strong>Open now tab</strong> \u2014 live feed from the scraper (124 auto-watched boards).</li>\n<li><strong>Timeline tab</strong> \u2014 the Fall &#x27;26 \u2192 Summer &#x27;27 cadence above.</li>\n<li><strong>Trackers tab</strong> \u2014 the community SWE boards to cross-check.</li>\n<li><strong>Playbook tab</strong> \u2014 this doc.</li>\n</ul>\n\n<h3>Live SWE trackers (cross-check the scraper)</h3>\n\n<ul>\n<li><strong>SimplifyJobs/Summer2026-Internships</strong> &amp; <strong>vanshb03/Summer2027-Internships</strong> \u2014 canonical, daily.</li>\n<li><strong>Ouckah / cvrve Summer2027-Internships</strong> \u2014 SWE-focused GitHub lists.</li>\n<li><strong>Simplify.jobs</strong> \u2014 real-time, tagged open/closed.</li>\n<li><strong>LinkedIn</strong> \u2014 &quot;software engineer intern&quot; + your network for referrals.</li>\n<li><strong>UNC Handshake</strong> \u2014 school portal + alumni.</li>\n</ul>\n\n<p>---</p>\n\n<h3>Deploy / automation status</h3>\n\n<p>The SWE scraper shares the PM engine \u2014 run it with <code>TRACK=swe</code>. It writes</p>\n<p><code>public/swe-openings.json</code> and pushes new roles (set <code>NTFY_TOPIC</code>). Same Render cron</p>\n<p>setup as the PM feed once the repo is connected. **Verify each posting&#x27;s term</p>\n<p>(Fall 2026 vs Summer 2027) on the source before applying \u2014 the scraper matches the</p>\n<p>role, not the term.**</p>\n";
</script>
<script>(function () {
  var HQ = window.HQ || {}, PB = window.PLAYBOOK_HTML || "";
  var timeline = HQ.timeline || [], comps = HQ.companies || [], openings = HQ.openings || [];
  var app = document.getElementById("app");
  var esc = function (s) { return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (m) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]; }); };

  // ---- real vs. fuzzy open/close dates ----
  // Two totally different confidence levels feed this board (see build_site.py / scraper.py):
  //   - a scraped role's firstSeen/removedAt are REAL unix timestamps the scraper itself
  //     recorded — no historical close data exists before role-lifecycle.json started running,
  //     so removedAt only ever appears on a role the scraper actually watched disappear.
  //   - companies.json's `openWindow` is a human's best-guess free-text estimate ("mid-Oct
  //     (2-4 week window)") — never a real date, and never silently upgraded into one here.
  // One helper renders both, kept visually distinct, so every tab shows the same thing the
  // same way instead of three slightly-different hand-rolled date chips.
  function shortDate(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    // add the year only when it isn't this year, so an old repost doesn't read as this week's
    var opts = d.getFullYear() === new Date().getFullYear() ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" };
    return d.toLocaleDateString("en-US", opts);
  }
  // target: { firstSeen, removedAt, openWindow } — pass ONLY fields that are actually known;
  // never fabricate a value to fill one in.
  // when the listing went up: the source's own posting date, else the day the scraper first saw it.
  // a posting date LATER than firstSeen is a re-post/edit stamp, so firstSeen wins then.
  function releasedAt(r) {
    if (!r) return 0;
    if (r.postedAt && (!r.firstSeen || r.postedAt <= r.firstSeen)) return r.postedAt;
    return r.firstSeen || 0;
  }
  function formatListingDates(target) {
    if (!target) return "";
    if (target.removedAt) {
      return '<span class="datechip datechip-closed" title="scraper stopped seeing this posting on this date">Closed ' + esc(shortDate(target.removedAt)) + "</span>";
    }
    if (target.postedAt && (!target.firstSeen || target.postedAt <= target.firstSeen)) {
      return '<span class="datechip datechip-open" title="date the company posted this listing">Posted ' + esc(shortDate(target.postedAt)) + "</span>";
    }
    if (target.firstSeen) {
      return '<span class="datechip datechip-open" title="scraper first saw this posting on this date">Opened ' + esc(shortDate(target.firstSeen)) + "</span>";
    }
    if (target.openWindow) {
      return '<span class="datechip datechip-est" title="human estimate, not a scraped date">Est. opens: ' + esc(target.openWindow) + "</span>";
    }
    return "";
  }

  // [name, initials, description, url, live] — live=true means the scraper actually pulls
  // roles from this into the feed; live=false means it's a reference link you check yourself.
  // Checked 2026-07-16: APM List's page data is byte-for-byte the same company/job IDs as
  // Simplify's (90%+ ID overlap) — it's a wrapper around Simplify's own dataset, not an
  // independent source, so scraping it too would just re-ingest duplicates. Tsenta is an
  // auto-apply BOT product, not a listing to pull from (and the recruiting research explicitly
  // flags auto-apply tools as a velocity-detection risk — not something to wire in anyway).
  var TRK = [
    ["GitHub · vanshb03 S2027", "GH", "Auto + community 2027 list — product roles", "https://github.com/vanshb03/Summer2027-Internships", true],
    ["GitHub · Simplify / Pitt CSC", "GH", "Canonical daily-updated list, PM section", "https://github.com/SimplifyJobs/Summer2026-Internships", true],
    ["GitHub · jobright PM Internship", "GH", "jobright.ai PM-internship repo — 2027-tagged rows (mirrors Simplify); pulled into the feed", "https://github.com/jobright-ai/2026-Product-Management-Internship", true],
    ["Simplify · APM Intern", "SJ", "Real-time board, tagged open/closed", "https://simplify.jobs/top-list/Associate-Product-Manager-Intern", true],
    ["Intern-List · PM", "IL", "jobright.ai-backed PM-intern aggregator", "https://www.intern-list.com/?k=pm", true],
    ["APM List", "AL", "apmlist.org — same dataset as Simplify above (verified), not independent", "https://apmlist.org/list/Associate-Product-Manager-Intern", false],
    ["Tsenta", "TS", "Auto-apply bot, not a listing — not something we scrape or recommend using", "https://tsenta.com/", false],
    ["LinkedIn · PM Intern", "LI", '"product management intern" + network (no scrapeable API)', "https://www.linkedin.com/jobs/search/?keywords=product%20management%20intern", false],
    ["UNC Handshake", "HS", "School portal, SSO-walled — check manually", "https://joinhandshake.com/", false]
  ];
  var TRACKERS = HQ.trackers || TRK;                     // per-track override (SWE passes its own)
  var LCLABEL = { none: "No LC", easy: "Easy LC", medium: "Med LC", hard: "Hard LC" };
  // season/open-date lookup (built once from HQ.companies, which already carries season+sr+mr from build_site.py)
  var SEASON = {};
  comps.forEach(function (c) { if (c.season) SEASON[c.c.toLowerCase()] = { season: c.season, sr: c.sr, mr: c.mr }; });
  function seasonOf(name) { return SEASON[(name || "").toLowerCase()] || { season: "", sr: 9, mr: 99 }; }
  // fuzzy hand-estimated open window (companies.json openWindow), same lookup pattern as SEASON —
  // used as the last-resort fallback in formatListingDates() when there's no real scraped date
  var OPENWIN = {};
  comps.forEach(function (c) { if (c.ow) OPENWIN[c.c.toLowerCase()] = c.ow; });
  function openWindowOf(name) { return OPENWIN[(name || "").toLowerCase()] || ""; }
  var SEASON_ORDER = ["Summer", "Fall", "Winter", "Spring", "Rolling", "Unknown"];
  var openSeasonFilter = "";   // "" = all seasons, for the Open Now tab
  // --- prestige tiers for the Open Now tab (tiers 1-3 = tech, ordered by prestige, startups -> 3;
  // tier 4 = non-tech / everything else). Matched by company-name substring; unknown tech/startups
  // default to 3. Edit these lists to re-rank any company. ---
  var TIER1 = ["airbnb","amazon","anthropic","apple","databricks","facebook","figma","google","jane street","meta","microsoft","netflix","nvidia","openai","palantir","salesforce","stripe","tesla","uber"];
  var TIER2 = ["adobe","amd","american express","amex","appian","atlassian","bytedance","canva","capital one","cisco","cloudflare","coinbase","coupang","crowdstrike","datadog","discord","doordash","dropbox","duolingo","epic games","gemini","godaddy","gusto","hubspot","ibm","instacart","intel","linkedin","lyft","mastercard","naver","notion","okta","oracle","paypal","pinterest","qualcomm","qwen","reddit","robinhood","roblox","samsung","sap","servicenow","shopify","snap","snowflake","spotify","square","tencent","tiktok","twilio","twitch","unity","visa","workday","zoom","zscaler"];
  // Tier 2.5 = (a) big, famous NON-tech names (marquee finance, consulting, hardware, big brands)
  // and (b) $500M+-valuation private startups -- either would otherwise sink into Tier 3/4 by the
  // substring rules. Pulled up per Neal 2026-09-10. Edit these lists to re-rank any company.
  var TIER25 = ["dedalus","dick's sporting","directv","dtcc","ernst & young","goldman","hewlett","home depot","hp enterprise","hp inc","id.me","infineon","machina","macy's","novo nordisk","pimco","pwc","red hat","schwab","skydio","u.s. bank","us bank","usaa","vanguard","west monroe"];
  // $500M+ private startups (unicorns / soonicorns). Excludes anything already public (Affirm,
  // Block, Toast, SoFi, Rivian, Circle, Chime, Klarna, Wise, GitLab...) and quant/HFT firms.
  var TIER25_STARTUPS = ["1password","abridge","addepar","airtable","anchorage digital","anduril","astranis","base power","brex","carta","chainalysis","consensys","crypto.com","deel","deepgram","fireblocks","fivetran","flexport","glean","grammarly","kraken","miro","opensea","paxos","plaid","ramp","redwood materials","replit","retool","ripple","rippling","saronic","scale ai","snyk","spacex","stoke space","uniswap","vercel","webflow","zipline"];
  // Marquee giants (household-name public cos too big/famous to leave in Tier 3). Auto-populated
  // proactively per Neal 2026-09-10 -- keep adding recognizable giants here as they surface.
  var TIER25_GIANTS = ["abbott","best buy","blackrock","bloomberg","boeing","booking","broadcom","cigna","coca-cola","costco","cvs health","disney","estee lauder","expedia","fedex","fidelity","garmin","ge healthcare","geico","general mills","general motors","hilton","humana","intuit","john deere","johnson & johnson","jpmorgan","kroger","l'oreal","liberty mutual","lockheed","lululemon","marriott","medtronic","micron","mondelez","morgan stanley","motorola","nationwide","nbcuniversal","nestle","new york times","nordstrom","northrop","optum","paramount","pepsico","progressive","raytheon","starbucks","state farm","synchrony","texas instruments","unilever","unitedhealth","vmware","walmart","warby parker","warner bros","wells fargo"];
  // Tier 4 = the "shit tier": random manufacturing / industrial / retail / staffing / no-name.
  // Finance + insurance are NOT here -- they fall through to Tier 3 (real companies, just not tech).
  var TIER4 = ["abc news","altasciences","blackhawk","bosch","brunswick","bwxt","chamberlain","church of jesus","copart","ge vernova","harman","holdings","honeywell","industries","johns manville","klein tools","koch","manufactur","marketeq","medline","metropolitan transportation","mobility global","nike","oshkosh","p&g","pentair","procter","rockwool","sam's club","schaeffler","sony","springs window","stellantis","tuckernuck","uline","united airlines","us foods","vertiv","window fashion"];
  // Marquee names too short to substring-match safely (e.g. "ey" would hit Disney/Honeywell,
  // "hp" would hit HPR) -- matched by EXACT lowercased company name instead.
  var TIER25_EXACT = ["block","box","caterpillar","citi","dell","discover","ey","ford","gap","hp","ing","rtx","target","ups","wise","wix","zip","redo","pattern"];
  // Well-known tech companies (public + notable) that would otherwise sink to Tier 3. Per Neal:
  // "any well-known tech company should be in 2.5" (e.g. Hudl). Keep adding recognizable tech here.
  var TIER25_TECH = ["affirm","applied materials","asana","axon","bill.com","braze","c3 ai","cadence","chegg","chewy","confluent","coursera","digitalocean","docusign","draftkings","ebay","elastic","electronic arts","epic systems","etsy","freshworks","github","gitlab","hashicorp","hudl","immuta","intercom","ixl learning","kensho","klaviyo","marqeta","mongodb","new relic","pagerduty","peloton","pindrop","postman","ringcentral","rivian","roku","rubrik","samsara","seatgeek","semgrep","sentry","sofi","splunk","tanium","tempus","toast","trade desk","trimble","veeam","verkada","wayfair","wealthfront","workiva","zendesk"];
  function tierOf(name) {
    var n = (name || "").toLowerCase().trim();
    function hit(arr) { for (var i = 0; i < arr.length; i++) { if (n.indexOf(arr[i]) !== -1) return true; } return false; }
    if (hit(TIER1)) return 1;
    if (hit(TIER2)) return 2;
    if (TIER25_EXACT.indexOf(n) !== -1) return 2.5;
    if (hit(TIER25)) return 2.5;
    if (hit(TIER25_STARTUPS)) return 2.5;
    if (hit(TIER25_GIANTS)) return 2.5;
    if (hit(TIER25_TECH)) return 2.5;
    if (hit(TIER4)) return 4;
    return 3;
  }
  var TIER_ORDER = [1, 2, 2.5, 3, 4];
  var TIER_LABEL = { 1: "Tier 1 · Top tech", 2: "Tier 2 · Strong tech", 2.5: "Tier 2.5 · Marquee non-tech (finance, consulting, big brands)", 3: "Tier 3 · Other tech, startups + finance", 4: "Tier 4 · Industrial / random" };
  var openTierFilter = "";   // "" = all tiers, for the Open Now tab

  function tab(id, label) { return '<button data-tab="' + id + '">' + label + "</button>"; }
  function view(id, inner) { return '<section class="view" data-view="' + id + '">' + inner + "</section>"; }

  // Timeline rows (timeline.json) are hand-curated program-level opens/closes prose — a
  // different data model than the per-role scraped feed, with no explicit join key to it. We
  // only ever ADD a real-date chip here (never replace the existing hand text) when a program's
  // name unambiguously names one of our tracked companies AND that company has an actual scraped
  // role right now — so this only ever surfaces confirmed real data, never a guess standing in
  // for one.
  function companyInText(text) {
    var low = (text || "").toLowerCase(), best = "";
    comps.forEach(function (c) {
      var name = (c.c || "").toLowerCase();
      if (name.length < 3) return;
      if (low.indexOf(name) !== -1 && name.length > best.length) best = name;
    });
    return best;
  }
  function timelineHtml() {
    var live = {}, closed = {};
    (openings || []).forEach(function (r) {
      var k = (r.company || "").toLowerCase(); if (!k) return;
      if (r.active === false) { if (!closed[k] || (r.removedAt || 0) > (closed[k].removedAt || 0)) closed[k] = r; }
      else if (!live[k]) live[k] = r;
    });
    var rows = '<div class="tlrow"><div class="tlwhen">Now · mid-Jul</div><div class="tlwhat">Prep window<span>Resume, target list, mocks — be ready to fire day one.</span></div></div>';
    timeline.forEach(function (p) {
      var co = companyInText(p.what || "");
      var chip = co ? formatListingDates(live[co] ? { firstSeen: live[co].firstSeen, postedAt: live[co].postedAt } : (closed[co] ? { removedAt: closed[co].removedAt } : null)) : "";
      rows += '<div class="tlrow"><div class="tlwhen">' + esc(p.when) + '</div><div class="tlwhat">' + esc(p.what) + (chip ? " " + chip : "") + (p.note ? '<span>' + esc(p.note) + "</span>" : "") + "</div></div>";
    });
    return '<div class="panel"><div class="phead"><h2>Cycle Timeline</h2><span class="hint">' + timeline.length + ' programs · rolling</span></div><div class="tl">' + rows + "</div></div>";
  }
  function trackersHtml() {
    var liveCount = TRACKERS.filter(function (t) { return t[4]; }).length;
    var c = TRACKERS.map(function (t) {
      var badge = t[4] ? '<span class="hbad hbad-ok" style="flex:0 0 auto">● Live</span>' : '<span class="hbad" style="flex:0 0 auto;color:var(--faint);background:var(--surface-2)">Reference</span>';
      return '<a class="tcard" href="' + t[3] + '" target="_blank" rel="noopener"><span class="ti">' + t[1] + '</span><span><span class="tn">' + esc(t[0]) + '</span><span class="td">' + esc(t[2]) + "</span></span>" + badge + '<span class="arw">↗</span></a>';
    }).join("");
    return '<div class="panel"><div class="phead"><h2>Sources</h2><span class="hint">' + liveCount + " / " + TRACKERS.length + ' actually feed the pipeline</span></div><div class="trk">' + c + "</div></div>";
  }
  function edgesHtml() {
    // structural/strategic edges over the broader applicant pool — distinct from resume
    // wording tactics (see Resume HQ's own Edge Playbook for those). See market-edges.json.
    var me = HQ.marketEdges;
    if (!me) return '<div class="panel"><div class="pad muted">No market-edges data loaded.</div></div>';
    var cards = (me.edges || []).map(function (e, ei) {
      var srcs = (e.sources || []).length ? '<p class="ehow" style="margin-top:8px"><b>Sources:</b> ' + e.sources.map(function (u, i) {
        return '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="color:var(--accent-2)">[' + (i + 1) + "]</a>";
      }).join(" ") + "</p>" : "";
      // the whole point: don't leave this as text — give an actual bullet (or summary line)
      // ready to drop into a resume/pitch, with a one-click copy so nothing gets retyped
      var actionable = "";
      (e.draftBullets || []).forEach(function (b, bi) {
        actionable += '<div class="hrow" style="align-items:flex-start;gap:10px">'
          + '<span style="flex:1;font-size:12.5px;font-style:italic;color:var(--ink)">“' + esc(b) + '”</span>'
          + '<button class="pill" style="background:var(--surface-2);color:var(--ink);flex:0 0 auto" data-copy-edge="' + ei + '" data-copy-bullet="' + bi + '">Copy</button></div>';
      });
      if (e.summaryLine) {
        actionable += '<div class="hrow" style="align-items:flex-start;gap:10px">'
          + '<span style="flex:1;font-size:12.5px;font-style:italic;color:var(--ink)"><b style="font-style:normal;color:var(--muted)">Summary line:</b> “' + esc(e.summaryLine) + '”</span>'
          + '<button class="pill" style="background:var(--surface-2);color:var(--ink);flex:0 0 auto" data-copy-edge="' + ei + '" data-copy-summary="1">Copy</button></div>';
      }

    if (id === "open") { var ov = app.querySelector('.view[data-view="open"]'); if (ov) ov.innerHTML = openHtml(); }
    if (id === "justopened") { var jv = app.querySelector('.view[data-view="justopened"]'); if (jv) jv.innerHTML = justOpenedHtml(); }
    if (id === "pipeline" && typeof refreshFunnels === "function") refreshFunnels();
  }
  tabs.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) show(b.dataset.tab); });
  show("justopened");   // default landing view

  // ---- Open Now tier tabs — bound on `app` (never replaced) since the "open" view's
  // innerHTML gets swapped wholesale both here and by the live-feed fetch below ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-otier]"); if (!b) return;
    openTierFilter = b.dataset.otier;
    var sec = app.querySelector('.view[data-view="open"]');
    if (sec) sec.innerHTML = openHtml();
  });

  // ---- manual status flips on Open Now / Just Opened rows: cycle the clickable pill through
  // Applied -> Interviewing -> Offer -> Rejected -> (clear), persisted per-company in localStorage ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-costat]"); if (!b) return;
    e.preventDefault();
    var key = b.dataset.costat;
    var srv = "";
    for (var i = 0; i < (openings || []).length; i++) {
      var r = openings[i];
      if (r.active !== false && roleKey(r) === key && r.applied) { srv = r.applied; break; }
    }
    // ring includes an explicit "none" step so you can cycle all the way back to "+ Status"
    // from any state — Applied -> Interviewing -> Offer -> Rejected -> (+ Status) -> Applied ...
    var o = openStat[key];
    var eff = (o === "none") ? "none" : (o || srv || "");
    var RING = ["applied", "interview", "offer", "accepted", "rejected", "irrelevant", "duplicate", "none"];
    var cur = eff === "" ? "none" : eff;
    openStat[key] = RING[(RING.indexOf(cur) + 1) % RING.length];   // "none" = explicit clear, shows "+ Status"
    saveOpenStat();
    var v = b.closest(".view");
    if (v) v.innerHTML = v.dataset.view === "justopened" ? justOpenedHtml() : openHtml();
  });

  // ---- Market Edges: copy a draft bullet/summary line straight to clipboard ----
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-copy-edge]"); if (!b) return;
    var me = HQ.marketEdges; if (!me) return;
    var edge = (me.edges || [])[+b.dataset.copyEdge]; if (!edge) return;
    var text = b.dataset.copySummary ? (edge.summaryLine || "") : (edge.draftBullets || [])[+b.dataset.copyBullet] || "";
    if (!text) return;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    var old = b.textContent; b.textContent = "Copied ✓";
    setTimeout(function () { b.textContent = old; }, 1200);
  });

  // ---- live feed: fetch the freshest openings at runtime so the board never shows stale/baked data ----
  if (HQ.feedUrl) {
    fetch(HQ.feedUrl, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (f) {
        if (!f || !f.roles) return;
        openings = f.roles; if (f.updated) HQ.updated = f.updated;
        var sec = app.querySelector('.view[data-view="open"]');
        if (sec) sec.innerHTML = openHtml();
        var jsec = app.querySelector('.view[data-view="justopened"]');
        if (jsec) jsec.innerHTML = justOpenedHtml();
        var tsec = app.querySelector('.view[data-view="timeline"]');
        if (tsec) tsec.innerHTML = timelineHtml();     // refresh any real-date chips matched to live/closed roles
        if (typeof render === "function") render();   // refresh pipeline: OPEN badges + deep-links to live postings
      })
      .catch(function () { /* offline / file:// — keep baked feed */ });
  }

  // ---- pipeline ----
  var KEY = HQ.key || "pm-pipeline-v2", FLAG = HQ.flag || "pm-targets-v2";
  var STAT = { research: ["Researching", "st-research"], applied: ["Applied", "st-applied"], interview: ["Interviewing", "st-interview"], offer: ["Offer", "st-offer"], accepted: ["Accepted", "st-accepted"], rejected: ["Rejected", "st-rejected"] };
  var ORDER = ["research", "applied", "interview", "offer", "accepted", "rejected"];
  var data = [];
  try { var st = localStorage.getItem(KEY); data = (st && JSON.parse(st).length) ? JSON.parse(st) : []; } catch (e) { data = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  try {
    if (!localStorage.getItem(FLAG)) {
      var have = {}; data.forEach(function (d) { have[(d.c || "").toLowerCase()] = 1; });
      comps.forEach(function (c) { if (!have[c.c.toLowerCase()]) data.push({ c: c.c, url: c.url || "", prog: c.prog || "", lc: c.lc || "", nyc: c.nyc || "", s: "research" }); });
      localStorage.setItem(FLAG, "1"); save();
    }
  } catch (e) {}
  // ---- fold the application log (applied.json) into the pipeline rows, once per company+status,
  // so a manual change you make later is never overwritten on the next load ----
  (function seedFromApplied() {
    var SEEN = KEY + "-appliedseen", seen = {}, changed = false;
    try { seen = JSON.parse(localStorage.getItem(SEEN)) || {}; } catch (e) { seen = {}; }
    (HQ.applied || []).forEach(function (a) {
      var st = a.status || "applied", sk = canonCo(a.company) + "|" + st;
      if (seen[sk] || !(st in RANK)) return;
      seen[sk] = 1;
      data.forEach(function (d) { if (canonCo(d.c) === canonCo(a.company) && RANK[st] > RANK[d.s || "research"]) { d.s = st; changed = true; } });
    });
    try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch (e) {}
    if (changed) save();
  })();
  var filter = "";
  var seasonFilter = "";   // "" = all seasons; else one of SEASON_ORDER (declared near top)
  var rowsEl = app.querySelector("#rows"), funnelEl = app.querySelector("#funnel"), cntEl = app.querySelector("#cnt");
  var seasonTabsEl = app.querySelector("#seasontabs");

  function renderSeasonTabs() {
    if (!seasonTabsEl) return;
    var counts = {};
    data.forEach(function (d) { var s = seasonOf(d.c).season || "Unknown"; counts[s] = (counts[s] || 0) + 1; });
    var all = '<button class="stab' + (seasonFilter ? "" : " on") + '" data-season="">All <b>' + data.length + "</b></button>";
    var tabs = SEASON_ORDER.filter(function (s) { return counts[s]; }).map(function (s) {
      return '<button class="stab sea-' + s.toLowerCase() + (seasonFilter === s ? " on" : "") + '" data-season="' + s + '">'
        + s + " <b>" + counts[s] + "</b></button>";
    }).join("");
    seasonTabsEl.innerHTML = all + tabs;
  }
  app.querySelector("#seasontabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-season]"); if (!b) return;
    seasonFilter = b.dataset.season; render();
  });

  function render() {
    renderSeasonTabs();
    // re-sort every render (not just first-seed) so companies already saved from an older
    // alphabetical seed still land in season -> open-date order, same key build_site.py uses
    data.sort(function (a, b) {
      var sa = seasonOf(a.c), sb = seasonOf(b.c);
      return sa.sr - sb.sr || sa.mr - sb.mr || a.c.toLowerCase().localeCompare(b.c.toLowerCase());
    });
    refreshFunnels();   // Applied / Interviewing / Offers / Researching, on Pipeline and at the top of Just Opened
    // map live openings by company so a target with an OPEN role deep-links to the actual posting
    // (active !== false: a recently-closed role riding along in `openings` isn't "open now")
    var OPEN = {}, CLOSED = {};
    (openings || []).forEach(function (r) {
      var k = (r.company || "").toLowerCase(); if (!k) return;
      if (r.active === false) { if (!CLOSED[k] || (r.removedAt || 0) > (CLOSED[k].removedAt || 0)) CLOSED[k] = r; }
      else if (r.url && !OPEN[k]) OPEN[k] = r;
    });
    rowsEl.innerHTML = ""; var shown = 0, lastSeason = null;
    data.forEach(function (d, i) {
      if (filter && d.c.toLowerCase().indexOf(filter) < 0) return;
      var seaInfo = seasonOf(d.c);
      var seaLabel = seaInfo.season || "Unknown";
      if (seasonFilter && seaLabel !== seasonFilter) return;
      shown++;
      // section divider on every season change — only in the unfiltered "All seasons" view;
      // a single season tab is already one homogeneous group, so a header would be redundant
      if (!seasonFilter && seaLabel !== lastSeason) {
        lastSeason = seaLabel;
        var hd = document.createElement("li"); hd.className = "sdiv sea-" + seaLabel.toLowerCase();
        hd.innerHTML = '<span>' + seaLabel + "</span>";
        rowsEl.appendChild(hd);
      }
      var live = OPEN[d.c.toLowerCase()];              // a real posting for this company, if open now
      var closedRole = !live && CLOSED[d.c.toLowerCase()];   // the only known posting recently closed, none open
      var href = (live && live.url) || d.url || "";     // deep-link to the posting, else the company's board
      var li = document.createElement("li"); li.className = "prow" + (closedRole ? " prow-closed" : "");
      var co = '<span class="pco">' + (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(d.c) + "</a>" : esc(d.c)) + "</span>";
      var pro = '<span class="pro">' + esc((live && live.title) || d.prog || "") + "</span>";
      var s = STAT[d.s] || STAT.research;
      var lc = d.lc ? '<span class="lcb lc-' + d.lc + '" title="LeetCode difficulty">' + (LCLABEL[d.lc] || d.lc) + "</span>" : "";
      var nyc = d.nyc ? '<span class="nycb nyc-' + d.nyc + '" title="NYC presence">' + (d.nyc === "hq" ? "NYC HQ" : "NYC") + "</span>" : "";
      var openb = live ? '<span class="nycb" style="background:var(--offer)" title="open role live now">● OPEN</span>' : "";
      var sea = seaInfo.season ? '<span class="seab sea-' + seaInfo.season.toLowerCase() + '" title="when this window opens">' + seaInfo.season + "</span>" : "";
      // real scraped date > recently-closed date > fuzzy hand-estimated window > nothing —
      // never fabricate a date for a target with none of the above
      var dateTarget = live ? { firstSeen: live.firstSeen, postedAt: live.postedAt }
        : closedRole ? { removedAt: closedRole.removedAt }
        : openWindowOf(d.c) ? { openWindow: openWindowOf(d.c) } : null;
      var dateChip = formatListingDates(dateTarget);
      // non-target-school arbitrage (market-edges.json): UNC alumni field far fewer inbound
      // requests than feeder-school alumni at the same company — one click to go find one
      var alumniUrl = "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(d.c + ' "University of North Carolina at Chapel Hill"');
      var alumni = '<a class="apply" style="background:var(--surface-2);color:var(--muted)" href="' + alumniUrl + '" target="_blank" rel="noopener" title="Find a UNC alum at ' + esc(d.c) + ' for a warm intro">Alumni ↗</a>';
      li.innerHTML = co + pro + openb + dateChip + sea + nyc + lc
        + '<button class="pill ' + s[1] + '" data-i="' + i + '" data-act="cycle">' + s[0] + "</button>"
        + (href ? '<a class="apply" href="' + esc(href) + '" target="_blank" rel="noopener">' + (live ? "Apply to role ↗" : "Board ↗") + "</a>" : "")
        + alumni
        + '<button class="pill st-rejected" data-i="' + i + '" data-act="del" title="Remove" style="background:none;color:var(--faint)">×</button>';
      rowsEl.appendChild(li);
    });
    cntEl.textContent = (filter || seasonFilter) ? shown + " / " + data.length : data.length + " targets";
    if ((filter || seasonFilter) && !shown) rowsEl.innerHTML = '<li class="empty">No matches.</li>';
  }
  rowsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var i = +b.dataset.i;
    if (b.dataset.act === "cycle") { var d = data[i]; d.s = ORDER[(ORDER.indexOf(d.s) + 1) % ORDER.length]; }
    else if (b.dataset.act === "del") { data.splice(i, 1); }
    save(); render();
  });
  app.querySelector("#search").addEventListener("input", function () { filter = this.value.trim().toLowerCase(); render(); });

  // ---- export/import: pipeline status is localStorage, which is PER-ORIGIN (onrender.com
  // and localhost don't share it) — this makes progress a portable file instead ----
  app.querySelector("#exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (HQ.key || "pm-pipeline") + "-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  });
  var importFile = app.querySelector("#importFile");
  app.querySelector("#importBtn").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var f = this.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!Array.isArray(incoming)) throw new Error("not an array");
        // merge by company (case-insensitive): imported status wins for a company already
        // present, anything imported-only gets appended — importing never silently drops rows
        var have = {}; data.forEach(function (d, i) { have[(d.c || "").toLowerCase()] = i; });
        incoming.forEach(function (row) {
          var k = (row.c || "").toLowerCase(); if (!k) return;
          if (k in have) data[have[k]] = row; else data.push(row);
        });
        save(); render();
        alert("Imported " + incoming.length + " rows.");
      } catch (e) { alert("Couldn't read that file as a pipeline export: " + e.message); }
      importFile.value = "";
    };
    reader.readAsText(f);
  });

  render();
})();
</script></body></html>
